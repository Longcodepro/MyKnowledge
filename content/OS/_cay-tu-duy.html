:root{
  /* BẢNG MÀU DUY NHẤT, sinh theo OKLCH (cùng độ sáng và độ bão hòa, chỉ khác sắc độ). Mỗi nhánh một tên màu, ba biến:
     --c-*  nền ô icon, đường nhánh, nền viên mục (pastel đậm vừa)
     --t-*  chữ trong viên mục (đậm cùng tông)
     --k-*  số thứ tự, mã chương, liên kết (đậm cùng tông)
     Đạt tối thiểu 4.5:1. Muốn đổi màu chỉ sửa ở khối này. */
  --c-xanh-duong:#85baff; --t-xanh-duong:#091f3b; --k-xanh-duong:#1c508d; /* OS 1: nền tảng, tông chủ đạo */
  --c-xanh-ngoc:#6cddd4;  --t-xanh-ngoc:#002523;  --k-xanh-ngoc:#005d57;  /* OS 2: dòng chảy, thứ đang chạy */
  --c-xanh-lo:#75dafc;    --t-xanh-lo:#00242f;    --k-xanh-lo:#01596f;    /* OS 3: CPU, thời gian */
  --c-vang:#ffdb68;       --t-vang:#281e00;       --k-vang:#614e02;       /* OS 4: khóa, bảo vệ */
  --c-cam-do:#ff9874;     --t-cam-do:#361307;     --k-cam-do:#823417;     /* OS 5: lỗi, bế tắc */
  --c-bac-ha:#91e8b0;     --t-bac-ha:#002712;     --k-bac-ha:#006034;     /* OS 6: tài nguyên được cấp phát */
  --c-xam-bac:#c0ccd9;    --t-xam-bac:#1b2025;    --k-xam-bac:#47515c;    /* OS 7: "ảo", mờ như bạc */
  --c-tim:#bda8f9;        --t-tim:#221838;        --k-tim:#554087;        /* OS 8: lưu trữ */
  --bg:#f7f9fc; --ink:#1b2330; --muted:#667085; --line:#dbe6f5;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:auto;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif}
header{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px;font-weight:600}
header p{margin:0;font-size:13px;color:var(--muted)}
/* Sơ đồ phủ kín phần còn lại của cửa sổ, tự co giãn vừa khít nên không phải kéo */
#stage{flex:1;min-width:900px;min-height:520px;position:relative;background:radial-gradient(ellipse at center,#fff 0%,var(--bg) 72%)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
svg text{font-family:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;dominant-baseline:central}
/* Nhánh và đường nối: rê chuột thì cả nhánh dày lên */
.curve{fill:none;stroke:var(--c);stroke-linecap:round;transition:stroke-width .2s}
.trunk{stroke-width:3.5}
.link{stroke-width:1.6}
.ring{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round;transition:stroke-width .2s}
.bg.hot .trunk{stroke-width:5.5}
.bg.hot .link{stroke-width:2.6}
.bg.hot .ring{stroke-width:12}
/* Thẻ chương */
.card{cursor:pointer;outline:none}
.card .face{fill:#fff;stroke:var(--c);stroke-width:1.5;filter:url(#shadow);transition:stroke-width .2s}
.card:hover .face,.card:focus-visible .face{stroke-width:3}
.card .tile{fill:var(--c)}
.card .tag{font-size:11px;font-weight:500;letter-spacing:.07em;fill:var(--k)}
.card .nm{font-size:13.5px;font-weight:600;fill:var(--ink)}
.ic{fill:none;stroke:var(--t);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.open text{font-size:11px;fill:var(--k);text-decoration:underline}
.open:hover text{font-weight:600}
/* Viên mục (nhánh con) */
.leaf{outline:none}
.leaf .pb{fill:var(--c);fill-opacity:.3;stroke:transparent;stroke-width:1.6;transition:fill-opacity .15s}
.leaf:hover .pb,.leaf:focus-visible .pb{fill-opacity:.58;stroke:var(--c)}
.leaf .num{font-size:12px;font-weight:600;fill:var(--k)}
.leaf .lb{font-size:13px;fill:var(--t)}
/* Nút gốc */
.hub{fill:#fff;stroke:var(--line);stroke-width:1.5;filter:url(#shadow2)}
.hubt{font-size:21px;font-weight:600;fill:var(--t-xanh-duong)}
/* Nhánh con "mọc": đường vẽ dần ra, viên mục hiện sau */
.gl{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .55s ease-out var(--d) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gt{opacity:0;animation:fade .4s ease-out calc(var(--d) + .18s) forwards}
@keyframes fade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.gl{animation:none;stroke-dasharray:none;stroke-dashoffset:0}.gt{animation:none;opacity:1}.curve,.ring,.card .face,.leaf .pb{transition:none}}
</style>

  cycle:[['path',{d:'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5'}],['path',{d:'M9.5 9.5l5 5M14.5 9.5l-5 5'}]], // OS 5: chờ vòng tròn mà kẹt
  ram:[['rect',{x:2,y:6,width:20,height:10,rx:1.5}],['rect',{x:5,y:9,width:3,height:4,rx:.5}],['rect',{x:10.5,y:9,width:3,height:4,rx:.5}],['rect',{x:16,y:9,width:3,height:4,rx:.5}],['path',{d:'M5 16v3M8.5 16v3M12 16v3M15.5 16v3M19 16v3'}]], // OS 6: thanh RAM
  virtual:[['rect',{x:3,y:3,width:8,height:8,rx:1.5,style:'fill:var(--c)'}],['rect',{x:13,y:3,width:8,height:8,rx:1.5,'stroke-dasharray':'2 1.8'}],['rect',{x:3,y:13,width:8,height:8,rx:1.5,'stroke-dasharray':'2 1.8'}],['rect',{x:13,y:13,width:8,height:8,rx:1.5,style:'fill:var(--c)'}]], // OS 7: ô liền = trong RAM, ô đứt = ở đĩa
  disk:[['circle',{cx:12,cy:12,r:9.5}],['circle',{cx:12,cy:12,r:2.4}],['path',{d:'M6.5 12a5.5 5.5 0 0 1 5.5-5.5M18.5 5.5l-4.3 4.3'}]],                                  // OS 8: đĩa từ và đầu đọc
};
// Tâm sơ đồ ở (0,0). Bên phải: OS1..4 từ trên xuống (chiều kim đồng hồ). Bên trái: OS5..8 từ dưới lên, nên liệt kê ngược để xếp từ trên xuống.
const ROW=30,GAPG=20,MINH=118,XB=215,PW=230,PH=54,LX=XB+PW+34,RING=112,HUB=100;
const svg=document.getElementById('svg'),NS='http://www.w3.org/2000/svg';
const open=new Set(D.map((_,i)=>i));
try{const s=JSON.parse(localStorage.getItem('os-tree-open'));if(Array.isArray(s)){open.clear();s.forEach(i=>open.add(i))}}catch(e){}
const save=()=>{try{localStorage.setItem('os-tree-open',JSON.stringify([...open]))}catch(_){}};
const K=c=>`--c:var(--c-${c});--t:var(--t-${c});--k:var(--k-${c})`;
function S(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;(parent||svg).append(e);return e}
function draw(grow){
  const t0=performance.now();
  svg.innerHTML='';
  const defs=S('defs',{});
  for(const [id,dy,sd,op] of [['shadow',4,6,.11],['shadow2',8,12,.16]]){
    const f=S('filter',{id,x:'-30%',y:'-30%',width:'160%',height:'170%'},defs);
    S('feDropShadow',{dx:0,dy,stdDeviation:sd,'flood-color':'#1f3d6e','flood-opacity':op},f);
  }
  const world=S('g',{});
  const sides=[[+1,[0,1,2,3]],[-1,[7,6,5,4]]];
  const hOf=i=>Math.max(MINH,(open.has(i)?D[i][5].length:0)*ROW);
  const sideH=ids=>ids.reduce((a,i)=>a+hOf(i),0)+GAPG*(ids.length-1);
  const gbs=D.map(d=>S('g',{class:'bg',style:K(d[4])},world));  // lớp đường nhánh, dưới cùng
  const hub=S('g',{},world);                                      // nút gốc
  S('circle',{class:'hub',r:HUB},hub);
  S('text',{class:'hubt','text-anchor':'middle',x:0,y:1},hub,'Hệ điều hành');
  const front=S('g',{},world);                                    // thẻ chương và viên mục, trên cùng
  const hot=(i,on)=>gbs[i].classList.toggle('hot',on);
  const wire=(e,i)=>{e.addEventListener('mouseenter',()=>hot(i,1));e.addEventListener('mouseleave',()=>hot(i,0));e.addEventListener('focus',()=>hot(i,1));e.addEventListener('blur',()=>hot(i,0))};
  const toggle=i=>{const was=open.has(i);was?open.delete(i):open.add(i);save();draw(was?-1:i)};
  sides.forEach(([sg,ids])=>{
    let y=-sideH(ids)/2;
    ids.forEach(i=>{
      const [f,tag,name,ico,col,secs]=D[i],h=hOf(i),by=y+h/2,shown=open.has(i),gb=gbs[i],gx=sg>0?XB:-XB-PW;
      // cung màu trên vòng quanh nút gốc và đường nhánh từ đó tới thẻ
      const th=Math.atan2(by,sg*(XB-RING)),sx=RING*Math.cos(th),sy=RING*Math.sin(th),p=a=>`${(RING*Math.cos(a)).toFixed(1)} ${(RING*Math.sin(a)).toFixed(1)}`;
      S('path',{class:'ring',d:`M ${p(th-.22)} A ${RING} ${RING} 0 0 1 ${p(th+.22)}`},gb);
      S('path',{class:'curve trunk',d:`M ${sx.toFixed(1)} ${sy.toFixed(1)} C ${(sx+sg*70).toFixed(1)} ${sy.toFixed(1)} ${sg*XB-sg*80} ${by} ${sg*XB} ${by}`},gb);
      // thẻ chương: bấm để thu gọn / mở ra
      const cd=S('g',{class:'card',style:K(col),role:'button',tabindex:0,'aria-expanded':shown,'aria-label':`${tag}: ${name}`},front);
      S('title',{},cd,'Bấm để thu gọn / mở ra');
      S('rect',{class:'face',x:gx,y:by-PH/2,width:PW,height:PH,rx:14},cd);
      S('rect',{class:'tile',x:gx+8,y:by-19,width:38,height:38,rx:10},cd);
      const ig=S('g',{class:'ic',transform:`translate(${gx+8+19-11} ${by-11}) scale(${22/24})`},cd);
      ICONS[ico].forEach(([tg,a])=>S(tg,a,ig));
      S('text',{class:'tag',x:gx+54,y:by-9},cd,tag);
      S('text',{class:'nm',x:gx+54,y:by+9},cd,name);
      cd.onclick=()=>toggle(i);
      cd.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(i)}};
      const ol=S('a',{href:f+'.html',class:'open',style:K(col)},front);
      S('text',{x:gx+PW/2,y:by+PH/2+12,'text-anchor':'middle'},ol,'mở cả bài');
      wire(cd,i);wire(ol,i);
      if(shown)secs.forEach((s,k)=>{
        const ly=y+(h-secs.length*ROW)/2+k*ROW+ROW/2,g=grow==='all'||grow===i,delay=((grow==='all'?i*.05:0)+k*.06).toFixed(2)+'s';
        const a=S('a',{href:`${f}.html#s${k+1}`,class:'leaf'+(g?' gt':''),style:K(col)+(g?`;--d:${delay}`:'')},front);
        const pb=S('rect',{class:'pb',height:26,rx:13,y:ly-13},a);
        const nm=S('text',{class:'num',y:ly+.5},a,String(k+1)),lb=S('text',{class:'lb',y:ly+.5},a,s);
        const nw=nm.getComputedTextLength(),lw=lb.getComputedTextLength(),pw=12+nw+7+lw+12,px=sg>0?LX:-LX-pw;
        pb.setAttribute('x',px);pb.setAttribute('width',pw);nm.setAttribute('x',px+12);lb.setAttribute('x',px+12+nw+7);
        const ex=sg*(XB+PW),xn=sg>0?px:px+pw;
        const ln=S('path',{class:'curve link'+(g?' gl':''),d:`M ${ex} ${by} C ${ex+sg*26} ${by} ${xn-sg*26} ${ly} ${xn} ${ly}`},gb);
        if(g){ln.style.setProperty('--len',ln.getTotalLength().toFixed(1));ln.style.setProperty('--d',delay)}
        wire(a,i);
      });
      y+=h+GAPG;
    });
  });
  // Khung nhìn ôm sát nội dung; thẻ SVG phủ kín khung nên sơ đồ tự vừa khít cửa sổ
  const b=world.getBBox(),pad=40;
  svg.setAttribute('viewBox',`${(b.x-pad).toFixed(0)} ${(b.y-pad).toFixed(0)} ${(b.width+pad*2).toFixed(0)} ${(b.height+pad*2).toFixed(0)}`);
  window.__drawMs=performance.now()-t0;
}
// Font đã nhúng sẵn trong file; chờ cả ba độ đậm sẵn sàng rồi mới đo chữ để viên mục khớp độ dài chữ.
let started=false;const go=()=>{if(!started){started=true;draw('all')}};
Promise.all(['400','500','600'].map(w=>document.fonts.load(`${w} 13px "Be Vietnam Pro"`,'Việt ế ữ'))).then(go,go);setTimeout(go,1500);
</script>
