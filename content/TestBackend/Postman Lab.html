<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postman Lab</title>
<style>
:root{--bg:#fff;--bg2:#f6f6f8;--bg3:#ececf0;--fg:#1f1f23;--fg2:#6a6a72;--bd:#dcdce2;--acc:#ff6c37;--acc-bg:#fff0ea;--blue:#0b6bcb;--onblue:#fff;--ok:#0a7d3c;--warn:#a15c00;--err:#c62828;--m-get:#0a7d3c;--m-post:#a15c00;--m-put:#1565c0;--m-patch:#7b1fa2;--m-delete:#c62828;--code:#f4f4f7;--shadow:0 6px 24px rgba(0,0,0,.16)}
[data-theme=dark]{--bg:#1c1c1f;--bg2:#242428;--bg3:#2f2f34;--fg:#ececf0;--fg2:#a2a2ac;--bd:#3b3b41;--acc:#ff8a5c;--acc-bg:#3a2a22;--blue:#5aa8ff;--onblue:#06213f;--ok:#4cc57e;--warn:#e8a54b;--err:#ff7b72;--m-get:#4cc57e;--m-post:#e8a54b;--m-put:#5aa8ff;--m-patch:#c58bff;--m-delete:#ff7b72;--code:#151518;--shadow:0 6px 24px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:5px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
pre{margin:0;white-space:pre-wrap;word-break:break-word}
h2{font-size:17px;margin:20px 0 8px;font-weight:600}
h3{font-size:14px;margin:16px 0 6px;font-weight:600}
.top{display:flex;align-items:center;gap:6px;padding:0 12px;height:44px;border-bottom:1px solid var(--bd);background:var(--bg2);flex:none}
.brand{font-weight:700;margin-right:12px;color:var(--acc)}
.top nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.top nav button{border:0;background:none;padding:12px 12px;border-bottom:2px solid transparent;color:var(--fg2);white-space:nowrap}
.top nav button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.btn{border:1px solid var(--bd);background:var(--bg);border-radius:5px;padding:4px 10px}
.btn:hover{background:var(--bg3)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.flat{border-color:transparent;background:none}
.btn.flat:hover{background:var(--bg3)}
.btn.sm{padding:1px 8px;font-size:12px}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex}
.page{flex:1;overflow:auto;padding:18px 24px 60px}
.page>*{max-width:1080px;margin-left:auto;margin-right:auto}
.dim{color:var(--fg2)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--err)}
.badge{font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--bd);background:var(--bg3);white-space:nowrap}
.badge.acc{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-weight:600;background:var(--bg2);font-size:12px}
.card{border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:8px 0}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:6px;z-index:99}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:10px;width:min(720px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--bd)}
.mb{padding:14px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--bd)}
.mb label{display:block;margin:10px 0 3px;font-weight:600}
.full{width:100%}
.menu{position:fixed;background:var(--bg);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:60;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px}
.menu button:hover{background:var(--bg3)}
.menu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
.pm{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.pm-body{flex:1;display:flex;min-height:0}
.rail{width:86px;flex:none;border-right:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;padding:6px 4px;gap:4px}
.rb{border:0;background:none;border-radius:6px;padding:9px 2px;font-size:11px;color:var(--fg2)}
.rb.on{background:var(--bg3);color:var(--fg);font-weight:600}
.side{width:292px;flex:none;border-right:1px solid var(--bd);overflow:auto;background:var(--bg2);padding-bottom:20px}
.sh{display:flex;align-items:center;gap:6px;padding:8px 10px;font-weight:600}
.sp{flex:1}
.filt{margin:0 10px 8px;width:calc(100% - 20px)}
.tr{display:flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;border-radius:5px;margin:0 4px;white-space:nowrap}
.tr:hover{background:var(--bg3)}
.tr.on{background:var(--bg3);font-weight:600}
.tr .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.tr .dots{visibility:hidden;border:0;background:none;padding:0 4px}
.tr:hover .dots{visibility:visible}
.chev{width:12px;color:var(--fg2)}
.mt{font-size:10px;font-weight:700;min-width:32px}
.m-get{color:var(--m-get)}.m-post{color:var(--m-post)}.m-put{color:var(--m-put)}.m-patch{color:var(--m-patch)}.m-delete{color:var(--m-delete)}.m-head,.m-options,.m-env,.m-col{color:var(--fg2)}
.mainp{flex:1;min-width:0;display:flex;flex-direction:column}
.tabstrip{display:flex;border-bottom:1px solid var(--bd);background:var(--bg2);height:38px;flex:none}
.tabs{display:flex;overflow-x:auto;flex:1}
.tb{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--bd);cursor:pointer;white-space:nowrap;max-width:210px;color:var(--fg2)}
.tb .t{overflow:hidden;text-overflow:ellipsis}
.tb.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--acc)}
.tb .x{border:0;background:none;visibility:hidden;padding:0 2px}
.tb:hover .x,.tb.on .x{visibility:visible}
.newtab{border:0;background:none;padding:0 12px;font-size:16px}
.envbar{display:flex;align-items:center;gap:6px;padding:0 8px;border-left:1px solid var(--bd)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.req{flex:1;display:flex;flex-direction:column;min-height:0}
.crumb{display:flex;align-items:center;gap:6px;padding:8px 14px 0}
.rname{border:1px solid transparent;background:none;font-weight:600;font-size:14px;padding:2px 6px;min-width:80px}
.rname:hover{border-color:var(--bd)}
.urlrow{display:flex;gap:0;padding:8px 14px}
.msel{width:104px;font-weight:700;border-radius:5px 0 0 5px;background:var(--bg2)}
.urlwrap{position:relative;flex:1;min-width:0}
.hl,.urlin{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 10px;height:33px;border:1px solid var(--bd);border-left:0;border-radius:0;width:100%}
.hl{position:absolute;inset:0;white-space:pre;overflow:hidden;pointer-events:none;line-height:19px;background:var(--bg)}
.urlin{position:relative;background:transparent;color:transparent;caret-color:var(--fg)}
.urlin::selection{color:transparent;background:rgba(11,107,203,.28)}
.urlin::placeholder{color:var(--fg2)}
.v-ok{background:var(--acc-bg);color:var(--acc);border-radius:3px}
.v-miss{color:var(--err);text-decoration:underline wavy}
.sendbtn{border-radius:0 5px 5px 0;padding:0 22px;font-size:14px}
.subtabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--bd);flex:none}
.subtabs button{border:0;background:none;padding:7px 10px;border-bottom:2px solid transparent;color:var(--fg2);white-space:nowrap}
.subtabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:4px;vertical-align:middle}
.sub{flex:0 0 42%;min-height:130px;overflow:auto;padding:10px 14px}
.resp{flex:1;min-height:120px;overflow:auto;border-top:1px solid var(--bd);display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:8px;font-weight:600;margin:4px 0 6px}
.ph .sp{flex:1}
.linkbtn{border:0;background:none;color:var(--blue);padding:0}
.kv input[type=text]{width:100%;border:0;border-radius:0;background:transparent;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:5px 6px}
.kv td,.kv th{border:1px solid var(--bd);padding:0}
.kv th{padding:4px 8px}
.kv td.ck{width:34px;text-align:center}
.kv td.dl{width:30px;text-align:center}
.kv tr.off input[type=text]{color:var(--fg2);text-decoration:line-through}
.kv input[readonly]{color:var(--fg2)}
.kv .hid td{background:var(--bg2);color:var(--fg2);padding:5px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.xbtn{border:0;background:none;color:var(--fg2)}
.radios{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.radios label{display:flex;gap:4px;align-items:center;cursor:pointer}
textarea.code{width:100%;min-height:200px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;background:var(--code);tab-size:2}
.scr{display:flex;gap:12px}
.scr .ed{flex:1;min-width:0}
.snip{width:230px;flex:none;border-left:1px solid var(--bd);padding-left:12px}
.snip button{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 4px;border-radius:4px;color:var(--blue)}
.snip button:hover{background:var(--bg3)}
.row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row label{min-width:110px;font-weight:600}
.empty{margin:auto;color:var(--fg2);text-align:center;padding:30px}
.spin{width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--acc);border-radius:50%;margin:0 auto 8px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.rhead{display:flex;align-items:center;gap:4px;padding:0 14px;border-bottom:1px solid var(--bd);flex:none}
.rhead button.t{border:0;background:none;padding:7px 10px;border-bottom:2px solid transparent;color:var(--fg2)}
.rhead button.t.on{color:var(--fg);border-bottom-color:var(--acc)}
.stat{display:flex;gap:14px;font-size:12px;margin-left:auto}
.stat span{cursor:help}
.rbody{flex:1;overflow:auto;padding:8px 14px}
.vtabs{display:flex;gap:4px;margin-bottom:6px}
.vtabs button{border:0;background:none;padding:2px 10px;border-radius:12px;color:var(--fg2)}
.vtabs button.on{background:var(--bg3);color:var(--fg)}
.jk{color:#a31515}.js{color:#0b6b25}.jn{color:#0451a5}.jb{color:#a15c00}
[data-theme=dark] .jk{color:#ff9d8f}[data-theme=dark] .js{color:#8fdc9f}[data-theme=dark] .jn{color:#8ec5ff}[data-theme=dark] .jb{color:#f0b866}
.tres{padding:5px 8px;border-bottom:1px solid var(--bd)}
.errbox{border:1px solid var(--err);border-radius:8px;padding:12px 14px;margin:12px 14px;background:var(--bg2)}
.pm-console{height:230px;border-top:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;flex:none}
.pm-console[hidden]{display:none}
.ch{display:flex;gap:8px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--bd)}
.cb{flex:1;overflow:auto;padding:4px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.cb summary{cursor:pointer;padding:2px 0}
.cd{padding:4px 0 8px 14px;color:var(--fg2)}
.cd b{color:var(--fg)}
.lg{padding:1px 0 1px 14px}.lg.warn{color:var(--warn)}.lg.error{color:var(--err)}
.pm-bar{display:flex;gap:4px;align-items:center;padding:2px 8px;border-top:1px solid var(--bd);background:var(--bg2);flex:none}
.varpop{position:fixed;right:14px;top:96px;width:380px;max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;z-index:40}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.epc{padding:10px 14px}
.epc .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.epc .pth{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
.epc .mb2{min-width:56px;font-weight:700;font-size:12px}
details>summary{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.side{display:none}}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:92px;text-align:center;background:var(--bg);margin:2px 0}
.chip small{display:block;color:var(--fg2);font-size:11px}
.chip.done{background:var(--bg2)}
.chip.cur{border-color:var(--acc);background:var(--acc-bg);font-weight:700}
.chip.fail{border-color:var(--err);border-style:dashed}
.chip.skip{opacity:.55;border-style:dotted}
.arrow{align-self:center;padding:0 4px;color:var(--fg2)}
.split{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.steps button{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:7px 10px;margin:0 0 6px}
.steps button.cur{border-color:var(--acc);background:var(--acc-bg)}
.steps button.later{opacity:.55}
.steps b{display:block}
.lane{font-size:11px;font-weight:700;margin-right:6px;padding:0 6px;border-radius:9px;border:1px solid var(--bd)}
.detail{border:1px solid var(--bd);border-radius:8px;padding:12px 14px;background:var(--bg)}
.detail pre{background:var(--code);padding:10px;border-radius:6px;margin-top:8px;max-height:56vh;overflow:auto}
.lab{display:flex;gap:12px;align-items:flex-start;padding:10px 14px}
.lab .st{min-width:92px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ok)}
.rtab{margin:10px 0;overflow:auto}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Postman Lab</div>
  <nav>
    <button data-v="postman" class="on">Postman</button>
    <button data-v="guide">Hướng dẫn</button>
    <button data-v="server">Endpoint và dữ liệu</button>
    <button data-v="flow">Luồng request</button>
    <button data-v="labs" id="navLabs">Bài lab</button>
    <button data-v="ref">Tra cứu</button>
  </nav>
  <button class="btn" id="themeBtn">Chế độ tối</button>
</header>

<section class="view on" id="view-postman">
  <div class="pm">
    <div class="pm-body">
      <div class="rail" id="rail"></div>
      <aside class="side" id="side"></aside>
      <div class="mainp">
        <div class="tabstrip"><div class="tabs" id="tabs"></div><button class="newtab" id="newTab" title="New request">+</button>
          <div class="envbar"><select id="envSel" title="Environment (môi trường đang dùng)"></select><button class="btn flat" id="eyeBtn" title="Quick look: xem biến đang có hiệu lực">Variables</button></div>
        </div>
        <div class="main" id="main"></div>
      </div>
    </div>
    <div class="pm-console" id="console" hidden></div>
    <div class="pm-bar"><button class="btn flat sm" id="btnConsole">Console</button><button class="btn flat sm" id="btnRunner">Runner</button></div>
  </div>
</section>
<section class="view" id="view-guide"></section>
<section class="view" id="view-server"></section>
<section class="view" id="view-flow"></section>
<section class="view" id="view-labs"></section>
<section class="view" id="view-ref"></section>

<script>
/*LOGIC*/
const HTTP=['get','post','put','patch','delete','head','options'];
const CODES=[[200,'OK','Thành công, có nội dung trả về'],[201,'Created','Tạo mới thành công (thường kèm header Location)'],[202,'Accepted','Đã nhận, sẽ xử lý sau'],[204,'No Content','Thành công nhưng không có body (hay gặp ở DELETE)'],[301,'Moved Permanently','Chuyển hướng vĩnh viễn'],[302,'Found','Chuyển hướng tạm thời'],[304,'Not Modified','Dùng bản cache, nội dung không đổi'],[400,'Bad Request','Request sai cú pháp (JSON hỏng, tham số sai kiểu)'],[401,'Unauthorized','Chưa xác thực: thiếu token hoặc token sai'],[403,'Forbidden','Đã xác thực nhưng không đủ quyền'],[404,'Not Found','Không tìm thấy tài nguyên'],[405,'Method Not Allowed','Sai method cho endpoint này'],[408,'Request Timeout','Server chờ request quá lâu'],[409,'Conflict','Xung đột dữ liệu (ví dụ email đã tồn tại)'],[415,'Unsupported Media Type','Content-Type không được server chấp nhận'],[418,"I'm a teapot",'Mã đùa trong RFC 2324'],[422,'Unprocessable Entity','Cú pháp đúng nhưng dữ liệu không hợp lệ (validate lỗi)'],[429,'Too Many Requests','Gọi quá nhiều, bị giới hạn tốc độ'],[500,'Internal Server Error','Lỗi bên trong server'],[502,'Bad Gateway','Cổng nhận phản hồi hỏng từ server phía sau'],[503,'Service Unavailable','Server tạm thời không phục vụ'],[504,'Gateway Timeout','Server phía sau trả lời quá chậm']];
const stText=c=>{const f=CODES.find(x=>x[0]===c);return f?f[1]:(c<300?'Success':c<400?'Redirect':c<500?'Client Error':'Server Error')};
const stVi=c=>{const f=CODES.find(x=>x[0]===c);return f?f[2]:''};
let uid=0;const nid=p=>p+(++uid);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const uuid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const b64u=s=>b64(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const utf8len=s=>new TextEncoder().encode(s).length;
const cap=k=>k.replace(/(^|-)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const fmtSize=n=>n<1024?n+' B':(n/1024).toFixed(2)+' KB';
const KNOWN={'localhost:8080':'127.0.0.1','staging.api.test':'203.0.113.25','postman-echo.com':'52.20.137.171'};

const S={cols:[],drafts:[],envs:[],activeEnv:null,globals:{vars:[]},tabs:[],active:null,history:[],logs:[],flow:null,fi:0,flags:{},srv:new Set(),view:'postman',side:'cols',console:false,speed:1};
const newVar=()=>({key:'',initial:'',current:'',enabled:true});
const newKV=()=>({key:'',value:'',desc:'',enabled:true});
const mkAuth=(type,token)=>({type,token:token||'',user:'',pass:'',key:'',value:'',in:'header'});
function newReq(o){return Object.assign({id:nid('r'),type:'request',name:'New Request',method:'GET',url:'',params:[],pathVars:[],headers:[],bodyMode:'none',rawType:'json',raw:'',form:[],urlenc:[],auth:mkAuth('inherit'),pre:'',post:'',doc:'',timeout:0,noCache:false,noToken:false},o||{})}
const mkEnv=(name,base)=>({id:nid('e'),name,vars:[{key:'baseUrl',initial:base,current:base,enabled:true}]});
function seed(){

  if(hostTok.includes('{{')){err='Error: getaddrinfo ENOTFOUND '+hostTok;hint=['Biến '+hostTok+' chưa có giá trị.','Chọn Environment ở góc phải trên hoặc khai báo biến này (Environment / Collection / Globals).']}

function evalLabs(f){
  const F=S.flags,st=f.res&&f.res.status;if(!st||!f.b||!f.b.uo)return;

  if(m==='GET'&&p==='/users'&&st===401)F.u401=1;
  if(m==='GET'&&p==='/users'&&st===200)F.u200=1;
  if(m==='POST'&&p==='/users'&&st===201)F.c201=1;

{t:'Làm quen màn hình Postman',lab:null,why:'Biết mỗi vùng làm gì thì mới không bị lạc. Gần như mọi thứ trong Postman đều nằm ở 4 chỗ này.',do:[['Mở tab **Postman**. Cột ngoài cùng bên trái có 3 mục: **Collections** (nơi cất request đã lưu), **Environments** (các bộ biến theo môi trường), **History** (mọi request đã gửi, kể cả chưa lưu).','Thanh trên cùng của vùng làm việc: mỗi tab là một request đang mở, dấu `+` mở request mới, ô **No Environment** bên phải để chọn môi trường, nút **Variables** để xem nhanh biến đang có hiệu lực.'],['Một request gồm: ô chọn **method** (GET/POST…), ô **URL**, nút **Send**, rồi các tab con **Params, Authorization, Headers, Body, Scripts, Settings**. Phần bên dưới là **Response**.'],['Thanh dưới cùng có **Console** (xem request thật sự đã gửi) và **Runner** (chạy cả collection).']],res:'Bạn chỉ ra được: request nằm ở đâu, biến chọn ở đâu, kết quả xem ở đâu.'},
{t:'Gửi request đầu tiên (GET)',lab:'get200',why:'GET chỉ đọc dữ liệu, không thay đổi gì trên server nên an toàn để thử đầu tiên.',do:[['Mở tab **Postman**, bấm vào request **Get data** ở cột Collections. URL đang là `postman-echo.com/get`.'],['Bấm **Send** (hoặc `Ctrl + Enter`).'],['Nhìn khung **Response** phía dưới: góc phải có **200 OK**, thời gian (ms) và kích thước. Rê chuột lên thời gian để xem phân rã DNS, TCP, TLS, chờ server.'],['Chuyển qua lại các tab **Body, Cookies, Headers, Test Results**. Ở Body có 3 cách nhìn: **Pretty** (tô màu JSON), **Raw**, **Preview**.']],res:'Body trả về là JSON có `args`, `headers`, `url`. Đây là server echo nên nó phản chiếu lại đúng những gì Postman gửi, kể cả các header Postman tự thêm.',btn:['Mở Get data',()=>{switchView('postman');openTab('request',S.cols[0].items[0].id)}]},
{t:'Query Params và Path Variables',lab:null,why:'Query param là phần sau dấu `?` để lọc/phân trang. Path variable (`:id`) là một phần của đường dẫn để chỉ đúng một tài nguyên.',do:[['Bấm nút bên dưới để mở request **List users** (`GET {{baseUrl}}/users`). Chọn Environment **Local** ở góc phải trên trước (xem bài 4 nếu chưa biết).'],['Vào tab **Params**. Bảng Params và thanh URL là một: gõ thêm `&q=an` vào cuối URL thì bảng tự có dòng `q = an`; ngược lại sửa trong bảng thì URL tự đổi.'],['Bỏ tick ô vuông đầu dòng `limit` để tạm tắt tham số đó mà không phải xóa.'],['Mở request **Get user** (`/users/:id`). Phần **Path Variables** xuất hiện bên dưới Query Params, điền `id = 2` rồi Send.']],res:'Danh sách đổi theo `page`, `limit`, `q`. Với `:id`, Postman thay `:id` bằng giá trị bạn điền khi gửi. Request này cần token nên sẽ ra 401 cho tới bài 5.',btn:['Mở List users',()=>openApiReq('list')]},
{t:'Environment và biến {{baseUrl}}',lab:'env2',why:'Gõ cứng `http://localhost:8080` vào mọi request thì đổi sang server khác phải sửa từng cái. Dùng biến thì đổi một chỗ, cả collection đi theo.',do:[['Ở cột trái bấm **Environments**. Bạn có sẵn **Local** (`localhost:8080`) và **Staging** (`staging.api.test`). Mỗi cái có biến `baseUrl`.'],['Chọn Local ở ô **No Environment** góc phải trên (hoặc bấm **Set active**).'],['Mở một request có URL dạng `{{baseUrl}}/get`. Biến hợp lệ tô **cam**, biến chưa có giá trị tô **đỏ gạch chân**. Bấm **Variables** để xem toàn bộ giá trị đang hiệu lực.'],['Thử bỏ chọn Environment (No Environment) rồi Send: sẽ ra lỗi `getaddrinfo ENOTFOUND {{baseUrl}}`. Đây là lỗi hay gặp nhất khi quên chọn môi trường.'],['Mở một Environment, nhìn hai cột: **Initial value** (được chia sẻ khi export) và **Current value** (chỉ trên máy bạn). Token và mật khẩu chỉ để ở Current.']],res:'Đổi Local sang Staging thì cùng một request gọi sang server khác. Header `x-server` trong response đổi từ `local-dev` sang `staging`.',btn:['Đặt Local làm môi trường',()=>{setEnv(S.envs[0].id);toast('Đang dùng Local')}]},
{t:'Đăng nhập (POST JSON) và lưu token',lab:'login',why:'POST gửi dữ liệu lên server. Với JSON, bạn phải chọn đúng kiểu body để Postman gắn header `Content-Type: application/json`, nếu không server sẽ trả 415.',do:[['Chọn môi trường **Local**. Bấm nút bên dưới mở request **Login** (`POST {{baseUrl}}/auth/login`).'],['Vào tab **Body**: radio **raw** đã chọn, ô bên phải là **JSON**. Body mẫu có `email` và `password`.'],['Vào tab **Headers** và bấm dòng **hidden**: bạn sẽ thấy `Content-Type: application/json` do Postman tự thêm. Thử đổi JSON thành **Text** ở tab Body rồi Send: ra 415 Unsupported Media Type. Đổi lại JSON.'],['Vào tab **Scripts**, chọn **Post-response**: có 2 dòng script lấy `access_token` từ response và ghi vào biến `token` của Environment. Bên phải là danh sách **Snippets** để chèn mẫu có sẵn.'],['Bấm **Send**. Sau đó bấm **Variables**: biến `token` đã xuất hiện trong Environment.']],res:'Status 200 và có `access_token`. Token này được lưu tự động nên các request sau chỉ cần gọi `{{token}}`.',btn:['Mở Login',()=>openApiReq('login')]},
{t:'Authorization và lỗi 401',lab:'u401',why:'401 nghĩa là server không biết bạn là ai (thiếu hoặc sai token). Khác 403 là biết bạn nhưng bạn không đủ quyền.',do:[['Đã đăng nhập ở bài 5 (có biến `token`). Mở request **List users**.'],['Vào tab **Authorization**: Type là **Bearer Token**, Token là `{{token}}`. Postman tự chuyển nó thành header `Authorization: Bearer …`.'],['Đổi Type sang **No Auth** rồi Send: ra **401 Unauthorized**. Bấm sang tab **Luồng request** để thấy luồng dừng ngay ở bước **Middleware xác thực**, không đi tới handler.'],['Đổi lại **Bearer Token** rồi Send: ra **200**.'],['Cách gọn hơn: bấm **Edit** trên collection (menu `⋯` cạnh tên collection) → tab **Authorization** → đặt Bearer `{{token}}`. Mỗi request chọn **Inherit auth from parent**, token hết hạn chỉ cần sửa một chỗ.']],res:'Không token: 401. Có token: 200 kèm `data`, `page`, `limit`, `total`.',btn:['Mở List users',()=>openApiReq('list')]},
{t:'Tạo, sửa, xóa: POST, PATCH, DELETE',lab:'c201',why:'Mỗi mã trạng thái nói rõ chuyện gì đã xảy ra. Học đọc chúng là kỹ năng chính khi kiểm tra API bằng tay.',do:[['Mở **Create user**, Send: **201 Created**, response có `id` mới và header `Location`. Gửi lại lần nữa: **409 Conflict** vì email đã tồn tại.'],['Vào Body, xóa field `email` rồi Send: **422 Unprocessable Entity**, response liệt kê field sai. JSON đúng cú pháp nhưng sai quy tắc dữ liệu.'],['Thử làm hỏng JSON (xóa một dấu ngoặc): **400 Bad Request**. Đây là lỗi cú pháp, khác với 422.'],['Mở **Update user** (PATCH, `id = 2`): chỉ gửi field cần sửa. **Replace user** (PUT) thì phải gửi đủ toàn bộ field.'],['Mở **Delete user** (`id = 6`), Send: **204 No Content**, không có body. Gửi lại: **404** vì đã xóa. Xem dữ liệu thật ở tab **Endpoint và dữ liệu**.']],res:'Bạn tự gây ra và nhận biết được 201, 400, 401, 404, 409, 415, 422, 204.',btn:['Mở Create user',()=>openApiReq('create')]},
{t:'Viết test bằng pm.test',lab:'test',why:'Test để Postman tự kiểm tra thay bạn, khỏi phải đọc response bằng mắt mỗi lần.',do:[['Mở request bất kỳ, vào **Scripts** → **Post-response**.'],['Ở cột **Snippets** bên phải bấm **Status code is 200**: script được chèn sẵn.'],['Bấm **Send**, xuống khung Response chọn tab **Test Results**: dòng **PASS**.'],['Cố tình sửa số 200 thành 404, Send lại: dòng **FAIL** kèm lý do `expected … to have status code 404`.'],['Thử thêm snippet **Response time is below 500ms** và **Response body: JSON value check**.']],res:'Tab Test Results hiện số test pass/fail. Runner (bài 10) cộng dồn kết quả này cho cả collection.'},
{t:'Chuyển môi trường Local và Staging',lab:'env2',why:'Đây là lợi ích thực tế nhất của Environment: kiểm tra cùng một bộ request trên nhiều server.',do:[['Chọn **Local**, mở **List users**, đăng nhập lại nếu token trống, Send. Mở tab **Headers** của response: `X-Server: local-dev`.'],['Chọn **Staging** ở góc phải trên. Staging có biến `baseUrl` riêng và chưa có `token`, nên cần chạy **Login** một lần trên Staging để lấy token riêng.'],['Gửi lại cùng request: `X-Server: staging`.']],res:'Cùng request, đổi dropdown là gọi sang server khác. Token của hai môi trường độc lập với nhau.'},
{t:'Import Swagger/OpenAPI',lab:'import',why:'Bạn đã có Swagger nên không cần dựng tay. Import biến spec thành cả collection.',do:[['Vào tab **Endpoint và dữ liệu**, kéo xuống mục **OpenAPI JSON**, bấm **Mở hộp Import** (hộp đã điền sẵn spec). Thực tế bạn sẽ lấy file `swagger.json` hoặc `openapi.json` từ API của mình rồi dán/chọn file ở đây.'],['Bấm **Import**: một collection mới xuất hiện ở cột trái, chia thư mục theo `tags`, mỗi endpoint thành một request.'],['Kiểm tra: URL dùng `{{baseUrl}}`, đường dẫn `{id}` đã đổi thành `:id`, body mẫu được sinh từ schema, endpoint có `security` được gắn Bearer `{{token}}` ở cấp collection.'],['Chọn môi trường **Local**, chạy **Login** lấy token rồi thử các request vừa import.']],res:'Có ngay collection đầy đủ mà không gõ tay. Postman thật cũng làm đúng như vậy với nút Import.',btn:['Mở hộp Import',()=>{switchView('postman');openImport()}]},
{t:'Chạy cả collection bằng Runner',lab:'run',why:'Chạy một lèo toàn bộ request để kiểm tra hồi quy thay vì bấm Send từng cái.',do:[['Ở thanh dưới cùng bấm **Runner** (hoặc menu `⋯` của collection → **Run collection**).'],['Bỏ tick request nào không muốn chạy. Thứ tự chạy theo thứ tự trong collection.'],['Bấm **Run**: bảng kết quả hiện status, thời gian và số test pass/fail của từng request, kèm tổng kết.']],res:'Thứ tự quan trọng: Login phải đứng trước các request cần token, nếu không chúng sẽ trả 401.',btn:['Mở Runner',()=>{switchView('postman');if(S.cols[0])openRunner(S.cols[0])}]},
{t:'Debug: Console và tab Luồng request',lab:null,why:'Khi request fail, việc đầu tiên là xem request thật sự đã gửi đi như thế nào, không phải cái bạn nghĩ đã gửi.',do:[['Bấm **Console** ở thanh dưới cùng, mỗi lần Send thêm một dòng. Bấm mở dòng đó để xem **Request Headers, Request Body, Response Headers, Response Body** sau khi đã thay biến.'],['Chuyển qua tab **Luồng request** để xem từng bước: thay biến, gắn header/auth/body, đi qua mạng, Router, Auth, Parse body, Validate, Handler. Bấm từng bước ở danh sách bên trái hoặc dùng **Chạy tự động**.'],['Gặp lỗi thì đọc đúng thứ tự: có phải lỗi mạng (ENOTFOUND, ECONNREFUSED)? Biến có màu đỏ không? Mã 4xx nằm ở bước nào của luồng?']],res:'Mỗi lỗi chỉ ra bước cụ thể: 401 dừng ở Auth, 415 và 400 dừng ở Parse body, 422 dừng ở Validate, 404 dừng ở Router hoặc Handler.'}
];
function renderGuide(){
  const v=$('#view-guide');v.innerHTML='';const page=el('div',{class:'page'});v.append(page);
  page.append(el('h2',{style:'margin-top:0'},'Hướng dẫn thực hành từng bước'),el('div',{class:'dim'},'Làm theo thứ tự từ trên xuống. Mỗi bài có nút mở sẵn request tương ứng, những bài có bài lab sẽ tự đánh dấu hoàn thành.'));
  GUIDE.forEach((g,i)=>{
    const done=g.lab&&S.flags[g.lab];
    const d=el('details',{class:'card',style:'padding:10px 14px'},el('summary',{},el('b',{},(i)+'. '+g.t),g.lab?el('span',{class:'badge '+(done?'acc':''),style:'margin-left:8px'},done?'Đã hoàn thành':'Chưa xong'):null));
    if(i<=1)d.open=true;
    d.append(el('div',{class:'dim',style:'margin:8px 0',html:'<b>Vì sao:</b> '+fmtG(g.why)}));
    d.append(el('ol',{style:'padding-left:20px;margin:6px 0'},g.do.map(s=>el('li',{style:'margin:5px 0',html:fmtG(s[0])}))));
    d.append(el('div',{style:'margin:8px 0',html:'<b>Kết quả mong đợi:</b> '+fmtG(g.res)}));
    if(g.btn)d.append(el('button',{class:'btn pri sm',onclick:g.btn[1]},g.btn[0]));
    page.append(d);
  });
}

/* ---------- khởi tạo ---------- */
function switchView(n){if(n!=='flow')stopPlay();S.view=n;$$('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+n));$$('.top nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===n));if(n==='guide')renderGuide();if(n==='server')renderServer();if(n==='flow')renderFlow();if(n==='labs')renderLabs()}
$$('.top nav button').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.v)));
$('#themeBtn').addEventListener('click',()=>{const d=document.documentElement;const dark=d.dataset.theme==='dark';d.dataset.theme=dark?'light':'dark';$('#themeBtn').textContent=dark?'Chế độ tối':'Chế độ sáng'});
$('#newTab').addEventListener('click',()=>newDraft());
$('#envSel').addEventListener('change',e=>setEnv(e.target.value));
$('#eyeBtn').addEventListener('click',toggleVarPop);
$('#btnConsole').addEventListener('click',()=>{S.console=!S.console;renderConsole()});
$('#btnRunner').addEventListener('click',()=>{if(S.cols[0])openRunner(S.cols[0]);else toast('Chưa có collection')});
document.addEventListener('keydown',e=>{
  if(S.view!=='postman')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const r=activeReq();if(r){e.preventDefault();doSend(r)}}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){const r=activeReq();if(r){e.preventDefault();saveReq(r)}}
  else if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='c'){e.preventDefault();S.console=!S.console;renderConsole()}
});

function applyTips(){
  TIPS.forEach(([sel,re,tip])=>{
    document.querySelectorAll(sel).forEach(n=>{
      if(n.getAttribute('title'))return;
      const t=(n.textContent||'').trim();
      if(re.test(t)||(n.tagName==='SELECT'||n.tagName==='INPUT')&&re.source==='.')n.setAttribute('title',tip);
    });
  });
}
let tipT=null;
new MutationObserver(()=>{if(tipT)return;tipT=setTimeout(()=>{tipT=null;applyTips()},0)}).observe(document.body,{childList:true,subtree:true});
seed();renderRef();renderAll();openTab('request',S.cols[0].items[0].id);applyTips();
</script>
