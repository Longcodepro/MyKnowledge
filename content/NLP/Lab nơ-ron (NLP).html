<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lab nơ-ron NLP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Bố cục: thanh tab dính trên cùng, mỗi tab là một sân khấu mạng nơ-ron + bảng điều khiển bên phải */
body { margin: 0; background: var(--vl-bg, #ffffff); color: var(--vl-fg, #14181d); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--vl-bg, #ffffff); }
body .vl-app {
  max-width: 1180px; margin: 0 auto; padding-block: 14px 32px;

}

}
.lab-tab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 7px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--vl-line, #d9dde3); background: var(--vl-panel, #f6f7f9); color: var(--vl-fg, #14181d);
  font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  transition: background-color .18s ease, border-color .18s ease, color .18s ease;
}
.lab-tab .n {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums;
}

/* Nút Lùi / Tiếp nổi hai bên màn hình, luôn nằm trong tầm nhìn */
.lab-fab {
  position: fixed; top: 50%; transform: translateY(-50%); z-index: 30;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  width: 46px; padding: 12px 0; border-radius: 14px; cursor: pointer;
  border: 2px solid var(--c, #2563eb); background: var(--vl-panel, #f6f7f9); color: var(--c, #2563eb);
  box-shadow: 0 4px 14px rgba(0,0,0,.18); opacity: .94;
  font: 700 11px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease, transform .15s ease;
}
.lab-fab .a { font-size: 20px; line-height: 1; }
.lab-fab-l { left: max(6px, env(safe-area-inset-left, 0px)); }
.lab-fab-r { right: max(6px, env(safe-area-inset-right, 0px)); background: var(--c, #2563eb); color: #fff; }

.lab-fab[aria-disabled="true"] { opacity: .38; cursor: default; box-shadow: none; }
@media (min-width: 640px) {

}
@media (max-width: 639px) { .lab-fab { width: 38px; padding: 9px 0; opacity: .88; } .lab-fab .a { font-size: 17px; } }

/* Ô công thức: công thức tổng quát + nhật ký thế số (ô mới lên đầu, ô cũ giữ nguyên) */
.lab-formula { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.lab-formula h2 { margin: 0; font-size: 15px; font-weight: 650; }
.lab-formula .lf-sub { margin: 2px 0 0; font-size: 12.5px; color: var(--vl-muted, #5b6470); }
.lf-gen { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.lf-chip, .lf-cell {
  border: 1px solid var(--vl-line, #d9dde3); border-left: 5px solid var(--c, #2563eb);
  border-radius: 10px; background: var(--vl-panel, #f6f7f9); padding: 9px 12px; min-width: 0;
}
.lf-chip b, .lf-cell b.lf-t { display: block; font-size: 12px; color: var(--c, #2563eb); margin-bottom: 4px; }
.lf-l { font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.lf-l.f { color: var(--vl-muted, #5b6470); font-style: italic; }
.lf-l.r { font-weight: 700; }
.lf-bar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lf-count { font-size: 12.5px; color: var(--vl-muted, #5b6470); font-variant-numeric: tabular-nums; }
.lf-log { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; max-height: 520px; overflow: auto; padding: 2px 4px 4px 0; }
.lf-cell.new { outline: 2px solid var(--c, #2563eb); outline-offset: -1px; }
.lf-empty { grid-column: 1 / -1; font-size: 13px; color: var(--vl-muted, #5b6470); padding: 10px 2px; }
@media (prefers-reduced-motion: reduce) { .lab-fab { transition: none; } }

/* ===== Bài giảng (lesson layer) ===== */
.ls { --c: #2563eb; margin: 4px 0 18px; display: flex; flex-direction: column; gap: 12px; font-size: 14.5px; line-height: 1.65; color: var(--vl-fg, #14181d); }
.ls * { box-sizing: border-box; }
.ls p { margin: 6px 0; }
.ls code, .ls .ls-m, .ls .ls-code, .ls .ls-out { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.ls code { font-size: 12.5px; background: color-mix(in srgb, var(--c) 10%, transparent); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.ls-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.ls-bar .ls-tag { font-size: 12.5px; font-weight: 650; color: var(--c); letter-spacing: .02em; }
.ls-bar .ls-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.ls-btn { font: 600 12.5px/1.2 system-ui, sans-serif; padding: 6px 12px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--c); background: transparent; color: var(--c); text-decoration: none; }
.ls-btn:hover { background: var(--c); color: #fff; }

.ls-hook h3 { margin: 0 0 4px; font-size: 16.5px; line-height: 1.35; text-wrap: balance; }
.ls-q { border: 1.5px dashed var(--c); border-radius: 12px; padding: 12px 16px; background: var(--vl-panel, #f6f7f9); }
.ls-opts { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.ls-opts button { text-align: left; font: 14px/1.5 inherit; font-family: inherit; padding: 9px 12px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--vl-line, #d9dde3); background: var(--vl-bg, #fff); color: inherit; min-height: 44px; }
.ls-opts button:hover:not([disabled]) { border-color: var(--c); }
.ls-opts button.ok { border-color: #15803d; background: #dcfce7; color: #14532d; }

.ls-opts button[disabled] { cursor: default; }
.ls-ex { border-top: 1px solid var(--vl-line, #d9dde3); margin-top: 8px; padding-top: 6px; }
.ls-d { border: 1px solid var(--vl-line, #d9dde3); border-radius: 12px; background: var(--vl-panel, #f6f7f9); padding: 0 16px; }
.ls-d > summary { cursor: pointer; font-weight: 650; padding: 11px 0; font-size: 15px; list-style-position: inside; }
.ls-d[open] > summary { border-bottom: 1px solid var(--vl-line, #d9dde3); margin-bottom: 8px; }
.ls-d > :last-child { margin-bottom: 14px; }
.ls-ol { margin: 6px 0; padding-left: 22px; }
.ls-ol > li { margin: 10px 0; }
.ls-m { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.75; background: var(--vl-bg, #fff); border: 1px solid var(--vl-line, #d9dde3); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
.ls-code, .ls-out { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; line-height: 1.6; margin: 8px 0; padding: 10px 12px; border-radius: 8px; }
.ls-code { background: #0f172a; color: #e2e8f0; }
.ls-out { background: var(--vl-bg, #fff); border: 1px solid var(--vl-line, #d9dde3); border-left: 4px solid #15803d; }
.ls-t { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
.ls-t th, .ls-t td { border: 1px solid var(--vl-line, #d9dde3); padding: 5px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.ls-t th { background: color-mix(in srgb, var(--c) 10%, transparent); }
.ls-t td:first-child { width: 28%; white-space: normal; }
.ls-a { border-top: 1px solid var(--vl-line, #d9dde3); padding: 6px 0; }
.ls-a > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.ls-note { border: 1px solid #b45309; border-left: 6px solid #b45309; border-radius: 12px; padding: 10px 16px; background: color-mix(in srgb, #f59e0b 10%, var(--vl-panel, #f6f7f9)); }

.ls-intro > summary { cursor: pointer; font-weight: 650; }
.ls-sim { scroll-margin-top: 64px; }
@media (max-width: 639px) { .lab-fab { top: auto; bottom: 14px; transform: none; } .lab-fab:active { transform: scale(.94); } body .vl-app { padding-bottom: 80px; } }
.lab-tabs-in { flex-wrap: wrap; overflow: visible; }
@media (max-width: 760px) { .lab-tabs { position: static; } .lab-tab { padding-right: 11px; } }
@media (max-width: 520px) { .ls { font-size: 14px; } .ls-d { padding: 0 12px; } .ls-hook, .ls-q, .ls-note { padding: 10px 12px; } }

<script>
/* === core/base.js (khung visual-lab, giữ nguyên) === */
/* ============================================================================
   VLab — khung dùng chung cho mọi trang mô phỏng bài học IT/AI
   ----------------------------------------------------------------------------
   Dán TOÀN BỘ file này vào thẻ <script> của trang HTML xuất ra.
   Không phụ thuộc thư viện ngoài. Chạy được offline.

   Cung cấp sẵn:
     - Chủ đề sáng/tối tự theo hệ thống + nút đổi
     - 4 bảng màu (có 1 bảng thân thiện với người mù màu)
     - Zoom bằng con lăn, kéo để di chuyển, nút đặt lại khung nhìn
     - Thanh trượt tham số
     - Bộ chạy: Chạy / Tạm dừng / Bước tiếp / Làm lại + thanh tốc độ
     - Ô nhập công thức (parser an toàn, KHÔNG dùng eval)
     - Khung mã giả tiếng Việt có tô sáng dòng đang chạy
     - Ô "Đang xảy ra gì?" và ô "Vì sao?"

   API chính:  const app = VLab.create({...});   xem phần cuối file.
   ========================================================================== */
(function (global) {
  'use strict';

  const VLab = {};

  /* ==========================================================================
     1. BẢNG MÀU
     ========================================================================== */
  const PALETTES = {
    'Mặc định':      ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed', '#0891b2'],
    'Dịu mắt':       ['#4f6d7a', '#c07a5c', '#6a8d73', '#a4789a', '#8c7851', '#5a7d9a'],
    'Tương phản cao':['#0040ff', '#ff0040', '#00a000', '#ff8000', '#8000ff', '#00a0a0'],
    'Thân thiện mù màu': ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#56B4E9', '#D55E00']
  };
  let paletteName = 'Mặc định';

  /* ==========================================================================
     2. CSS — nhúng một lần
     ========================================================================== */
  const CSS = `
  :root{
    --vl-bg:#ffffff; --vl-panel:#f6f7f9; --vl-fg:#14181d; --vl-muted:#5d6670;
    --vl-line:#d9dde3; --vl-accent:#2563eb; --vl-grid:#e8ebef; --vl-axis:#9aa3ad;
    --vl-hl:#fff3bf; --vl-hl-fg:#5c4600;
  }
  :root[data-vl-theme="dark"]{
    --vl-bg:#13161a; --vl-panel:#1b1f25; --vl-fg:#e8ecf1; --vl-muted:#9aa5b1;
    --vl-line:#2b323b; --vl-accent:#5b9dff; --vl-grid:#22272e; --vl-axis:#5d6670;
    --vl-hl:#3a3414; --vl-hl-fg:#ffe79a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-vl-theme="light"]){
      --vl-bg:#13161a; --vl-panel:#1b1f25; --vl-fg:#e8ecf1; --vl-muted:#9aa5b1;
      --vl-line:#2b323b; --vl-accent:#5b9dff; --vl-grid:#22272e; --vl-axis:#5d6670;
      --vl-hl:#3a3414; --vl-hl-fg:#ffe79a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--vl-bg);color:var(--vl-fg);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .vl-app{max-width:1180px;margin:0 auto;padding:16px;}
  .vl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .vl-title{font-size:18px;font-weight:650;margin:0;flex:1 1 220px;}
  .vl-head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .vl-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
  @media (max-width:860px){ .vl-main{grid-template-columns:1fr;} }
  .vl-stage-wrap{position:relative;border:1px solid var(--vl-line);border-radius:10px;
    overflow:hidden;background:var(--vl-panel);}
  .vl-stage{display:block;width:100%;height:auto;touch-action:none;cursor:grab;}
  .vl-stage.dragging{cursor:grabbing;}
  .vl-status{padding:10px 12px;border-top:1px solid var(--vl-line);background:var(--vl-bg);
    font-size:14px;min-height:42px;color:var(--vl-fg);}
  .vl-status b{color:var(--vl-accent);}
  .vl-side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .vl-card{border:1px solid var(--vl-line);border-radius:10px;background:var(--vl-panel);padding:12px;}
  .vl-card h3{margin:0 0 8px;font-size:13px;font-weight:650;text-transform:uppercase;
    letter-spacing:.04em;color:var(--vl-muted);}
  .vl-row{margin-bottom:12px;}
  .vl-row:last-child{margin-bottom:0;}
  .vl-lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px;}
  .vl-lab span:last-child{font-variant-numeric:tabular-nums;color:var(--vl-accent);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--vl-accent);margin:0;}
  .vl-btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;
    border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);}
  .vl-btn:hover{border-color:var(--vl-accent);}
  .vl-btn.primary{background:var(--vl-accent);border-color:var(--vl-accent);color:#fff;}
  .vl-btns{display:flex;gap:6px;flex-wrap:wrap;}
  select,input[type=text]{font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;
    border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);width:100%;}
  .vl-head-tools select{width:auto;}
  .vl-err{color:#dc2626;font-size:12px;margin-top:4px;min-height:16px;}
  :root[data-vl-theme="dark"] .vl-err{color:#ff8080;}
  .vl-code{margin:0;font:12.5px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;
    counter-reset:vlline;max-height:260px;overflow:auto;}
  .vl-code div{padding:1px 6px;border-radius:4px;white-space:pre-wrap;color:var(--vl-muted);}
  .vl-code div.on{background:var(--vl-hl);color:var(--vl-hl-fg);font-weight:600;}
  .vl-why{font-size:13.5px;color:var(--vl-fg);}
  .vl-why p{margin:0 0 8px;} .vl-why p:last-child{margin:0;}
  .vl-hint{font-size:12px;color:var(--vl-muted);margin-top:6px;}
  `;

  function injectCSS() {
    if (document.getElementById('vl-css')) return;
    const s = document.createElement('style');
    s.id = 'vl-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ==========================================================================
     3. PARSER CÔNG THỨC — an toàn, không dùng eval()
     Hỗ trợ: + - * / ^ ( ) , số, biến, hàm dựng sẵn, hằng pi/e
     Dùng:  const f = VLab.compile('x^2 + 3*x', ['x']);  f({x:2}) -> 10
     ========================================================================== */
  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    exp: Math.exp, sqrt: Math.sqrt, abs: Math.abs,
    log: Math.log, ln: Math.log, log10: Math.log10, log2: Math.log2,
    floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign,
    min: Math.min, max: Math.max, pow: Math.pow, atan2: Math.atan2,
    relu: function (v) { return v > 0 ? v : 0; },
    sigmoid: function (v) { return 1 / (1 + Math.exp(-v)); }
  };
  const CONSTS = { pi: Math.PI, e: Math.E };

  function tokenize(src) {
    const out = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < src.length && /[0-9.]/.test(src[j])) j++;
        const num = parseFloat(src.slice(i, j));
        if (isNaN(num)) throw new Error('Số không hợp lệ: ' + src.slice(i, j));
        out.push({ t: 'num', v: num });
        i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i;
        while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
        out.push({ t: 'name', v: src.slice(i, j) });
        i = j; continue;
      }
      if ('+-*/^(),'.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      throw new Error('Ký tự lạ: "' + c + '"');
    }
    return out;
  }

  // Chuyển sang hậu tố bằng thuật toán sân ga (shunting-yard)
  function toRPN(tokens) {
    // Dấu trừ đứng trước (u-) nằm giữa */ và ^, nên -x^2 = -(x^2)
    const prec = { '+': 1, '-': 1, '*': 2, '/': 2, 'u-': 2.5, '^': 3 };
    const right = { '^': true, 'u-': true };
    const out = [], ops = [];
    let prev = null;
    for (let k = 0; k < tokens.length; k++) {
      const tk = tokens[k];
      if (tk.t === 'num') { out.push(tk); }
      else if (tk.t === 'name') {
        if (tokens[k + 1] && tokens[k + 1].t === '(') ops.push({ t: 'fn', v: tk.v, argc: 1 });
        else out.push(tk);
      }
      else if (tk.t === ',') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Dấu phẩy đặt sai chỗ');
        for (let m = ops.length - 2; m >= 0; m--) {
          if (ops[m].t === 'fn') { ops[m].argc++; break; }
          if (ops[m].t === '(') break;
        }
      }
      else if (tk.t === '(') { ops.push(tk); }
      else if (tk.t === ')') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Thiếu dấu mở ngoặc');
        ops.pop();
        if (ops.length && ops[ops.length - 1].t === 'fn') out.push(ops.pop());
      }
      else {
        let op = tk.t;
        const unary = (op === '-' || op === '+') &&
          (prev === null || prev.t === '(' || prev.t === ',' ||
            '+-*/^'.indexOf(prev.t) >= 0);
        if (unary) {
          // dấu đứng trước toán hạng: không đẩy toán tử nào ra, chỉ xếp vào chồng
          if (op === '+') { prev = tk; continue; }
          ops.push({ t: 'u-' }); prev = tk; continue;
        }
        while (ops.length) {
          const top = ops[ops.length - 1];
          const topOp = top.t === 'fn' ? null : top.t;
          if (topOp && topOp !== '(' &&
            (prec[topOp] > prec[op] || (prec[topOp] === prec[op] && !right[op]))) {
            out.push(ops.pop());
          } else break;
        }
        ops.push({ t: op });
      }
      prev = tk;
    }
    while (ops.length) {
      const top = ops.pop();
      if (top.t === '(') throw new Error('Thiếu dấu đóng ngoặc');
      out.push(top);
    }
    return out;
  }

  /**
   * Biên dịch một biểu thức thành hàm.
   * @param {string} src  ví dụ 'x^2 + 3*x'
   * @param {string[]} vars  tên các biến được phép, ví dụ ['x'] hoặc ['x','y']
   * @returns {function(Object): number}
   */
  VLab.compile = function (src, vars) {
    vars = vars || ['x'];
    const rpn = toRPN(tokenize(String(src)));
    // Kiểm tra ngay lúc biên dịch: tên lạ, và biểu thức thiếu/thừa toán hạng
    let depth = 0;
    for (const tk of rpn) {
      if (tk.t === 'name' && vars.indexOf(tk.v) < 0 && !(tk.v in CONSTS))
        throw new Error('Không hiểu "' + tk.v + '"');
      if (tk.t === 'fn' && !(tk.v in FUNCS))
        throw new Error('Không có hàm "' + tk.v + '"');
      if (tk.t === 'num' || tk.t === 'name') depth += 1;
      else if (tk.t === 'u-') depth += 0;
      else if (tk.t === 'fn') depth += 1 - tk.argc;
      else depth -= 1;
      if (depth < 1) throw new Error('Biểu thức thiếu toán hạng');
    }
    if (depth !== 1) throw new Error('Biểu thức chưa hoàn chỉnh');
    return function (scope) {
      const st = [];
      for (const tk of rpn) {
        if (tk.t === 'num') st.push(tk.v);
        else if (tk.t === 'name') st.push(tk.v in CONSTS ? CONSTS[tk.v] : (scope[tk.v] || 0));
        else if (tk.t === 'u-') st.push(-st.pop());
        else if (tk.t === 'fn') {
          const args = st.splice(st.length - tk.argc, tk.argc);
          st.push(FUNCS[tk.v].apply(null, args));
        } else {
          const b = st.pop(), a = st.pop();
          st.push(tk.t === '+' ? a + b : tk.t === '-' ? a - b :
            tk.t === '*' ? a * b : tk.t === '/' ? a / b : Math.pow(a, b));
        }
      }
      return st.pop();
    };
  };

  /** Đạo hàm số (dùng khi không có công thức đạo hàm) */
  VLab.deriv = function (f, scope, varName, h) {
    h = h || 1e-5;
    const s1 = Object.assign({}, scope), s2 = Object.assign({}, scope);
    s1[varName] = scope[varName] + h;
    s2[varName] = scope[varName] - h;
    return (f(s1) - f(s2)) / (2 * h);
  };

  /* ==========================================================================
     4. KHUNG NHÌN 2D — zoom bằng con lăn, kéo để di chuyển
     ========================================================================== */
  function makeView2D(canvas, opts, onChange) {
    opts = opts || {};
    const home = {
      cx: opts.cx || 0,                  // toạ độ thế giới ở giữa khung
      cy: opts.cy || 0,
      scale: opts.scale || 40            // số pixel cho 1 đơn vị thế giới
    };
    const v = { cx: home.cx, cy: home.cy, scale: home.scale };

    function toScreen(x, y) {
      return [canvas.clientWidth / 2 + (x - v.cx) * v.scale,
              canvas.clientHeight / 2 - (y - v.cy) * v.scale];
    }
    function toWorld(px, py) {
      return [(px - canvas.clientWidth / 2) / v.scale + v.cx,
              -(py - canvas.clientHeight / 2) / v.scale + v.cy];
    }

    // Bài có thể gán v.onPointerDown / onPointerMove / onPointerUp để tự xử lý
    // (ví dụ kéo một nút của đồ thị). onPointerDown trả về true thì khung nhìn
    // không kéo theo. Toạ độ truyền vào là pixel trong canvas.
    let drag = null, grabbed = false;
    function local(e) {
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }
    canvas.addEventListener('pointerdown', function (e) {
      canvas.setPointerCapture(e.pointerId);
      if (v.onPointerDown) {
        const p = local(e);
        if (v.onPointerDown(p[0], p[1], e)) { grabbed = true; return; }
      }
      drag = { x: e.clientX, y: e.clientY, cx: v.cx, cy: v.cy };
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (grabbed) {
        if (v.onPointerMove) { const p = local(e); v.onPointerMove(p[0], p[1], e); }
        return;
      }
      if (!drag) return;
      v.cx = drag.cx - (e.clientX - drag.x) / v.scale;
      v.cy = drag.cy + (e.clientY - drag.y) / v.scale;
      onChange();
    });
    function endDrag() {
      if (grabbed && v.onPointerUp) v.onPointerUp();
      grabbed = false;
      drag = null;
      canvas.classList.remove('dragging');
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const [wx, wy] = toWorld(e.clientX - r.left, e.clientY - r.top);
      const k = Math.exp(-e.deltaY * 0.0015);
      v.scale = Math.max(2, Math.min(4000, v.scale * k));
      // giữ nguyên điểm dưới con trỏ
      const [nx, ny] = toWorld(e.clientX - r.left, e.clientY - r.top);
      v.cx += wx - nx; v.cy += wy - ny;
      onChange();
    }, { passive: false });

    // pinch 2 ngón trên cảm ứng
    let pinch = null;
    canvas.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2) { pinch = null; return; }
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) { v.scale = Math.max(2, Math.min(4000, v.scale * d / pinch)); onChange(); }
      pinch = d;
    }, { passive: false });
    canvas.addEventListener('touchend', function () { pinch = null; });

    v.toScreen = toScreen;
    v.toWorld = toWorld;
    v.reset = function () { v.cx = home.cx; v.cy = home.cy; v.scale = home.scale; onChange(); };
    v.setHome = function (o) { Object.assign(home, o); v.reset(); };

    /** Vẽ lưới + trục. Gọi đầu tiên trong hàm vẽ của bài. */
    v.drawGrid = function (ctx) {
      const W = canvas.clientWidth, H = canvas.clientHeight;
      const cs = getComputedStyle(document.documentElement);
      const grid = cs.getPropertyValue('--vl-grid').trim();
      const axis = cs.getPropertyValue('--vl-axis').trim();
      // bước lưới "đẹp": 1, 2, 5, 10...
      let step = Math.pow(10, Math.floor(Math.log10(80 / v.scale)));
      const n = 80 / (step * v.scale);
      if (n > 5) step *= 5; else if (n > 2) step *= 2;
      const [x0, y1] = toWorld(0, 0), [x1, y0] = toWorld(W, H);
      ctx.lineWidth = 1;
      ctx.strokeStyle = grid;
      ctx.beginPath();
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
        const px = Math.round(toScreen(x, 0)[0]) + 0.5;
        ctx.moveTo(px, 0); ctx.lineTo(px, H);
      }
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
        const py = Math.round(toScreen(0, y)[1]) + 0.5;
        ctx.moveTo(0, py); ctx.lineTo(W, py);
      }
      ctx.stroke();
      // trục
      ctx.strokeStyle = axis; ctx.lineWidth = 1.5;
      ctx.beginPath();
      const oy = Math.round(toScreen(0, 0)[1]) + 0.5;
      const ox = Math.round(toScreen(0, 0)[0]) + 0.5;
      ctx.moveTo(0, oy); ctx.lineTo(W, oy);
      ctx.moveTo(ox, 0); ctx.lineTo(ox, H);
      ctx.stroke();
      // nhãn số
      ctx.fillStyle = axis;
      ctx.font = '11px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const lbl = (t) => Math.abs(t) < 1e-9 ? '0' :
        (Math.abs(t) < 1e-4 || Math.abs(t) >= 1e5 ? t.toExponential(1) :
          parseFloat(t.toPrecision(4)).toString());
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
        if (Math.abs(x) < step / 2) continue;
        ctx.fillText(lbl(x), toScreen(x, 0)[0], Math.min(H - 14, Math.max(2, oy + 3)));
      }
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
        if (Math.abs(y) < step / 2) continue;
        ctx.fillText(lbl(y), Math.max(24, Math.min(W - 2, ox - 5)), toScreen(0, y)[1]);
      }
    };
    return v;
  }

  /* ==========================================================================
     5. TẠO ỨNG DỤNG
     ========================================================================== */
  /**
   * @param {Object} cfg
   *   title    {string}  tiêu đề trang
   *   why      {string}  nội dung ô "Vì sao?" (HTML đơn giản)
   *   stage    {'2d'|'none'}  '2d' tạo sẵn canvas + zoom/pan; 'none' để bài tự dựng (3D)
   *   view     {Object}  {cx, cy, scale} khung nhìn ban đầu (chỉ với stage '2d')
   *   height   {number}  chiều cao sân khấu, mặc định 460
   *   func     {Object}  {label, value, vars} hiện ô nhập công thức
   *   params   {Array}   [{id, label, min, max, step, value, fixed}]
   *   player   {boolean} hiện bộ Chạy/Bước/Làm lại
   *   code     {string[]} các dòng mã giả tiếng Việt
   *   onDraw   {function(ctx, app)}  vẽ lại (chỉ với stage '2d')
   *   onStep   {function(app): boolean}  chạy một bước; trả về false khi kết thúc
   *   onReset  {function(app)}  đặt lại trạng thái bài
   *   onParam  {function(id, value, app)}  khi một tham số đổi
   */
  VLab.create = function (cfg) {
    injectCSS();
    cfg = cfg || {};
    const app = {};
    const root = document.createElement('div');
    root.className = 'vl-app';
    document.body.appendChild(root);

    /* --- đầu trang --- */
    const head = document.createElement('div');
    head.className = 'vl-head';
    head.innerHTML =
      '<h1 class="vl-title"></h1><div class="vl-head-tools">' +
      '<select class="vl-pal" title="Bảng màu"></select>' +
      '<button class="vl-btn vl-theme">Sáng/Tối</button>' +
      '<button class="vl-btn vl-home">Đặt lại khung nhìn</button></div>';
    head.querySelector('.vl-title').textContent = cfg.title || 'Mô phỏng';
    root.appendChild(head);

    const palSel = head.querySelector('.vl-pal');
    Object.keys(PALETTES).forEach(function (n) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n; palSel.appendChild(o);
    });
    palSel.value = paletteName;
    palSel.addEventListener('change', function () {
      paletteName = palSel.value; app.redraw();
    });
    head.querySelector('.vl-theme').addEventListener('click', function () {
      const cur = document.documentElement.getAttribute('data-vl-theme');
      const sysDark = global.matchMedia &&
        global.matchMedia('(prefers-color-scheme: dark)').matches;
      const now = cur || (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-vl-theme', now === 'dark' ? 'light' : 'dark');
      app.redraw();
    });

    /* --- bố cục chính --- */
    const main = document.createElement('div');
    main.className = 'vl-main';
    root.appendChild(main);

    const stageWrap = document.createElement('div');
    stageWrap.className = 'vl-stage-wrap';
    main.appendChild(stageWrap);

    const side = document.createElement('div');
    side.className = 'vl-side';
    main.appendChild(side);

    /* --- sân khấu --- */
    const stageMode = cfg.stage || '2d';
    const stageH = cfg.height || 460;
    let canvas = null, ctx = null;
    app.stageEl = stageWrap;

    if (stageMode === '2d') {
      canvas = document.createElement('canvas');
      canvas.className = 'vl-stage';
      canvas.style.height = stageH + 'px';
      stageWrap.appendChild(canvas);
      ctx = canvas.getContext('2d');
      app.canvas = canvas; app.ctx = ctx;
    } else {
      const host = document.createElement('div');
      host.className = 'vl-stage';
      host.style.height = stageH + 'px';
      stageWrap.appendChild(host);
      app.host = host;
    }

    const statusEl = document.createElement('div');
    statusEl.className = 'vl-status';
    statusEl.innerHTML = '<span class="vl-muted">Sẵn sàng.</span>';
    stageWrap.appendChild(statusEl);

    /* --- khung nhìn --- */
    if (stageMode === '2d') {
      app.view = makeView2D(canvas, cfg.view, function () { app.redraw(); });
    }
    head.querySelector('.vl-home').addEventListener('click', function () {
      if (app.view) app.view.reset();
      else if (app.onHome) app.onHome();
    });

    /* --- ô nhập công thức --- */
    app.f = null;
    if (cfg.func) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Công thức</h3>' +
        '<div class="vl-lab"><span></span></div>' +
        '<input type="text" class="vl-fn">' +
        '<div class="vl-err"></div>' +
        '<div class="vl-hint">Dùng được: + - * / ^ ( ) và sin, cos, exp, ln, sqrt, abs, tanh, relu, sigmoid, pi, e</div>';
      card.querySelector('.vl-lab span').textContent =
        cfg.func.label || ('Hàm theo ' + (cfg.func.vars || ['x']).join(', '));
      const inp = card.querySelector('.vl-fn');
      const err = card.querySelector('.vl-err');
      inp.value = cfg.func.value || 'x^2';
      function recompile() {
        try {
          app.f = VLab.compile(inp.value, cfg.func.vars || ['x']);
          app.fSource = inp.value;
          err.textContent = '';
          if (cfg.onReset) cfg.onReset(app);
          app.redraw();
        } catch (e) {
          err.textContent = 'Lỗi: ' + e.message;
        }
      }
      inp.addEventListener('change', recompile);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') recompile(); });
      side.appendChild(card);
      try {
        app.f = VLab.compile(inp.value, cfg.func.vars || ['x']);
        app.fSource = inp.value;
      } catch (e) { err.textContent = 'Lỗi: ' + e.message; }
    }

    /* --- thanh trượt tham số --- */
    const paramVals = {};
    if (cfg.params && cfg.params.length) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Tham số</h3>';
      cfg.params.forEach(function (p) {
        paramVals[p.id] = p.value;
        const row = document.createElement('div');
        row.className = 'vl-row';
        row.innerHTML = '<div class="vl-lab"><span></span><span class="vl-val"></span></div>' +
          '<input type="range">';
        row.querySelector('.vl-lab span').textContent = p.label;
        const val = row.querySelector('.vl-val');
        const r = row.querySelector('input');
        r.min = p.min; r.max = p.max; r.step = p.step; r.value = p.value;
        const fmt = function (v) {
          return p.fixed != null ? Number(v).toFixed(p.fixed) : String(v);
        };
        val.textContent = fmt(p.value);
        r.addEventListener('input', function () {
          paramVals[p.id] = parseFloat(r.value);
          val.textContent = fmt(r.value);
          if (cfg.onParam) cfg.onParam(p.id, paramVals[p.id], app);
          app.redraw();
        });
        card.appendChild(row);
      });
      side.appendChild(card);
    }
    app.param = function (id) { return paramVals[id]; };
    app.params = paramVals;

    /* --- bộ chạy --- */
    app.running = false;
    app.stepCount = 0;
    if (cfg.player) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Chạy mô phỏng</h3>' +
        '<div class="vl-btns"><button class="vl-btn primary vl-play">▶ Chạy</button>' +
        '<button class="vl-btn vl-step">Bước tiếp</button>' +
        '<button class="vl-btn vl-again">Làm lại</button></div>' +
        '<div class="vl-row" style="margin-top:12px">' +
        '<div class="vl-lab"><span>Tốc độ (bước/giây)</span><span class="vl-spd">8</span></div>' +
        '<input type="range" class="vl-speed" min="1" max="60" step="1" value="8"></div>';
      side.appendChild(card);
      const btnPlay = card.querySelector('.vl-play');
      const spdEl = card.querySelector('.vl-spd');
      const spdIn = card.querySelector('.vl-speed');
      spdIn.addEventListener('input', function () { spdEl.textContent = spdIn.value; });

      let timer = null;
      function oneStep() {
        const alive = cfg.onStep ? cfg.onStep(app) : false;
        app.stepCount++;
        app.redraw();
        if (alive === false) app.pause();
      }
      app.play = function () {
        if (app.running) return;
        app.running = true;
        btnPlay.textContent = '❚❚ Tạm dừng';
        const tick = function () {
          if (!app.running) return;
          oneStep();
          timer = setTimeout(tick, 1000 / parseFloat(spdIn.value));
        };
        tick();
      };
      app.pause = function () {
        app.running = false;
        btnPlay.textContent = '▶ Chạy';
        if (timer) { clearTimeout(timer); timer = null; }
      };
      btnPlay.addEventListener('click', function () {
        app.running ? app.pause() : app.play();
      });
      card.querySelector('.vl-step').addEventListener('click', function () {
        app.pause(); oneStep();
      });
      card.querySelector('.vl-again').addEventListener('click', function () {
        app.pause();
        app.stepCount = 0;
        if (cfg.onReset) cfg.onReset(app);
        app.highlight(-1);
        app.redraw();
      });
    }

    /* --- mã giả --- */
    let codeLines = [];
    if (cfg.code && cfg.code.length) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Thuật toán</h3><div class="vl-code"></div>';
      const box = card.querySelector('.vl-code');
      cfg.code.forEach(function (line) {
        const d = document.createElement('div');
        d.textContent = line;
        box.appendChild(d);
        codeLines.push(d);
      });
      side.appendChild(card);
    }
    /** Tô sáng dòng mã giả đang chạy (-1 để bỏ tô sáng) */
    app.highlight = function (i) {
      codeLines.forEach(function (d, k) { d.classList.toggle('on', k === i); });
    };

    /* --- ô "Vì sao?" --- */
    if (cfg.why) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Vì sao?</h3><div class="vl-why"></div>';
      card.querySelector('.vl-why').innerHTML = cfg.why;
      side.appendChild(card);
    }

    /* --- API phụ --- */
    /** Cập nhật ô "Đang xảy ra gì?" dưới sân khấu */
    app.status = function (html) { statusEl.innerHTML = html; };
    /** Lấy màu thứ i của bảng màu đang chọn */
    app.color = function (i) {
      const p = PALETTES[paletteName];
      return p[((i % p.length) + p.length) % p.length];
    };
    /** Lấy giá trị một biến CSS của chủ đề, ví dụ app.css('--vl-fg') */
    app.css = function (name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    };

    /* --- vòng vẽ --- */
    let pending = false;
    app.redraw = function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        pending = false;
        if (stageMode === '2d') {
          const dpr = global.devicePixelRatio || 1;
          const w = canvas.clientWidth, h = canvas.clientHeight;
          if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
          }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          if (cfg.onDraw) cfg.onDraw(ctx, app);
        } else if (cfg.onDraw) {
          cfg.onDraw(null, app);
        }
      });
    };

    global.addEventListener('resize', function () { app.redraw(); });
    if (global.matchMedia) {
      global.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', function () { app.redraw(); });
    }

    if (cfg.onReset) cfg.onReset(app);
    app.redraw();
    return app;
  };

  /* ==========================================================================
     6. TIỆN ÍCH VẼ (canvas 2D)
     ========================================================================== */
  /** Vẽ đường cong y = f(x) trong toạ độ thế giới */
  VLab.plotFunction = function (ctx, view, f, color, width) {
    const W = ctx.canvas.clientWidth;
    ctx.strokeStyle = color; ctx.lineWidth = width || 2;
    ctx.beginPath();
    let started = false;
    for (let px = 0; px <= W; px++) {
      const x = view.toWorld(px, 0)[0];
      const y = f(x);
      if (!isFinite(y)) { started = false; continue; }
      const [sx, sy] = view.toScreen(x, y);
      if (sy < -1e4 || sy > 1e4) { started = false; continue; }
      if (started) ctx.lineTo(sx, sy); else { ctx.moveTo(sx, sy); started = true; }
    }
    ctx.stroke();
  };

  /** Vẽ một chấm tròn tại toạ độ thế giới */
  VLab.dot = function (ctx, view, x, y, color, r) {
    const [sx, sy] = view.toScreen(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx, sy, r || 5, 0, Math.PI * 2);
    ctx.fill();

  var LESSON = {"batch": "<div class=\"ls-hook\">\n<h3>🔥 Câu đố: đáp án ở ngay trước mặt, sao máy đi lạc lâu thế?<\/h3>\n<p>Ba điểm (1, 3), (2, 5), (3, 7) nằm <b>đúng<\/b> trên đường <b>y = 2x + 1<\/b>. Nhìn là biết đáp án: <b>w = 2, b = 1<\/b>. Vậy mà với cài đặt mặc định (η = 0.01, 100 epoch), máy dừng ở <b>w = 2.0348, b = 0.9208<\/b>. Loss (mất mát: con số đo mô hình đang sai bao nhiêu) đã bé tí, 0.00090, nhưng <b>b vẫn lệch ~0.08<\/b>. Muốn loss &lt; 10⁻⁶ phải chạy tới <b>1513 epoch<\/b> (epoch = một lượt duyệt hết dữ liệu; η đọc là \"ê-ta\", tốc độ học — learning rate — độ dài mỗi bước).<\/p>\n<p>Trong khi đó, một mẹo rất nhỏ (bạn sẽ tự suy ra ở phần 📐) đưa máy tới đích sau <b>7 epoch<\/b>, nhanh gấp ~216 lần. Mẹo đó là gì, và vì sao nó xuất hiện trong <i>mọi<\/i> bài ML bạn sẽ làm, kể cả dự đoán giá xe?<\/p>\n<\/div>\n\n<div class=\"ls-q\" data-a=\"2\">\n<p class=\"ls-qq\">✋ <b>Đoán trước:<\/b> kéo η từ 0.01 lên <b>0.19<\/b> (vẫn nằm trong thanh trượt), bấm Chạy. Chuyện gì xảy ra?<\/p>\n<div class=\"ls-opts\">\n<button type=\"button\" data-i=\"1\">A. Hội tụ nhanh hơn nhiều<\/button>\n<button type=\"button\" data-i=\"2\">B. Loss tăng vọt, w và b văng ra rất xa<\/button>\n<button type=\"button\" data-i=\"3\">C. Hội tụ như cũ, chỉ dao động nhẹ<\/button>\n<\/div>\n<div class=\"ls-ex\" hidden>\n<p><b>B.<\/b> Với η = 0.17 máy vẫn hội tụ (loss &lt; 10⁻⁶ sau 88 epoch). Với η = 0.19, mỗi bước đi quá đà, bước sau quá đà hơn bước trước: sau 1000 epoch w ≈ −5.2×10⁴⁴. Ranh giới nằm đúng ở η = <b>0.1803<\/b>. Con số này không phải thử sai mà <i>suy ra được<\/i> (phần 📐, mục 5).<\/p>\n<\/div>\n<\/div>\n\n<details class=\"ls-d\" open>\n<summary>📐 Suy ra trên giấy (6 bước)<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Mô hình và loss.<\/b> ŷᵢ = w·xᵢ + b (ŷ đọc \"y mũ\" = dự đoán). Loss MSE (sai số bình phương trung bình):\n<div class=\"ls-m\">L(w,b) = (1/N)·Σ (ŷᵢ − yᵢ)²<\/div>\nChia N để loss không phình theo số mẫu, nhờ vậy η không phải chỉnh lại khi thêm dữ liệu.<\/li>\n<li><b>Gradient<\/b> (vectơ các đạo hàm riêng, chỉ hướng làm loss tăng nhanh nhất). Đặt eᵢ = ŷᵢ − yᵢ, dùng quy tắc chuỗi (chain rule, đạo hàm hàm hợp):\n<div class=\"ls-m\">∂L/∂w = (1/N)·Σ 2eᵢ·(∂ŷᵢ/∂w) = (2/N)·Σ eᵢ·xᵢ\n∂L/∂b = (2/N)·Σ eᵢ<\/div><\/li>\n<li><b>Vì sao đi ngược gradient?<\/b> Khai triển bậc 1: L(θ − η·g) ≈ L(θ) − η·‖g‖². Số bị trừ luôn dương nên loss giảm, miễn η đủ nhỏ để phép xấp xỉ còn đúng. \"Đủ nhỏ\" là bao nhiêu? Xem mục 5.<\/li>\n<li><b>Thế số bước đầu<\/b> (đối chiếu với ô \"Thế số từng bước\" bên dưới mô phỏng). w = b = 0 nên ŷ = [0, 0, 0]; e = [−3, −5, −7].\n<div class=\"ls-m\">L = (9 + 25 + 49)/3 = 27.6667\n∂L/∂w = (2/3)(−3·1 − 5·2 − 7·3) = −22.6667\n∂L/∂b = (2/3)(−3 − 5 − 7) = −10\nw ← 0 − 0.01·(−22.6667) = 0.2267\nb ← 0 − 0.01·(−10) = 0.1<\/div><\/li>\n<li><b>Vì sao đi chậm?<\/b> Loss là một cái \"bát\" (parabol hai chiều). Độ cong của bát theo từng hướng là <b>trị riêng<\/b> (eigenvalue) của ma trận độ cong (Hessian):\n<div class=\"ls-m\">H = (2/N)·[[Σx², Σx], [Σx, N]] = [[9.333, 4], [4, 2]]\ntrị riêng: λ₁ = 0.240 (hướng phẳng lì), λ₂ = 11.093 (hướng dốc đứng)<\/div>\nMỗi epoch, sai số theo một hướng được nhân với <b>(1 − η·λ)<\/b>. Để hướng dốc không văng: |1 − η·λ₂| &lt; 1 ⇒ <b>η &lt; 2/λ₂ = 2/11.093 = 0.1803<\/b>, đúng ngưỡng ở câu đoán. Nhưng hướng phẳng chỉ co với hệ số 1 − 0.01·0.240 = 0.99760 mỗi epoch: nhích từng li. Tỉ lệ λ₂/λ₁ = <b>46<\/b> (số điều kiện, condition number): bát càng dẹt, càng khó chạy.<br>\nHướng phẳng đó là gì? Sai số còn lại sau 100 epoch là (w − 2, b − 1) = (0.0348, −0.0792), tỉ lệ −2.27, khớp với vectơ riêng của λ₁ (−2.27). Nghĩa là <b>w tăng thì b phải giảm gấp ~2.3 lần<\/b>: hai tham số \"dính\" nhau.<\/li>\n<li><b>Vì sao dính, và mẹo gỡ.<\/b> Mọi đường thẳng khớp tốt đều đi gần trọng tâm dữ liệu (x̄, ȳ) = (2, 5): sau 50 epoch, ŷ(2) = 4.975, 50 epoch nữa chỉ nhích lên 4.990. Từ đó đường thẳng chỉ <i>xoay quanh điểm (2, 5)<\/i>. Mà đường y = w·x + b xoay quanh x = 2 thì b = 5 − 2w: đổi w kéo theo đổi b. Mẹo: <b>đặt trục xoay về x = 0 bằng cách trừ trung bình<\/b>, x′ = x − 2 = (−1, 0, 1):\n<div class=\"ls-m\">H′ = (2/3)·[[2, 0], [0, 3]] = [[1.333, 0], [0, 2]]\ntrị riêng 1.333 và 2 → tỉ lệ chỉ 1.5; η cho phép tới 1.0<\/div>\nVới η = 0.5: sau epoch 1 đã có <b>b = 5<\/b> (đúng trung bình của y), loss &lt; 10⁻⁶ ở epoch 7. Kết quả ŷ = 2·(x − 2) + 5 = 2x + 1: cùng một đường thẳng, chỉ đổi hệ trục. Đây chính là <b>chuẩn hoá đặc trưng<\/b> (feature scaling: trừ trung bình, chia độ lệch chuẩn). Trong project giá xe, \"năm sản xuất\" ≈ 2015 và \"số km\" ≈ 10⁵ làm bát dẹt hơn cả ví dụ này nhiều lần.<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧪 Thử trong mô phỏng (đoán trước rồi mới bấm)<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Bấm Tiếp 4 lần<\/b> (một epoch gồm 4 pha) rồi đọc ô \"Thế số từng bước\". Có ra đúng −22.6667 và −10 như mục 4 không? Đây là phép \"giấy ↔ máy\" bạn nên làm trước khi tin bất cứ con số nào.<\/li>\n<li><b>Đặt w₀ = 2, b₀ = 1 (đáp án) rồi Tiếp.<\/b> Đoán: gradient bằng bao nhiêu? Loss? Máy có đi đâu nữa không? (Gradient = 0, loss = 0: điểm tối ưu là nơi gradient triệt tiêu, nên máy đứng yên.)<\/li>\n<li><b>Chạy mặc định rồi nhìn đồ thị \"Mô hình khớp dữ liệu\".<\/b> Đường thẳng khớp ba điểm khá sớm nhưng phần \"đuôi\" sau đó rất dài: đó là hướng phẳng ở mục 5.<\/li>\n<li><b>Kéo η lên 0.17 rồi 0.19.<\/b> Quan sát đồ thị loss và dòng chữ \"Phân kỳ (diverge)\". Ghi lại η lớn nhất mà bạn thấy còn hội tụ, so với 0.1803.<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>📊 Excel (kiểm chứng bằng bảng tính)<\/summary>\n<p>Nhập dữ liệu và tham số, rồi dựng bảng mỗi hàng là một epoch:<\/p>\n<table class=\"ls-t\">\n<tr><th>Ô<\/th><th>Nội dung<\/th><\/tr>\n<tr><td>A1, B1:D1<\/td><td><code>x<\/code>, rồi <code>1  2  3<\/code><\/td><\/tr>\n<tr><td>A2, B2:D2<\/td><td><code>y<\/code>, rồi <code>3  5  7<\/code><\/td><\/tr>\n<tr><td>J1, K1<\/td><td><code>η<\/code>, rồi <code>0.01<\/code><\/td><\/tr>\n<tr><td>Hàng 4<\/td><td>tiêu đề: epoch, w, b, ŷ₁, ŷ₂, ŷ₃, L, ∂L/∂w, ∂L/∂b<\/td><\/tr>\n<tr><td>A5, B5, C5<\/td><td><code>0<\/code>, <code>0<\/code>, <code>0<\/code> (epoch 0, w₀, b₀)<\/td><\/tr>\n<tr><td>D5 (kéo sang F5)<\/td><td><code>=$B5*B$1+$C5<\/code><\/td><\/tr>\n<tr><td>G5<\/td><td><code>=SUMXMY2(D5:F5,$B$2:$D$2)/3<\/code><\/td><\/tr>\n<tr><td>H5<\/td><td><code>=2*SUMPRODUCT(D5:F5-$B$2:$D$2,$B$1:$D$1)/3<\/code><\/td><\/tr>\n<tr><td>I5<\/td><td><code>=2*SUMPRODUCT(D5:F5-$B$2:$D$2)/3<\/code><\/td><\/tr>\n<tr><td>A6<\/td><td><code>=A5+1<\/code><\/td><\/tr>\n<tr><td>B6<\/td><td><code>=B5-$K$1*H5<\/code><\/td><\/tr>\n<tr><td>C6<\/td><td><code>=C5-$K$1*I5<\/code><\/td><\/tr>\n<tr><td>D6:I6<\/td><td>sao chép từ D5:I5, rồi kéo cả hàng 6 xuống ~100 hàng<\/td><\/tr>\n<\/table>\n<p><b>Kiểm tra:<\/b> G5 = 27.6667; B6 = 0.2267; C6 = 0.1. Hàng epoch 100 (hàng 105) cho w ≈ 2.0348, b ≈ 0.9208.<\/p>\n<p><b>Thử phá:<\/b> sửa B1:D1 thành <code>-1  0  1<\/code> và K1 thành <code>0.5<\/code>. Đoán trước: C6 bằng bao nhiêu? (Bằng 5.) Hàng nào có G &lt; 10⁻⁶? (Epoch 7.)<\/p>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>💻 JupyterLab (tự cài tay, chưa dùng thư viện)<\/summary>\n<pre class=\"ls-code\">x = [1, 2, 3]\ny = [3, 5, 7]\nN = len(x)\nw, b, eta = 0.0, 0.0, 0.01\n\nfor epoch in range(100):\n    e = [w*xi + b - yi for xi, yi in zip(x, y)]       # sai số từng mẫu: ŷ - y\n    L = sum(ei**2 for ei in e) / N                    # loss MSE\n    gw = 2/N * sum(ei*xi for ei, xi in zip(e, x))     # ∂L/∂w\n    gb = 2/N * sum(e)                                 # ∂L/∂b\n    w, b = w - eta*gw, b - eta*gb                     # cập nhật cả hai cùng lúc\n\nL = sum((w*xi + b - yi)**2 for xi, yi in zip(x, y)) / N   # loss tại (w, b) cuối cùng\nprint(f&quot;w={w:.4f}  b={b:.4f}  L={L:.2e}&quot;)<\/pre>\n<p>Kết quả phải trùng Excel và mô phỏng:<\/p>\n<pre class=\"ls-out\">w=2.0348  b=0.9208  L=8.99e-04<\/pre>\n<p><b>Thử phá:<\/b> đổi thành <code>x = [-1, 0, 1]<\/code>, <code>eta = 0.5<\/code>, <code>range(10)<\/code>:<\/p>\n<pre class=\"ls-out\">w=2.0000  b=5.0000  L=7.65e-10<\/pre>\n<p>Chú ý w = 2 nhưng b = 5, không phải 1. Đường thẳng vẫn là đường cũ, vì bây giờ b là giá trị tại x = 2 (b′ = b + 2w = 1 + 4 = 5).<\/p>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧭 Tự kiểm tra<\/summary>\n<details class=\"ls-a\"><summary>1. Nhân đôi cả ba nhãn y (6, 10, 14). Đáp án mới là gì, và ngưỡng η có đổi không?<\/summary><p>w = 4, b = 2. Ngưỡng η <b>không đổi<\/b>: Hessian chỉ chứa x, không chứa y. Tốc độ hội tụ do hình dạng của dữ liệu đầu vào quyết định, không do nhãn.<\/p><\/details>\n<details class=\"ls-a\"><summary>2. Vì sao Batch GD tốn kém với 1 triệu mẫu?<\/summary><p>Mỗi lần cập nhật phải duyệt hết 1 triệu mẫu để tính gradient, và 1 epoch chỉ cho đúng 1 lần cập nhật. Đây là động cơ của SGD ở tab kế tiếp.<\/p><\/details>\n<details class=\"ls-a\"><summary>3. Nếu thêm đặc trưng thứ hai có giá trị cỡ 10⁵ (như số km), điều gì xảy ra với ngưỡng η?<\/summary><p>Trung bình của x² ở đặc trưng đó cỡ 10¹⁰ nên λ₂ rất lớn và ngưỡng 2/λ₂ cực nhỏ, trong khi các đặc trưng bé vẫn cần η lớn mới đi nổi. Một η không thể vừa lòng cả hai: phải chuẩn hoá.<\/p><\/details>\n<\/details>\n\n<div class=\"ls-note\">\n<b>🔁 Trùng NCKH:<\/b> learning rate (<code>eta<\/code> trong XGBoost) cùng ý với η ở đây: bước nhỏ thì an toàn nhưng cần nhiều vòng, bước lớn có thể phá. Khác ở chỗ bước của XGBoost là \"thêm một cây\", không phải sửa w. Bạn không cần học lại phần này khi đọc tài liệu XGBoost.\n<\/div>\n\n<details class=\"ls-d\">\n<summary>📝 Ghi vào Notion (4 dòng)<\/summary>\n<div class=\"ls-m\">• Gradient descent: θ ← θ − η·∇L; MSE: ∂L/∂w = (2/N)Σeᵢxᵢ, ∂L/∂b = (2/N)Σeᵢ.\n• Ngưỡng η = 2/λmax(H) (0.1803 ở bài này); λ = trị riêng của ma trận độ cong.\n• Bát dẹt (λmax/λmin lớn) ⇒ hội tụ chậm; nguyên nhân hay gặp: đặc trưng không có trung bình 0.\n• Cách chữa: trừ trung bình (và chia độ lệch chuẩn) trước khi train.<\/div>\n<\/details>\n", "sgd": "<div class=\"ls-hook\">\n<h3>🔥 Câu đố: mỗi bước chỉ nhìn một điểm. Nghe liều, mà lại thắng?<\/h3>\n<p>Cùng dữ liệu, cùng η = 0.01, sau <b>60 epoch<\/b> (đo bằng MSE trên cả 3 điểm): Batch GD (tab 1) còn loss <b>0.00111<\/b>, SGD chỉ còn <b>0.00043<\/b>, tốt hơn <b>~2.6 lần<\/b>. SGD (Stochastic Gradient Descent, xuống dốc ngẫu nhiên: mỗi lần cập nhật chỉ dùng <i>một<\/i> mẫu) không thông minh hơn; nó chỉ đi nhiều bước hơn. Một epoch của SGD có 3 lần cập nhật (mỗi mẫu một lần), còn Batch chỉ có 1.<\/p>\n<p>Câu hỏi thật sự: thông tin từ <i>một<\/i> điểm có đáng tin để đi theo không? Tại w = b = 0, gradient theo w của ba điểm lần lượt là <b>−6, −20, −42<\/b>: ba con số khác hẳn nhau. Nhưng trung bình của chúng là <b>−22.6667<\/b>, đúng bằng gradient của Batch ở tab 1. Mỗi điểm kéo một kiểu, và chỉ <i>trung bình<\/i> mới đúng hướng. Vậy vì sao đi theo từng điểm một mà vẫn tới đích?<\/p>\n<\/div>\n\n<div class=\"ls-q\" data-a=\"2\">\n<p class=\"ls-qq\">✋ <b>Đoán trước:<\/b> đặt \"Hàm kích hoạt\" = 1 (sigmoid) rồi chạy 60 epoch. Loss ở cuối sẽ ra sao?<\/p>\n<div class=\"ls-opts\">\n<button type=\"button\" data-i=\"1\">A. Giảm về gần 0 như khi tuyến tính<\/button>\n<button type=\"button\" data-i=\"2\">B. Kẹt ở khoảng 36, không giảm nổi<\/button>\n<button type=\"button\" data-i=\"3\">C. Phân kỳ, tăng vọt<\/button>\n<\/div>\n<div class=\"ls-ex\" hidden>\n<p><b>B<\/b> (cuối epoch 60 loss mẫu cuối = 36.04). Sigmoid chỉ cho đầu ra trong khoảng (0, 1) mà nhãn là 3, 5, 7. Mẫu y = 7 luôn sai ít nhất 6, tức là bình phương ≥ 36. Đây <b>không phải lỗi tối ưu hoá<\/b>: tối ưu giỏi đến đâu cũng vô ích khi hàm kích hoạt không với tới nhãn. Quy tắc: hồi quy (đầu ra là số bất kỳ) dùng đầu ra tuyến tính; xác suất mới dùng sigmoid (tab 3).<\/p>\n<\/div>\n<\/div>\n\n<details class=\"ls-d\" open>\n<summary>📐 Suy ra trên giấy<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Gradient của một mẫu.<\/b> L = (ŷ − y)² với ŷ = w·x + b. Đặt δ = ∂L/∂ŷ = 2(ŷ − y). Quy tắc chuỗi cho:\n<div class=\"ls-m\">∂L/∂w = δ·x     ∂L/∂b = δ\nw ← w − η·δ·x     b ← b − η·δ     (cập nhật ngay, rồi mới sang mẫu kế)<\/div><\/li>\n<li><b>Thế số hai cập nhật đầu<\/b> (η = 0.01, w = b = 0):\n<div class=\"ls-m\">Mẫu (1, 3):  ŷ = 0,  δ = 2(0 − 3) = −6\n             w = 0 − 0.01·(−6·1) = 0.06;  b = 0.06\nMẫu (2, 5):  ŷ = 0.06·2 + 0.06 = 0.18,  δ = 2(0.18 − 5) = −9.64\n             w = 0.06 + 0.01·19.28 = 0.2528;  b = 0.1564<\/div>\nBấm Tiếp 8 lần và đối chiếu với ô \"Thế số từng bước\".<\/li>\n<li><b>Vì sao đi theo một mẫu mà vẫn đúng hướng?<\/b> Gradient Batch là trung bình gᵢ của các mẫu. Nếu chọn mẫu i ngẫu nhiên đều thì <b>kỳ vọng<\/b> của gᵢ bằng gradient Batch: đây là ước lượng không chệch (unbiased estimator). Phần sai lệch là nhiễu, và nhiễu có dấu ngẫu nhiên nên bị triệt tiêu dần qua nhiều bước.<\/li>\n<li><b>Vì sao đồ thị loss không giảm đều?<\/b> Ba bước đầu, loss lần lượt là 9 → 23.2 → 37.0: <i>tăng<\/i>, dù mô hình đang tốt lên. Lý do: loss của SGD đo trên mẫu đang xét, và mẫu sau có nhãn lớn hơn nên khó hơn. Muốn đo tiến bộ thật, hãy tính MSE trên toàn bộ dữ liệu cuối mỗi epoch.<\/li>\n<li><b>Vì sao phải xáo trộn (shuffle)?<\/b> Dữ liệu ở đây sắp theo nhãn tăng dần. Nếu cứ duyệt đúng thứ tự, cập nhật cuối mỗi epoch luôn kéo mô hình về phía mẫu cuối. Xáo trộn mỗi epoch phá thế thiên vị đó. Bật \"xáo trộn\" và so đường đi của đồ thị loss.<\/li>\n<li><b>Vì sao ở đây SGD không rung?<\/b> Vì dữ liệu <i>không nhiễu<\/i>: tại (w, b) = (2, 1) cả ba gradient riêng lẻ cùng bằng 0 nên SGD dừng hẳn. Thí nghiệm tư duy: đổi nhãn thứ ba từ 7 thành 8. Ba điểm không còn thẳng hàng; nghiệm tốt nhất (bình phương tối thiểu) là (w, b) = (2.5, 0.3333). Batch GD đứng yên đúng chỗ đó. SGD với η = 0.01 thì <b>không bao giờ đứng yên<\/b>: sau 2000 epoch, w vẫn nhảy trong [2.507, 2.521] và b trong [0.303, 0.310], vì mỗi mẫu vẫn kéo về nghiệm riêng của nó. Cách chữa: giảm η dần theo thời gian, hoặc dùng <b>mini-batch<\/b> (mỗi bước dùng vài chục mẫu: ít rung hơn SGD, rẻ hơn Batch).<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧪 Thử trong mô phỏng<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Bấm Tiếp 12 lần (một epoch).<\/b> Đồ thị \"Mô hình khớp dữ liệu\" tô sáng mẫu đang dùng. Hãy để ý đường thẳng nhích theo từng mẫu chứ không theo cả ba.<\/li>\n<li><b>Xáo trộn = 0 rồi = 1.<\/b> Chạy hai lần cùng η. Đường đi khác nhau, đích đến có khác không? (Ở dữ liệu không nhiễu, không.)<\/li>\n<li><b>Bật sigmoid<\/b> (câu đoán ở trên) và nhìn đồ thị \"Mô hình khớp dữ liệu\": đường cong bị \"ép\" vào khoảng 0–1, không bao giờ chạm các điểm.<\/li>\n<li><b>Tăng η lên 0.2 rồi 0.3.<\/b> Đoán trước: SGD có chịu được η lớn như Batch không? (Ở dữ liệu này, η = 0.15 vẫn hội tụ nhưng 0.2 thì phân kỳ.)<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>📊 Excel<\/summary>\n<p>Dùng lại x, y, η như tab 1 (B1:D1, B2:D2, K1). Bảng mới, mỗi hàng là <b>một lần cập nhật<\/b> (không phải một epoch):<\/p>\n<table class=\"ls-t\">\n<tr><th>Ô<\/th><th>Nội dung<\/th><\/tr>\n<tr><td>Hàng 4<\/td><td>tiêu đề: n, w, b, i, x, y, ŷ, δ, L<\/td><\/tr>\n<tr><td>A5, B5, C5<\/td><td><code>0<\/code>, <code>0<\/code>, <code>0<\/code><\/td><\/tr>\n<tr><td>D5<\/td><td><code>=MOD(A5,3)+1<\/code> (chỉ số mẫu, chạy 1, 2, 3, 1, 2, 3, …)<\/td><\/tr>\n<tr><td>E5<\/td><td><code>=INDEX($B$1:$D$1,D5)<\/code><\/td><\/tr>\n<tr><td>F5<\/td><td><code>=INDEX($B$2:$D$2,D5)<\/code><\/td><\/tr>\n<tr><td>G5<\/td><td><code>=B5*E5+C5<\/code><\/td><\/tr>\n<tr><td>H5<\/td><td><code>=2*(G5-F5)<\/code><\/td><\/tr>\n<tr><td>I5<\/td><td><code>=(G5-F5)^2<\/code><\/td><\/tr>\n<tr><td>A6<\/td><td><code>=A5+1<\/code><\/td><\/tr>\n<tr><td>B6<\/td><td><code>=B5-$K$1*H5*E5<\/code><\/td><\/tr>\n<tr><td>C6<\/td><td><code>=C5-$K$1*H5<\/code><\/td><\/tr>\n<tr><td>D6:I6<\/td><td>sao chép từ D5:I5, kéo xuống 180 hàng (60 epoch × 3)<\/td><\/tr>\n<\/table>\n<p><b>Kiểm tra:<\/b> B6 = 0.06, C6 = 0.06; B7 = 0.2528, C7 = 0.1564; I5, I6, I7 = 9, 23.2324, 37.0297.<\/p>\n<p><b>Thử phá:<\/b> sửa D2 từ 7 thành 8 và kéo xuống ~3000 hàng. Đoán trước: cột B có đứng yên không? (Không: nó nhảy qua lại quanh 2.5.)<\/p>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>💻 JupyterLab<\/summary>\n<pre class=\"ls-code\">x = [1, 2, 3]\ny = [3, 5, 7]\nw, b, eta = 0.0, 0.0, 0.01\nn = 0\n\nfor epoch in range(60):\n    for xi, yi in zip(x, y):          # duyệt từng mẫu theo thứ tự cố định\n        delta = 2 * (w*xi + b - yi)   # δ = 2(ŷ − y)\n        w -= eta * delta * xi         # cập nhật NGAY sau mỗi mẫu\n        b -= eta * delta\n        n += 1\n        if n &lt;= 3:\n            print(f&quot;n={n}  delta={delta:.4f}  w={w:.4f}  b={b:.4f}&quot;)\n\nmse = sum((w*xi + b - yi)**2 for xi, yi in zip(x, y)) / len(x)\nprint(f&quot;sau 60 epoch: w={w:.4f}  b={b:.4f}  MSE toàn bộ={mse:.5f}&quot;)<\/pre>\n<pre class=\"ls-out\">n=1  delta=-6.0000  w=0.0600  b=0.0600\nn=2  delta=-9.6400  w=0.2528  b=0.1564\nn=3  delta=-12.1704  w=0.6179  b=0.2781\nsau 60 epoch: w=2.0231  b=0.9452  MSE toàn bộ=0.00043<\/pre>\n<p><b>Thử phá:<\/b> sửa <code>y = [3, 5, 8]<\/code> và chạy 2000 epoch, in <code>w, b<\/code> ở vài epoch cuối liên tiếp. Bạn sẽ thấy chúng không đứng yên:<\/p>\n<pre class=\"ls-code\">x = [1, 2, 3]\ny = [3, 5, 8]                         # nhãn thứ ba đổi từ 7 thành 8\nw, b, eta = 0.0, 0.0, 0.01\ntail = []\n\nfor epoch in range(2000):\n    for xi, yi in zip(x, y):\n        delta = 2 * (w*xi + b - yi)\n        w -= eta * delta * xi\n        b -= eta * delta\n        if epoch &gt;= 1998:             # giữ lại 6 cập nhật cuối\n            tail.append((w, b))\n\nfor w_, b_ in tail:\n    print(f&quot;w={w_:.4f}  b={b_:.4f}&quot;)\n\nxm, ym = sum(x)/3, sum(y)/3           # nghiệm bình phương tối thiểu, tính tay\nw_ls = sum((xi-xm)*(yi-ym) for xi, yi in zip(x, y)) / sum((xi-xm)**2 for xi in x)\nb_ls = ym - w_ls*xm\nprint(f&quot;nghiệm đúng: w={w_ls:.4f}  b={b_ls:.4f}&quot;)<\/pre>\n<pre class=\"ls-out\">w=2.5211  b=0.3099\nw=2.5070  b=0.3028\nw=2.5176  b=0.3063\nw=2.5211  b=0.3099\nw=2.5070  b=0.3028\nw=2.5176  b=0.3063\nnghiệm đúng: w=2.5000  b=0.3333<\/pre>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧭 Tự kiểm tra<\/summary>\n<details class=\"ls-a\"><summary>1. Vì sao SGD cần giảm η dần trên dữ liệu thật?<\/summary><p>Dữ liệu thật có nhiễu nên mỗi mẫu kéo về một nghiệm riêng; η cố định làm w rung trong một vùng có kích thước tỉ lệ với η. Giảm η thì vùng rung co lại.<\/p><\/details>\n<details class=\"ls-a\"><summary>2. Một epoch Batch và một epoch SGD có tốn công như nhau không?<\/summary><p>Cùng số phép tính gradient (đều duyệt hết N mẫu), nhưng SGD cập nhật N lần còn Batch chỉ 1 lần. Vì vậy SGD \"thắng\" ở bước đầu mỗi epoch, đúng như câu đố mở đầu.<\/p><\/details>\n<details class=\"ls-a\"><summary>3. Mini-batch kích thước B nằm ở đâu giữa hai thái cực?<\/summary><p>B = 1 là SGD, B = N là Batch. Thực tế dùng B ≈ 32–256: tận dụng được tính toán song song trên phần cứng mà vẫn có nhiều cập nhật mỗi epoch.<\/p><\/details>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>📝 Ghi vào Notion<\/summary>\n<div class=\"ls-m\">• SGD: cập nhật sau mỗi mẫu, w ← w − η·δ·x, b ← b − η·δ.\n• Gradient một mẫu là ước lượng không chệch của gradient Batch (trung bình đúng, từng cái nhiễu).\n• 1 epoch = N cập nhật (Batch: 1 cập nhật). Loss đo theo mẫu sẽ răng cưa.\n• Đầu ra hồi quy phải tuyến tính; sigmoid giới hạn (0, 1) nên không với tới nhãn lớn.\n• Dữ liệu nhiễu + η cố định ⇒ rung quanh nghiệm; chữa bằng giảm η hoặc mini-batch.<\/div>\n<\/details>\n", "logit": "<div class=\"ls-hook\">\n<h3>🔥 Câu đố: dữ liệu hoàn hảo, loss về 0, vậy sao w cứ lớn mãi không dừng?<\/h3>\n<p>Ba điểm: x = −1 thuộc lớp 0; x = 1 và x = 2 thuộc lớp 1. Một ranh giới đứng giữa −1 và 1 là xong. Mô phỏng chạy 60 epoch cho w = <b>2.5803<\/b>; chạy 300 epoch cho w = <b>4.1169<\/b>; nó cứ lớn dần, không bao giờ dừng. Mô hình ngày càng \"chắc chắn\": xác suất lớp 1 tại x = 2 đi từ <b>99.49%<\/b> lên <b>99.97%<\/b>, và tại x = −1 từ 7.78% xuống 1.66%.<\/p>\n<p>Vì sao không có đáp án hữu hạn, và nó gây hại gì khi dữ liệu thật \"gần như tách được\" (chấm điểm tín dụng, vài biến quá mạnh)? Phần dưới trả lời, kèm một câu đố thứ hai: <b>vì sao dùng BCE chứ không dùng MSE như tab 1?<\/b><\/p>\n<\/div>\n\n<div class=\"ls-q\" data-a=\"2\">\n<p class=\"ls-qq\">✋ <b>Đoán trước:<\/b> nhãn đúng là y = 1 nhưng mô hình đang chắc chắn sai: z = −5 (σ(z) ≈ 0.0067). Gradient theo z, lớn hay nhỏ? Mô hình sai nặng nhất thì học thế nào?<\/p>\n<div class=\"ls-opts\">\n<button type=\"button\" data-i=\"1\">A. Cả MSE và BCE đều cho gradient lớn, vì sai rất nhiều<\/button>\n<button type=\"button\" data-i=\"2\">B. BCE cho gradient lớn (≈ −0.99), MSE gần như bằng 0 (≈ −0.013)<\/button>\n<button type=\"button\" data-i=\"3\">C. Hai hàm cho gradient y hệt nhau<\/button>\n<\/div>\n<div class=\"ls-ex\" hidden>\n<p><b>B.<\/b> BCE: ∂L/∂z = ŷ − y = −0.9933. MSE (với sigmoid): ∂L/∂z = 2(ŷ − y)·ŷ(1 − ŷ) = −0.0132, nhỏ hơn <b>75 lần<\/b>, vì thừa số σ′(z) = ŷ(1 − ŷ) ≈ 0 khi sigmoid bão hoà. Với MSE, mô hình sai chắc chắn là mô hình học chậm nhất, đúng ngược với điều ta muốn. BCE khử hẳn thừa số đó (chứng minh ở mục 3).<\/p>\n<\/div>\n<\/div>\n\n<details class=\"ls-d\" open>\n<summary>📐 Suy ra trên giấy<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Mô hình.<\/b> z = w·x + b, ŷ = σ(z) = 1/(1 + e⁻ᶻ), đọc ŷ là xác suất P(y = 1 | x). Sigmoid nén mọi số thực vào (0, 1).<\/li>\n<li><b>BCE từ đâu ra?<\/b> (Binary Cross-Entropy, entropy chéo nhị phân; còn gọi log loss.) Xác suất mô hình gán cho nhãn thật là ŷʸ·(1 − ŷ)¹⁻ʸ. Chọn tham số làm tích các xác suất này lớn nhất (maximum likelihood, hợp lý cực đại) tương đương làm −ln của nó nhỏ nhất:\n<div class=\"ls-m\">L = −[ y·ln ŷ + (1 − y)·ln(1 − ŷ) ]<\/div>\nNếu y = 1 thì L = −ln ŷ: gán 100% cho đáp án đúng thì loss 0; gán 50% thì 0.6931 (= ln 2); gán 1% thì 4.61; gán 0% thì vô cực. Mô hình bị phạt <i>rất nặng<\/i> khi sai mà tự tin.<\/li>\n<li><b>Gradient: hai thứ sinh ra để đi cùng nhau.<\/b>\n<div class=\"ls-m\">∂L/∂ŷ = −y/ŷ + (1 − y)/(1 − ŷ)\n∂ŷ/∂z = ŷ(1 − ŷ)\n∂L/∂z = [−y(1 − ŷ) + (1 − y)ŷ] = ŷ − y     (thừa số ŷ(1 − ŷ) triệt tiêu)\n⇒ δ = ŷ − y;   ∂L/∂w = δ·x;   ∂L/∂b = δ<\/div>\nĐẹp: công thức giống hệt hồi quy tuyến tính (tab 2), chỉ khác ŷ đã qua sigmoid.<\/li>\n<li><b>Thế số ba cập nhật đầu<\/b> (SGD, η = 0.1, w = b = 0):\n<div class=\"ls-m\">(x=−1, y=0): z=0,  ŷ=0.5,  L=0.6931 (= ln 2),  δ=+0.5\n             ∂w=δ·x=−0.5, ∂b=0.5 → w=0.05, b=−0.05\n(x= 1, y=1): z=0.05·1+(−0.05)=0, ŷ=0.5, δ=−0.5\n             ∂w=−0.5, ∂b=−0.5 → w=0.1, b=0.0\n(x= 2, y=1): z=0.2, ŷ=0.5498, L=0.5981, δ=−0.4502\n             ∂w=−0.9003 → w=0.1900, b=0.0450<\/div><\/li>\n<li><b>Biên quyết định<\/b> (decision boundary): ŷ = 0.5 ⇔ z = 0 ⇔ x = −b/w. Sau 60 epoch: −b/w = −0.0416, nằm giữa −1 và 1 đúng như mong đợi (ô góc trên đồ thị \"Đường sigmoid và biên quyết định\").<\/li>\n<li><b>Vì sao w không dừng?<\/b> Với dữ liệu tách được, loss chỉ tiến về 0 khi ŷ → 0 hoặc 1 tuyệt đối, tức là |z| → ∞, tức là w → ∞. Không có nghiệm hữu hạn; gradient ngày càng nhỏ nên w tăng chậm dần (chỉ cỡ logarit của số epoch). Hậu quả: xác suất cực đoan, kém tin cậy khi gặp điểm lạ. <b>Cách chữa: regularization<\/b> (chính quy hoá, phạt tham số lớn): thêm (λ/2)·w² vào loss, tức cộng λ·w vào gradient theo w. Với λ = 0.1, sau 3000 epoch w dừng ở <b>1.4994<\/b> (không có phạt: w = 6.3996 và vẫn đang tăng).<\/li>\n<li><b>Dữ liệu thật lẫn lộn thì sao?<\/b> Thêm một điểm (x = 2, y = 0) mâu thuẫn với (x = 2, y = 1): lúc này loss trung bình có đáy thật, ở w = 0.7638, b = −0.8151 (tìm bằng phương pháp Newton), vì không ranh giới nào phân loại hoàn hảo.<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧪 Thử trong mô phỏng<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Bấm Tiếp 4 lần<\/b> rồi đọc ô \"Thế số\": z = 0, ŷ = 0.5, loss = 0.6931. Đây là <b>phép thử sức khoẻ<\/b> cho mọi bài phân loại nhị phân: với w = b = 0 loss ban đầu phải là ln 2 ≈ 0.693. Nếu code của bạn ra số khác xa, có bug.<\/li>\n<li><b>Tăng \"Số epoch tối đa\" lên 300, chạy hết.<\/b> Nhìn w trong ô trên đồ thị mô hình: nó vẫn tăng. Loss gần 0 nhưng w không hề \"hội tụ\".<\/li>\n<li><b>Đặt w₀ = −3 (sai hẳn chiều), chạy 6 epoch.<\/b> Đoán: w đi tới đâu? Với BCE, w kéo từ −3 lên <b>−0.83<\/b>; còn nếu loss là MSE + sigmoid (tab 2 bật sigmoid), w gần như nằm yên ở <b>−2.89<\/b>. Đó là câu đố đầu bài, nhìn bằng mắt.<\/li>\n<li><b>Đặt η = 3 (tối đa).<\/b> Đồ thị sigmoid trở nên gần như một bậc thang: w tăng rất nhanh.<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>📊 Excel<\/summary>\n<p>Cho x ở B1:D1 = <code>-1  1  2<\/code>, y ở B2:D2 = <code>0  1  1<\/code>, η ở K1 = <code>0.1<\/code>. Mỗi hàng là một lần cập nhật:<\/p>\n<table class=\"ls-t\">\n<tr><th>Ô<\/th><th>Nội dung<\/th><\/tr>\n<tr><td>Hàng 4<\/td><td>tiêu đề: n, w, b, i, x, y, z, ŷ, L, δ<\/td><\/tr>\n<tr><td>A5, B5, C5<\/td><td><code>0<\/code>, <code>0<\/code>, <code>0<\/code><\/td><\/tr>\n<tr><td>D5<\/td><td><code>=MOD(A5,3)+1<\/code><\/td><\/tr>\n<tr><td>E5<\/td><td><code>=INDEX($B$1:$D$1,D5)<\/code><\/td><\/tr>\n<tr><td>F5<\/td><td><code>=INDEX($B$2:$D$2,D5)<\/code><\/td><\/tr>\n<tr><td>G5<\/td><td><code>=B5*E5+C5<\/code><\/td><\/tr>\n<tr><td>H5<\/td><td><code>=1/(1+EXP(-G5))<\/code><\/td><\/tr>\n<tr><td>I5<\/td><td><code>=-(F5*LN(H5)+(1-F5)*LN(1-H5))<\/code><\/td><\/tr>\n<tr><td>J5<\/td><td><code>=H5-F5<\/code><\/td><\/tr>\n<tr><td>A6<\/td><td><code>=A5+1<\/code><\/td><\/tr>\n<tr><td>B6<\/td><td><code>=B5-$K$1*J5*E5<\/code><\/td><\/tr>\n<tr><td>C6<\/td><td><code>=C5-$K$1*J5<\/code><\/td><\/tr>\n<tr><td>D6:J6<\/td><td>sao chép từ D5:J5, kéo xuống 180 hàng<\/td><\/tr>\n<\/table>\n<p><b>Kiểm tra:<\/b> I5 = 0.6931; B6 = 0.05, C6 = −0.05; H6 = 0.5 (bất ngờ chưa? xem mục tự kiểm tra); B7 = 0.1, C7 = 0.0; B8 = 0.1900. Hàng 185 (sau 180 lần cập nhật) cho w ≈ 2.5803.<\/p>\n<p><b>Thử phá:<\/b> thêm phạt L2: trong B6 đổi thành <code>=B5-$K$1*(J5*E5+0.1*B5)<\/code> rồi kéo dài ~9000 hàng (3000 epoch): w dừng ở khoảng 1.50.<\/p>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>💻 JupyterLab<\/summary>\n<pre class=\"ls-code\">import math\n\nx = [-1, 1, 2]\ny = [0, 1, 1]\nw, b, eta = 0.0, 0.0, 0.1\nsigmoid = lambda z: 1 / (1 + math.exp(-z))\nn = 0\n\nfor epoch in range(60):\n    for xi, yi in zip(x, y):\n        yhat = sigmoid(w*xi + b)\n        loss = -(yi*math.log(yhat) + (1-yi)*math.log(1-yhat))\n        delta = yhat - yi             # δ = ŷ − y\n        w -= eta * delta * xi\n        b -= eta * delta\n        n += 1\n        if n &lt;= 3:\n            print(f&quot;n={n}  loss={loss:.4f}  w={w:.4f}  b={b:.4f}&quot;)\n\nprint(f&quot;sau 60 epoch: w={w:.4f}  b={b:.4f}  biên x=-b/w={-b/w:.4f}&quot;)<\/pre>\n<pre class=\"ls-out\">n=1  loss=0.6931  w=0.0500  b=-0.0500\nn=2  loss=0.6931  w=0.1000  b=0.0000\nn=3  loss=0.5981  w=0.1900  b=0.0450\nsau 60 epoch: w=2.5803  b=0.1073  biên x=-b/w=-0.0416<\/pre>\n<p><b>Thử phá:<\/b> chạy 300 epoch (w ≈ 4.1169), rồi thêm <code>+ lam*w<\/code> vào gradient của w với <code>lam = 0.1<\/code> và chạy 3000 epoch:<\/p>\n<pre class=\"ls-code\">import math\n\nx = [-1, 1, 2]\ny = [0, 1, 1]\nsigmoid = lambda z: 1 / (1 + math.exp(-z))\n\nfor lam in (0.0, 0.1):                # 0.0 = không phạt, 0.1 = phạt L2\n    w, b, eta = 0.0, 0.0, 0.1\n    for epoch in range(3000):\n        for xi, yi in zip(x, y):\n            delta = sigmoid(w*xi + b) - yi\n            w -= eta * (delta*xi + lam*w)   # cộng thêm λ·w vào gradient\n            b -= eta * delta\n    print(f&quot;lam={lam}: w={w:.4f}  b={b:.4f}&quot;)<\/pre>\n<pre class=\"ls-out\">lam=0.0: w=6.3996  b=0.0058\nlam=0.1: w=1.4994  b=0.1442<\/pre>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧭 Tự kiểm tra<\/summary>\n<details class=\"ls-a\"><summary>1. Vì sao ŷ = 0.5 <i>hai lần liên tiếp<\/i> (mẫu 1 rồi mẫu 2)? Trùng hợp?<\/summary><p>Không. Cập nhật từ mẫu x = −1 thay đổi z tại điểm x′ một lượng −η·δ·(x·x′ + 1). Với x = −1 và x′ = 1: x·x′ + 1 = −1 + 1 = 0. Hai vectơ [x, 1] = [−1, 1] và [1, 1] <b>vuông góc<\/b> nên mẫu này không ảnh hưởng dự đoán của mẫu kia. Hiểu được điều này là hiểu hình học của cập nhật gradient.<\/p><\/details>\n<details class=\"ls-a\"><summary>2. Loss khởi đầu của bài phân loại 10 lớp (softmax) với w = 0 là bao nhiêu?<\/summary><p>Đoán đều 1/10 mỗi lớp nên loss = −ln(1/10) = ln 10 = 2.3026. Quy tắc chung: loss khởi đầu ≈ ln(số lớp).<\/p><\/details>\n<details class=\"ls-a\"><summary>3. Accuracy (độ chính xác) cao nhưng log loss cao: có thể không?<\/summary><p>Có. Mô hình đoán đúng nhãn nhưng với xác suất rụt rè (0.51) hoặc sai một vài mẫu với xác suất cực đoan (0.001 cho nhãn thật) đều làm log loss cao. Accuracy chỉ nhìn bên nào của 0.5; log loss nhìn cả độ tự tin.<\/p><\/details>\n<\/details>\n\n<div class=\"ls-note\">\n<b>🔁 Trùng NCKH:<\/b> BCE chính là log loss, hàm mục tiêu của XGBoost với <code>binary:logistic<\/code>. Gradient mà XGBoost tính cho mỗi mẫu là g = ŷ − y, đúng cái δ bạn vừa suy ra; hessian (đạo hàm bậc hai) là h = ŷ(1 − ŷ). Phạt L2 (<code>reg_lambda<\/code>) cũng là cùng ý với \"phạt w lớn\" ở mục 6, chỉ khác đối tượng bị phạt là trọng số lá của cây. Phần này bạn không cần học lại khi quay lại NCKH.\n<\/div>\n\n<details class=\"ls-d\">\n<summary>📝 Ghi vào Notion<\/summary>\n<div class=\"ls-m\">• Logistic: z = wx + b; ŷ = σ(z); BCE: L = −[y ln ŷ + (1−y) ln(1−ŷ)].\n• Gradient: δ = ŷ − y; ∂L/∂w = δ·x; ∂L/∂b = δ (σ′ bị triệt tiêu, nên BCE hợp sigmoid).\n• MSE + sigmoid: gradient nhỏ đi khi mô hình sai chắc chắn (≈ 75 lần ở z = −5).\n• Biên quyết định: x = −b/w. Loss khởi đầu với w = 0 phải là ln 2 ≈ 0.693.\n• Dữ liệu tách được ⇒ w → ∞; chữa bằng regularization (cộng λw vào gradient).<\/div>\n<\/details>\n", "notes": "<div class=\"ls-hook\">\n<h3>🔥 Câu đố: chồng hai lớp lên nhau, mạng có mạnh hơn một lớp không?<\/h3>\n<p>Hãy thử một phép tính nhỏ trên chính mạng 2-2-1 này, nhưng <b>bỏ hàm kích hoạt<\/b> (a = z). Lớp 1 cho a¹ = W¹x + b¹, lớp 2 cho ŷ = W²a¹ + b². Thế vào nhau:<\/p>\n<div class=\"ls-m\">ŷ = W²(W¹x + b¹) + b² = (W²W¹)·x + (W²b¹ + b²)\nW²W¹ = [0.17, 0.39]     W²b¹ + b² = 0.47\nx = (0.5, 0.8): 0.17·0.5 + 0.39·0.8 + 0.47 = 0.867      (tính từng lớp cũng ra 0.867)<\/div>\n<p><b>Hai lớp tuyến tính = một lớp tuyến tính.<\/b> Có chồng bao nhiêu lớp đi nữa cũng không hơn một phép nhân ma trận. Toàn bộ sức mạnh của mạng nơ-ron nằm ở hàm kích hoạt phi tuyến (ở đây là sigmoid) chen giữa các lớp.<\/p>\n<p>Câu đố thứ hai, nằm ngay trên thanh trượt của mô phỏng: tài liệu gốc chỉ cập nhật <b>lớp ra<\/b>. Nhìn gradient ở bước đầu: lớp ra ≈ <b>−0.1617<\/b>, lớp ẩn ≈ <b>−0.0163<\/b>, nhỏ hơn khoảng <b>10 lần<\/b>. Vì sao lớp ẩn nhận ít \"lệnh sửa\" đến vậy? Và nếu mạng có 10 lớp sigmoid thì sao?<\/p>\n<\/div>\n\n<div class=\"ls-q\" data-a=\"3\">\n<p class=\"ls-qq\">✋ <b>Đoán trước:<\/b> đạo hàm σ′(z) = σ(z)·(1 − σ(z)) lớn nhất bằng bao nhiêu?<\/p>\n<div class=\"ls-opts\">\n<button type=\"button\" data-i=\"1\">A. 1<\/button>\n<button type=\"button\" data-i=\"2\">B. 0.5<\/button>\n<button type=\"button\" data-i=\"3\">C. 0.25<\/button>\n<\/div>\n<div class=\"ls-ex\" hidden>\n<p><b>C.<\/b> Tích σ(1 − σ) lớn nhất khi σ = 0.5 (tức z = 0) và bằng 0.25. Khi lan truyền ngược, mỗi lớp sigmoid nhân gradient với một σ′ ≤ 0.25 (rồi còn nhân thêm trọng số). Chồng 10 lớp: 0.25¹⁰ ≈ <b>9.5×10⁻⁷<\/b>. Lớp đầu hầu như không nhận tín hiệu: đây là <b>vanishing gradient<\/b> (gradient biến mất), lý do ReLU (đạo hàm bằng 1 khi z &gt; 0) thành lựa chọn mặc định ở tab 6.<\/p>\n<\/div>\n<\/div>\n\n<details class=\"ls-d\" open>\n<summary>📐 Suy ra trên giấy (x = (0.5, 0.8), y = 1)<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Xuôi (forward pass):<\/b> đi từ đầu vào ra đầu ra.\n<div class=\"ls-m\">z¹₁ = 0.1·0.5 + 0.3·0.8 + 0.1 = 0.39      a¹₁ = σ(0.39) = 0.5963\nz¹₂ = 0.2·0.5 + 0.4·0.8 + 0.2 = 0.62      a¹₂ = σ(0.62) = 0.6502\nz²  = 0.5·0.5963 + 0.6·0.6502 + 0.3 = 0.9883      ŷ = σ(0.9883) = 0.7287\nL = −ln(0.7287) = 0.3164   (y = 1, BCE như tab 3)<\/div><\/li>\n<li><b>Ngược lớp ra:<\/b> như tab 3, δ² = ŷ − y = −0.2713. Gradient của trọng số = δ của nơ-ron <i>đích<\/i> × giá trị đi vào cạnh đó:\n<div class=\"ls-m\">∂L/∂W² = δ²·a¹ = [−0.2713·0.5963, −0.2713·0.6502] = [−0.1617, −0.1764]\n∂L/∂b² = δ² = −0.2713<\/div><\/li>\n<li><b>Ngược lớp ẩn:<\/b> δ² được chia về từng nơ-ron ẩn theo <i>trọng số nối<\/i> (nơ-ron nối mạnh chịu trách nhiệm nhiều), rồi nhân σ′ (nơ-ron đang bão hoà thì ít nhạy với đầu vào nên chịu ít trách nhiệm):\n<div class=\"ls-m\">δ¹ = (W²)ᵀ·δ² ⊙ σ′(z¹)      (⊙ là nhân từng phần tử)\nδ¹₁ = (0.5·−0.2713)·(0.5963·0.4037) = −0.03265\nδ¹₂ = (0.6·−0.2713)·(0.6502·0.3498) = −0.03702\n∂L/∂W¹ = δ¹·xᵀ = [[−0.0163, −0.0261], [−0.0185, −0.0296]]<\/div>\nHai thừa số đều làm nhỏ: 0.5 hoặc 0.6 từ trọng số, và σ′ ≈ 0.24 (gần mức tối đa 0.25). Đó là câu trả lời cho \"nhỏ hơn ~10 lần\".<\/li>\n<li><b>Cập nhật<\/b> (η = 0.1), chỉ lớp ra như tài liệu:\n<div class=\"ls-m\">W² = [0.5 − 0.1·(−0.1617), 0.6 − 0.1·(−0.1764)] = [0.5162, 0.6176]\nb² = 0.3 − 0.1·(−0.2713) = 0.3271<\/div><\/li>\n<li><b>Vì sao không khởi tạo mọi trọng số bằng nhau (hoặc bằng 0)?<\/b> Nếu hai hàng của W¹ giống hệt nhau và hai phần tử của W² bằng nhau thì a¹₁ = a¹₂, δ¹₁ = δ¹₂, và mọi cập nhật giữ chúng giống nhau mãi: hai nơ-ron ẩn thành bản sao, mạng coi như chỉ có 1 nơ-ron. Phải khởi tạo ngẫu nhiên khác nhau để phá đối xứng (symmetry breaking).<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧪 Thử trong mô phỏng<\/summary>\n<ol class=\"ls-ol\">\n<li><b>Bấm Tiếp 4 lần<\/b> và đối chiếu từng con số ở mục 1–3 với ô \"Thế số từng bước\". Bật \"Số trên lưới = 1 (đầy đủ)\" để thấy z, y, δ, ∂ trên lưới.<\/li>\n<li><b>Chạy 30 epoch hai lần:<\/b> \"Lớp được cập nhật\" = 0 rồi = 1. Loss cuối: 0.1342 (chỉ lớp ra) và 0.1272 (mọi lớp). Chênh ít vì chỉ có một mẫu và lớp ra đã đủ sức; trên bài toán thật, lớp ẩn không được học thì mạng chỉ là hồi quy logistic trên những đặc trưng ngẫu nhiên cố định.<\/li>\n<li><b>Đặt \"Lớp được cập nhật\" = 1, bấm Tiếp tới pha ④<\/b> và nhìn các nhãn ▲ ▼ trên cạnh: W² đổi khoảng 0.0162, còn W¹ chỉ đổi khoảng 0.0016. Đó là hiệu ứng \"nhỏ hơn ~10 lần\" ở mục 3, nhìn bằng mắt.<\/li>\n<li><b>Kéo từng nút bằng chuột<\/b> để xem lưới gọn lại; nhấp con lăn để phóng to.<\/li>\n<\/ol>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>📊 Excel<\/summary>\n<p>Đặt x ở B1:C1 = <code>0.5  0.8<\/code>, y ở B2 = <code>1<\/code>, η ở K1 = <code>0.1<\/code>. Mỗi hàng của W¹ là một nơ-ron ẩn (cột D là b¹):<\/p>\n<table class=\"ls-t\">\n<tr><th>Ô<\/th><th>Nội dung<\/th><\/tr>\n<tr><td>B4:D4<\/td><td><code>0.1  0.3  0.1<\/code> (W¹ hàng 1 và b¹₁)<\/td><\/tr>\n<tr><td>B5:D5<\/td><td><code>0.2  0.4  0.2<\/code> (W¹ hàng 2 và b¹₂)<\/td><\/tr>\n<tr><td>B7:D7<\/td><td><code>0.5  0.6  0.3<\/code> (W² và b²)<\/td><\/tr>\n<tr><td>E4 (kéo xuống E5)<\/td><td><code>=SUMPRODUCT(B4:C4,$B$1:$C$1)+D4<\/code> (z¹)<\/td><\/tr>\n<tr><td>F4 (kéo xuống F5)<\/td><td><code>=1/(1+EXP(-E4))<\/code> (a¹)<\/td><\/tr>\n<tr><td>E7<\/td><td><code>=B7*F4+C7*F5+D7<\/code> (z²)<\/td><\/tr>\n<tr><td>F7<\/td><td><code>=1/(1+EXP(-E7))<\/code> (ŷ)<\/td><\/tr>\n<tr><td>G7<\/td><td><code>=-(B2*LN(F7)+(1-B2)*LN(1-F7))<\/code> (L)<\/td><\/tr>\n<tr><td>H7<\/td><td><code>=F7-B2<\/code> (δ²)<\/td><\/tr>\n<tr><td>I7, J7<\/td><td><code>=$H7*F4<\/code>, <code>=$H7*F5<\/code> (∂W²)<\/td><\/tr>\n<tr><td>H4<\/td><td><code>=B7*$H$7*F4*(1-F4)<\/code> (δ¹₁)<\/td><\/tr>\n<tr><td>H5<\/td><td><code>=C7*$H$7*F5*(1-F5)<\/code> (δ¹₂)<\/td><\/tr>\n<tr><td>I4, J4<\/td><td><code>=$H4*B$1<\/code>, <code>=$H4*C$1<\/code> (∂W¹ hàng 1; hàng 5 làm tương tự với H5)<\/td><\/tr>\n<tr><td>B10, C10, D10<\/td><td><code>=B7-$K$1*I7<\/code>, <code>=C7-$K$1*J7<\/code>, <code>=D7-$K$1*H7<\/code> (W², b² mới)<\/td><\/tr>\n<\/table>\n<p><b>Kiểm tra:<\/b> F7 = 0.7287; G7 = 0.3164; H7 = −0.2713; I7 = −0.1617; H4 = −0.03265; I4 = −0.0163; B10 = 0.5162.<\/p>\n<p><b>Thử phá:<\/b> thay F4, F5 bằng <code>=E4<\/code>, <code>=E5<\/code> (bỏ sigmoid) và E7 vẫn như cũ: E7 sẽ ra đúng 0.867 như câu đố mở đầu.<\/p>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>💻 JupyterLab<\/summary>\n<pre class=\"ls-code\">import numpy as np\n\nsigmoid = lambda z: 1 / (1 + np.exp(-z))\n\nx  = np.array([0.5, 0.8]);  y = 1.0\nW1 = np.array([[0.1, 0.3], [0.2, 0.4]]);  b1 = np.array([0.1, 0.2])\nW2 = np.array([0.5, 0.6]);                b2 = 0.3\neta = 0.1\n\n# --- xuôi ---\nz1 = W1 @ x + b1;   a1 = sigmoid(z1)\nz2 = W2 @ a1 + b2;  yhat = sigmoid(z2)\nloss = -(y*np.log(yhat) + (1-y)*np.log(1-yhat))\n\n# --- ngược ---\nd2  = yhat - y                          # δ² = ŷ − y\ndW2 = d2 * a1;  db2 = d2\nd1  = (W2 * d2) * a1 * (1 - a1)         # δ¹ = (W²)ᵀδ² ⊙ σ′(z¹)\ndW1 = np.outer(d1, x);  db1 = d1\n\nnp.set_printoptions(precision=4, suppress=True)\nprint(&quot;z1 =&quot;, z1, &quot; a1 =&quot;, a1)\nprint(f&quot;z2 = {z2:.4f}  yhat = {yhat:.4f}  loss = {loss:.4f}&quot;)\nprint(f&quot;d2 = {d2:.4f}  dW2 = {dW2}  d1 = {d1}&quot;)\nprint(&quot;dW1 =&quot;, np.round(dW1, 4).tolist())\n\n# --- cập nhật (chỉ lớp ra, như tài liệu) ---\nW2 = W2 - eta * dW2;  b2 = b2 - eta * db2\nprint(&quot;W2 mới =&quot;, W2, &quot; b2 mới =&quot;, round(float(b2), 4))<\/pre>\n<pre class=\"ls-out\">z1 = [0.39 0.62]  a1 = [0.5963 0.6502]\nz2 = 0.9883  yhat = 0.7287  loss = 0.3164\nd2 = -0.2713  dW2 = [-0.1617 -0.1764]  d1 = [-0.0326 -0.037 ]\ndW1 = [[-0.0163, -0.0261], [-0.0185, -0.0296]]\nW2 mới = [0.5162 0.6176]  b2 mới = 0.3271<\/pre>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>🧭 Tự kiểm tra<\/summary>\n<details class=\"ls-a\"><summary>1. Vì sao gradient của W¹ có x, còn gradient của W² có a¹?<\/summary><p>Gradient của một trọng số = δ của nơ-ron mà cạnh đi <i>tới<\/i> × giá trị đi <i>vào<\/i> cạnh đó. Với W¹ thì giá trị đi vào là x, với W² là a¹ (đầu ra lớp ẩn). Cùng một quy tắc cho mọi lớp.<\/p><\/details>\n<details class=\"ls-a\"><summary>2. Nếu x₁ lớn gấp 10 lần thì gradient của W¹₁₁ và W¹₁₂ đổi thế nào?<\/summary><p>∂L/∂W¹₁₁ lớn gấp 10 lần (vì nhân với x₁), còn ∂L/∂W¹₁₂ không đổi. Đặc trưng có thang đo lớn sẽ kéo trọng số của nó nhanh hơn: lại là lý do chuẩn hoá đặc trưng (tab 1).<\/p><\/details>\n<details class=\"ls-a\"><summary>3. ReLU thay sigmoid thì bước nào ở mục 3 thay đổi?<\/summary><p>Chỉ thừa số σ′(z¹) bị thay bằng ReLU′(z¹) = 1 nếu z¹ &gt; 0, ngược lại 0. Tab 6 làm chính xác điều này.<\/p><\/details>\n<\/details>\n\n<details class=\"ls-d\">\n<summary>📝 Ghi vào Notion<\/summary>\n<div class=\"ls-m\">• Không có hàm kích hoạt phi tuyến thì mọi mạng nhiều lớp thu về một phép nhân ma trận.\n• Forward: zˡ = Wˡ·aˡ⁻¹ + bˡ; aˡ = f(zˡ). Lớp ra sigmoid + BCE: δᴸ = ŷ − y.\n• Lớp ẩn: δˡ = (Wˡ⁺¹)ᵀδˡ⁺¹ ⊙ f′(zˡ). Gradient trọng số = δ (nơ-ron đích) × đầu vào của cạnh.\n• σ′ ≤ 0.25 ⇒ nhiều lớp sigmoid làm gradient lớp đầu biến mất (vanishing gradient).\n• Phải khởi tạo ngẫu nhiên để phá đối xứng giữa các nơ-ron ẩn.<\/div>\n<\/details>\n", "ex": "<div class=\"ls-hook\">\n<h3>🔥 Câu đố: làm sao biết công thức backprop của mình đúng, mà không cần tin ai?<\/h3>\n<p>Backprop (lan truyền ngược) là phần dễ sai nhất khi tự cài tay: chỉ một dấu trừ lệch, mạng vẫn chạy, loss vẫn giảm chút ít, và bạn không bao giờ biết. Có một phép thử không cần tin sách, tin Excel hay tin tôi: <b>đo đạo hàm bằng định nghĩa<\/b>. Ở Ví dụ 1, công thức backprop cho ∂L/∂w_out₁ là <b>−0.147508<\/b>. Bạn tự nhích w_out₁ lên và xuống một chút ε = 10⁻⁵, đo loss thay đổi bao nhiêu:<\/p>\n<div class=\"ls-m\">(L(w + ε) − L(w − ε)) / (2ε) = <b>−0.147508<\/b><\/div>\n<p>Khớp tới 11 chữ số. Một đoạn code 5 dòng như vậy bắt được mọi lỗi backprop (gọi là <b>gradient check<\/b>, kiểm tra gradient). Chuyên gia cũng làm vậy khi viết lớp mới.<\/p>\n<p>Câu đố thứ hai, ở Ví dụ 3 (Softmax): ba giá trị δ là <b>−0.3410, 0.2424, 0.0986<\/b>. Cộng lại ra… đúng 0. Trùng hợp?<\/p>\n<\/div>\n\n<div class=\"ls-q\" data-a=\"2\">\n<p class=\"ls-qq\">✋ <b>Đoán trước:<\/b> vì sao Σδ = 0 ở Ví dụ 3?<\/p>\n<div class=\"ls-opts\">\n<button type=\"button\" data-i=\"1\">A. May mắn với bộ số này<\/button>\n<button type=\"button\" data-i=\"2\">B. Vì Σŷ = 1 và Σy = 1, nên Σ(ŷ − y) = 0 với <i>mọi<\/i> bộ số<\/button>\n<button type=\"button\" data-i=\"3\">C. Vì softmax bị lỗi làm tròn<\/button>\n<\/div>\n<div class=\"ls-ex\" hidden>\n<p><b>B.<\/b> Softmax luôn cho tổng xác s
