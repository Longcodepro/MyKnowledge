<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lab Sơ đồ OOAD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F2F5FA; --panel:#FFFFFF; --ink:#0F1B2D; --mute:#5B6B82; --line:#D5DCE8; --line2:#E7ECF4;
  --accent:#2750D8; --accent-soft:#E6ECFD;
  --static:#0B8A7A; --static-soft:#DDF3EF;
  --dyn:#B93F0C; --dyn-soft:#FFEADD; --signal:#FF6A1F;
  --draw:#1D2A3E;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Lexend','Be Vietnam Pro',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.25}
.top{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.top h1{font-size:clamp(24px,4.4vw,34px);font-weight:700;letter-spacing:-.01em}
.top h1 span{color:var(--accent)}
.top p{margin:0;color:var(--mute);max-width:62ch}

/* chọn ví dụ */
.exs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.ex{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.ex b{font-family:var(--f-head);font-size:15px;font-weight:600}
.ex span{font-size:12.5px;color:var(--mute);line-height:1.45}
.ex:hover{border-color:#aebbd6}
.ex[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ex[aria-pressed=true] b{color:var(--accent)}
.ex i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}

/* tab */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px 8px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab .n{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.tab .nm{font-weight:600;font-size:14px}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--static)}
.tab.d .dot{background:var(--signal)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-selected=true] .n{color:#aab6cc}
.tab:hover:not([aria-selected=true]){border-color:#aebbd6}

/* nội dung */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:14px}
.card h2{font-size:18px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.card h2 small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.head h2.big{font-size:clamp(22px,3.4vw,28px);font-weight:700;margin:0}
.chip{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid}
.chip.s{background:var(--static-soft);color:#066B5E;border-color:#A8DDD4}
.chip.d{background:var(--dyn-soft);color:var(--dyn);border-color:#F4BFA1}
.src{font-size:12.5px;color:var(--mute)}
.lead{font-size:16.5px;margin:10px 0 0;max-width:72ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.mini{background:var(--paper);border-radius:10px;padding:12px 14px}
.mini h3{font-size:12px;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.mini p{margin:0;font-size:14.5px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:var(--paper);font-weight:600;font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.k{font-weight:600;white-space:nowrap;color:var(--accent);width:1%}
td code,.mono{font-family:var(--f-mono);font-size:12.5px}

/* ký hiệu */
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.sym{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#FCFDFF}
.sym .g{background:var(--paper);border-radius:8px;display:grid;place-items:center;padding:6px 2px}
.sym b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.sym p{margin:2px 0 0;font-size:13px;color:var(--mute);line-height:1.5}
.gsvg{width:88px;height:48px;display:block}

/* bàn vẽ */
.lab-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.14)}
.seg.f button[aria-pressed=true]{color:var(--dyn)}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 13px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#1d3fb5;color:#fff}
.btn.fire{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.fire:hover:not(:disabled){background:#e85a10;color:#fff}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.stepbox{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 14px;min-height:62px}
.stepbox .no{font-family:var(--f-head);font-weight:700;font-size:22px;color:var(--accent);line-height:1.1;min-width:2ch}
.stepbox b{display:block;font-size:14.5px}
.stepbox p{margin:0;font-size:13.5px;color:#2B3A55;line-height:1.5}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:12px;font-weight:500}
.dots button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.dots button.done{border-color:var(--accent);color:var(--accent)}
.dots button[aria-current=true].done{color:#fff}
.fig{margin:0;border:1px solid var(--line);border-radius:12px;background:
  linear-gradient(var(--line2) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/24px 24px,#fff;overflow-x:auto}
.fig svg{display:block;margin:0 auto;min-width:760px;width:100%;height:auto}
.flowbox{background:var(--dyn-soft);border-radius:10px;padding:10px 14px}
.flowbox .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid #F0C3A6;background:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--dyn)}
.chips button[aria-pressed=true]{background:var(--dyn);border-color:var(--dyn);color:#fff}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:210px;overflow:auto;counter-reset:l}
.log li{font-size:13.5px;display:flex;gap:8px;padding:3px 8px;border-radius:6px;color:#8a5a40;counter-increment:l}
.log li::before{content:counter(l);font-family:var(--f-mono);font-size:11.5px;min-width:2ch;color:#c58a68;padding-top:2px}
.log li.now{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--signal)}
.log li.now::before{color:var(--signal)}
.log:empty::after{content:'—';color:#c58a68;padding:3px 8px}
.sel select{font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:5px 8px;background:#fff}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:2px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}

/* SVG */
.sh{fill:var(--panel);stroke:var(--draw);stroke-width:1.6}
.sh.soft{fill:var(--paper)}
.sh.bnd{fill:var(--panel)}
.sh.dashed{stroke-dasharray:6 4;fill:var(--paper)}
.ln{fill:none;stroke:var(--draw);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:6 4}
.ln.thin{stroke-width:1}
.dc{fill:none;stroke:var(--draw);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.dc.fill{fill:var(--draw)}
.dc.hollow{fill:var(--panel)}
.fillc{fill:var(--draw)}
.tx{font:500 14px var(--f-body);fill:var(--ink)}
.tx.sm{font-size:12.5px}
.tx.b{font-weight:700}
.tx.mute{fill:var(--mute)}
.tx.it{font-style:italic}
.tx.ul{text-decoration:underline}
.tx.hl{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.lane-bg{fill:var(--panel);stroke:var(--line)}
.lane-hd{fill:var(--accent-soft);stroke:var(--line)}
.lln{stroke:#8A98AF;stroke-dasharray:5 4;stroke-width:1.2}
.actb{fill:var(--panel);stroke:var(--draw);stroke-width:1.4}
.tr{fill:none;stroke:var(--signal);stroke-width:3.2;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.pulse{fill:var(--signal);stroke:#fff;stroke-width:2}
.hid{opacity:0;pointer-events:none}
.el{transition:opacity .25s}
.new .sh,.new .ln:not(.lln),.new .dc,.new .actb{stroke:var(--accent)}
.new .fillc,.new .dc.fill{fill:var(--accent)}
.new .tx{fill:var(--accent)}
.playing .nd,.playing .bar{opacity:.34}
.playing .ed{opacity:.26}
.playing .nd.seen,.playing .nd.cur,.playing .bar.seen,.playing .bar.cur{opacity:1}
.playing .ed.on{opacity:1}
.nd.seen .sh,.bar.seen .actb{stroke:#E39566}
.nd.cur .sh{stroke:var(--signal);stroke-width:2.8;filter:drop-shadow(0 0 7px rgba(255,106,31,.65))}
.nd.cur .fillc,.nd.seen .fillc{fill:var(--signal)}
.nd.seen .fillc{fill:#E39566}
.nd.cur .tx{fill:#7A2B05}
.bar.cur .actb{stroke:var(--signal);stroke-width:2.4}
.ed.on .ln,.ed.on .dc{stroke:#E39566}
.ed.on .dc.fill{fill:#E39566}
.ed.on .tr{opacity:.4}
.ed.fire .tr{opacity:1}
.ed.fire .ln,.ed.fire .dc{stroke:var(--signal)}
.ed.fire .dc.fill{fill:var(--signal)}

/* sequence: combined fragment */
.frm{fill:var(--accent-soft);fill-opacity:.28;stroke:none}
.frb{fill:none;stroke:var(--draw);stroke-width:1.5}
.frt{fill:var(--panel);stroke:var(--draw);stroke-width:1.2}
.frd{stroke:var(--draw);stroke-width:1.2;stroke-dasharray:7 4}
.opb{fill:transparent;stroke:none}
.opb.taken{fill:var(--dyn-soft);fill-opacity:.65}
.opb.skip{fill:var(--line2);fill-opacity:.9}
.opbd{opacity:0}
.opbd.taken{opacity:1;fill:var(--static)}
.opbd.skip{opacity:1;fill:var(--mute)}
.fr.hit .frb{stroke:var(--signal);stroke-width:2.2}
.fr.hit .frt{stroke:var(--signal)}
.fr.skip .frb{stroke:var(--mute);stroke-dasharray:5 4}
.fr.skip .frt{stroke:var(--mute)}
.new .frb,.new .frt,.new .frd{stroke:var(--accent)}
.tcov table{min-width:0}.tcov th,.tcov td{padding:7px 6px;font-size:12px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.tcov td.k{width:auto;min-width:92px}
@media (max-width:640px){
  .exs{grid-template-columns:1fr}
  .card{padding:16px 14px}
  .sym{grid-template-columns:88px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .el,.nd{transition:none}
}
/* ghép với khung VLab */
html body{background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
html body .vl-app{max-width:none;padding:0;margin-top:14px}
html body .vl-head{display:none}
html body .vl-main{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:860px){html body .vl-main{grid-template-columns:minmax(0,1fr)}}
html body .vl-stage-wrap{background:var(--panel);border-color:var(--line)}
html body .vl-card{background:var(--panel);border-color:var(--line)}
html body .vl-status{background:var(--panel);border-top-color:var(--line);color:var(--ink);min-height:64px;font-size:14px}
html body .vl-status b{color:var(--accent)}
.svghost{position:relative;overflow:hidden;touch-action:none;
  background:linear-gradient(var(--line2) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/24px 24px,var(--panel)}
.svghost svg{display:block;width:100%;height:100%}
.tb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.card h2:first-child{margin-top:0}
.card + .card{margin-top:14px}
#botSec h2{font-size:18px;margin-bottom:10px}
#labhost .vl-title{display:none}
html body .vl-code{max-height:300px}
html body .vl-code div.on{background:var(--dyn-soft);color:var(--dyn)}
html body .vl-card h3{font-family:var(--f-mono)}
:root[data-vl-theme="dark"]{
  --paper:#0E131B; --panel:#161D28; --ink:#E8ECF1; --mute:#9AA5B1; --line:#2B3442; --line2:#1D2530;
  --accent:#6C93FF; --accent-soft:#1E2B52; --static:#3FC1AE; --static-soft:#12332F; --dyn:#FF9A63; --dyn-soft:#3A2415; --draw:#C9D3E3;
  color-scheme:dark;
}
</style>
<script>
/* ============================================================================
   VLab — khung dùng chung cho mọi trang mô phỏng bài học IT/AI
   ----------------------------------------------------------------------------
   Dán TOÀN BỘ file này vào thẻ <script> của trang HTML xuất ra.
   Không phụ thuộc thư viện ngoài. Chạy được offline.

   Cung cấp sẵn:
     - Chủ đề sáng/tối tự theo hệ thống + nút đổi
     - 4 bảng màu (có 1 bảng thân thiện với người mù màu)
     - Zoom bằng con lăn, kéo để di chuyển, nút đặt lại khung nhìn
     - Thanh trượt tham số
     - Bộ chạy: Chạy / Tạm dừng / Bước tiếp / Làm lại + thanh tốc độ
     - Ô nhập công thức (parser an toàn, KHÔNG dùng eval)
     - Khung mã giả tiếng Việt có tô sáng dòng đang chạy
     - Ô "Đang xảy ra gì?" và ô "Vì sao?"

   API chính:  const app = VLab.create({...});   xem phần cuối file.
   ========================================================================== */
(function (global) {
  'use strict';

  const VLab = {};

  /* ==========================================================================
     1. BẢNG MÀU
     ========================================================================== */
  const PALETTES = {
    'Mặc định':      ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed', '#0891b2'],
    'Dịu mắt':       ['#4f6d7a', '#c07a5c', '#6a8d73', '#a4789a', '#8c7851', '#5a7d9a'],
    'Tương phản cao':['#0040ff', '#ff0040', '#00a000', '#ff8000', '#8000ff', '#00a0a0'],
    'Thân thiện mù màu': ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#56B4E9', '#D55E00']
  };
  let paletteName = 'Mặc định';

  /* ==========================================================================
     2. CSS — nhúng một lần
     ========================================================================== */
  const CSS = `
  :root{
    --vl-bg:#ffffff; --vl-panel:#f6f7f9; --vl-fg:#14181d; --vl-muted:#5d6670;
    --vl-line:#d9dde3; --vl-accent:#2563eb; --vl-grid:#e8ebef; --vl-axis:#9aa3ad;
    --vl-hl:#fff3bf; --vl-hl-fg:#5c4600;
  }
  :root[data-vl-theme="dark"]{
    --vl-bg:#13161a; --vl-panel:#1b1f25; --vl-fg:#e8ecf1; --vl-muted:#9aa5b1;
    --vl-line:#2b323b; --vl-accent:#5b9dff; --vl-grid:#22272e; --vl-axis:#5d6670;
    --vl-hl:#3a3414; --vl-hl-fg:#ffe79a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-vl-theme="light"]){
      --vl-bg:#13161a; --vl-panel:#1b1f25; --vl-fg:#e8ecf1; --vl-muted:#9aa5b1;
      --vl-line:#2b323b; --vl-accent:#5b9dff; --vl-grid:#22272e; --vl-axis:#5d6670;
      --vl-hl:#3a3414; --vl-hl-fg:#ffe79a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--vl-bg);color:var(--vl-fg);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .vl-app{max-width:1180px;margin:0 auto;padding:16px;}
  .vl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .vl-title{font-size:18px;font-weight:650;margin:0;flex:1 1 220px;}
  .vl-head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .vl-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
  @media (max-width:860px){ .vl-main{grid-template-columns:1fr;} }
  .vl-stage-wrap{position:relative;border:1px solid var(--vl-line);border-radius:10px;
    overflow:hidden;background:var(--vl-panel);}
  .vl-stage{display:block;width:100%;height:auto;touch-action:none;cursor:grab;}
  .vl-stage.dragging{cursor:grabbing;}
  .vl-status{padding:10px 12px;border-top:1px solid var(--vl-line);background:var(--vl-bg);
    font-size:14px;min-height:42px;color:var(--vl-fg);}
  .vl-status b{color:var(--vl-accent);}
  .vl-side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .vl-card{border:1px solid var(--vl-line);border-radius:10px;background:var(--vl-panel);padding:12px;}

  .vl-row{margin-bottom:12px;}
  .vl-row:last-child{margin-bottom:0;}

  .vl-lab span:last-child{font-variant-numeric:tabular-nums;color:var(--vl-accent);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--vl-accent);margin:0;}
  .vl-btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;
    border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);}
  .vl-btn:hover{border-color:var(--vl-accent);}
  .vl-btn.primary{background:var(--vl-accent);border-color:var(--vl-accent);color:#fff;}
  .vl-btns{display:flex;gap:6px;flex-wrap:wrap;}
  select,input[type=text]{font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;
    border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);width:100%;}
  .vl-head-tools select{width:auto;}
  .vl-err{color:#dc2626;font-size:12px;margin-top:4px;min-height:16px;}
  :root[data-vl-theme="dark"] .vl-err{color:#ff8080;}
  .vl-code{margin:0;font:12.5px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;
    counter-reset:vlline;max-height:260px;overflow:auto;}
  .vl-code div{padding:1px 6px;border-radius:4px;white-space:pre-wrap;color:var(--vl-muted);}
  .vl-code div.on{background:var(--vl-hl);color:var(--vl-hl-fg);font-weight:600;}
  .vl-why{font-size:13.5px;color:var(--vl-fg);}
  .vl-why p{margin:0 0 8px;} .vl-why p:last-child{margin:0;}
  .vl-hint{font-size:12px;color:var(--vl-muted);margin-top:6px;}
  `;

  function injectCSS() {
    if (document.getElementById('vl-css')) return;
    const s = document.createElement('style');
    s.id = 'vl-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ==========================================================================
     3. PARSER CÔNG THỨC — an toàn, không dùng eval()
     Hỗ trợ: + - * / ^ ( ) , số, biến, hàm dựng sẵn, hằng pi/e
     Dùng:  const f = VLab.compile('x^2 + 3*x', ['x']);  f({x:2}) -> 10
     ========================================================================== */
  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    exp: Math.exp, sqrt: Math.sqrt, abs: Math.abs,
    log: Math.log, ln: Math.log, log10: Math.log10, log2: Math.log2,
    floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign,
    min: Math.min, max: Math.max, pow: Math.pow, atan2: Math.atan2,
    relu: function (v) { return v > 0 ? v : 0; },
    sigmoid: function (v) { return 1 / (1 + Math.exp(-v)); }
  };
  const CONSTS = { pi: Math.PI, e: Math.E };

  function tokenize(src) {
    const out = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < src.length && /[0-9.]/.test(src[j])) j++;
        const num = parseFloat(src.slice(i, j));
        if (isNaN(num)) throw new Error('Số không hợp lệ: ' + src.slice(i, j));
        out.push({ t: 'num', v: num });
        i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i;
        while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
        out.push({ t: 'name', v: src.slice(i, j) });
        i = j; continue;
      }
      if ('+-*/^(),'.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      throw new Error('Ký tự lạ: "' + c + '"');
    }
    return out;
  }

  // Chuyển sang hậu tố bằng thuật toán sân ga (shunting-yard)
  function toRPN(tokens) {
    // Dấu trừ đứng trước (u-) nằm giữa */ và ^, nên -x^2 = -(x^2)
    const prec = { '+': 1, '-': 1, '*': 2, '/': 2, 'u-': 2.5, '^': 3 };
    const right = { '^': true, 'u-': true };
    const out = [], ops = [];
    let prev = null;
    for (let k = 0; k < tokens.length; k++) {
      const tk = tokens[k];
      if (tk.t === 'num') { out.push(tk); }
      else if (tk.t === 'name') {
        if (tokens[k + 1] && tokens[k + 1].t === '(') ops.push({ t: 'fn', v: tk.v, argc: 1 });
        else out.push(tk);
      }
      else if (tk.t === ',') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Dấu phẩy đặt sai chỗ');
        for (let m = ops.length - 2; m >= 0; m--) {
          if (ops[m].t === 'fn') { ops[m].argc++; break; }
          if (ops[m].t === '(') break;
        }
      }
      else if (tk.t === '(') { ops.push(tk); }
      else if (tk.t === ')') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Thiếu dấu mở ngoặc');
        ops.pop();
        if (ops.length && ops[ops.length - 1].t === 'fn') out.push(ops.pop());
      }
      else {
        let op = tk.t;
        const unary = (op === '-' || op === '+') &&
          (prev === null || prev.t === '(' || prev.t === ',' ||
            '+-*/^'.indexOf(prev.t) >= 0);
        if (unary) {
          // dấu đứng trước toán hạng: không đẩy toán tử nào ra, chỉ xếp vào chồng
          if (op === '+') { prev = tk; continue; }
          ops.push({ t: 'u-' }); prev = tk; continue;
        }
        while (ops.length) {
          const top = ops[ops.length - 1];
          const topOp = top.t === 'fn' ? null : top.t;
          if (topOp && topOp !== '(' &&
            (prec[topOp] > prec[op] || (prec[topOp] === prec[op] && !right[op]))) {
            out.push(ops.pop());
          } else break;
        }
        ops.push({ t: op });
      }
      prev = tk;
    }
    while (ops.length) {
      const top = ops.pop();
      if (top.t === '(') throw new Error('Thiếu dấu đóng ngoặc');
      out.push(top);
    }
    return out;
  }

  /**
   * Biên dịch một biểu thức thành hàm.
   * @param {string} src  ví dụ 'x^2 + 3*x'
   * @param {string[]} vars  tên các biến được phép, ví dụ ['x'] hoặc ['x','y']
   * @returns {function(Object): number}
   */
  VLab.compile = function (src, vars) {
    vars = vars || ['x'];
    const rpn = toRPN(tokenize(String(src)));
    // Kiểm tra ngay lúc biên dịch: tên lạ, và biểu thức thiếu/thừa toán hạng
    let depth = 0;
    for (const tk of rpn) {
      if (tk.t === 'name' && vars.indexOf(tk.v) < 0 && !(tk.v in CONSTS))
        throw new Error('Không hiểu "' + tk.v + '"');
      if (tk.t === 'fn' && !(tk.v in FUNCS))
        throw new Error('Không có hàm "' + tk.v + '"');
      if (tk.t === 'num' || tk.t === 'name') depth += 1;
      else if (tk.t === 'u-') depth += 0;
      else if (tk.t === 'fn') depth += 1 - tk.argc;
      else depth -= 1;
      if (depth < 1) throw new Error('Biểu thức thiếu toán hạng');
    }
    if (depth !== 1) throw new Error('Biểu thức chưa hoàn chỉnh');
    return function (scope) {
      const st = [];
      for (const tk of rpn) {
        if (tk.t === 'num') st.push(tk.v);
        else if (tk.t === 'name') st.push(tk.v in CONSTS ? CONSTS[tk.v] : (scope[tk.v] || 0));
        else if (tk.t === 'u-') st.push(-st.pop());
        else if (tk.t === 'fn') {
          const args = st.splice(st.length - tk.argc, tk.argc);
          st.push(FUNCS[tk.v].apply(null, args));
        } else {
          const b = st.pop(), a = st.pop();
          st.push(tk.t === '+' ? a + b : tk.t === '-' ? a - b :
            tk.t === '*' ? a * b : tk.t === '/' ? a / b : Math.pow(a, b));
        }
      }
      return st.pop();
    };
  };

  /** Đạo hàm số (dùng khi không có công thức đạo hàm) */
  VLab.deriv = function (f, scope, varName, h) {
    h = h || 1e-5;
    const s1 = Object.assign({}, scope), s2 = Object.assign({}, scope);
    s1[varName] = scope[varName] + h;
    s2[varName] = scope[varName] - h;
    return (f(s1) - f(s2)) / (2 * h);
  };

  /* ==========================================================================
     4. KHUNG NHÌN 2D — zoom bằng con lăn, kéo để di chuyển
     ========================================================================== */
  function makeView2D(canvas, opts, onChange) {
    opts = opts || {};
    const home = {
      cx: opts.cx || 0,                  // toạ độ thế giới ở giữa khung
      cy: opts.cy || 0,
      scale: opts.scale || 40            // số pixel cho 1 đơn vị thế giới
    };
    const v = { cx: home.cx, cy: home.cy, scale: home.scale };

    function toScreen(x, y) {
      return [canvas.clientWidth / 2 + (x - v.cx) * v.scale,
              canvas.clientHeight / 2 - (y - v.cy) * v.scale];
    }
    function toWorld(px, py) {
      return [(px - canvas.clientWidth / 2) / v.scale + v.cx,
              -(py - canvas.clientHeight / 2) / v.scale + v.cy];
    }

    // Bài có thể gán v.onPointerDown / onPointerMove / onPointerUp để tự xử lý
    // (ví dụ kéo một nút của đồ thị). onPointerDown trả về true thì khung nhìn
    // không kéo theo. Toạ độ truyền vào là pixel trong canvas.
    let drag = null, grabbed = false;
    function local(e) {
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }
    canvas.addEventListener('pointerdown', function (e) {
      canvas.setPointerCapture(e.pointerId);
      if (v.onPointerDown) {
        const p = local(e);
        if (v.onPointerDown(p[0], p[1], e)) { grabbed = true; return; }
      }
      drag = { x: e.clientX, y: e.clientY, cx: v.cx, cy: v.cy };
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (grabbed) {
        if (v.onPointerMove) { const p = local(e); v.onPointerMove(p[0], p[1], e); }
        return;
      }
      if (!drag) return;
      v.cx = drag.cx - (e.clientX - drag.x) / v.scale;
      v.cy = drag.cy + (e.clientY - drag.y) / v.scale;
      onChange();
    });
    function endDrag() {
      if (grabbed && v.onPointerUp) v.onPointerUp();
      grabbed = false;
      drag = null;
      canvas.classList.remove('dragging');
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const [wx, wy] = toWorld(e.clientX - r.left, e.clientY - r.top);
      const k = Math.exp(-e.deltaY * 0.0015);
      v.scale = Math.max(2, Math.min(4000, v.scale * k));
      // giữ nguyên điểm dưới con trỏ
      const [nx, ny] = toWorld(e.clientX - r.left, e.clientY - r.top);
      v.cx += wx - nx; v.cy += wy - ny;
      onChange();
    }, { passive: false });

    // pinch 2 ngón trên cảm ứng
    let pinch = null;
    canvas.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2) { pinch = null; return; }
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) { v.scale = Math.max(2, Math.min(4000, v.scale * d / pinch)); onChange(); }
      pinch = d;
    }, { passive: false });
    canvas.addEventListener('touchend', function () { pinch = null; });

    v.toScreen = toScreen;
    v.toWorld = toWorld;
    v.reset = function () { v.cx = home.cx; v.cy = home.cy; v.scale = home.scale; onChange(); };
    v.setHome = function (o) { Object.assign(home, o); v.reset(); };

    /** Vẽ lưới + trục. Gọi đầu tiên trong hàm vẽ của bài. */
    v.drawGrid = function (ctx) {
      const W = canvas.clientWidth, H = canvas.clientHeight;
      const cs = getComputedStyle(document.documentElement);
      const grid = cs.getPropertyValue('--vl-grid').trim();
      const axis = cs.getPropertyValue('--vl-axis').trim();
      // bước lưới "đẹp": 1, 2, 5, 10...
      let step = Math.pow(10, Math.floor(Math.log10(80 / v.scale)));
      const n = 80 / (step * v.scale);
      if (n > 5) step *= 5; else if (n > 2) step *= 2;
      const [x0, y1] = toWorld(0, 0), [x1, y0] = toWorld(W, H);
      ctx.lineWidth = 1;
      ctx.strokeStyle = grid;
      ctx.beginPath();
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
        const px = Math.round(toScreen(x, 0)[0]) + 0.5;
        ctx.moveTo(px, 0); ctx.lineTo(px, H);
      }
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
        const py = Math.round(toScreen(0, y)[1]) + 0.5;
        ctx.moveTo(0, py); ctx.lineTo(W, py);
      }
      ctx.stroke();
      // trục
      ctx.strokeStyle = axis; ctx.lineWidth = 1.5;
      ctx.beginPath();
      const oy = Math.round(toScreen(0, 0)[1]) + 0.5;
      const ox = Math.round(toScreen(0, 0)[0]) + 0.5;
      ctx.moveTo(0, oy); ctx.lineTo(W, oy);
      ctx.moveTo(ox, 0); ctx.lineTo(ox, H);
      ctx.stroke();
      // nhãn số
      ctx.fillStyle = axis;
      ctx.font = '11px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const lbl = (t) => Math.abs(t) < 1e-9 ? '0' :
        (Math.abs(t) < 1e-4 || Math.abs(t) >= 1e5 ? t.toExponential(1) :
          parseFloat(t.toPrecision(4)).toString());
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
        if (Math.abs(x) < step / 2) continue;
        ctx.fillText(lbl(x), toScreen(x, 0)[0], Math.min(H - 14, Math.max(2, oy + 3)));
      }
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
        if (Math.abs(y) < step / 2) continue;
        ctx.fillText(lbl(y), Math.max(24, Math.min(W - 2, ox - 5)), toScreen(0, y)[1]);
      }
    };
    return v;
  }

  /* ==========================================================================
     5. TẠO ỨNG DỤNG
     ========================================================================== */
  /**
   * @param {Object} cfg
   *   title    {string}  tiêu đề trang
   *   why      {string}  nội dung ô "Vì sao?" (HTML đơn giản)
   *   stage    {'2d'|'none'}  '2d' tạo sẵn canvas + zoom/pan; 'none' để bài tự dựng (3D)
   *   view     {Object}  {cx, cy, scale} khung nhìn ban đầu (chỉ với stage '2d')
   *   height   {number}  chiều cao sân khấu, mặc định 460
   *   func     {Object}  {label, value, vars} hiện ô nhập công thức
   *   params   {Array}   [{id, label, min, max, step, value, fixed}]
   *   player   {boolean} hiện bộ Chạy/Bước/Làm lại
   *   code     {string[]} các dòng mã giả tiếng Việt
   *   onDraw   {function(ctx, app)}  vẽ lại (chỉ với stage '2d')
   *   onStep   {function(app): boolean}  chạy một bước; trả về false khi kết thúc
   *   onReset  {function(app)}  đặt lại trạng thái bài
   *   onParam  {function(id, value, app)}  khi một tham số đổi
   */
  VLab.create = function (cfg) {
    injectCSS();
    cfg = cfg || {};
    const app = {};
    const root = document.createElement('div');
    root.className = 'vl-app';
    document.body.appendChild(root);

    /* --- đầu trang --- */
    const head = document.createElement('div');
    head.className = 'vl-head';
    head.innerHTML =
      '<h1 class="vl-title"></h1><div class="vl-head-tools">' +
      '<select class="vl-pal" title="Bảng màu"></select>' +
      '<button class="vl-btn vl-theme">Sáng/Tối</button>' +
      '<button class="vl-btn vl-home">Đặt lại khung nhìn</button></div>';
    head.querySelector('.vl-title').textContent = cfg.title || 'Mô phỏng';
    root.appendChild(head);

    const palSel = head.querySelector('.vl-pal');
    Object.keys(PALETTES).forEach(function (n) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n; palSel.appendChild(o);
    });
    palSel.value = paletteName;
    palSel.addEventListener('change', function () {
      paletteName = palSel.value; app.redraw();
    });
    head.querySelector('.vl-theme').addEventListener('click', function () {
      const cur = document.documentElement.getAttribute('data-vl-theme');
      const sysDark = global.matchMedia &&
        global.matchMedia('(prefers-color-scheme: dark)').matches;
      const now = cur || (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-vl-theme', now === 'dark' ? 'light' : 'dark');
      app.redraw();
    });

    /* --- bố cục chính --- */
    const main = document.createElement('div');
    main.className = 'vl-main';
    root.appendChild(main);

    const stageWrap = document.createElement('div');
    stageWrap.className = 'vl-stage-wrap';
    main.appendChild(stageWrap);

    const side = document.createElement('div');
    side.className = 'vl-side';
    main.appendChild(side);

    /* --- sân khấu --- */
    const stageMode = cfg.stage || '2d';
    const stageH = cfg.height || 460;
    let canvas = null, ctx = null;
    app.stageEl = stageWrap;

    if (stageMode === '2d') {
      canvas = document.createElement('canvas');
      canvas.className = 'vl-stage';
      canvas.style.height = stageH + 'px';
      stageWrap.appendChild(canvas);
      ctx = canvas.getContext('2d');
      app.canvas = canvas; app.ctx = ctx;
    } else {
      const host = document.createElement('div');
      host.className = 'vl-stage';
      host.style.height = stageH + 'px';
      stageWrap.appendChild(host);
      app.host = host;
    }

    const statusEl = document.createElement('div');
    statusEl.className = 'vl-status';
    statusEl.innerHTML = '<span class="vl-muted">Sẵn sàng.</span>';
    stageWrap.appendChild(statusEl);

    /* --- khung nhìn --- */
    if (stageMode === '2d') {
      app.view = makeView2D(canvas, cfg.view, function () { app.redraw(); });
    }
    head.querySelector('.vl-home').addEventListener('click', function () {
      if (app.view) app.view.reset();
      else if (app.onHome) app.onHome();
    });

    /* --- ô nhập công thức --- */
    app.f = null;
    if (cfg.func) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Công thức</h3>' +
        '<div class="vl-lab"><span></span></div>' +
        '<input type="text" class="vl-fn">' +
        '<div class="vl-err"></div>' +
        '<div class="vl-hint">Dùng được: + - * / ^ ( ) và sin, cos, exp, ln, sqrt, abs, tanh, relu, sigmoid, pi, e</div>';
      card.querySelector('.vl-lab span').textContent =
        cfg.func.label || ('Hàm theo ' + (cfg.func.vars || ['x']).join(', '));
      const inp = card.querySelector('.vl-fn');
      const err = card.querySelector('.vl-err');
      inp.value = cfg.func.value || 'x^2';
      function recompile() {
        try {
          app.f = VLab.compile(inp.value, cfg.func.vars || ['x']);
          app.fSource = inp.value;
          err.textContent = '';
          if (cfg.onReset) cfg.onReset(app);
          app.redraw();
        } catch (e) {
          err.textContent = 'Lỗi: ' + e.message;
        }
      }
      inp.addEventListener('change', recompile);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') recompile(); });
      side.appendChild(card);
      try {
        app.f = VLab.compile(inp.value, cfg.func.vars || ['x']);
        app.fSource = inp.value;
      } catch (e) { err.textContent = 'Lỗi: ' + e.message; }
    }

    /* --- thanh trượt tham số --- */
    const paramVals = {};
    if (cfg.params && cfg.params.length) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Tham số</h3>';
      cfg.params.forEach(function (p) {
        paramVals[p.id] = p.value;
        const row = document.createElement('div');
        row.className = 'vl-row';
        row.innerHTML = '<div class="vl-lab"><span></span><span class="vl-val"></span></div>' +
          '<input type="range">';
        row.querySelector('.vl-lab span').textContent = p.label;
        const val = row.querySelector('.vl-val');
        const r = row.querySelector('input');
        r.min = p.min; r.max = p.max; r.step = p.step; r.value = p.value;
        const fmt = function (v) {
          return p.fixed != null ? Number(v).toFixed(p.fixed) : String(v);
        };
        val.textContent = fmt(p.value);
        r.addEventListener('input', function () {
          paramVals[p.id] = parseFloat(r.value);
          val.textContent = fmt(r.value);
          if (cfg.onParam) cfg.onParam(p.id, paramVals[p.id], app);
          app.redraw();
        });
        card.appendChild(row);
      });
      side.appendChild(card);
    }
    app.param = function (id) { return paramVals[id]; };
    app.params = paramVals;

    /* --- bộ chạy --- */
    app.running = false;
    app.stepCount = 0;
    if (cfg.player) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Chạy mô phỏng</h3>' +
        '<div class="vl-btns"><button class="vl-btn primary vl-play">▶ Chạy</button>' +
        '<button class="vl-btn vl-step">Bước tiếp</button>' +
        '<button class="vl-btn vl-again">Làm lại</button></div>' +
        '<div class="vl-row" style="margin-top:12px">' +
        '<div class="vl-lab"><span>Tốc độ (bước/giây)</span><span class="vl-spd">8</span></div>' +
        '<input type="range" class="vl-speed" min="1" max="60" step="1" value="8"></div>';
      side.appendChild(card);
      const btnPlay = card.querySelector('.vl-play');

      (divAt[i] || []).slice().sort((p, q) => p.f.depth - q.f.depth).forEach(x => items.push({ t: 'div', x }));
      (startAt[i] || []).forEach(f => items.push({ t: 'st', f }));
      items.forEach((it, k) => {
        const prev = items[k - 1];
        const base = it.t === 'div' ? 44 : 52;                       // từ cuối mục tới vạch / đỉnh khung
        let h = it.t === 'div' ? 28 : (!prev ? 26 : prev.t === 'st' ? 24 : 38);
        if (k === 0) { const need = lastBottom + 8 - (y + h - base); if (need > 0) h += need; }   // không chồng đáy khung trước
        y += h;
        if (it.t === 'div') it.x.f.ops[it.x.j].divY = y - base; else it.f.y1 = y - base;
      });
      Y[m.id] = y;
      const step = m.kind === 'self' ? 58 : 42;
      y += step;
      const en = (endAt[i] || []).slice().sort((p, q) => q.depth - p.depth);   // trong ra ngoài
      if (en.length) {
        const baseB = m.kind === 'create' ? 38 : m.kind === 'self' ? 34 : m.kind === 'ret' ? 8 : m.guard ? 24 : 28;
        let b = Y[m.id] + baseB;
        en.forEach((f, k) => { if (k) b += 10; f.y2 = b; });
        lastBottom = b;
        y += Math.max(6, (b - Y[m.id]) + 24 - step);
      } else lastBottom = m.kind === 'create' ? Y[m.id] + 40 : -1e9;
    });
    const yEnd = y, H = yEnd + 24;

    /* --- 3. Toạ độ ngang của khung: bao các đối tượng tham gia + lề theo độ sâu lồng --- */
    const xr = (i0, i1) => {
      let lo = 1e9, hi = -1e9;
      for (let i = i0; i <= i1; i++) {
        const m = msgs[i], F = P[m.f], T = P[m.t];
        [F, T].forEach(p => { const w = p.kind === 'actor' ? 18 : 8; lo = Math.min(lo, p.x - w); hi = Math.max(hi, p.x + w); });
        if (m.kind === 'create') { lo = Math.min(lo, T.x - T.hw / 2 - 4); hi = Math.max(hi, T.x + T.hw / 2 + 4); }
        if (m.kind === 'self') hi = Math.max(hi, F.x + 52 + String(m.label).length * 6.6);
      }
      return [lo, hi];
    };
    frs.forEach(f => {
      const r = xr(f.a, f.b), pad = 14 + 8 * (f.h - 1);
      f.x1 = r[0] - pad; f.x2 = r[1] + pad;
      f.tw = Math.round(14 + 7.2 * f.op.length);
      let need = f.tw + 14 + f.ops[0].g.length * 6.4 + 100;
      f.ops.forEach((o, j) => { if (j) need = Math.max(need, 16 + o.g.length * 6.4 + 100); });
      need = Math.max(need, 130);
      if (f.x2 - f.x1 < need) f.x2 = f.x1 + need;
    });
    for (let i = fo.length - 1; i >= 0; i--) { const f = fo[i], p = f.parent; if (p) { p.x1 = Math.min(p.x1, f.x1 - 8); p.x2 = Math.max(p.x2, f.x2 + 8); } }
    const W = Math.max(W0, Math.ceil(Math.max(0, ...frs.map(f => f.x2)) + 6));

    const ls = p => p.created ? Y[p.created] + 18 : (p.kind === 'actor' ? top + 84 : (p.stereo ? top + 56 : top + 52));
    let o = '';

    /* --- 4. Vẽ khung: lớp nền + viền nằm dưới cùng, nhãn + guard + huy hiệu nằm trên cùng --- */
    let front = '';
    fo.forEach(f => {
      const w = f.x2 - f.x1, hh = f.y2 - f.y1, X = f1(f.x1), Yt = f1(f.y1);
      let b = `<rect class="frm" x="${X}" y="${Yt}" width="${f1(w)}" height="${f1(hh)}" rx="3"/>`;
      f.ops.forEach((q, j) => {
        const ya = j ? q.divY : f.y1, yb = j < f.ops.length - 1 ? f.ops[j + 1].divY : f.y2;
        b += `<rect class="opb" data-op="${j}" x="${X}" y="${f1(ya)}" width="${f1(w)}" height="${f1(yb - ya)}"/>`;
      });
      b += `<rect class="frb" x="${X}" y="${Yt}" width="${f1(w)}" height="${f1(hh)}" rx="3"/>`;
      f.ops.forEach((q, j) => { if (j) b += `<line class="frd" x1="${X}" y1="${f1(q.divY)}" x2="${f1(f.x2)}" y2="${f1(q.divY)}"/>`; });
      const lab = esc('khung ' + f.op + (f.title ? ' · ' + f.title : ''));
      o += `<g class="fr el" data-s="${f.s}" data-frag="${f.id}" data-l="${lab}">${b}</g>`;
      let t = `<path class="frt" d="M${X},${Yt} H${f1(f.x1 + f.tw)} V${f1(f.y1 + 11)} L${f1(f.x1 + f.tw - 7)},${f1(f.y1 + 18)} H${X} Z"/>` +
        txt(f.x1 + (f.tw - 3) / 2, f.y1 + 9, f.op, { cls: 'sm b', mid: true });
      f.ops.forEach((q, j) => {
        const ly = j ? q.divY + 13 : f.y1 + 9;
        if (q.g) t += txt(j ? f.x1 + 8 : f.x1 + f.tw + 8, ly, q.g, { cls: 'sm b hl', a: 'start', mid: true });
        t += `<text class="tx sm b hl opbd" data-op="${j}" x="${f1(f.x2 - 8)}" y="${f1(ly)}" text-anchor="end" dominant-baseline="central"></text>`;
      });
      front += `<g class="fr frf el" data-s="${f.s}" data-frag="${f.id}" data-l="${lab}">${t}</g>`;
    });

    /* --- 5. Đối tượng, lifeline, vùng hoạt động, thông điệp (giữ nguyên cách vẽ cũ) --- */
    d.parts.forEach(p => {
      let inner = '';
      if (p.kind === 'actor') inner = actorSVG(p.x, top + 34, p.label);
      else {
        const yy = p.created ? Y[p.created] - 18 : (p.stereo && !p.created ? top + 10 : top + 16), hh = p.created ? 36 : (p.stereo ? 46 : 36);
        inner = `<rect class="sh" x="${f1(p.x - p.hw / 2)}" y="${yy}" width="${p.hw}" height="${hh}" rx="3"/>`;
        if (p.stereo && !p.created) inner += txt(p.x, yy + 12, '«' + p.stereo + '»', { cls: 'sm mute', mid: true }) + txt(p.x, yy + 31, p.label, { cls: 'ul', mid: true });
        else inner += txt(p.x, yy + hh / 2, p.label, { cls: 'ul', mid: true });
      }
      const ps = p.s || 2;
      o += grp('nd', ps, p.id, L1(p.label), inner);
      const y2 = p.destroy ? Y[p.destroy] : yEnd - 6;
      let ll = `<line class="lln" x1="${f1(p.x)}" y1="${ls(p)}" x2="${f1(p.x)}" y2="${y2}"/>`;
      if (p.destroy) ll += `<path class="ln x" d="M${p.x - 8},${y2 - 8} L${p.x + 8},${y2 + 8} M${p.x + 8},${y2 - 8} L${p.x - 8},${y2 + 8}"/>`;
      o += grp('ll', ps, null, '', ll);
    });
    const bars = [];
    msgs.forEach(m => {
      if (m.kind === 'ret' || m.kind === 'destroy') return;
      const y1 = Y[m.id]; let y2;
      const r = msgs.find(q => q.kind === 'ret' && q.ref === m.id);
      if (m.end) y2 = Y[m.end]; else if (r) y2 = Y[r.id]; else y2 = y1 + (m.kind === 'self' ? 28 : 22);
      bars.push(m.kind === 'create' ? { p: m.t, y1: y1 + 18, y2: y1 + 36, s: m.s || 3 } : { p: m.t, y1: y1 - 3, y2: y2 + 4, s: m.s || 3 });
    });
    bars.forEach((b, i) => { let dp = 0; for (let j = 0; j < i; j++) { const c = bars[j]; if (c.p === b.p && c.y1 <= b.y1 + 4 && c.y2 >= b.y1 + 4) dp++; } b.dp = dp; });
    bars.forEach(b => {
      const x = P[b.p].x - 5 + b.dp * 6;
      o += grp('bar', b.s, b.p, '', `<rect class="actb" x="${f1(x)}" y="${f1(b.y1)}" width="10" height="${f1(b.y2 - b.y1)}"/>`);
    });
    const edges = {}, all = [];
    msgs.forEach(m => {
      const yy = Y[m.id], F = P[m.f], T = P[m.t], k = m.kind || 'sync';
      let pts, mx, lab = L1(m.label);
      if (k === 'self') {
        const x1 = F.x + 5;
        pts = [[x1, yy], [x1 + 38, yy], [x1 + 38, yy + 26], [x1 + 3, yy + 26]];
        o += edgeSVG({ pts, id: m.id, s: m.s || 3, end: 'filled', label: m.label, lx: x1 + 46, ly: yy + 13, la: 'start', lab });
      } else {
        const dir = Math.sign(T.x - F.x) || 1;
        const x1 = F.x + dir * 5, x2 = T.x - dir * (k === 'create' ? T.hw / 2 : 5);
        pts = [[x1, yy], [x2, yy]]; mx = (x1 + x2) / 2;
        o += edgeSVG({ pts, id: m.id, s: m.s || 3, end: (k === 'sync' || k === 'destroy') ? 'filled' : 'open', dash: k === 'ret' || k === 'create', label: m.label, lx: mx, ly: yy - 9, lcls: k === 'ret' ? 'it' : '', lab });
        if (m.guard) o += grp('gd', m.gs || 5, null, 'điều kiện ' + m.guard, txt(mx, yy + 14, m.guard, { cls: 'sm b gdt', mid: true }));
      }
      edges[m.id] = { from: m.f, to: m.t }; all.push([m.id]);
    });

    o += front;

    /* --- 6. Kịch bản chạy luồng: kiểm tra mã thông điệp có thật --- */
    const scen = d.scen || [{ n: 'Kịch bản chính', steps: all }];
    scen.forEach(sc => sc.steps.forEach(g => g.forEach(id => { if (!(id in IX)) throw new Error('Kịch bản "' + sc.n + '": không có thông điệp ' + id); })));

    /* --- 7. Hỗ trợ chạy luồng: tô khung nào chạy, khung nào bị bỏ qua --- */
    const lblOf = (f, j) => f.op + (f.ops.length > 1 ? sym(j) : '');
    function onFlow(sv, fired, done) {
      const cnt = {}; fired.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; });
      const last = fired.length ? IX[fired[fired.length - 1]] : -1;
      const ok = [], no = [];
      frs.forEach(f => {
        const gs = sv.querySelectorAll('.fr[data-frag="' + f.id + '"]'); if (!gs.length) return;
        const any = f.ops.some(q => cnt[q.from]), passed = done || last > f.b;
        gs.forEach(g => { g.classList.toggle('hit', any); g.classList.toggle('skip', !any && passed); });
        f.ops.forEach((q, j) => {
          const k = cnt[q.from] || 0;
          const s = k ? 'taken' : ((f.op === 'alt' && any) || passed) ? 'skip' : 'pend';
          const sel = '.fr[data-frag="' + f.id + '"] ';
          const bg = sv.querySelector(sel + '.opb[data-op="' + j + '"]'), bd = sv.querySelector(sel + '.opbd[data-op="' + j + '"]');
          bg.classList.toggle('taken', s === 'taken'); bg.classList.toggle('skip', s === 'skip');
          bd.classList.toggle('taken', s === 'taken'); bd.classList.toggle('skip', s === 'skip');
          bd.textContent = s === 'taken' ? (f.op === 'loop' ? '✓ ' + k + ' vòng' : '✓ chạy' + (k > 1 ? ' ×' + k : ''))
            : s === 'skip' ? (f.op === 'loop' ? '✗ 0 vòng' : f.op === 'alt' ? '✗ không chọn' : '✗ bỏ qua') : '';
          if (done) (s === 'taken' ? ok : no).push('<b>' + f.op + '</b> ' + esc(q.g || (f.title + (f.ops.length > 1 ? ' ' + sym(j) : ''))) + (f.op === 'loop' ? ' (×' + k + ')' : ''));
        });
      });
      let note = '';
      if (last >= 0) {
        const path = fo.filter(f => last >= f.a && last <= f.b).map(f => {
          const j = f.ops.findIndex(q => last >= q.a && last <= q.b), q = f.ops[j];
          return '<b>' + lblOf(f, j) + '</b>' + (q.g ? ' ' + esc(q.g) : '') + (f.op === 'loop' ? ' (vòng ' + (cnt[q.from] || 0) + ')' : '');
        });
        note = '<br>▸ ' + (path.length ? 'Đang trong: ' + path.join(' › ') : 'Đang ở ngoài mọi khung fragment');
      }
      if (done) note += '<br>✓ Đã chạy: ' + (ok.join(', ') || '—') + '<br>✗ Bỏ qua: ' + (no.join(', ') || '—');
      return note;
    }
    function onFlowClear(sv) {
      sv.querySelectorAll('.fr').forEach(g => g.classList.remove('hit', 'skip'));
      sv.querySelectorAll('.opb,.opbd').forEach(e => e.classList.remove('taken', 'skip'));
      sv.querySelectorAll('.opbd').forEach(e => { e.textContent = ''; });
    }

    /* --- 8. Dữ liệu cho các bảng mô tả --- */
    const fragPath = i => fo.filter(f => i >= f.a && i <= f.b).map(f => lblOf(f, f.ops.findIndex(q => i >= q.a && i <= q.b))).join(' › ');
    function cover(ids) {
      const cnt = {}; ids.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; });
      const res = {};
      fo.forEach(f => {
        const nn = f.ops.map(q => cnt[q.from] || 0);
        res[f.id] = { n: nn, reached: !f.parent || res[f.parent.id].n[f.parentOp] > 0 };
      });
      return res;
    }
    return { svg: o, w: W, h: H, maxH: 1250, edges, scen, onFlow, onFlowClear, frags: fo, fragPath, cover, sym, lbl: lblOf };
  };

  /* ===== 4. COLLABORATION ===== */
  R.col = function (d) {
    const N = {}, LB = {}; const OBJ = {};
    d.objs.forEach(ob => { OBJ[ob.id] = ob; ob.w = ob.w || (ob.actor ? 36 : 124); ob.h = ob.h || (ob.actor ? 58 : 38); N[ob.id] = box(ob.x, ob.actor ? ob.y - 2 : ob.y, ob.w, ob.h); LB[ob.id] = L1(ob.label); });
    let o = '';
    const LK = [];
    d.links.forEach(l => {
      const pts = route(N[l.f], N[l.t], l.via);
      LK.push({ f: l.f, t: l.t, pts });
      o += edgeSVG({ pts, s: l.s || 2, lab: 'liên kết ' + LB[l.f] + ' — ' + LB[l.t] });
    });
    d.objs.forEach(ob => {
      const inner = ob.actor ? actorSVG(ob.x, ob.y, ob.label)
        : `<rect class="sh" x="${ob.x - ob.w / 2}" y="${ob.y - ob.h / 2}" width="${ob.w}" height="${ob.h}" rx="3"/>` + txt(ob.x, ob.y, ob.label, { cls: 'ul', mid: true });
      o += grp('nd', ob.s || 1, ob.id, LB[ob.id], inner);
    });
    const key = (a, b) => [a, b].sort().join('|');
    const cnt = {}, idx = {};
    d.msgs.forEach(m => { const k = key(m.f, m.t); cnt[k] = (cnt[k] || 0) + 1; });
    const edges = {}, order = [];
    d.msgs.forEach(m => {
      const k = key(m.f, m.t); idx[k] = (idx[k] || 0);
      const i = idx[k]++, c = cnt[k];
      const lk = LK.find(l => (l.f === m.f && l.t === m.t) || (l.f === m.t && l.t === m.f));
      const A = lk.pts[0], B = lk.pts[lk.pts.length - 1];
      const L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1, ux = (B[0] - A[0]) / L, uy = (B[1] - A[1]) / L;
      const nx = -uy, ny = ux, off = (i - (c - 1) / 2) * 26;
      const fwd = lk.f === m.f;
      const P0 = [(fwd ? A[0] : B[0]) + nx * off, (fwd ? A[1] : B[1]) + ny * off];
      const P1 = [(fwd ? B[0] : A[0]) + nx * off, (fwd ? B[1] : A[1]) + ny * off];
      const M = [(P0[0] + P1[0]) / 2, (P0[1] + P1[1]) / 2];
      const len = Math.min(54, L * .4), vx = (P1[0] - P0[0]) / L, vy = (P1[1] - P0[1]) / L;
      const a1 = [M[0] - vx * len / 2, M[1] - vy * len / 2], a2 = [M[0] + vx * len / 2, M[1] + vy * len / 2];
      let side = off > .5 ? 1 : off < -.5 ? -1 : (ny > 0 ? -1 : 1);
      if (Math.abs(ny) < .3 && Math.abs(off) <= .5) side = 1;
      const lnx = nx * side, lny = ny * side;
      const an = lnx > .4 ? 'start' : lnx < -.4 ? 'end' : 'middle';
      const lx = M[0] + lnx * (an === 'middle' ? 0 : 18), ly = M[1] + lny * (an === 'middle' ? 16 : 0);
      const traceD = `M${pt(P0)} L${pt(P1)}`;
      o += edgeSVG({ pts: [a1, a2], id: m.id, s: m.s || 3, end: 'filled', label: m.label, lx, ly, la: an, traceD, lab: L1(m.label) });
      edges[m.id] = { from: m.f, to: m.t }; order.push([m.id]);
    });
    return { svg: o, w: 900, h: d.h, edges, scen: [{ n: 'Kịch bản chính', steps: order }] };
  };

  /* ===== 5. CLASS ===== */
  R.cls = function (d) {
    const N = {}, S = {}, LB = {};
    d.classes.forEach(c => {
      c.attrs = c.attrs || []; c.ops = c.ops || [];
      c.hh = 28 + (c.stereo ? 13 : 0); c.ah = Math.max(1, c.attrs.length) * 17 + 8; c.oh = Math.max(1, c.ops.length) * 17 + 8; c.h = c.hh + c.ah + c.oh;
      N[c.id] = box(c.x + c.w / 2, c.y + c.h / 2, c.w, c.h); S[c.id] = c.s || 1; LB[c.id] = c.name;
    });
    const kindS = { assoc: 3, agg: 4, comp: 4, ac: 4, gen: 5, dep: 6 };
    const G = {}; let lines = '';
    d.rels.forEach(r => {
      const k = r.kind || 'assoc';
      let pts;
      if (k === 'ac') { const m = G[r.rel].mid; pts = [anchor(N[r.f], m[0], m[1]), m]; }
      else pts = route(N[r.f], N[r.t], r.via);
      const mid = polyAt(pts, .5); G[r.id || (r.f + r.t)] = { pts, mid: [mid.x, mid.y] };
      const s = r.s || Math.max(kindS[k], S[r.f], r.t ? S[r.t] : 1);
      const o = { pts, s, label: r.label, lp: r.lp, m1: r.m1, m2: r.m2, lab: LB[r.f] + (k === 'gen' ? ' kế thừa ' : ' — ') + LB[r.t || ''] };
      if (k === 'agg') o.start = 'dia';
      if (k === 'comp') o.start = 'fdia';
      if (k === 'gen') o.end = 'tri';
      if (k === 'dep') { o.dash = 1; o.end = 'open'; }
      if (k === 'ac') { o.dash = 1; o.lab = 'lớp kết hợp ' + LB[r.f]; }
      if (r.nav) o.end = 'open';
      lines += edgeSVG(o);
    });
    let o = lines;
    d.classes.forEach(c => {
      const nameY = c.y + (c.stereo ? 13 + 14 : 14);
      let b = `<rect class="sh" x="${c.x}" y="${c.y}" width="${c.w}" height="${f1(c.h)}"/>` +
        `<line class="ln thin" x1="${c.x}" y1="${c.y + c.hh}" x2="${c.x + c.w}" y2="${c.y + c.hh}"/>` +
        `<line class="ln thin" x1="${c.x}" y1="${c.y + c.hh + c.ah}" x2="${c.x + c.w}" y2="${c.y + c.hh + c.ah}"/>`;
      if (c.stereo) b += txt(c.x + c.w / 2, c.y + 12, '«' + c.stereo + '»', { cls: 'sm mute', mid: true });
      b += txt(c.x + c.w / 2, nameY, c.name, { cls: 'b' + (c.abs ? ' it' : ''), mid: true });
      o += grp('nd', c.s || 1, c.id, c.name, b);
      const rows = (arr, top) => arr.map((t, i) => txt(c.x + 8, top + 4 + i * 17 + 8.5, t, { cls: 'sm', a: 'start', mid: true })).join('');
      if (c.attrs.length) o += grp('at', c.as || 2, null, 'thuộc tính của ' + c.name, rows(c.attrs, c.y + c.hh));
      if (c.ops.length) o += grp('at', c.os || 6, null, 'phương thức của ' + c.name, rows(c.ops, c.y + c.hh + c.ah));
    });
    return { svg: o, w: 900, h: d.h };
  };

  /* ===== 6. OBJECT ===== */
  R.obj = function (d) {
    const N = {}, LB = {};
    d.objs.forEach(ob => {
      ob.attrs = ob.attrs || []; ob.hh = 30; ob.h = ob.hh + (ob.attrs.length ? ob.attrs.length * 17 + 10 : 0);
      N[ob.id] = box(ob.x + ob.w / 2, ob.y + ob.h / 2, ob.w, ob.h); LB[ob.id] = ob.label;
    });
    let o = '';
    d.links.forEach(l => {
      const pts = route(N[l.f], N[l.t], l.via);
      o += edgeSVG({ pts, s: l.s || 4, label: l.label, lp: l.lp, lab: 'liên kết ' + LB[l.f] + ' — ' + LB[l.t] });
    });
    d.objs.forEach(ob => {
      let b = `<rect class="sh" x="${ob.x}" y="${ob.y}" width="${ob.w}" height="${f1(ob.h)}"/>`;
      if (ob.attrs.length) b += `<line class="ln thin" x1="${ob.x}" y1="${ob.y + ob.hh}" x2="${ob.x + ob.w}" y2="${ob.y + ob.hh}"/>`;
      b += txt(ob.x + ob.w / 2, ob.y + ob.hh / 2, ob.label, { cls: 'b ul', mid: true });
      o += grp('nd', ob.s || 2, ob.id, ob.label, b);
      if (ob.attrs.length) o += grp('at', ob.as || 3, null, 'giá trị của ' + ob.label, ob.attrs.map((t, i) => txt(ob.x + 9, ob.y + ob.hh + 5 + i * 17 + 8.5, t, { cls: 'sm', a: 'start', mid: true })).join(''));
    });
    return { svg: o, w: 900, h: d.h };
  };

  /* ===== 7. STATE ===== */
  R.st = function (d) {
    const N = {}, LB = {};

      `<h2 style="margin-top:20px">Danh sách thông điệp</h2>${T(['#', 'Từ', 'Đến', 'Thông điệp', 'Loại', 'Nằm trong fragment'], ms, 'tcov')}` +
      `<h2 style="margin-top:20px">Độ phủ của các kịch bản chạy luồng</h2>${T(['Kịch bản', 'Số bước'].concat(r.frags.map(f => esc(f.op) + '<br><span class="src">' + esc(f.title || '') + '</span>')), cv + sum, 'tcov')}` +
      `<p class="src" style="margin:8px 0 0">— : khung cha không chạy nên chưa tới khung này · ✗ : tới nơi nhưng bị bỏ qua · ① ②: nhánh được chọn · ×n: số vòng lặp</p>`;
  }
  function renderText() {
    const d = cur.d;
    const idx = DIAGRAMS.indexOf(d) + 1;
    const sym = d.symbols.map(s => `<div class="sym"><div class="g">${s.g}</div><div><b>${esc(s.n)}</b><p>${esc(s.d)}</p></div></div>`).join('');
    $('#topSec').innerHTML =
      `<div class="card"><div class="head"><h2 class="big">${idx}. ${d.name}</h2><span class="chip ${d.tag}">${d.tag === 's' ? 'Sơ đồ tĩnh' : 'Sơ đồ động'}</span><span class="src">${esc(d.src)}</span></div>` +
      `<p class="lead">${esc(d.lead)}</p>` +
      `<div class="cols"><div class="mini"><h3>${d.tag === 's' ? 'Tĩnh nghĩa là' : 'Động nghĩa là'}</h3><p>${d.tag === 's' ? 'Mô tả cấu trúc tại một thời điểm, không có trục thời gian.' : 'Mô tả hành vi diễn ra theo thời gian, có trước có sau.'}</p></div>` +
      `<div class="mini"><h3>Dùng lúc nào</h3><p>${esc(d.when)}</p></div><div class="mini"><h3>Dễ nhầm</h3><p>${esc(d.pitfall)}</p></div></div></div>`;
    $('#symSec').innerHTML = `<div class="card"><h2>Ký hiệu <small>định nghĩa và cách vẽ</small></h2><div class="syms">${sym}</div></div>`;
    const sp = cur.ex.spec; let bot = '';
    if (ST.tab === 'uc') bot = `<h2>${esc(sp.uc.title)}</h2><div class="tbl-wrap"><table><tbody>${sp.uc.rows.map(r => `<tr><td class="k">${esc(r[0])}</td><td>${nl(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
    else if (ST.tab === 'cls' || ST.tab === 'st') {
      const t = sp[ST.tab];
      bot = `<h2>${ST.tab === 'cls' ? 'Danh sách lớp chính' : 'Bảng chuyển trạng thái'}</h2><div class="tbl-wrap"><table><thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map((c, i) => `<td${i === 0 ? ' class="k"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    } else if (ST.tab === 'seq') bot = seqTables(cur.r, cur.data);
    else if (ST.tab === 'col') bot = `<h2>Danh sách thông điệp</h2><div class="tbl-wrap">${msgTable(cur.data, ST.tab)}</div>`;
    $('#botSec').innerHTML = bot ? `<div class="card">${bot}</div>` : '';
  }

  /* ---------- vẽ sơ đồ ---------- */
  function render() {
    stopAll();
    const d = DIAGRAMS.find(x => x.id === ST.tab), ex = EXS[ST.ex], data = ex[ST.tab];
    const r = ENG.R[ST.tab](data);
    let edges = r.edges, scen = r.scen;
    if (ST.tab === 'act') { edges = {}; data.edges.forEach(e => edges[e.id] = { from: e.f, to: e.t }); scen = data.scen; }
    cur = { d, ex, data, r, edges, scen, N: d.steps.length, dyn: d.tag === 'd' && !!scen };
    host.innerHTML = `<svg xmlns="${NS}" viewBox="0 0 ${r.w} ${r.h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sơ đồ ${d.name} của ví dụ ${esc(ex.name)}">${r.svg}<g class="fx"></g></svg>`;
    svg = host.querySelector('svg'); fx = svg.querySelector('.fx');
    home = { x: 0, y: 0, w: r.w, h: r.h }; vb = Object.assign({}, home);
    fitHost();
    titleEl.textContent = `${d.name} · ${ex.name}`;
    whyEl.innerHTML = `<p><b>Vì sao cần sơ đồ này?</b> ${esc(d.why)}</p>` + (SIMPL[ST.tab] ? `<p class="vl-hint">Đơn giản hóa so với thực tế: ${esc(SIMPL[ST.tab])}</p>` : '');
    slider.min = 1; slider.max = cur.N;
    modeSeg.style.display = tb.style.display = cur.dyn ? '' : 'none';
    ST.scen = 0; ST.idx = 0; ST.step = cur.N;
    renderText();
    setMode(cur.dyn ? ST.mode : 'draw', true);
    ready = true;
  }
  function fitHost() {
    if (!svg) return;
    const w = host.clientWidth || 700;
    host.style.height = Math.round(Math.min(cur.r.maxH || 860, Math.max(300, w * cur.r.h / cur.r.w))) + 'px';
  }
  window.addEventListener('resize', fitHost);

  function stepText(n) { const s = cur.d.steps[n - 1]; return `<b>Bước ${n}/${cur.N} · ${esc(s.t)}</b><br>${esc(s.d)}`; }
  function summary() {
    const nd = svg.querySelectorAll('.nd').length, ed = svg.querySelectorAll('.ed').length;
    return `<b>Sơ đồ ${cur.d.name} đã vẽ xong</b> trong ${cur.N} bước: ${nd} phần tử chính và ${ed} đường nối hoặc thông điệp.`;
  }
  function applyStep(n) {
    ST.step = n;
    const part = n < cur.N;
    svg.querySelectorAll('.el').forEach(el => {
      const s = +el.dataset.s;
      el.classList.toggle('hid', part && s > n);
      el.classList.toggle('new', part && s === n);
    });
  }

  /* ---------- chế độ ---------- */
  function drawLines() { return cur.d.steps.map((s, i) => `${i + 1}. ${s.t}`); }
  function nodeLabel(id) { const el = svg.querySelector(`[data-node="${id}"]`); return el ? (el.dataset.l || id) : id; }
  function edgeText(eid) { const g = svg.querySelector(`[data-eid="${eid}"]`), t = g && g.querySelector('text'); return t ? t.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function groupText(grp) {
    return grp.map(eid => { const e = cur.edges[eid], t = edgeText(eid); return nodeLabel(e.from) + ' → ' + nodeLabel(e.to) + (t ? ' : ' + t : ''); }).join('  ‖  ');
  }
  function flowLines() { return cur.scen[ST.scen].steps.map(g => groupText(g)); }
  function buildChips() {
    chips.innerHTML = cur.scen.map((s, i) => `<button data-i="${i}" aria-pressed="${i === ST.scen}">${esc(s.n)}</button>`).join('');
    chips.style.display = ST.mode === 'flow' ? '' : 'none';
  }
  function setMode(m, quiet) {
    app.pause(); clearFlow(); ST.mode = m;
    modeSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
    applyStep(cur.N); setSlider(cur.N);
    if (cur.dyn) buildChips();
    if (m === 'flow') {
      setLines(flowLines());
      const sc = cur.scen[ST.scen], f = cur.edges[sc.steps[0][0]];
      app.status(`<b>Kịch bản: ${esc(sc.n)}</b> · ${sc.steps.length} bước. Tín hiệu xuất phát tại <b>${esc(nodeLabel(f.from))}</b>.`);
    } else {
      setLines(drawLines());
      app.status(summary());
    }
  }
  modeSeg.addEventListener('click', e => { const b = e.target.closest('button'); if (b && ready) setMode(b.dataset.m); });
  chips.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ST.scen = +b.dataset.i; setMode('flow'); });

  /* ---------- bộ chạy ---------- */
  function scrub(v) {
    app.pause();
    if (ST.mode === 'flow') { clearFlow(); ST.mode = 'draw'; modeSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === 'draw')); chips.style.display = 'none'; setLines(drawLines()); }
    applyStep(v); app.highlight(v - 1);
    app.status(v >= cur.N ? summary() : stepText(v));
  }
  function resetExternal() {
    clearFlow();
    if (ST.mode === 'flow') {
      applyStep(cur.N); setSlider(cur.N); setLines(flowLines());
      const sc = cur.scen[ST.scen];
      app.status(`<b>Đã đặt lại.</b> Kịch bản: ${esc(sc.n)}, ${sc.steps.length} bước.`);
    } else {
      applyStep(1); setSlider(1); app.highlight(0); app.status(stepText(1));
    }
  }
  function stepOnce() {
    if (ST.mode === 'flow') return stepFlow();
    if (ST.step >= cur.N) ST.step = 0;
    const n = ST.step + 1;
    applyStep(n); setSlider(n); app.highlight(n - 1);
    app.status(n >= cur.N ? summary() : stepText(n));
    return n < cur.N;
  }

  /* ---------- luồng hoạt động (như tín hiệu chạy trong mạng nơ-ron) ---------- */
  function clearFlow() {
    token++;
    if (!svg) return;
    if (cur && cur.r && cur.r.onFlowClear) cur.r.onFlowClear(svg);
    svg.classList.remove('playing');
    svg.querySelectorAll('.seen,.cur,.on,.fire').forEach(e => e.classList.remove('seen', 'cur', 'on', 'fire'));
    svg.querySelectorAll('.tr').forEach(t => { t.style.strokeDasharray = ''; t.style.strokeDashoffset = ''; });
    fx.innerHTML = '';
    ST.idx = 0;
    app.highlight(-1);
  }
  function stopAll() { try { app.pause(); } catch (e) { } clearFlow(); }
  function setCur(ids) {
    svg.querySelectorAll('.cur').forEach(e => { e.classList.remove('cur'); e.classList.add('seen'); });
    ids.forEach(id => svg.querySelectorAll(`[data-node="${id}"]`).forEach(e => { e.classList.remove('seen'); e.classList.add('cur'); }));
  }
  function fire(eid, dur, tk) {
    const g = svg.querySelector(`[data-eid="${eid}"]`); if (!g) return;
    g.classList.add('on', 'fire');
    const tr = g.querySelector('.tr'); if (!tr) return;
    const len = tr.getTotalLength();
    tr.style.strokeDasharray = len + ' ' + len; tr.style.strokeDashoffset = len;
    if (!dur) { tr.style.strokeDashoffset = 0; g.classList.remove('fire'); return; }
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 7); c.setAttribute('class', 'pulse'); fx.appendChild(c);
    const t0 = performance.now();
    (function frame(now) {
      if (tk !== token) { c.remove(); return; }
      const k = Math.min(1, (now - t0) / dur);
      tr.style.strokeDashoffset = len * (1 - k);
      const p = tr.getPointAtLength(len * k);
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      if (k < 1) requestAnimationFrame(frame); else { c.remove(); g.classList.remove('fire'); }
    })(t0);
  }
  function stepFlow() {
    const sc = cur.scen[ST.scen], steps = sc.steps;
    if (ST.idx >= steps.length) clearFlow();
    if (ST.idx === 0) {
      applyStep(cur.N);
      svg.classList.add('playing');
      setCur(Array.from(new Set(steps[0].map(e => cur.edges[e].from))));
    }
    const grp = steps[ST.idx]; ST.idx++;
    const tk = ++token;
    const dur = reduce ? 0 : Math.max(180, Math.min(650, speedMs() * 0.7));
    grp.forEach(eid => fire(eid, dur, tk));
    const arrive = () => { if (tk === token) setCur(Array.from(new Set(grp.map(e => cur.edges[e].to)))); };
    dur ? setTimeout(arrive, dur) : arrive();
    app.highlight(ST.idx - 1);
    const extra = cur.r.onFlow ? cur.r.onFlow(svg, steps.slice(0, ST.idx).reduce((a, g) => a.concat(g), []), ST.idx >= steps.length) : '';
    app.status(`<b>Bước ${ST.idx}/${steps.length} · ${esc(sc.n)}</b><br>${esc(groupText(grp))}${extra}`);
    return ST.idx < steps.length;
  }

  /* ---------- zoom, kéo, pinch cho sân khấu SVG ---------- */
  function setVB() { svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`); }
  function zoomAt(fx_, fy_, k) {
    const W = home.w, nw = Math.max(W / 6, Math.min(W * 1.4, vb.w / k)), nh = nw * home.h / home.w;
    vb.x += fx_ * (vb.w - nw); vb.y += fy_ * (vb.h - nh); vb.w = nw; vb.h = nh; setVB();
  }
  host.addEventListener('wheel', e => {
    if (!svg) return; e.preventDefault();
    const r = host.getBoundingClientRect();
    zoomAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  const ptrs = new Map(); let lastD = 0;
  host.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); host.setPointerCapture(e.pointerId); host.classList.add('dragging'); lastD = 0; });
  host.addEventListener('pointermove', e => {
    if (!svg || !ptrs.has(e.pointerId)) return;
    const p = ptrs.get(e.pointerId), r = host.getBoundingClientRect();
    if (ptrs.size === 2) {
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const a = Array.from(ptrs.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (lastD) zoomAt(((a[0].x + a[1].x) / 2 - r.left) / r.width, ((a[0].y + a[1].y) / 2 - r.top) / r.height, d / lastD);
      lastD = d; return;
    }
    vb.x -= (e.clientX - p.x) * vb.w / r.width; vb.y -= (e.clientY - p.y) * vb.h / r.height;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); setVB();
  });
  const endP = e => { ptrs.delete(e.pointerId); lastD = 0; if (!ptrs.size) host.classList.remove('dragging'); };
  host.addEventListener('pointerup', endP); host.addEventListener('pointercancel', endP);
  app.onHome = function () { if (svg) { vb = Object.assign({}, home); setVB(); } };

  buildPickers();
  render();
  window.__lab = { ST, render, app, get cur() { return cur; }, setMode, ST_: ST };
})();
</script>

</body></html>
