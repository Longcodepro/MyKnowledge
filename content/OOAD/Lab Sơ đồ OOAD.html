<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab OOAD v2 – Phân tích thiết kế hướng đối tượng</title>
<style>
.sh-panel{padding:12px 16px 90px;max-width:1180px;margin:0 auto}
.lb h2{margin:0 0 6px;font-size:19px}
.lb h3{margin:0 0 6px;font-size:15px}
.lb p{margin:6px 0;line-height:1.55}
.lb .why{background:var(--vl-panel);border-left:4px solid var(--vl-accent);padding:8px 12px;border-radius:6px;margin:8px 0}
.lb .warn{background:var(--vl-hl);color:var(--vl-hl-fg);padding:8px 12px;border-radius:6px;margin:8px 0}
.lb .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.lb .chip{border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.lb .chip[aria-pressed=true]{background:var(--vl-accent);color:#fff;border-color:var(--vl-accent)}
.lb table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.lb th,.lb td{border:1px solid var(--vl-line);padding:5px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.lb th{background:var(--vl-panel)}
.lb .tw{overflow-wrap:anywhere}
.lb .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lb .card{border:1px solid var(--vl-line);border-radius:10px;padding:10px 12px;background:var(--vl-bg)}
.lb .dgwrap{overflow:hidden;position:relative;border:1px solid var(--vl-line);border-radius:10px;background:var(--vl-bg)}
.lb .dginner{transform-origin:0 0}
.lb .st{margin:8px 0;padding:8px 12px;background:var(--vl-panel);border-radius:6px;font-size:14px;line-height:1.5}
.lb pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--vl-panel);border:1px solid var(--vl-line);border-radius:8px;padding:10px;font-size:12.5px;line-height:1.5;margin:6px 0}
.lb code{background:var(--vl-panel);padding:1px 5px;border-radius:4px;font-size:12.5px}
.lb .btn{border:1px solid var(--vl-line);background:var(--vl-panel);color:var(--vl-fg);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.lb select{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);max-width:100%}
.lb .tb{display:inline-block;border:1px solid var(--vl-line);border-radius:6px;margin:4px 8px 4px 0;vertical-align:top;background:var(--vl-bg)}
.lb .tb b{display:block;background:var(--vl-panel);padding:3px 8px;font-size:13px;border-bottom:1px solid var(--vl-line)}
.lb .tb div{padding:3px 8px;font-size:12.5px;font-family:ui-monospace,monospace}
.lb .pk{color:#b45309;font-weight:700}.lb .fk{color:#2563eb;font-weight:700}
.lb .quiz li{margin:4px 0}
.lb .quiz button{margin-left:6px}
:root{
  --paper:var(--vl-panel); --panel:var(--vl-bg); --ink:var(--vl-fg); --mute:var(--vl-muted); --line:var(--vl-line); --line2:var(--vl-grid);
  --accent:var(--vl-accent); --accent-soft:#E6ECFD; --static:#0B8A7A; --static-soft:#DDF3EF; --dyn:#B93F0C; --dyn-soft:#FFEADD; --signal:#FF6A1F; --draw:var(--vl-fg);
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-head:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-mono:ui-monospace,Menlo,Consolas,monospace;
}
:root[data-vl-theme="dark"]{--accent-soft:#1E2B52;--static:#3FC1AE;--static-soft:#12332F;--dyn:#FF9A63;--dyn-soft:#3A2415;}
/* nội dung */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:14px}
.card h2{font-size:18px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.card h2 small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.head h2.big{font-size:clamp(22px,3.4vw,28px);font-weight:700;margin:0}
.chip{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid}
.chip.s{background:var(--static-soft);color:#066B5E;border-color:#A8DDD4}
.chip.d{background:var(--dyn-soft);color:var(--dyn);border-color:#F4BFA1}
.src{font-size:12.5px;color:var(--mute)}
.lead{font-size:16.5px;margin:10px 0 0;max-width:72ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.mini{background:var(--paper);border-radius:10px;padding:12px 14px}
.mini h3{font-size:12px;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.mini p{margin:0;font-size:14.5px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:var(--paper);font-weight:600;font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.k{font-weight:600;white-space:nowrap;color:var(--accent);width:1%}
td code,.mono{font-family:var(--f-mono);font-size:12.5px}

/* ký hiệu */
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.sym{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#FCFDFF}
.sym .g{background:var(--paper);border-radius:8px;display:grid;place-items:center;padding:6px 2px}
.sym b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.sym p{margin:2px 0 0;font-size:13px;color:var(--mute);line-height:1.5}
.gsvg{width:140px;height:auto;display:block}.gsvg .tx.sm{font-size:10.5px}

/* bàn vẽ */
.lab-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.14)}
.seg.f button[aria-pressed=true]{color:var(--dyn)}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 13px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#1d3fb5;color:#fff}
.btn.fire{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.fire:hover:not(:disabled){background:#e85a10;color:#fff}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.stepbox{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 14px;min-height:62px}
.stepbox .no{font-family:var(--f-head);font-weight:700;font-size:22px;color:var(--accent);line-height:1.1;min-width:2ch}
.stepbox b{display:block;font-size:14.5px}
.stepbox p{margin:0;font-size:13.5px;color:#2B3A55;line-height:1.5}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:12px;font-weight:500}
.dots button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.dots button.done{border-color:var(--accent);color:var(--accent)}
.dots button[aria-current=true].done{color:#fff}
.fig{margin:0;border:1px solid var(--line);border-radius:12px;background:
  linear-gradient(var(--line2) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/24px 24px,#fff;overflow-x:auto}
.fig svg{display:block;margin:0 auto;min-width:760px;width:100%;height:auto}
.flowbox{background:var(--dyn-soft);border-radius:10px;padding:10px 14px}
.flowbox .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid #F0C3A6;background:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--dyn)}
.chips button[aria-pressed=true]{background:var(--dyn);border-color:var(--dyn);color:#fff}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:210px;overflow:auto;counter-reset:l}
.log li{font-size:13.5px;display:flex;gap:8px;padding:3px 8px;border-radius:6px;color:#8a5a40;counter-increment:l}
.log li::before{content:counter(l);font-family:var(--f-mono);font-size:11.5px;min-width:2ch;color:#c58a68;padding-top:2px}
.log li.now{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--signal)}
.log li.now::before{color:var(--signal)}
.log:empty::after{content:'—';color:#c58a68;padding:3px 8px}
.sel select{font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:5px 8px;background:#fff}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:2px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}

/* SVG */
.sh{fill:var(--panel);stroke:var(--draw);stroke-width:1.6}
.sh.soft{fill:var(--paper)}
.sh.bnd{fill:var(--panel)}
.sh.dashed{stroke-dasharray:6 4;fill:var(--paper)}
.ln{fill:none;stroke:var(--draw);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:6 4}
.ln.thin{stroke-width:1}
.dc{fill:none;stroke:var(--draw);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.dc.fill{fill:var(--draw)}
.dc.hollow{fill:var(--panel)}
.fillc{fill:var(--draw)}
.tx{font:500 14px var(--f-body);fill:var(--ink)}
.tx.sm{font-size:12.5px}
.tx.b{font-weight:700}
.tx.mute{fill:var(--mute)}
.tx.it{font-style:italic}
.tx.ul{text-decoration:underline}
.tx.hl{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.lane-bg{fill:var(--panel);stroke:var(--line)}
.lane-hd{fill:var(--accent-soft);stroke:var(--line)}
.lln{stroke:#8A98AF;stroke-dasharray:5 4;stroke-width:1.2}
.actb{fill:var(--panel);stroke:var(--draw);stroke-width:1.4}
.tr{fill:none;stroke:var(--signal);stroke-width:3.2;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.pulse{fill:var(--signal);stroke:#fff;stroke-width:2}
.hid{opacity:0;pointer-events:none}
.el{transition:opacity .25s}
.new .sh,.new .ln:not(.lln),.new .dc,.new .actb{stroke:var(--accent)}
.new .fillc,.new .dc.fill{fill:var(--accent)}
.new .tx{fill:var(--accent)}
.playing .nd,.playing .bar{opacity:.34}
.playing .ed{opacity:.26}
.playing .nd.seen,.playing .nd.cur,.playing .bar.seen,.playing .bar.cur{opacity:1}
.playing .ed.on{opacity:1}
.nd.seen .sh,.bar.seen .actb{stroke:#E39566}
.nd.cur .sh{stroke:var(--signal);stroke-width:2.8;filter:drop-shadow(0 0 7px rgba(255,106,31,.65))}
.nd.cur .fillc,.nd.seen .fillc{fill:var(--signal)}
.nd.seen .fillc{fill:#E39566}
.nd.cur .tx{fill:#7A2B05}
.bar.cur .actb{stroke:var(--signal);stroke-width:2.4}
.ed.on .ln,.ed.on .dc{stroke:#E39566}
.ed.on .dc.fill{fill:#E39566}
.ed.on .tr{opacity:.4}
.ed.fire .tr{opacity:1}
.ed.fire .ln,.ed.fire .dc{stroke:var(--signal)}
.ed.fire .dc.fill{fill:var(--signal)}

/* sequence: combined fragment */
.frm{fill:var(--accent-soft);fill-opacity:.28;stroke:none}
.frb{fill:none;stroke:var(--draw);stroke-width:1.5}
.frt{fill:var(--panel);stroke:var(--draw);stroke-width:1.2}
.frd{stroke:var(--draw);stroke-width:1.2;stroke-dasharray:7 4}
.opb{fill:transparent;stroke:none}
.opb.taken{fill:var(--dyn-soft);fill-opacity:.65}
.opb.skip{fill:var(--line2);fill-opacity:.9}
.opbd{opacity:0}
.opbd.taken{opacity:1;fill:var(--static)}
.opbd.skip{opacity:1;fill:var(--mute)}
.fr.hit .frb{stroke:var(--signal);stroke-width:2.2}
.fr.hit .frt{stroke:var(--signal)}
.fr.skip .frb{stroke:var(--mute);stroke-dasharray:5 4}
.fr.skip .frt{stroke:var(--mute)}
.new .frb,.new .frt,.new .frd{stroke:var(--accent)}
.tcov table{min-width:0}.tcov th,.tcov td{padding:7px 6px;font-size:12px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.tcov td.k{width:auto;min-width:92px}
@media (max-width:640px){

  .card{padding:16px 14px}
  .sym{grid-template-columns:130px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .el,.nd{transition:none}
}
.lb2{max-width:1180px;margin:0 auto}
.svghost{position:relative;overflow:hidden;touch-action:pan-y;border:1px solid var(--line);border-radius:12px;width:100%;
  background:linear-gradient(var(--line2) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/24px 24px,var(--panel);cursor:grab}
.svghost svg{display:block;width:100%;height:100%}
.tb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0}
.exc button,.scc button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.exc button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.scc button{border-color:#F0C3A6;color:var(--dyn)}
.scc button[aria-pressed=true]{background:var(--dyn);border-color:var(--dyn);color:#fff}
.exc,.scc{display:flex;gap:6px;flex-wrap:wrap}
.st2{margin:10px 0;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-size:14px;line-height:1.55;min-height:62px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.lb2 .tbl-wrap{overflow-x:auto}
.lb2 table{min-width:0}
.lb2 th{white-space:normal}
.lb2 td,.lb2 th{overflow-wrap:anywhere}
.lb2 .seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font:inherit;font-weight:600;font-size:13.5px;color:var(--mute);cursor:pointer}
.lb2 .seg button[aria-pressed=true]{background:var(--panel);color:var(--dyn);box-shadow:0 1px 3px rgba(15,27,45,.14)}
.lb2 .seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px}
.lb2 .btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 13px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer}
@media (max-width:640px){.sym{grid-template-columns:130px minmax(0,1fr)}}
/* ---- thử thách / mồi câu hỏi ---- */
.hook{margin-top:12px;padding:10px 14px;border-left:4px solid var(--signal);background:var(--dyn-soft);border-radius:8px;line-height:1.6;font-size:14.5px}
.chi{padding:12px 0;border-top:1px solid var(--line2)}
.chi:first-of-type{border-top:0}
.chi .q{margin:0 0 8px;line-height:1.6}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.ob{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;max-width:100%}
.ob:hover{border-color:var(--accent)}
.ob.ok{border-color:#16a34a;background:#dcfce7;color:#14532d}
.ob.bad{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}
.ob.pick{border-color:var(--accent);background:var(--accent-soft)}
:root[data-vl-theme="dark"] .ob.ok{background:#14351f;color:#bbf7d0}
:root[data-vl-theme="dark"] .ob.bad{background:#3b1414;color:#fecaca}
.ob.sm{padding:3px 10px;font-size:12.5px}
.fb{margin-top:8px;padding:10px 12px;background:var(--accent-soft);border-radius:8px;line-height:1.6;font-size:14px}
.sortl .sr{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:4px 0}
.sortl .sn{font-weight:600;min-width:150px}
.sortl .sb{display:inline-flex;gap:6px;flex-wrap:wrap}
.sres{width:100%;font-size:13.5px;padding:2px 0 6px 0;color:var(--mute)}
.chal .card{margin-top:14px}
.chal h2 small{margin-left:8px}
/* ---- bản đồ môn ---- */
.mapbar{margin:6px 0}
.reqc{padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0}
.stg{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--panel)}
.stg.none{background:var(--paper);border-style:dashed}
.stg .sh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stg .sh .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700}
.stg.none .sh .n{background:var(--mute)}
.chp{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chp.nn{border-color:#F0C3A6;color:var(--dyn)}
.stg p{margin:6px 0;line-height:1.6}
.stg .curio{color:var(--dyn);font-size:14px}
.tblw{overflow-x:auto}
/* ---- RDM ---- */
.rbar{margin:6px 0 10px}
.cb,.rt{display:inline-block;vertical-align:top;border:1.5px solid var(--draw);border-radius:6px;margin:4px 8px 4px 0;background:var(--panel);min-width:140px}
.cb b,.rt b{display:block;padding:4px 10px;background:var(--paper);border-bottom:1.5px solid var(--draw);font-size:13px;text-align:center}
.cb div,.rt div{padding:2px 10px;font-size:12.5px;font-family:var(--f-mono)}
.rt{border-color:var(--accent)}.rt b{border-color:var(--accent)}
.pk{color:#b45309;font-weight:700}.fk{color:#2563eb;font-weight:700}
:root[data-vl-theme="dark"] .pk{color:#fbbf24}:root[data-vl-theme="dark"] .fk{color:#7db3ff}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.flow .mid{padding:4px 10px;background:var(--accent-soft);border-radius:99px;font-size:12.5px;font-weight:600}
.mul{display:inline-block;margin:0 6px;font-size:12.5px;color:var(--mute);vertical-align:middle}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:10px}
.three .card{margin-top:0;padding:10px 12px}
.rtw{margin-top:10px}
.lb .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
/* ---- giao diện ---- */
.uigrid{display:grid;grid-template-columns:minmax(280px,420px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.uigrid{grid-template-columns:minmax(0,1fr)}}
.wf{border:2px solid var(--draw);border-radius:14px;padding:12px;background:var(--panel)}
.wfh{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px dashed var(--line);margin-bottom:8px;cursor:pointer}
.wfh span{font-size:12.5px;color:var(--mute)}
.wfs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.seat{border:1.5px solid var(--draw);border-radius:8px;padding:8px 0;text-align:center;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.seat.free:hover{background:var(--accent-soft)}
.seat.pick{background:var(--accent);color:#fff;border-color:var(--accent)}
.seat.sold{background:var(--line);color:var(--mute);cursor:not-allowed}
.seat.hold{background:#fde68a;color:#78350f;border-color:#d97706;cursor:not-allowed}
.seat.sm{display:inline-block;padding:2px 8px;font-size:11.5px;cursor:default;margin-right:6px}
.wfl{margin-bottom:8px}
.wff{display:grid;gap:6px;margin-bottom:8px}

<script>

     - Thanh trượt tham số

     - Ô nhập công thức (parser an toàn, KHÔNG dùng eval)
     - Khung mã giả tiếng Việt có tô sáng dòng đang chạy

(function (global) {

  .vl-code div.on{background:var(--vl-hl);color:var(--vl-hl-fg);font-weight:600;}

  `;

  function injectCSS() {
    if (document.getElementById('vl-css')) return;
    const s = document.createElement('style');

    s.textContent = CSS;

  /* ==========================================================================
     3. PARSER CÔNG THỨC — an toàn, không dùng eval()
     Hỗ trợ: + - * / ^ ( ) , số, biến, hàm dựng sẵn, hằng pi/e
     Dùng:  const f = VLab.compile('x^2 + 3*x', ['x']);  f({x:2}) -> 10
     ========================================================================== */
  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    exp: Math.exp, sqrt: Math.sqrt, abs: Math.abs,
    log: Math.log, ln: Math.log, log10: Math.log10, log2: Math.log2,
    floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign,
    min: Math.min, max: Math.max, pow: Math.pow, atan2: Math.atan2,
    relu: function (v) { return v > 0 ? v : 0; },
    sigmoid: function (v) { return 1 / (1 + Math.exp(-v)); }
  };
  const CONSTS = { pi: Math.PI, e: Math.E };

  function tokenize(src) {
    const out = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < src.length && /[0-9.]/.test(src[j])) j++;
        const num = parseFloat(src.slice(i, j));
        if (isNaN(num)) throw new Error('Số không hợp lệ: ' + src.slice(i, j));
        out.push({ t: 'num', v: num });
        i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i;
        while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
        out.push({ t: 'name', v: src.slice(i, j) });
        i = j; continue;
      }
      if ('+-*/^(),'.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      throw new Error('Ký tự lạ: "' + c + '"');
    }
    return out;
  }

  // Chuyển sang hậu tố bằng thuật toán sân ga (shunting-yard)
  function toRPN(tokens) {
    // Dấu trừ đứng trước (u-) nằm giữa */ và ^, nên -x^2 = -(x^2)
    const prec = { '+': 1, '-': 1, '*': 2, '/': 2, 'u-': 2.5, '^': 3 };
    const right = { '^': true, 'u-': true };
    const out = [], ops = [];
    let prev = null;
    for (let k = 0; k < tokens.length; k++) {
      const tk = tokens[k];
      if (tk.t === 'num') { out.push(tk); }
      else if (tk.t === 'name') {
        if (tokens[k + 1] && tokens[k + 1].t === '(') ops.push({ t: 'fn', v: tk.v, argc: 1 });
        else out.push(tk);
      }
      else if (tk.t === ',') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Dấu phẩy đặt sai chỗ');
        for (let m = ops.length - 2; m >= 0; m--) {
          if (ops[m].t === 'fn') { ops[m].argc++; break; }
          if (ops[m].t === '(') break;
        }
      }
      else if (tk.t === '(') { ops.push(tk); }
      else if (tk.t === ')') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Thiếu dấu mở ngoặc');
        ops.pop();
        if (ops.length && ops[ops.length - 1].t === 'fn') out.push(ops.pop());
      }
      else {
        let op = tk.t;
        const unary = (op === '-' || op === '+') &&
          (prev === null || prev.t === '(' || prev.t === ',' ||
            '+-*/^'.indexOf(prev.t) >= 0);
        if (unary) {
          // dấu đứng trước toán hạng: không đẩy toán tử nào ra, chỉ xếp vào chồng
          if (op === '+') { prev = tk; continue; }
          ops.push({ t: 'u-' }); prev = tk; continue;
        }
        while (ops.length) {
          const top = ops[ops.length - 1];
          const topOp = top.t === 'fn' ? null : top.t;
          if (topOp && topOp !== '(' &&
            (prec[topOp] > prec[op] || (prec[topOp] === prec[op] && !right[op]))) {
            out.push(ops.pop());
          } else break;
        }
        ops.push({ t: op });
      }
      prev = tk;
    }
    while (ops.length) {
      const top = ops.pop();
      if (top.t === '(') throw new Error('Thiếu dấu đóng ngoặc');
      out.push(top);
    }
    return out;
  }

  /**
   * Biên dịch một biểu thức thành hàm.
   * @param {string} src  ví dụ 'x^2 + 3*x'
   * @param {string[]} vars  tên các biến được phép, ví dụ ['x'] hoặc ['x','y']
   * @returns {function(Object): number}
   */
  VLab.compile = function (src, vars) {
    vars = vars || ['x'];
    const rpn = toRPN(tokenize(String(src)));
    // Kiểm tra ngay lúc biên dịch: tên lạ, và biểu thức thiếu/thừa toán hạng
    let depth = 0;
    for (const tk of rpn) {
      if (tk.t === 'name' && vars.indexOf(tk.v) < 0 && !(tk.v in CONSTS))
        throw new Error('Không hiểu "' + tk.v + '"');
      if (tk.t === 'fn' && !(tk.v in FUNCS))
        throw new Error('Không có hàm "' + tk.v + '"');
      if (tk.t === 'num' || tk.t === 'name') depth += 1;
      else if (tk.t === 'u-') depth += 0;
      else if (tk.t === 'fn') depth += 1 - tk.argc;
      else depth -= 1;
      if (depth < 1) throw new Error('Biểu thức thiếu toán hạng');
    }
    if (depth !== 1) throw new Error('Biểu thức chưa hoàn chỉnh');
    return function (scope) {
      const st = [];
      for (const tk of rpn) {
        if (tk.t === 'num') st.push(tk.v);
        else if (tk.t === 'name') st.push(tk.v in CONSTS ? CONSTS[tk.v] : (scope[tk.v] || 0));
        else if (tk.t === 'u-') st.push(-st.pop());
        else if (tk.t === 'fn') {
          const args = st.splice(st.length - tk.argc, tk.argc);
          st.push(FUNCS[tk.v].apply(null, args));
        } else {
          const b = st.pop(), a = st.pop();
          st.push(tk.t === '+' ? a + b : tk.t === '-' ? a - b :
            tk.t === '*' ? a * b : tk.t === '/' ? a / b : Math.pow(a, b));
        }
      }
      return st.pop();
    };
  };

  /** Đạo hàm số (dùng khi không có công thức đạo hàm) */
  VLab.deriv = function (f, scope, varName, h) {
    h = h || 1e-5;
    const s1 = Object.assign({}, scope), s2 = Object.assign({}, scope);
    s1[varName] = scope[varName] + h;
    s2[varName] = scope[varName] - h;
    return (f(s1) - f(s2)) / (2 * h);
  };

  /* ==========================================================================
     4. KHUNG NHÌN 2D — zoom bằng con lăn, kéo để di chuyển
     ========================================================================== */
  function makeView2D(canvas, opts, onChange) {
    opts = opts || {};
    const home = {
      cx: opts.cx || 0,                  // toạ độ thế giới ở giữa khung
      cy: opts.cy || 0,
      scale: opts.scale || 40            // số pixel cho 1 đơn vị thế giới
    };
    const v = { cx: home.cx, cy: home.cy, scale: home.scale };

    function toScreen(x, y) {
      return [canvas.clientWidth / 2 + (x - v.cx) * v.scale,
              canvas.clientHeight / 2 - (y - v.cy) * v.scale];
    }
    function toWorld(px, py) {
      return [(px - canvas.clientWidth / 2) / v.scale + v.cx,
              -(py - canvas.clientHeight / 2) / v.scale + v.cy];
    }

    // Bài có thể gán v.onPointerDown / onPointerMove / onPointerUp để tự xử lý
    // (ví dụ kéo một nút của đồ thị). onPointerDown trả về true thì khung nhìn
    // không kéo theo. Toạ độ truyền vào là pixel trong canvas.
    let drag = null, grabbed = false;
    function local(e) {
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }
    canvas.addEventListener('pointerdown', function (e) {
      canvas.setPointerCapture(e.pointerId);
      if (v.onPointerDown) {
        const p = local(e);
        if (v.onPointerDown(p[0], p[1], e)) { grabbed = true; return; }
      }
      drag = { x: e.clientX, y: e.clientY, cx: v.cx, cy: v.cy };
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (grabbed) {
        if (v.onPointerMove) { const p = local(e); v.onPointerMove(p[0], p[1], e); }
        return;
      }
      if (!drag) return;
      v.cx = drag.cx - (e.clientX - drag.x) / v.scale;
      v.cy = drag.cy + (e.clientY - drag.y) / v.scale;
      onChange();
    });
    function endDrag() {
      if (grabbed && v.onPointerUp) v.onPointerUp();
      grabbed = false;
      drag = null;
      canvas.classList.remove('dragging');
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const [wx, wy] = toWorld(e.clientX - r.left, e.clientY - r.top);
      const k = Math.exp(-e.deltaY * 0.0015);
      v.scale = Math.max(2, Math.min(4000, v.scale * k));
      // giữ nguyên điểm dưới con trỏ
      const [nx, ny] = toWorld(e.clientX - r.left, e.clientY - r.top);
      v.cx += wx - nx; v.cy += wy - ny;
      onChange();
    }, { passive: false });

    // pinch 2 ngón trên cảm ứng
    let pinch = null;
    canvas.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2) { pinch = null; return; }
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) { v.scale = Math.max(2, Math.min(4000, v.scale * d / pinch)); onChange(); }
      pinch = d;
    }, { passive: false });
    canvas.addEventListener('touchend', function () { pinch = null; });

    v.toScreen = toScreen;
    v.toWorld = toWorld;
    v.reset = function () { v.cx = home.cx; v.cy = home.cy; v.scale = home.scale; onChange(); };
    v.setHome = function (o) { Object.assign(home, o); v.reset(); };

    /** Vẽ lưới + trục. Gọi đầu tiên trong hàm vẽ của bài. */
    v.drawGrid = function (ctx) {
      const W = canvas.clientWidth, H = canvas.clientHeight;
      const cs = getComputedStyle(document.documentElement);
      const grid = cs.getPropertyValue('--vl-grid').trim();
      const axis = cs.getPropertyValue('--vl-axis').trim();
      // bước lưới "đẹp": 1, 2, 5, 10...
      let step = Math.pow(10, Math.floor(Math.log10(80 / v.scale)));
      const n = 80 / (step * v.scale);
      if (n > 5) step *= 5; else if (n > 2) step *= 2;
      const [x0, y1] = toWorld(0, 0), [x1, y0] = toWorld(W, H);
      ctx.lineWidth = 1;
      ctx.strokeStyle = grid;
      ctx.beginPath();
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
        const px = Math.round(toScreen(x, 0)[0]) + 0.5;
        ctx.moveTo(px, 0); ctx.lineTo(px, H);
      }
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
        const py = Math.round(toScreen(0, y)[1]) + 0.5;
        ctx.moveTo(0, py); ctx.lineTo(W, py);
      }
      ctx.stroke();
      // trục
      ctx.strokeStyle = axis; ctx.lineWidth = 1.5;
      ctx.beginPath();
      const oy = Math.round(toScreen(0, 0)[1]) + 0.5;
      const ox = Math.round(toScreen(0, 0)[0]) + 0.5;
      ctx.moveTo(0, oy); ctx.lineTo(W, oy);
      ctx.moveTo(ox, 0); ctx.lineTo(ox, H);
      ctx.stroke();
      // nhãn số
      ctx.fillStyle = axis;
      ctx.font = '11px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const lbl = (t) => Math.abs(t) < 1e-9 ? '0' :
        (Math.abs(t) < 1e-4 || Math.abs(t) >= 1e5 ? t.toExponential(1) :
          parseFloat(t.toPrecision(4)).toString());
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
        if (Math.abs(x) < step / 2) continue;
        ctx.fillText(lbl(x), toScreen(x, 0)[0], Math.min(H - 14, Math.max(2, oy + 3)));
      }
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
        if (Math.abs(y) < step / 2) continue;
        ctx.fillText(lbl(y), Math.max(24, Math.min(W - 2, ox - 5)), toScreen(0, y)[1]);
      }
    };
    return v;
  }

  /* ==========================================================================
     5. TẠO ỨNG DỤNG
     ========================================================================== */
  /**
   * @param {Object} cfg
   *   title    {string}  tiêu đề trang
   *   why      {string}  nội dung ô "Vì sao?" (HTML đơn giản)
   *   stage    {'2d'|'none'}  '2d' tạo sẵn canvas + zoom/pan; 'none' để bài tự dựng (3D)
   *   view     {Object}  {cx, cy, scale} khung nhìn ban đầu (chỉ với stage '2d')
   *   height   {number}  chiều cao sân khấu, mặc định 460
   *   func     {Object}  {label, value, vars} hiện ô nhập công thức
   *   params   {Array}   [{id, label, min, max, step, value, fixed}]
   *   player   {boolean} hiện bộ Chạy/Bước/Làm lại
   *   code     {string[]} các dòng mã giả tiếng Việt
   *   onDraw   {function(ctx, app)}  vẽ lại (chỉ với stage '2d')
   *   onStep   {function(app): boolean}  chạy một bước; trả về false khi kết thúc
   *   onReset  {function(app)}  đặt lại trạng thái bài
   *   onParam  {function(id, value, app)}  khi một tham số đổi
   */
  VLab.apps = [];
  /** Nhúng CSS chung (shell.js gọi sẵn, để tab không dùng VLab.create vẫn đúng giao diện) */
  VLab.injectCSS = injectCSS;
  /** Chủ đề: MẶC ĐỊNH SÁNG. Chỉ tối khi người dùng bấm nút. */
  VLab.getTheme = function () {
    return document.documentElement.getAttribute('data-vl-theme') === 'dark' ? 'dark' : 'light';
  };
  VLab.setTheme = function (t) {
    document.documentElement.setAttribute('data-vl-theme', t === 'dark' ? 'dark' : 'light');
    try { localStorage.setItem('vl-theme', t); } catch (e) {}
    VLab.redrawAll();
  };
  VLab.setPalette = function (name) {
    if (PALETTES[name]) { paletteName = name; VLab.redrawAll(); }
  };
  VLab.redrawAll = function () {
    VLab.apps.forEach(function (a) { a.redraw(); });
    global.dispatchEvent(new Event('vl-redraw'));
  };
  (function () {
    let t = 'light';
    try { t = localStorage.getItem('vl-theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-vl-theme', t === 'dark' ? 'dark' : 'light');
  })();

  VLab.create = function (cfg) {
    injectCSS();
    cfg = cfg || {};
    const app = {};
    const root = document.createElement('div');
    root.className = 'vl-app' + (cfg.compact ? ' vl-compact' : '');
    (cfg.mount || document.body).appendChild(root);
    app.root = root;
    VLab.apps.push(app);

    /* --- đầu trang --- */
    const head = document.createElement('div');
    head.className = 'vl-head';
    head.innerHTML =
      '<h1 class="vl-title"></h1><div class="vl-head-tools">' +
      '<select class="vl-pal" title="Bảng màu"></select>' +
      '<button class="vl-btn vl-theme">Sáng/Tối</button>' +
      '<button class="vl-btn vl-home">Đặt lại khung nhìn</button></div>';
    head.querySelector('.vl-title').textContent = cfg.title || 'Mô phỏng';
    if (cfg.compact) head.querySelector('.vl-head-tools').style.display = 'none';
    if (cfg.compact && !cfg.title) head.style.display = 'none';
    root.appendChild(head);

    const palSel = head.querySelector('.vl-pal');
    Object.keys(PALETTES).forEach(function (n) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n; palSel.appendChild(o);
    });
    palSel.value = paletteName;
    palSel.addEventListener('change', function () {
      paletteName = palSel.value; app.redraw();
    });
    head.querySelector('.vl-theme').addEventListener('click', function () {
      VLab.setTheme(VLab.getTheme() === 'dark' ? 'light' : 'dark');
    });

    /* --- bố cục chính --- */
    const main = document.createElement('div');
    main.className = 'vl-main';
    root.appendChild(main);

    const stageWrap = document.createElement('div');
    stageWrap.className = 'vl-stage-wrap';
    main.appendChild(stageWrap);

    const side = document.createElement('div');
    side.className = 'vl-side';
    main.appendChild(side);
    app.side = side; app.main = main;
    /** Thêm một thẻ điều khiển riêng của tab vào cột bên phải. Trả về <div> nội dung. */
    app.addCard = function (title, content) {
      const c = document.createElement('div'); c.className = 'vl-card';
      const h = document.createElement('h3'); h.textContent = title; c.appendChild(h);
      const b = document.createElement('div'); c.appendChild(b);
      if (typeof content === 'string') b.innerHTML = content; else if (content) b.appendChild(content);
      side.insertBefore(c, side.firstChild);
      return b;
    };

    /* --- sân khấu --- */
    const stageMode = cfg.stage || '2d';
    const stageH = cfg.height || 460;
    let canvas = null, ctx = null;
    app.stageEl = stageWrap;

    if (stageMode === '2d') {
      canvas = document.createElement('canvas');
      canvas.className = 'vl-stage';
      canvas.style.height = 'clamp(280px, 62vh, ' + stageH + 'px)';
      stageWrap.appendChild(canvas);
      ctx = canvas.getContext('2d');
      app.canvas = canvas; app.ctx = ctx;
    } else {
      const host = document.createElement('div');
      host.className = 'vl-stage';
      host.style.height = 'clamp(280px, 62vh, ' + stageH + 'px)';
      stageWrap.appendChild(host);
      app.host = host;
    }

    const statusEl = document.createElement('div');
    statusEl.className = 'vl-status';
    statusEl.innerHTML = '<span class="vl-muted">Sẵn sàng.</span>';
    stageWrap.appendChild(statusEl);

    /* --- khung nhìn --- */
    if (stageMode === '2d') {
      app.view = makeView2D(canvas, cfg.view, function () { app.redraw(); });
    }
    head.querySelector('.vl-home').addEventListener('click', function () {
      if (app.view) app.view.reset();
      else if (app.onHome) app.onHome();
    });

    /* --- ô nhập công thức --- */
    app.f = null;
    if (cfg.func) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Công thức</h3>' +
        '<div class="vl-lab"><span></span></div>' +
        '<input type="text" class="vl-fn">' +
        '<div class="vl-err"></div>' +
        '<div class="vl-hint">Dùng được: + - * / ^ ( ) và sin, cos, exp, ln, sqrt, abs, tanh, relu, sigmoid, pi, e</div>';
      card.querySelector('.vl-lab span').textContent =
        cfg.func.label || ('Hàm theo ' + (cfg.func.vars || ['x']).join(', '));
      const inp = card.querySelector('.vl-fn');
      const err = card.querySelector('.vl-err');
      inp.value = cfg.func.value || 'x^2';
      function recompile() {
        try {
          app.f = VLab.compile(inp.value, cfg.func.vars || ['x']);
          app.fSource = inp.value;
          err.textContent = '';
          if (cfg.onReset) cfg.onReset(app);
          app.redraw();
        } catch (e) {
          err.textContent = 'Lỗi: ' + e.message;
        }
      }
      inp.addEventListener('change', recompile);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') recompile(); });
      side.appendChild(card);
      try {
        app.f = VLab.compile(inp.value, cfg.func.vars || ['x']);
        app.fSource = inp.value;
      } catch (e) { err.textContent = 'Lỗi: ' + e.message; }
    }

    /* --- thanh trượt tham số --- */
    const paramVals = {};
    if (cfg.params && cfg.params.length) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Tham số</h3>';
      cfg.params.forEach(function (p) {
        paramVals[p.id] = p.value;
        const row = document.createElement('div');
        row.className = 'vl-row';
        row.innerHTML = '<div class="vl-lab"><span></span><span class="vl-val"></span></div>' +
          '<input type="range">';
        row.querySelector('.vl-lab span').textContent = p.label;
        const val = row.querySelector('.vl-val');
        const r = row.querySelector('input');
        r.min = p.min; r.max = p.max; r.step = p.step; r.value = p.value;
        const fmt = function (v) {
          return p.fixed != null ? Number(v).toFixed(p.fixed) : String(v);
        };
        val.textContent = fmt(p.value);
        r.addEventListener('input', function () {
          paramVals[p.id] = parseFloat(r.value);
          val.textContent = fmt(r.value);
          if (cfg.onParam) cfg.onParam(p.id, paramVals[p.id], app);
          app.redraw();
        });
        card.appendChild(row);
      });
      side.appendChild(card);
    }
    app.param = function (id) { return paramVals[id]; };
    app.params = paramVals;

    /* --- bộ chạy --- */
    app.running = false;
    app.stepCount = 0;
    if (cfg.player) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Chạy mô phỏng</h3>' +
        '<div class="vl-btns"><button class="vl-btn primary vl-play">▶ Chạy</button>' +
        '<button class="vl-btn vl-step">Bước tiếp</button>' +
        '<button class="vl-btn vl-again">Làm lại</button></div>' +
        '<div class="vl-row" style="margin-top:12px">' +
        '<div class="vl-lab"><span>Tốc độ (bước/giây)</span><span class="vl-spd">8</span></div>' +
        '<input type="range" class="vl-speed" min="0.1" max="60" step="0.1" value="8"></div>';
      side.appendChild(card);
      const btnPlay = card.querySelector('.vl-play');
      const spdEl = card.querySelector('.vl-spd');
      const spdIn = card.querySelector('.vl-speed');
      spdIn.addEventListener('input', function () { spdEl.textContent = spdIn.value; });

      let timer = null;
      function oneStep() {
        const alive = cfg.onStep ? cfg.onStep(app) : false;
        app.stepCount++;
        app.redraw();
        if (alive === false) app.pause();
      }
      app.play = function () {
        if (app.running) return;
        app.running = true;
        btnPlay.textContent = '❚❚ Tạm dừng';
        const tick = function () {
          if (!app.running) return;
          oneStep();
          timer = setTimeout(tick, 1000 / parseFloat(spdIn.value));
        };
        tick();
      };
      app.pause = function () {
        app.running = false;
        btnPlay.textContent = '▶ Chạy';
        if (timer) { clearTimeout(timer); timer = null; }
      };
      btnPlay.addEventListener('click', function () {
        app.running ? app.pause() : app.play();
      });
      card.querySelector('.vl-step').addEventListener('click', function () {
        app.pause(); oneStep();
      });
      card.querySelector('.vl-again').addEventListener('click', function () {
        app.pause();
        app.stepCount = 0;
        if (cfg.onReset) cfg.onReset(app);
        app.highlight(-1);
        app.redraw();
      });
    }

    /* --- mã giả --- */
    let codeLines = [];
    if (cfg.code && cfg.code.length) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Thuật toán</h3><div class="vl-code"></div>';
      const box = card.querySelector('.vl-code');
      cfg.code.forEach(function (line) {
        const d = document.createElement('div');
        d.textContent = line;
        box.appendChild(d);
        codeLines.push(d);
      });
      side.appendChild(card);
    }
    /** Tô sáng dòng mã giả đang chạy (-1 để bỏ tô sáng) */
    app.highlight = function (i) {
      codeLines.forEach(function (d, k) { d.classList.toggle('on', k === i); });
    };

    /* --- ô "Vì sao?" --- */
    if (cfg.why) {
      const card = document.createElement('div');
      card.className = 'vl-card';
      card.innerHTML = '<h3>Vì sao?</h3><div class="vl-why"></div>';
      card.querySelector('.vl-why').innerHTML = cfg.why;
      side.appendChild(card);
    }

    /* --- API phụ --- */
    /** Cập nhật ô "Đang xảy ra gì?" dưới sân khấu */
    app.status = function (html) { statusEl.innerHTML = html; };
    /** Lấy màu thứ i của bảng màu đang chọn */
    app.color = function (i) {
      const p = PALETTES[paletteName];
      return p[((i % p.length) + p.length) % p.length];
    };
    /** Lấy giá trị một biến CSS của chủ đề, ví dụ app.css('--vl-fg') */
    app.css = function (name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    };

    /* --- vòng vẽ --- */
    let pending = false;
    app.redraw = function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        pending = false;
        if (stageMode === '2d') {
          const dpr = global.devicePixelRatio || 1;
          const w = canvas.clientWidth, h = canvas.clientHeight;
          if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
          }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          if (cfg.onDraw) cfg.onDraw(ctx, app);
        } else if (cfg.onDraw) {
          cfg.onDraw(null, app);
        }
      });
    };

    global.addEventListener('resize', function () { app.redraw(); });

    if (cfg.onReset) cfg.onReset(app);
    app.redraw();
    /* trang một khung (không có VLabShell): vẫn có Space = Chạy/Dừng toàn trang nếu đã ghép player.js */
    if (cfg.player && !cfg.mount && global.VLabPlayer && !global.VLabShell) {
      const ctl = VLabPlayer.attach({ app: function () { return app; } });
      const p0 = app.play, p1 = app.pause;
      app.play = function () { p0(); ctl.sync(); }; app.pause = function () { p1(); ctl.sync(); };
    }
    return app;
  };

  /* ==========================================================================
     6. TIỆN ÍCH VẼ (canvas 2D)
     ========================================================================== */
  /** Vẽ đường cong y = f(x) trong toạ độ thế giới */
  VLab.plotFunction = function (ctx, view, f, color, width) {
    const W = ctx.canvas.clientWidth;
    ctx.strokeStyle = color; ctx.lineWidth = width || 2;
    ctx.beginPath();
    let started = false;
    for (let px = 0; px <= W; px++) {
      const x = view.toWorld(px, 0)[0];
      const y = f(x);
      if (!isFinite(y)) { started = false; continue; }
      const [sx, sy] = view.toScreen(x, y);
      if (sy < -1e4 || sy > 1e4) { started = false; continue; }
      if (started) ctx.lineTo(sx, sy); else { ctx.moveTo(sx, sy); started = true; }
    }
    ctx.stroke();
  };

  /** Vẽ một chấm tròn tại toạ độ thế giới */
  VLab.dot = function (ctx, view, x, y, color, r) {
    const [sx, sy] = view.toScreen(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx, sy, r || 5, 0, Math.PI * 2);
    ctx.fill();
  };

  /** Vẽ mũi tên từ (x1,y1) đến (x2,y2) trong toạ độ thế giới */
  VLab.arrow = function (ctx, view, x1, y1, x2, y2, color, width) {
    const [a, b] = view.toScreen(x1, y1);
    const [c, d] = view.toScreen(x2, y2);
    const ang = Math.atan2(d - b, c - a);
    const len = 9;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width || 2;
    ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(c, d);
    ctx.lineTo(c - len * Math.cos(ang - 0.4), d - len * Math.sin(ang - 0.4));
    ctx.lineTo(c - len * Math.cos(ang + 0.4), d - len * Math.sin(ang + 0.4));
    ctx.closePath(); ctx.fill();
  };

  /** Viết chữ tại toạ độ màn hình */
  VLab.label = function (ctx, px, py, text, color, align) {
    ctx.fillStyle = color;
    ctx.font = '12px system-ui,sans-serif';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 4;                 // viền nền quanh chữ: không bị đường/lưới đè lên
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--vl-panel').trim() || '#fff';
    ctx.strokeText(text, px, py);
    ctx.fillText(text, px, py);
  };

  VLab.palettes = PALETTES;
  global.VLab = VLab;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================================
   VLabPlayer — phím tắt toàn trang, nút Back/Chạy/Next nổi, tốc độ và hoạt họa dùng chung
   ----------------------------------------------------------------------------
   Dán TRƯỚC core/shell.js (bundle.mjs tự làm). code-flow cũng dùng file này.

   Quy ước "stepper" của một tab (đối tượng tab trả về):
     { next(), back(), canNext(), canBack(), reset?() }
     - next() CÓ THỂ trả về Promise: đó là hoạt họa chạy từ trạng thái cũ sang trạng thái mới
       (gói tin chạy dọc dây, mũi tên vẽ dần…). Player đợi xong mới cho bước tiếp theo.
     - back() làm NGAY, không hoạt họa.
     - reset() (tuỳ chọn): về bước đầu; Space ở bước cuối sẽ tự gọi rồi chạy lại từ đầu.

   Phím (chạy ở BẤT KỲ đâu trên trang, không cần bấm vào ô nào):
     →  Next (có hoạt họa)         ←  Back (ngay lập tức)
     Space  Chạy tự động / Dừng    Shift+← →  đổi tab
   Chỉ bỏ qua khi đang gõ chữ trong ô nhập văn bản / textarea / contenteditable
   (để vẫn gõ được dấu cách và di chuyển con trỏ). Ô chọn (select), thanh trượt, nút bấm KHÔNG chặn phím.

   Tốc độ: VLabPlayer.speed (0.1–3), lưu localStorage. Đang hoạt họa mà bấm → lần nữa = tua nhanh tới cuối bước đó
   (cần ở tốc độ chậm).  Mọi hoạt họa phải dùng
     VLabPlayer.tween(ms, k => …)  hoặc  VLabPlayer.wait(ms)   để tuân theo tốc độ.
   VLabPlayer.fast = true → bỏ hoạt họa (dùng khi kiểm thử).
   ========================================================================== */
(function (global) {
  'use strict';
  const CSS = `
  .pl-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;
    gap:8px;padding:0 14px 14px;pointer-events:none;}
  .pl-bar>*{pointer-events:auto;}
  .pl-back{justify-self:start;grid-column:1;} .pl-mid{grid-column:2;} .pl-next{justify-self:end;grid-column:3;}
  .pl-btn{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:10px 18px;border-radius:999px;cursor:pointer;
    border:1px solid var(--vl-accent);background:var(--vl-accent);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .pl-btn.ghost{background:var(--vl-bg);color:var(--vl-accent);}
  .pl-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pl-btn[hidden],.pl-mid[hidden]{display:none;}
  .pl-mid{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .pl-grp{display:flex;gap:6px;align-items:center;background:var(--vl-bg);border:1px solid var(--vl-line);border-radius:999px;
    padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .pl-grp .pl-btn{box-shadow:none;min-height:38px;padding:7px 14px;}
  .pl-spd{font:inherit;font-size:13px;min-height:38px;border:1px solid var(--vl-line);border-radius:999px;padding:0 8px;
    background:var(--vl-bg);color:var(--vl-fg);cursor:pointer;width:auto;}
  .pl-hint{font-size:12px;color:var(--vl-muted);background:var(--vl-bg);border:1px solid var(--vl-line);border-radius:999px;padding:2px 10px;}
  @media (max-width:700px){.pl-hint{display:none;}.pl-btn{padding:10px 14px;}}
  `;
  const ease = function (k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
  let speed = 1, gen = 0;                 // gen tăng → các tween đang chạy kết thúc ngay
  const LEVELS = [.1, .25, .5, .75, 1, 1.5, 2, 3];
  try { const v = parseFloat(localStorage.getItem('vl-speed')); if (v >= .1 && v <= 4) speed = v; } catch (e) {}

  const P = {
    fast: false,
    get speed() { return speed; },
    setSpeed: function (v) {
      speed = Math.max(.1, Math.min(4, +v || 1));
      try { localStorage.setItem('vl-speed', String(speed)); } catch (e) {}
      if (global.Flow) global.Flow.speed = speed;
    },
    ms: function (ms) { return ms / speed; },
    /** Tua: mọi hoạt họa đang chạy nhảy ngay tới cuối. */
    finish: function () { gen++; },
    wait: function (ms) { return P.fast ? Promise.resolve() : new Promise(function (r) { setTimeout(r, ms / speed); }); },
    /** Chạy fn(k) với k: 0→1 trong ms (đã chia tốc độ), có làm mượt đầu/cuối. Trả Promise. */
    tween: function (ms, fn, noEase) {
      if (P.fast) { fn(1); return Promise.resolve(); }
      return new Promise(function (res) {
        const t0 = performance.now(), D = ms / speed, g0 = gen;
        (function tick(t) {
          const k = gen !== g0 ? 1 : Math.min(1, (t - t0) / D);
          fn(noEase ? k : ease(k));
          if (k < 1) requestAnimationFrame(tick); else res();

      });
    },
    ease: ease,
    /** Hiện dần một phần tử DOM mới (mờ → rõ, trượt nhẹ lên). Trả Promise. */
    enter: function (el, ms) {
      if (!el) return Promise.resolve();
      el.style.opacity = 0; el.style.transform = 'translateY(10px)';
      return P.tween(ms || 450, function (k) { el.style.opacity = k; el.style.transform = 'translateY(' + (10 * (1 - k)) + 'px)'; })
        .then(function () { el.style.opacity = ''; el.style.transform = ''; });
    },

    /** cfg: { stepper(): obj|null, app(): app|null, moveTab(dir) } → { sync, stop, playing } */
    attach: function (cfg) {
      if (!document.getElementById('pl-css')) {
        const s = document.createElement('style'); s.id = 'pl-css'; s.textContent = CSS; document.head.appendChild(s);
      }
      const bar = document.createElement('div'); bar.className = 'pl-bar';
      bar.innerHTML = '<button class="pl-btn ghost pl-back" hidden>← Back</button>' +
        '<div class="pl-mid" hidden><div class="pl-hint">← → lùi/tiến · Space chạy/dừng · Shift+← → đổi tab</div>' +
        '<div class="pl-grp"><button class="pl-btn pl-play" title="Space">▶ Chạy</button>' +

      const pts = route(N[e.f], N[e.t], e.via, { p0: e.p0, p1: e.p1 });
      o += edgeSVG({ pts, id: e.id, s: e.s || Math.max(S[e.f], S[e.t]), end: 'open', label: e.label, lp: e.lp, lcls: 'b', lab: LB[e.f] + ' → ' + LB[e.t] });
    });
    d.nodes.forEach(n => {
      let inner = '';
      if (n.type === 'start') inner = `<circle class="fillc" cx="${n.x}" cy="${n.y}" r="9"/>`;
      else if (n.type === 'end') inner = `<circle class="sh" cx="${n.x}" cy="${n.y}" r="12"/><circle class="fillc" cx="${n.x}" cy="${n.y}" r="7"/>`;
      else if (n.type === 'dec') inner = `<path class="sh" d="M${n.x},${n.y - n.h / 2} L${n.x + n.w / 2},${n.y} L${n.x},${n.y + n.h / 2} L${n.x - n.w / 2},${n.y} Z"/>`;
      else if (n.type === 'bar') inner = `<rect class="fillc" x="${n.x - n.w / 2}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="2"/>`;
      else inner = `<rect class="sh" x="${n.x - n.w / 2}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="15"/>` + txt(n.x, n.y, n.label, { mid: true });

  };

  /* ===== 3. SEQUENCE (có combined fragment: alt, opt, loop, par, break) ===== */
  R.seq = function (d) {
    const W0 = 900, n = d.parts.length, P = {};
    const left = d.left || 80, right = W0 - (d.right || 80);
    d.parts.forEach((p, i) => { p.x = n > 1 ? left + (right - left) * i / (n - 1) : W0 / 2; P[p.id] = p; p.hw = p.kind === 'actor' ? 0 : Math.max(96, Math.min(146, String(p.label).length * 7.4 + 22)); });
    const msgs = d.msgs, IX = {};
    msgs.forEach((m, i) => { IX[m.id] = i; });
    const SYM = '①②③④⑤⑥';
    const sym = j => SYM.charAt(j);

    /* --- 1. Đọc combined fragment, tìm quan hệ lồng nhau --- */
    const frs = (d.frags || []).map((f, fi) => {
      const ops = f.ops.map(o => ({ g: o.g || '', from: o.from, to: o.to, a: IX[o.from], b: IX[o.to] }));
      ops.forEach((o, j) => {
        if (o.a == null || o.b == null || o.a > o.b) throw new Error('Fragment ' + f.id + ': khoảng thông điệp sai');
        if (j && o.a !== ops[j - 1].b + 1) throw new Error('Fragment ' + f.id + ': các operand phải nối liền nhau');
      });
      return Object.assign({}, f, { fi, ops, a: ops[0].a, b: ops[ops.length - 1].b, s: f.s || 6, kids: [] });
    });
    const fo = frs.slice().sort((x, y) => x.a - y.a || y.b - x.b || x.fi - y.fi);   // ngoài → trong
    const stk = [];
    fo.forEach(f => {
      while (stk.length && stk[stk.length - 1].b < f.a) stk.pop();
      const t = stk[stk.length - 1];
      if (t && t.b < f.b) throw new Error('Fragment ' + f.id + ' cắt ngang ' + t.id);
      f.parent = t || null; f.depth = stk.length; f.parentOp = -1;
      if (t) {
        f.parentOp = t.ops.findIndex(o => f.a >= o.a && f.a <= o.b);
        if (f.parentOp < 0 || f.b > t.ops[f.parentOp].b) throw new Error('Fragment ' + f.id + ' phải nằm trọn trong một operand của ' + t.id);
        t.kids.push(f);
      }
      stk.push(f);
    });
    for (let i = fo.length - 1; i >= 0; i--) { const f = fo[i]; f.h = 1 + Math.max(0, ...f.kids.map(k => k.h)); }

    /* --- 2. Xếp tung độ: chừa chỗ cho đỉnh khung, vạch ngăn operand và đáy khung --- */
    const top = 14; let y = d.y0 || 132; const Y = {};
    const startAt = {}, divAt = {}, endAt = {};
    const put = (M, k, v) => { (M[k] || (M[k] = [])).push(v); };
    fo.forEach(f => { put(startAt, f.a, f); put(endAt, f.b, f); });
    frs.forEach(f => f.ops.forEach((o, j) => { if (j) put(divAt, o.a, { f, j }); }));
    let lastBottom = -1e9;
    msgs.forEach((m, i) => {
      const items = [];
      (divAt[i] || []).slice().sort((p, q) => p.f.depth - q.f.depth).forEach(x => items.push({ t: 'div', x }));
      (startAt[i] || []).forEach(f => items.push({ t: 'st', f }));
      items.forEach((it, k) => {
        const prev = items[k - 1];
        const base = it.t === 'div' ? 44 : 52;                       // từ cuối mục tới vạch / đỉnh khung
        let h = it.t === 'div' ? 28 : (!prev ? 26 : prev.t === 'st' ? 24 : 38);
        if (k === 0) { const need = lastBottom + 8 - (y + h - base); if (need > 0) h += need; }   // không chồng đáy khung trước
        y += h;
        if (it.t === 'div') it.x.f.ops[it.x.j].divY = y - base; else it.f.y1 = y - base;
      });
      Y[m.id] = y;
      const step = m.kind === 'self' ? 58 : 42;
      y += step;
      const en = (endAt[i] || []).slice().sort((p, q) => q.depth - p.depth);   // trong ra ngoài
      if (en.length) {
        const baseB = m.kind === 'create' ? 38 : m.kind === 'self' ? 34 : m.kind === 'ret' ? 8 : m.guard ? 24 : 28;
        let b = Y[m.id] + baseB;
        en.forEach((f, k) => { if (k) b += 10; f.y2 = b; });
        lastBottom = b;
        y += Math.max(6, (b - Y[m.id]) + 24 - step);
      } else lastBottom = m.kind === 'create' ? Y[m.id] + 40 : -1e9;
    });
    const yEnd = y, H = yEnd + 24;

    /* --- 3. Toạ độ ngang của khung: bao các đối tượng tham gia + lề theo độ sâu lồng --- */
    const xr = (i0, i1) => {
      let lo = 1e9, hi = -1e9;
      for (let i = i0; i <= i1; i++) {
        const m = msgs[i], F = P[m.f], T = P[m.t];
        [F, T].forEach(p => { const w = p.kind === 'actor' ? 18 : 8; lo = Math.min(lo, p.x - w); hi = Math.max(hi, p.x + w); });
        if (m.kind === 'create') { lo = Math.min(lo, T.x - T.hw / 2 - 4); hi = Math.max(hi, T.x + T.hw / 2 + 4); }
        if (m.kind === 'self') hi = Math.max(hi, F.x + 52 + String(m.label).length * 6.6);
      }
      return [lo, hi];
    };
    frs.forEach(f => {
      const r = xr(f.a, f.b), pad = 14 + 8 * (f.h - 1);
      f.x1 = r[0] - pad; f.x2 = r[1] + pad;
      f.tw = Math.round(14 + 7.2 * f.op.length);
      let need = f.tw + 14 + f.ops[0].g.length * 6.4 + 100;
      f.ops.forEach((o, j) => { if (j) need = Math.max(need, 16 + o.g.length * 6.4 + 100); });
      need = Math.max(need, 130);
      if (f.x2 - f.x1 < need) f.x2 = f.x1 + need;
    });
    for (let i = fo.length - 1; i >= 0; i--) { const f = fo[i], p = f.parent; if (p) { p.x1 = Math.min(p.x1, f.x1 - 8); p.x2 = Math.max(p.x2, f.x2 + 8); } }
    const W = Math.max(W0, Math.ceil(Math.max(0, ...frs.map(f => f.x2)) + 6));

    const ls = p => p.created ? Y[p.created] + 18 : (p.kind === 'actor' ? top + 84 : (p.stereo ? top + 56 : top + 52));
    let o = '';

    /* --- 4. Vẽ khung: lớp nền + viền nằm dưới cùng, nhãn + guard + huy hiệu nằm trên cùng --- */
    let front = '';
    fo.forEach(f => {
      const w = f.x2 - f.x1, hh = f.y2 - f.y1, X = f1(f.x1), Yt = f1(f.y1);
      let b = `<rect class="frm" x="${X}" y="${Yt}" width="${f1(w)}" height="${f1(hh)}" rx="3"/>`;
      f.ops.forEach((q, j) => {
        const ya = j ? q.divY : f.y1, yb = j < f.ops.length - 1 ? f.ops[j + 1].divY : f.y2;
        b += `<rect class="opb" data-op="${j}" x="${X}" y="${f1(ya)}" width="${f1(w)}" height="${f1(yb - ya)}"/>`;
      });
      b += `<rect class="frb" x="${X}" y="${Yt}" width="${f1(w)}" height="${f1(hh)}" rx="3"/>`;
      f.ops.forEach((q, j) => { if (j) b += `<line class="frd" x1="${X}" y1="${f1(q.divY)}" x2="${f1(f.x2)}" y2="${f1(q.divY)}"/>`; });
      const lab = esc('khung ' + f.op + (f.title ? ' · ' + f.title : ''));
      o += `<g class="fr el" data-s="${f.s}" data-frag="${f.id}" data-l="${lab}">${b}</g>`;
      let t = `<path class="frt" d="M${X},${Yt} H${f1(f.x1 + f.tw)} V${f1(f.y1 + 11)} L${f1(f.x1 + f.tw - 7)},${f1(f.y1 + 18)} H${X} Z"/>` +
        txt(f.x1 + (f.tw - 3) / 2, f.y1 + 9, f.op, { cls: 'sm b', mid: true });
      f.ops.forEach((q, j) => {
        const ly = j ? q.divY + 13 : f.y1 + 9;
        if (q.g) t += txt(j ? f.x1 + 8 : f.x1 + f.tw + 8, ly, q.g, { cls: 'sm b hl', a: 'start', mid: true });
        t += `<text class="tx sm b hl opbd" data-op="${j}" x="${f1(f.x2 - 8)}" y="${f1(ly)}" text-anchor="end" dominant-baseline="central"></text>`;
      });
      front += `<g class="fr frf el" data-s="${f.s}" data-frag="${f.id}" data-l="${lab}">${t}</g>`;
    });

    /* --- 5. Đối tượng, lifeline, vùng hoạt động, thông điệp (giữ nguyên cách vẽ cũ) --- */
    d.parts.forEach(p => {
      let inner = '';
      if (p.kind === 'actor') inner = actorSVG(p.x, top + 34, p.label);
      else {
        const yy = p.created ? Y[p.created] - 18 : (p.stereo && !p.created ? top + 10 : top + 16), hh = p.created ? 36 : (p.stereo ? 46 : 36);
        inner = `<rect class="sh" x="${f1(p.x - p.hw / 2)}" y="${yy}" width="${p.hw}" height="${hh}" rx="3"/>`;
        if (p.stereo && !p.created) inner += txt(p.x, yy + 12, '«' + p.stereo + '»', { cls: 'sm mute', mid: true }) + txt(p.x, yy + 31, p.label, { cls: 'ul', mid: true });
        else inner += txt(p.x, yy + hh / 2, p.label, { cls: 'ul', mid: true });
      }
      const ps = p.s || 2;
      o += grp('nd', ps, p.id, L1(p.label), inner);
      const y2 = p.destroy ? Y[p.destroy] : yEnd - 6;
      let ll = `<line class="lln" x1="${f1(p.x)}" y1="${ls(p)}" x2="${f1(p.x)}" y2="${y2}"/>`;
      if (p.destroy) ll += `<path class="ln x" d="M${p.x - 8},${y2 - 8} L${p.x + 8},${y2 + 8} M${p.x + 8},${y2 - 8} L${p.x - 8},${y2 + 8}"/>`;
      o += grp('ll', ps, null, '', ll);
    });
    const bars = [];
    msgs.forEach(m => {
      if (m.kind === 'ret' || m.kind === 'destroy') return;
      const y1 = Y[m.id]; let y2;
      const r = msgs.find(q => q.kind === 'ret' && q.ref === m.id);
      if (m.end) y2 = Y[m.end]; else if (r) y2 = Y[r.id]; else y2 = y1 + (m.kind === 'self' ? 28 : 22);
      bars.push(m.kind === 'create' ? { p: m.t, y1: y1 + 18, y2: y1 + 36, s: m.s || 3 } : { p: m.t, y1: y1 - 3, y2: y2 + 4, s: m.s || 3 });
    });
    bars.forEach((b, i) => { let dp = 0; for (let j = 0; j < i; j++) { const c = bars[j]; if (c.p === b.p && c.y1 <= b.y1 + 4 && c.y2 >= b.y1 + 4) dp++; } b.dp = dp; });
    bars.forEach(b => {
      const x = P[b.p].x - 5 + b.dp * 6;
      o += grp('bar', b.s, b.p, '', `<rect class="actb" x="${f1(x)}" y="${f1(b.y1)}" width="10" height="${f1(b.y2 - b.y1)}"/>`);
    });
    const edges = {}, all = [];
    msgs.forEach(m => {
      const yy = Y[m.id], F = P[m.f], T = P[m.t], k = m.kind || 'sync';
      let pts, mx, lab = L1(m.label);
      if (k === 'self') {
        const x1 = F.x + 5;
        pts = [[x1, yy], [x1 + 38, yy], [x1 + 38, yy + 26], [x1 + 3, yy + 26]];
        o += edgeSVG({ pts, id: m.id, s: m.s || 3, end: 'filled', label: m.label, lx: x1 + 46, ly: yy + 13, la: 'start', lab });
      } else {
        const dir = Math.sign(T.x - F.x) || 1;
        const x1 = F.x + dir * 5, x2 = T.x - dir * (k === 'create' ? T.hw / 2 : 5);
        pts = [[x1, yy], [x2, yy]]; mx = (x1 + x2) / 2;
        o += edgeSVG({ pts, id: m.id, s: m.s || 3, end: (k === 'sync' || k === 'destroy') ? 'filled' : 'open', dash: k === 'ret' || k === 'create', label: m.label, lx: mx, ly: yy - 9, lcls: k === 'ret' ? 'it' : '', lab });
        if (m.guard) o += grp('gd', m.gs || 5, null, 'điều kiện ' + m.guard, txt(mx, yy + 14, m.guard, { cls: 'sm b gdt', mid: true }));
      }
      edges[m.id] = { from: m.f, to: m.t }; all.push([m.id]);
    });

    o += front;

    /* --- 6. Kịch bản chạy luồng: kiểm tra mã thông điệp có thật --- */
    const scen = d.scen || [{ n: 'Kịch bản chính', steps: all }];
    scen.forEach(sc => sc.steps.forEach(g => g.forEach(id => { if (!(id in IX)) throw new Error('Kịch bản "' + sc.n + '": không có thông điệp ' + id); })));

    /* --- 7. Hỗ trợ chạy luồng: tô khung nào chạy, khung nào bị bỏ qua --- */
    const lblOf = (f, j) => f.op + (f.ops.length > 1 ? sym(j) : '');
    function onFlow(sv, fired, done) {
      const cnt = {}; fired.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; });
      const last = fired.length ? IX[fired[fired.length - 1]] : -1;
      const ok = [], no = [];
      frs.forEach(f => {
        const gs = sv.querySelectorAll('.fr[data-frag="' + f.id + '"]'); if (!gs.length) return;
        const any = f.ops.some(q => cnt[q.from]), passed = done || last > f.b;
        gs.forEach(g => { g.classList.toggle('hit', any); g.classList.toggle('skip', !any && passed); });
        f.ops.forEach((q, j) => {
          const k = cnt[q.from] || 0;
          const s = k ? 'taken' : ((f.op === 'alt' && any) || passed) ? 'skip' : 'pend';
          const sel = '.fr[data-frag="' + f.id + '"] ';
          const bg = sv.querySelector(sel + '.opb[data-op="' + j + '"]'), bd = sv.querySelector(sel + '.opbd[data-op="' + j + '"]');
          bg.classList.toggle('taken', s === 'taken'); bg.classList.toggle('skip', s === 'skip');
          bd.classList.toggle('taken', s === 'taken'); bd.classList.toggle('skip', s === 'skip');
          bd.textContent = s === 'taken' ? (f.op === 'loop' ? '✓ ' + k + ' vòng' : '✓ chạy' + (k > 1 ? ' ×' + k : ''))
            : s === 'skip' ? (f.op === 'loop' ? '✗ 0 vòng' : f.op === 'alt' ? '✗ không chọn' : '✗ bỏ qua') : '';
          if (done) (s === 'taken' ? ok : no).push('<b>' + f.op + '</b> ' + esc(q.g || (f.title + (f.ops.length > 1 ? ' ' + sym(j) : ''))) + (f.op === 'loop' ? ' (×' + k + ')' : ''));
        });
      });
      let note = '';
      if (last >= 0) {
        const path = fo.filter(f => last >= f.a && last <= f.b).map(f => {
          const j = f.ops.findIndex(q => last >= q.a && last <= q.b), q = f.ops[j];
          return '<b>' + lblOf(f, j) + '</b>' + (q.g ? ' ' + esc(q.g) : '') + (f.op === 'loop' ? ' (vòng ' + (cnt[q.from] || 0) + ')' : '');
        });
        note = '<br>▸ ' + (path.length ? 'Đang trong: ' + path.join(' › ') : 'Đang ở ngoài mọi khung fragment');
      }
      if (done) note += '<br>✓ Đã chạy: ' + (ok.join(', ') || '—') + '<br>✗ Bỏ qua: ' + (no.join(', ') || '—');
      return note;
    }

      sv.querySelectorAll('.fr').forEach(g => g.classList.remove('hit', 'skip'));
      sv.querySelectorAll('.opb,.opbd').forEach(e => e.classList.remove('taken', 'skip'));
      sv.querySelectorAll('.opbd').forEach(e => { e.textContent = ''; });
    }

    /* --- 8. Dữ liệu cho các bảng mô tả --- */
    const fragPath = i => fo.filter(f => i >= f.a && i <= f.b).map(f => lblOf(f, f.ops.findIndex(q => i >= q.a && i <= q.b))).join(' › ');
    function cover(ids) {
      const cnt = {}; ids.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; });
      const res = {};
      fo.forEach(f => {
        const nn = f.ops.map(q => cnt[q.from] || 0);
        res[f.id] = { n: nn, reached: !f.parent || res[f.parent.id].n[f.parentOp] > 0 };
      });
      return res;
    }
    return { svg: o, w: W, h: H, maxH: 1250, edges, scen, onFlow, onFlowClear, frags: fo, fragPath, cover, sym, lbl: lblOf };
  };

  /* ===== 4. COLLABORATION ===== */
  R.col = function (d) {
    const N = {}, LB = {}; const OBJ = {};
    d.objs.forEach(ob => { OBJ[ob.id] = ob; ob.w = ob.w || (ob.actor ? 36 : 124); ob.h = ob.h || (ob.actor ? 58 : 38); N[ob.id] = box(ob.x, ob.actor ? ob.y - 2 : ob.y, ob.w, ob.h); LB[ob.id] = L1(ob.label); });
    let o = '';
    const LK = [];
    d.links.forEach(l => {
      const pts = route(N[l.f], N[l.t], l.via);
      LK.push({ f: l.f, t: l.t, pts });
      o += edgeSVG({ pts, s: l.s || 2, lab: 'liên kết ' + LB[l.f] + ' — ' + LB[l.t] });
    });
    d.objs.forEach(ob => {
      const inner = ob.actor ? actorSVG(ob.x, ob.y, ob.label)
        : `<rect class="sh" x="${ob.x - ob.w / 2}" y="${ob.y - ob.h / 2}" width="${ob.w}" height="${ob.h}" rx="3"/>` + txt(ob.x, ob.y, ob.label, { cls: 'ul', mid: true });
      o += grp('nd', ob.s || 1, ob.id, LB[ob.id], inner);
    });
    const key = (a, b) => [a, b].sort().join('|');
    const cnt = {}, idx = {};
    d.msgs.forEach(m => { const k = key(m.f, m.t); cnt[k] = (cnt[k] || 0) + 1; });
    const edges = {}, order = [];
    d.msgs.forEach(m => {
      const k = key(m.f, m.t); idx[k] = (idx[k] || 0);
      const i = idx[k]++, c = cnt[k];
      const lk = LK.find(l => (l.f === m.f && l.t === m.t) || (l.f === m.t && l.t === m.f));
      const A = lk.pts[0], B = lk.pts[lk.pts.length - 1];
      const L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1, ux = (B[0] - A[0]) / L, uy = (B[1] - A[1]) / L;
      const nx = -uy, ny = ux, off = (i - (c - 1) / 2) * 26;
      const fwd = lk.f === m.f;
      const P0 = [(fwd ? A[0] : B[0]) + nx * off, (fwd ? A[1] : B[1]) + ny * off];
      const P1 = [(fwd ? B[0] : A[0]) + nx * off, (fwd ? B[1] : A[1]) + ny * off];
      const M = [(P0[0] + P1[0]) / 2, (P0[1] + P1[1]) / 2];
      const len = Math.min(54, L * .4), vx = (P1[0] - P0[0]) / L, vy = (P1[1] - P0[1]) / L;
      const a1 = [M[0] - vx * len / 2, M[1] - vy * len / 2], a2 = [M[0] + vx * len / 2, M[1] + vy * len / 2];
      let side = off > .5 ? 1 : off < -.5 ? -1 : (ny > 0 ? -1 : 1);
      if (Math.abs(ny) < .3 && Math.abs(off) <= .5) side = 1;
      const lnx = nx * side, lny = ny * side;
      const an = lnx > .4 ? 'start' : lnx < -.4 ? 'end' : 'middle';
      const lx = M[0] + lnx * (an === 'middle' ? 0 : 18), ly = M[1] + lny * (an === 'middle' ? 16 : 0);
      const traceD = `M${pt(P0)} L${pt(P1)}`;
      o += edgeSVG({ pts: [a1, a2], id: m.id, s: m.s || 3, end: 'filled', label: m.label, lx, ly, la: an, traceD, lab: L1(m.label) });
      edges[m.id] = { from: m.f, to: m.t }; order.push([m.id]);
    });
    return { svg: o, w: 900, h: d.h, edges, scen: [{ n: 'Kịch bản chính', steps: order }] };
  };

  /* ===== 5. CLASS ===== */
  R.cls = function (d) {
    const N = {}, S = {}, LB = {};
    d.classes.forEach(c => {

function buildMap(panel) {
  panel.classList.add('lb');
  let cur = 0, shown = 1;
  panel.innerHTML = '<h2>Bản đồ môn: một câu yêu cầu đi qua những sơ đồ nào?</h2>' +
    '<div class="why">Các chương 3 đến 6 không phải bảy môn rời nhau. Chúng là <b>cùng một câu yêu cầu</b> được biến hình qua từng bước. Chọn một yêu cầu thật của đồ án, bấm <b>Next</b> (hoặc phím →) để xem nó trở thành gì ở mỗi bước. Có bước nó <b>biến mất</b>, và đó cũng là điều đáng biết.</div>' +
    '<div class="mapbar"></div><div class="req"></div><div class="stages"></div><div class="mapnote src"></div>' +
    '<h3 style="margin-top:22px">Môn yêu cầu nộp gì, và bảng nào đi kèm sơ đồ nào?</h3>' +
    '<div class="tblw">' + table(['Nội dung báo cáo (theo yêu cầu đồ án)', 'Sơ đồ / hình', 'Bảng đi kèm để đạt điểm', 'Tab trong lab'], [
      ['Mô hình Use Case, đặc tả use case', 'Use Case (mỗi chức năng một hình)', 'Danh sách tác nhân, danh sách use case, bảng đặc tả từng use case', '1 và 11'],
      ['Mô hình Sequence', 'Sequence', 'Bảng thông điệp (nguồn, đích, phương thức)', '3'],
      ['Thiết kế lớp đối tượng', 'Class', 'Danh sách lớp + mô tả từng lớp (thuộc tính, phương thức chính)', '5'],
      ['Thiết kế cơ sở dữ liệu', 'RDM (không dùng ERD)', 'Mô tả từng bảng: cột, kiểu, khóa chính, khóa ngoại, ràng buộc', '10'],
      ['Thiết kế giao diện', 'Hình từng màn hình', 'Danh sách thành phần + danh sách biến cố (+ bảng thiết kế xử lý)', '12'],
      ['(Bonus, không bắt buộc) hành vi theo trạng thái', 'State', 'Bảng chuyển trạng thái: sự kiện, điều kiện, hành động', '7']
    ]) + '</div><p class="src">Thứ tự làm của nhóm: BFD + kế hoạch, rồi (1) Use Case + đặc tả, (2) Sequence + Class, (3) RDM + giao diện, và chỉ bắt đầu code sau pha 1 và 2.</p>';
  const bar = panel.querySelector('.mapbar'), reqEl = panel.querySelector('.req'), box = panel.querySelector('.stages'), note = panel.querySelector('.mapnote');
  const cards = [];
  function build() {
    const J = JOURNEYS[cur]; box.innerHTML = ''; cards.length = 0;
    reqEl.innerHTML = '<div class="reqc"><b>Câu yêu cầu:</b> “' + esc(J.req) + '”</div>';
    J.st.forEach(function (s, i) {
      const c = h('div', 'stg' + (s.none ? ' none' : ''));
      c.innerHTML = '<div class="sh"><span class="n">' + (i + 1) + '</span><b>' + STAGES[i] + '</b><span class="chp">' + STAGE_CH[i] + '</span>' + (s.none ? '<span class="chp nn">không có, và đúng</span>' : '') + '</div><p>' + s.t + '</p>' + (s.q ? '<p class="curio">❓ ' + s.q + '</p>' : '');
      box.appendChild(c); cards.push(c);
    });
    shown = 1; apply();
  }
  function apply() {
    cards.forEach(function (c, i) { c.style.display = i < shown ? '' : 'none'; });
    note.innerHTML = 'Đã lần theo <b>' + shown + '/' + cards.length + '</b> bước. ' + (shown < cards.length ? 'Bấm Next để biết bước tiếp theo.' : 'Xong. Thử chọn yêu cầu khác để xem nó đi theo đường khác thế nào.');
    if (window.VLabShell && VLabShell.sync) VLabShell.sync();
  }
  chips(bar, JOURNEYS.map(function (j) { return j.name; }), 0, function (k) { cur = k; build(); });
  build();
  return { stepper: {
    next: async function () { if (shown >= cards.length) return; shown++; apply(); await VLabPlayer.enter(cards[shown - 1]); },
    back: function () { if (shown > 1) { shown--; apply(); } },
    reset: function () { shown = 1; apply(); },
    canNext: function () { return shown < cards.length; }, canBack: function () { return shown > 1; } } };
}

  { n: '7', name: 'Thuộc tính kiểu mảng', why: 'Một ô chỉ được chứa <b>một</b> giá trị. Thuộc tính là mảng (danh sách) thì mỗi phần tử thành <b>một dòng</b> trong bảng chi tiết.',
    body: arrowRow(cbox('ĐơnĐặt', ['maDon', 'dsGhế: Ghế[]']), rt('DonDat', ['PK MaDon']) + rt('ChiTietDat', ['PK,FK MaDon', 'PK SoGhe']), 'mảng → bảng chi tiết'),
    ch: { items: [{ t: 'mc', q: 'Một lập trình viên lười lưu danh sách ghế vào một cột chuỗi: <code>"A12,A13,A14"</code>. Điều gì xảy ra khi hỏi “ghế A13 chuyến này đã bán chưa?”', opts: ['Vẫn truy vấn nhanh và chính xác', 'Phải dò chuỗi, không đánh chỉ mục được, không ràng buộc khóa ngoại được'], ans: 1, why: 'Chuỗi gộp phá vỡ nguyên tắc “mỗi ô một giá trị”. Truy vấn trở thành <code>LIKE \'%A13%\'</code> (còn khớp nhầm A130), CSDL không thể chặn hai đơn cùng chứa A13, và không có khóa ngoại để đảm bảo ghế tồn tại. Tách thành dòng thì cả ba vấn đề biến mất.' }] } },
  { n: '8', name: 'Giá trị rời rạc → bảng danh mục', why: 'Thuộc tính chỉ nhận vài giá trị cố định (trạng thái, loại…) thì tách thành <b>bảng danh mục</b> và dùng khóa ngoại. Điều thú vị: <b>mỗi trạng thái trong State diagram chính là một dòng</b> của bảng danh mục này.',
    body: arrowRow(cbox('Vé', ['trangThai: String']), rt('Ve', ['PK MaVe', 'FK MaTrangThai']) + rt('TrangThaiVe', ['PK MaTrangThai', 'TenTrangThai']) + '<div class="rt"><b>dữ liệu TrangThaiVe</b><div>1 · DANG_GIU</div><div>2 · DA_THANH_TOAN</div><div>3 · DA_HUY</div><div>4 · HET_HAN</div></div>', 'danh mục + khóa ngoại'),
    ch: { items: [{ t: 'mc', q: 'Cột <code>trangThai</code> kiểu chuỗi tự do. Rủi ro lớn nhất?', opts: ['Chiếm nhiều dung lượng', 'Ai đó ghi “Da huy” hoặc “DA_HUY ” (dư dấu cách), và CSDL không chặn được giá trị sai đó'], ans: 1, why: 'Khóa ngoại đến bảng danh mục khiến CSDL <b>từ chối</b> giá trị ngoài danh sách. Thêm trạng thái mới (ví dụ “Đã lên xe” khi soát vé) chỉ là thêm một dòng, không sửa cấu trúc. Đổi lại phải JOIN khi cần tên trạng thái (hoặc dùng kiểu ENUM nếu nhóm ưu tiên đơn giản, hãy ghi rõ đánh đổi).' }] } },
