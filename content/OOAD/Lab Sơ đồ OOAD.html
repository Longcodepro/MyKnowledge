    body: '<div class="three"><div class="card"><h3>Dạng 1: mỗi tham số một cột (thường chỉ một dòng)</h3>' + rt('ThamSo', ['PK Khoa', 'ThoiGianGiuGhe', 'ThoiGianHuyToiThieu']) + '<p class="src">Thêm tham số mới = thêm cột (sửa cấu trúc). Vô hiệu hóa một tham số khó diễn đạt.</p></div>' +
      '<div class="card"><h3>Dạng 2: mỗi tham số một dòng</h3>' + rt('ThamSo', ['PK MaThamSo', 'TenThamSo', 'Kieu', 'GiaTri (chuỗi)', 'TinhTrang']) + '<div class="rt"><b>dữ liệu ví dụ</b><div>THOI_GIAN_GIU_GHE · số nguyên · "10" · bật</div><div>THOI_GIAN_HUY_TOI_THIEU · số nguyên · "4" · bật</div></div><p class="src">Thêm tham số = thêm dòng. Giá trị lưu dạng chuỗi nên cần cột Kiểu để chương trình ép đúng kiểu.</p></div></div>',
    ch: { items: [{ t: 'mc', q: 'Cần thêm tham số “số ghế tối đa mỗi lần đặt”. Dạng nào buộc phải <b>sửa cấu trúc bảng</b>?', opts: ['Dạng 1 (mỗi tham số một cột)', 'Dạng 2 (mỗi tham số một dòng)'], ans: 0, why: 'Dạng 1 phải thêm cột (<code>ALTER TABLE</code>). Dạng 2 chỉ thêm một dòng. Ngược lại dạng 1 có kiểu dữ liệu đúng ngay từ cột, còn dạng 2 phải lưu chuỗi và nhớ thêm cột Kiểu. Đổi chác muôn thuở: linh hoạt hay chặt chẽ.' }] } }
];
function buildRdm(panel) {
  panel.classList.add('lb');
  let cur = 0;
  panel.innerHTML = '<h2>Class → RDM: 9 quy tắc, và vì sao lại thế</h2>' +
    '<div class="why"><b>RDM</b> (Relational Data Model, mô hình dữ liệu quan hệ) là sơ đồ các <b>bảng</b> với khóa chính, khóa ngoại. Môn này <b>không dùng ERD</b>: bạn đi thẳng từ class diagram sang RDM bằng 9 quy tắc. Mỗi quy tắc dưới đây có <i>vì sao</i> trước, ví dụ từ đồ án đặt vé sau, và một câu để bạn đoán trước. Màu: <span class="pk">PK</span> = khóa chính, <span class="fk">FK</span> = khóa ngoại.</div>' +
    '<div class="rbar"></div><div class="rbody"></div>';
  const bar = panel.querySelector('.rbar'), body = panel.querySelector('.rbody');
  const names = RULES.map(function (r) { return r.n + '. ' + r.name; }).concat(['Áp dụng cho đồ án']);
  function show() {
    body.innerHTML = '';
    if (cur < RULES.length) {
      const R = RULES[cur];
      body.appendChild(h('div', 'card', '<h3>Quy tắc ' + R.n + ': ' + esc(R.name) + '</h3><p><b>Vì sao:</b> ' + R.why + '</p>' + R.body));
      const box = h('div', 'chal'); body.appendChild(box); buildChallenges(box, R.ch, 'x');
    } else {
      body.appendChild(h('div', 'card', '<h3>Áp dụng: chuyển class diagram “Đặt vé xe khách” sang RDM</h3>' +
        '<p class="warn">Đây là <b>bản nháp để đối chiếu</b> chuyển từ class diagram mẫu ở tab Class, không phải đáp án chính thức. Nhóm tự chốt lại khi class diagram của nhóm khác đi.</p>' +
        table(['Phần của class diagram', 'Quy tắc', 'Kết quả'], [
          ['Mỗi lớp lưu dữ liệu', '1', 'NguoiDung, KhachHang, NhanVien, Tuyen, ChuyenXe, GheChuyen, Ve, ThanhToan. <i>CổngThanhToán (interface) không thành bảng.</i>'],
          ['KháchHàng, NhânViên kế thừa NgườiDùng', '5 (cách 3)', 'NguoiDung chứa cột chung; KhachHang và NhanVien có khóa chính cũng là khóa ngoại đến NguoiDung.'],
          ['Tuyến 1 — n ChuyếnXe', '3', 'ChuyenXe.MaTuyen (FK).'],
          ['ChuyếnXe ◆ Ghế (composition)', '3 + khóa ghép', 'Khóa chính của GheChuyen là (MaChuyen, SoGhe): bộ phận mang khóa của toàn thể.'],
          ['Vé — Chuyến, Vé — Khách, Vé — Nhân viên', '3', 'Ve.MaChuyen, Ve.MaKH (NULL được), Ve.MaNVBan (NULL được).'],
          ['Vé giữ Ghế', '3', 'Ve(MaChuyen, SoGhe) là khóa ngoại ghép đến GheChuyen. <b>Không</b> đặt UNIQUE trên cặp này vì vé đã hủy vẫn nằm lại (xem tab Object).'],
          ['Vé 1 — 0..1 ThanhToán', '2', 'ThanhToan.MaVe (FK, UNIQUE).'],
          ['Trạng thái ghế/vé, phương thức thanh toán', '8', 'Bảng danh mục TrangThaiGhe, TrangThaiVe, PhuongThucThanhToan. Thuộc tính boolean <code>dangGiu</code> của lớp Ghế phải nâng lên thành danh mục vì thực tế có 3 trạng thái (trống, đang giữ, đã bán).'],
          ['10 phút, 4 giờ…', '9 (dạng 2)', 'Bảng ThamSo: THOI_GIAN_GIU_GHE, THOI_GIAN_HUY_TOI_THIEU.']
        ]) +
        '<p class="src">Quy tắc 4, 6, 7 không xuất hiện ở class diagram mẫu. Chúng sẽ xuất hiện ngay nếu nhóm chọn mô hình “Đơn đặt có nhiều vé” (xem câu tranh luận ở tab Class).</p>' +
        '<div class="rtw">' + rt('NguoiDung', ['PK MaND', 'HoTen', 'Sdt', 'MatKhauHash']) + rt('KhachHang', ['PK,FK MaND', 'MaKH']) + rt('NhanVien', ['PK,FK MaND', 'MaNV']) + rt('Tuyen', ['PK MaTuyen', 'DiemDi', 'DiemDen']) + rt('ChuyenXe', ['PK MaChuyen', 'FK MaTuyen', 'GioDi', 'GiaCoBan']) + rt('GheChuyen', ['PK,FK MaChuyen', 'PK SoGhe', 'FK MaTrangThaiGhe', 'GiuDen']) + rt('Ve', ['PK MaVe', 'FK MaChuyen + SoGhe', 'FK MaKH (NULL)', 'FK MaNVBan (NULL)', 'GiaVe', 'FK MaTrangThaiVe']) + rt('ThanhToan', ['PK MaTT', 'FK MaVe (UQ)', 'SoTien', 'FK MaPhuongThuc', 'ThoiDiem']) + rt('TrangThaiGhe', ['PK MaTrangThai', 'TenTrangThai']) + rt('TrangThaiVe', ['PK MaTrangThai', 'TenTrangThai']) + rt('PhuongThucThanhToan', ['PK MaPhuongThuc', 'TenPhuongThuc']) + rt('ThamSo', ['PK MaThamSo', 'TenThamSo', 'Kieu', 'GiaTri', 'TinhTrang']) + '</div>'));
      const box = h('div', 'chal'); body.appendChild(box);
      buildChallenges(box, { items: [
        { t: 'mc', q: 'Chú ý bảng <code>GheChuyen</code>: khóa chính ghép (MaChuyen, SoGhe). Vì sao không dùng một cột <code>MaGhe</code> tự tăng cho gọn?', opts: ['Dùng cột tự tăng cũng được, chỉ khác sở thích', 'Khóa ghép thể hiện đúng “ghế thuộc chuyến” và tự ngăn trùng số ghế trong cùng một chuyến'], ans: 1, why: 'Với khóa tự tăng, bạn vẫn phải thêm ràng buộc UNIQUE(MaChuyen, SoGhe) để chặn hai ghế A12 trong cùng một chuyến. Khóa ghép nói thẳng điều đó ngay trong cấu trúc. Cả hai đều dùng được; điều quan trọng là bạn biết <i>vì sao</i> chọn.' },
        { t: 'mc', q: 'Bảng <code>ThanhToan</code> lưu thêm <code>SoTien</code>, dù số tiền có thể suy ra từ <code>Ve.GiaVe</code>. Có nên không?', opts: ['Không, vì lưu dữ liệu tính được là thừa', 'Có, vì số tiền thực thu là một sự thật lịch sử và có thể khác giá vé (giảm giá, thu một phần)'], ans: 1, why: 'Quy tắc ngón tay cái: dữ liệu <b>tính được từ dữ liệu hiện tại</b> thì đừng lưu (như tổng doanh thu); dữ liệu là <b>sự kiện đã xảy ra</b> (đã thu bao nhiêu) thì phải lưu, vì sau này giá đổi sẽ không tính lại được.' }] }, 'x');
    }
  }
  chips(bar, names, 0, function (k) { cur = k; show(); });
  show();
  return {};
}
/* ===== Tab: Thiết kế giao diện (chương 6) — bấm vào màn hình để thấy biến cố ===== */

      ['Ngữ nghĩa', 'Nội dung dữ liệu và chức năng là gì?', 'Hiển thị chuyến, sơ đồ ghế, tổng tiền; thông báo “ghế vừa bị người khác chọn” phải đúng với điều hệ thống thật sự làm.'],
      ['Cú pháp', 'Quá trình tương tác diễn ra theo trình tự nào?', 'Chọn chuyến → chọn ghế → nhập thông tin → thanh toán. Kiểu đối thoại: mẫu biểu điền vào + chọn trên sơ đồ.'],

      { l: 'Khóa lúc bấm Tiếp tục', r: 'Ít ghi CSDL, khó bị lợi dụng giữ chỗ. Đổi lại người dùng có thể chọn xong mới biết ghế “vừa bị người khác lấy”, nên giao diện phải có thông báo lỗi rõ ràng và tải lại sơ đồ ghế.' }], end: 'Không có đáp án duy nhất. Quan trọng là nhóm chốt và ghi vào đặc tả use case (đây cũng là một câu hỏi “nhóm chưa chốt” trong tab Xuất cho AI).' },
    { t: 'mc', q: 'Nút “Tiếp tục” vẫn bật dù chưa chọn ghế nào, bấm vào mới báo lỗi. Vi phạm nguyên tắc nào của chương 6?', opts: ['Nhất quán', 'Cấm chức năng không phù hợp ngữ cảnh / tránh tạo cơ hội cho người dùng mắc lỗi', 'Hỗ trợ undo'], ans: 1, why: 'Tốt hơn hết là <b>không cho phép sai ngay từ đầu</b> (tắt nút) thay vì cho sai rồi mắng. Đó cũng là cách màn hình mẫu bên trên xử lý.' }] }, 'x');
  return { onShow: function () { render(); } };
}
