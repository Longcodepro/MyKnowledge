<title>Phòng lab Tuần 1 và 2</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
.navfix{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:44px;height:72px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:30px;line-height:1;cursor:pointer;opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.navfix:hover,.navfix:focus-visible{opacity:1;outline:2px solid var(--accent)}
#navPrev{left:0;border-radius:0 10px 10px 0}#navNext{right:0;border-radius:10px 0 0 10px}
@media (max-width:600px){.navfix{width:32px;height:56px;font-size:24px}}
/* Bố cục: thanh tab ngang; mỗi tab là bảng điều khiển bên trái + kết quả bên phải + chú giải thuật ngữ bên dưới. */
:root{
  --bg:#ffffff; --panel:#f6f7f9; --fg:#14181d; --muted:#5d6670; --line:#d9dde3;
  --accent:#2563eb; --accent-soft:#e8efff; --ok:#15803d; --ok-bg:#e7f6ec;
  --warn:#9a5b00; --warn-bg:#fff3d6; --err:#b42318; --err-bg:#fdebe9;
  --code-bg:#f1f3f6; --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#13161a; --panel:#1b1f25; --fg:#e8ecf1; --muted:#9aa5b1; --line:#2b323b;
  --accent:#6aa5ff; --accent-soft:#1f2c47; --ok:#5fd28a; --ok-bg:#16301f;
  --warn:#f0b64d; --warn-bg:#3a2e12; --err:#ff8c80; --err-bg:#3d1c19; --code-bg:#12161b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:20px;margin:0;flex:1 1 260px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13.5px;flex-basis:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:0}
.tabs button{font:inherit;font-size:14px;white-space:nowrap;padding:9px 13px;border:1px solid transparent;border-bottom:none;
  background:none;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--bg);border-color:var(--line);font-weight:650;
  box-shadow:0 1px 0 var(--bg);margin-bottom:-1px}
.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{margin:0 0 12px;color:var(--fg);max-width:75ch}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;min-width:0}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row label,.lab{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.lab b{font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-bottom:8px}
.chk input{margin-top:4px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
pre,.code{margin:0;font:12.5px/1.55 var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:300px}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.err{color:var(--err);background:var(--err-bg)} .pill.info{color:var(--accent);background:var(--accent-soft)}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{border:1px solid var(--line);padding:3px 7px;text-align:left;vertical-align:top}
table.t th{background:var(--code-bg);font-weight:650}
.scroll{overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mono{font-family:var(--mono)}
.seg-h{color:#c2410c} .seg-p{color:#7e22ce} .seg-s{color:#0e7490}
:root[data-theme="dark"] .seg-h{color:#ffa56b} :root[data-theme="dark"] .seg-p{color:#d3a4ff} :root[data-theme="dark"] .seg-s{color:#6fd6ea}
.gloss{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.gloss summary{cursor:pointer;font-weight:650;font-size:13.5px}
.gloss dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;font-size:13.5px}
@media (max-width:560px){.gloss dl{grid-template-columns:1fr}}
.gloss dt{font-weight:650;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.gloss dd{margin:0}
.sim{font-size:12.5px;color:var(--muted);margin-top:14px}
.ent{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-family:var(--mono);font-size:12.5px}
.ent span:nth-child(odd){color:var(--muted)}
.svc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.bar{height:10px;border-radius:5px;background:var(--code-bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}

.dcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;margin-bottom:14px}
.dwrap{overflow-x:auto;background:var(--bg)}
.dcv{display:block}
.status{padding:10px 12px;border-top:1px solid var(--line);background:var(--bg);font-size:14px;min-height:46px}
.status b{color:var(--accent)}
.hook{margin:0 0 12px;padding:8px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
.hook b{color:var(--accent)}
.codeL{font:12.5px/1.6 var(--mono);margin:0}
.codeL div{padding:1px 6px;border-radius:4px;white-space:pre-wrap;color:var(--muted)}
.codeL div.on{background:var(--warn-bg);color:var(--warn);font-weight:650}
.scn{display:flex;gap:6px;flex-wrap:wrap}
.scn .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
<div class="wrap">
  <header>
    <h1>Phòng lab TV2: từ PDF đến dữ liệu có nhãn</h1>
    <button class="btn" id="themeBtn" type="button">Nền tối</button>
    <p>Quy trình, đầu vào, đầu ra và việc cần làm tiếp của TV2 ở tuần 1 và tuần 2, cùng một khung chung để làm lại với các tuần sau.</p>
  </header>
  <div class="tabs" role="tablist" id="tabs" aria-label="Nhiệm vụ tuần 1"></div>
  <div id="panels"></div>
</div>
<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pill = (kind, text) => '<span class="pill ' + kind + '">' + esc(text) + '</span>';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const enc = new TextEncoder();
const SLOW = 2;   // hệ số làm chậm mọi hoạt ảnh gói tin; chỉnh số này để nhanh/chậm hơn
const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const PAL = ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed', '#0891b2'];
const LC = { ngoai: 5, pres: 0, app: 1, dom: 2, infra: 3, db: 4 };   // màu theo tầng

/* ---- màu theo chủ đề (đọc từ biến CSS) ---- */
const T = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  ['bg', 'panel', 'fg', 'muted', 'line', 'accent', 'ok', 'warn', 'err', 'code-bg', 'ok-bg', 'warn-bg', 'err-bg', 'accent-soft']
    .forEach(k => { T[k] = cs.getPropertyValue('--' + k).trim() || '#888'; });
}

/* ---- hàm vẽ cơ bản (toạ độ thiết kế, tâm của hộp là x,y) ---- */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function txt(c, s, x, y, o) {
  o = o || {};
  c.font = (o.bold ? 'bold ' : '') + (o.size || 14) + 'px system-ui,sans-serif';
  c.fillStyle = o.color || T.fg; c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'middle';
  c.fillText(String(s), x, y);
}
function fit(c, s, w, size, bold) {            // cắt chữ cho vừa độ rộng
  c.font = (bold ? 'bold ' : '') + size + 'px system-ui,sans-serif';
  s = String(s);
  if (c.measureText(s).width <= w) return s;
  while (s.length > 1 && c.measureText(s + '…').width > w) s = s.slice(0, -1);
  return s + '…';
}
function box(c, x, y, w, h, o) {
  o = o || {};
  c.save(); if (o.alpha != null) c.globalAlpha = o.alpha;
  rr(c, x - w / 2, y - h / 2, w, h, o.r == null ? 10 : o.r);
  c.fillStyle = o.fill || T.bg; c.fill();
  if (o.tint) { const a = c.globalAlpha; c.globalAlpha = a * o.tint[1]; c.fillStyle = o.tint[0]; c.fill(); c.globalAlpha = a; }
  if (o.dash) c.setLineDash(o.dash);
  c.lineWidth = o.lw || 2; c.strokeStyle = o.stroke || T.line; c.stroke(); c.setLineDash([]);
  if (o.title != null) txt(c, fit(c, o.title, w - 14, o.fs || 16, true), x, y - (o.sub ? h * 0.16 : 0), { size: o.fs || 16, bold: true, color: o.tc || T.fg });
  if (o.sub) txt(c, fit(c, o.sub, w - 14, o.ss || 12.5), x, y + h * 0.24, { size: o.ss || 12.5, color: o.sc || T.muted });
  c.restore();
}
function arrow(c, p, q, o) {
  o = o || {};
  const ang = Math.atan2(q[1] - p[1], q[0] - p[0]), hl = o.head === false ? 0 : 11;
  c.save(); c.strokeStyle = o.color || T.muted; c.fillStyle = o.color || T.muted; c.lineWidth = o.lw || 2;
  if (o.dash) c.setLineDash(o.dash);
  c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0] - Math.cos(ang) * hl * 0.6, q[1] - Math.sin(ang) * hl * 0.6); c.stroke(); c.setLineDash([]);
  if (hl) { c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q[0] - hl * Math.cos(ang - 0.4), q[1] - hl * Math.sin(ang - 0.4));
    c.lineTo(q[0] - hl * Math.cos(ang + 0.4), q[1] - hl * Math.sin(ang + 0.4)); c.closePath(); c.fill(); }
  c.restore();
}
function badge(c, s, x, y, color, filled) {   // nhãn nhỏ có viền, tâm tại x,y
  c.save(); c.font = 'bold 12.5px system-ui,sans-serif';
  const w = c.measureText(s).width + 16;
  rr(c, x - w / 2, y - 11, w, 22, 11); c.fillStyle = filled ? color : T.bg; c.fill(); c.lineWidth = 1.6; c.strokeStyle = color; c.stroke();
  txt(c, s, x, y, { size: 12.5, bold: true, color: filled ? '#fff' : color }); c.restore();
}
function cyl(c, x, y, w, h, o) {              // hình trụ = cơ sở dữ liệu
  o = o || {}; const e = 10;
  c.save(); c.lineWidth = o.lw || 2; c.strokeStyle = o.stroke || PAL[4]; c.fillStyle = o.fill || T.bg;
  c.beginPath(); c.moveTo(x - w / 2, y - h / 2 + e); c.lineTo(x - w / 2, y + h / 2 - e);
  c.ellipse(x, y + h / 2 - e, w / 2, e, 0, Math.PI, 0, true); c.lineTo(x + w / 2, y - h / 2 + e);
  c.ellipse(x, y - h / 2 + e, w / 2, e, 0, 0, Math.PI * 2, true); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(x, y - h / 2 + e, w / 2, e, 0, 0, Math.PI); c.stroke(); c.restore();
}
function edgePts(a, b) {                      // điểm trên viền hai hộp
  const dx = b.x - a.x, dy = b.y - a.y;
  const clip = (r, dx, dy) => {
    const sx = dx ? (r.w / 2) / Math.abs(dx) : Infinity, sy = dy ? (r.h / 2) / Math.abs(dy) : Infinity, s = Math.min(sx, sy);
    return [r.x + dx * s, r.y + dy * s];
  };
  return [clip(a, dx, dy), clip(b, -dx, -dy)];
}
function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
function along(p, d) {
  for (let i = 1; i < p.length; i++) {
    const s = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= s || i === p.length - 1) { const f = s ? Math.min(1, d / s) : 1; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * f, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * f]; }
    d -= s;
  }
  return p[p.length - 1];
}

/* ---- sân khấu canvas: toạ độ thiết kế cố định (w x h), tự co theo bề rộng ---- */
const STAGES = [];
class Stage {
  constructor(host, w, h) {
    this.w = w; this.h = h; this.pk = []; this.draw = function () {};
    this.wrap = document.createElement('div'); this.wrap.className = 'dwrap';
    this.cv = document.createElement('canvas'); this.cv.className = 'dcv'; this.cv.setAttribute('role', 'img');
    this.wrap.appendChild(this.cv); host.appendChild(this.wrap);
    this.ctx = this.cv.getContext('2d'); this.fit();
    if (window.ResizeObserver) new ResizeObserver(() => this.fit()).observe(this.wrap);
    STAGES.push(this);
  }
  fit() {
    const cw = Math.max(this.wrap.clientWidth, 800), ch = cw * this.h / this.w, dpr = window.devicePixelRatio || 1;
    this.cv.style.width = cw + 'px'; this.cv.style.height = ch + 'px';
    this.cv.width = Math.round(cw * dpr); this.cv.height = Math.round(ch * dpr); this.k = cw * dpr / this.w;
  }
  /* gửi một "gói tin" chạy dọc đường pts; trả về Promise khi tới nơi */
  packet(pts, o) {
    o = o || {};
    return new Promise(res => {
      const len = polyLen(pts);
      this.pk.push({ pts: pts, len: len, t0: performance.now(), dur: REDUCE ? 1 : SLOW * (o.dur || Math.max(380, len * 1.25)), color: o.color || PAL[1], label: o.label, res: res });
    });
  }
  update(now) { this.pk = this.pk.filter(p => { if (now - p.t0 >= p.dur) { p.res(); return false; } return true; }); }
  frame(now) {
    if (!this.cv.offsetParent) return;
    const c = this.ctx; c.setTransform(this.k, 0, 0, this.k, 0, 0); c.clearRect(0, 0, this.w, this.h);
    this.draw(c, now);
    this.pk.forEach(p => {
      const f = Math.min(1, (now - p.t0) / p.dur), pos = along(p.pts, p.len * f);
      c.save(); c.shadowColor = p.color; c.shadowBlur = 10; c.fillStyle = p.color; c.beginPath(); c.arc(pos[0], pos[1], 7, 0, Math.PI * 2); c.fill(); c.restore();
      if (p.label) badge(c, p.label, pos[0], pos[1] - 20, p.color, true);
    });
  }
}
(function loop() {
  const now = performance.now();
  STAGES.forEach(s => { s.update(now); s.frame(now); });
  requestAnimationFrame(loop);
})();

/* ---- khung giao diện chung của mỗi tab ---- */
function shell(root, o) {
  root.innerHTML =
    '<p class="intro">' + o.intro + '</p>' +
    (o.hook ? '<div class="hook"><b>Nhớ nhanh:</b> ' + o.hook + '</div>' : '') +
    '<div class="dcard"><div class="dstage"></div><div class="status" aria-live="polite"></div></div>' +
    '<div class="grid"><section class="card"><h3>Điều khiển</h3>' + o.controls + '</section>' +
    '<section class="card stack"><h3 style="margin:0">Chi tiết</h3>' + (o.detail || '') + '</section></div>' +
    (o.note ? '<p class="sim">' + o.note + '</p>' : '') +
    '<details class="gloss" open><summary>Thuật ngữ trong tab này</summary><dl>' +
    o.gloss.map(g => '<dt>' + esc(g[0]) + '</dt><dd>' + g[1] + '</dd>').join('') + '</dl></details>';
  return { stage: new Stage($('.dstage', root), o.w || 1000, o.h || 460), status: html => { $('.status', root).innerHTML = html; } };
}
const hexOf = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');


/* =================== BỘ DỰNG SƠ ĐỒ CHUNG: node + cạnh + gói tin + kịch bản + mã giả =================== */
const F = (n, e, l, h, rev, x) => ({ n: n, e: e, l: l, h: h, rev: rev || [], x: x });
function makeFlow(root, cfg) {
  cfg.nodes.forEach(n => { n.w = n.w || 150; n.h = n.h || 56; n.st = 'cho'; });
  const byId = {}; cfg.nodes.forEach(n => { byId[n.id] = n; });
  const E = cfg.edges.map(e => ({ id: e[0], a: byId[e[1]], b: byId[e[2]], label: e[3] }));
  const eById = {}; E.forEach(e => { eById[e.id] = e; });
  const W = cfg.w || 1000, H = cfg.h || 460, BANDS = cfg.bands || [];
  const ui = shell(root, {
    intro: cfg.intro, hook: cfg.hook, w: W, h: H,
    controls: '<div class="lab"><span>Kịch bản</span></div><div class="scn f-scn" style="margin-bottom:12px"></div>' +
      '<div class="btns" style="margin-bottom:10px"><button class="btn primary f-play" type="button">▶ Chạy</button><button class="btn f-step" type="button">Bước tiếp</button><button class="btn f-reset" type="button">Làm lại</button></div>' +
      '<div class="row"><div class="lab"><label>Tốc độ (bước/giây, chậm = bên trái)</label><b class="f-spdv">0.5</b></div><input class="f-spd" type="range" min="0.25" max="4" step="0.25" value="0.5" aria-label="Tốc độ"></div>' + (cfg.controls || ''),
    detail: '<div><div class="lab"><span>Mã giả (dòng đang chạy được tô sáng)</span></div><div class="codeL f-code" style="max-height:300px;overflow:auto"></div></div>' + (cfg.detail || ''),
    gloss: cfg.gloss, note: cfg.note
  });
  const S = { frames: [], idx: 0, cur: [], curE: [], passed: {}, timer: null, running: false, k: 0, spd: 0.5, stage: 0 };
  const codeEl = $('.f-code', root);
  codeEl.innerHTML = cfg.code.map(l => '<div>' + esc(l) + '</div>').join('');
  const hl = i => $$('div', codeEl).forEach((d, j) => d.classList.toggle('on', j === i));
  function pause() { S.running = false; $('.f-play', root).textContent = '▶ Chạy'; clearTimeout(S.timer); }
  function reset() {
    pause(); if (cfg.onReset) cfg.onReset(S, root);
    S.frames = cfg.build(S.k, root); S.idx = 0; S.cur = []; S.curE = []; S.passed = {}; S.stage = 0;
    cfg.nodes.forEach(n => { n.st = 'cho'; }); hl(-1);
    ui.status('Kịch bản <b>' + cfg.names[S.k] + '</b> gồm ' + S.frames.length + ' bước.');
    if (cfg.onFrame) cfg.onFrame(null, S, root);
  }
  function step() {
    if (S.idx >= S.frames.length) { pause(); return; }
    const f = S.frames[S.idx++];
    S.cur.forEach(id => { byId[id].st = 'xong'; }); S.curE.forEach(id => { S.passed[id] = true; });
    S.cur = f.n; S.curE = f.e; f.n.forEach(id => { byId[id].st = 'dangXet'; });
    if (f.x != null) S.stage = f.x;
    hl(f.l); ui.status('<b>Bước ' + S.idx + '/' + S.frames.length + '.</b> ' + f.h);
    if (cfg.onFrame) cfg.onFrame(f, S, root);
    f.e.forEach(id => {
      const e = eById[id], p = edgePts(e.a, e.b), rev = f.rev.indexOf(id) >= 0;
      ui.stage.packet(rev ? [p[1], p[0]] : p, { color: PAL[1], dur: 520 });
    });
    if (S.idx >= S.frames.length) pause();
  }
  function play() { if (S.running) return; S.running = true; $('.f-play', root).textContent = '❚❚ Tạm dừng';
    const tick = () => { if (!S.running) return; step(); if (S.running) S.timer = setTimeout(tick, 1000 / S.spd); }; tick(); }
  const scn = $('.f-scn', root);
  cfg.names.forEach((n, i) => {
    const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = i + '. ' + n; b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.onclick = () => { S.k = i; $$('button', scn).forEach((x, j) => x.setAttribute('aria-pressed', j === i ? 'true' : 'false')); if (cfg.onScenario) cfg.onScenario(i, root); reset(); };
    scn.appendChild(b);
  });
  $('.f-play', root).onclick = () => S.running ? pause() : play();
  $('.f-step', root).onclick = () => { pause(); step(); };
  $('.f-reset', root).onclick = reset;
  $('.f-spd', root).oninput = e => { S.spd = parseFloat(e.target.value); $('.f-spdv', root).textContent = S.spd; };
  ui.stage.draw = function (c) {
    BANDS.forEach(b => { c.save(); c.globalAlpha = 0.08; c.fillStyle = PAL[b[3]]; c.fillRect(0, b[1], W, b[2] - b[1]); c.restore();
      txt(c, b[0], 12, b[1] + 13, { size: 11, bold: true, color: PAL[b[3]], align: 'left' }); });
    E.forEach(e => {
      const p = edgePts(e.a, e.b), on = S.curE.indexOf(e.id) >= 0, done = S.passed[e.id];
      arrow(c, p[0], p[1], { color: on ? PAL[1] : done ? PAL[0] : T.line, lw: on ? 4 : done ? 2.6 : 1.6, head: on || done });
    });
    cfg.nodes.forEach(n => {
      const col = PAL[n.c == null ? 0 : n.c];
      if (n.st === 'dangXet') box(c, n.x, n.y, n.w, n.h, { fill: col, stroke: col, lw: 3.5, title: n.t, sub: n.s, tc: '#fff', sc: '#fff', fs: 14.5, ss: 11.5 });
      else box(c, n.x, n.y, n.w, n.h, { fill: T.bg, stroke: col, lw: n.st === 'xong' ? 3 : 2, tint: n.st === 'xong' ? [col, 0.2] : null, title: n.t, sub: n.s, fs: 14.5, ss: 11.5 });
    });
    S.curE.forEach(id => { const e = eById[id], m = [(e.a.x + e.b.x) / 2, (e.a.y + e.b.y) / 2]; if (e.label) badge(c, e.label, m[0], m[1], PAL[1]); });
    if (cfg.extra) cfg.extra(c, S);
    [['Đang xử lý (nền đặc)', 0], ['Đã đi qua (nền nhạt)', 1], ['Chưa tới (nền trắng)', 2]].forEach((it, i) => {
      const x = 22 + i * 190, y = H - 14; c.beginPath(); c.arc(x, y, 6, 0, 7); c.fillStyle = i === 0 ? PAL[0] : T.bg; c.fill();
      if (i === 1) { c.globalAlpha = 0.25; c.fillStyle = PAL[0]; c.fill(); c.globalAlpha = 1; } c.lineWidth = 2; c.strokeStyle = PAL[0]; c.stroke();
      txt(c, it[0], x + 12, y, { size: 12, align: 'left', color: T.muted });
    });
  };
  reset();
  return { S: S, ui: ui, reset: reset, step: step, byId: byId };
}
