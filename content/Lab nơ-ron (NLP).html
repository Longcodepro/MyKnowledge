    });
    ctx.fillStyle = st.fg; ctx.font = '11px system-ui,sans-serif'; ctx.textAlign = 'right';
    var wv2 = net.W[0][0][0], bv2 = net.b[0][0];
    ctx.fillText('w=' + fmt(wv2, 3) + ', b=' + fmt(bv2, 3), x + w - 10, y + 13);
    if (logit && Math.abs(wv2) > 1e-6) {
      ctx.textAlign = 'left'; ctx.fillStyle = st.muted;
      ctx.fillText('biên x = −b/w = ' + fmt(-bv2 / wv2, 3), ix + 4, iy + ih - 6);
    }
  }

  function drawLoss(T, ctx, x, y, w, h, st) {
    var tr = T.tr, C = st.C, hist = tr.lossHist, n = hist.length;
    box(ctx, x, y, w, h, 'Loss theo ' + (T.sc.mode === 'batch' ? 'epoch' : 'lần cập nhật') + ' (thang nén log)', st);
    var ix = x + 40, iy = y + 26, iw = w - 52, ih = h - 42;
    ctx.strokeStyle = st.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix, iy + ih); ctx.lineTo(ix + iw, iy + ih); ctx.stroke();
    ctx.font = '10px system-ui,sans-serif'; ctx.textBaseline = 'middle';
    if (n === 0) {
      ctx.fillStyle = st.muted; ctx.textAlign = 'center';
      ctx.fillText('Chưa có dữ liệu: loss xuất hiện sau pha ②', ix + iw / 2, iy + ih / 2);
      return;
    }
    var finite = hist.filter(function (v) { return isFinite(v); });
    var maxv = Math.max(1e-9, Math.min(1e12, Math.max.apply(null, finite.length ? finite : [1])));
    var den = Math.log10(1 + maxv);
    var last = hist[n - 1];
    function X(i) { return ix + (n <= 1 ? 0 : i / Math.max(7, n - 1) * iw); }
    function Y(v) { var q = isFinite(v) ? Math.log10(1 + Math.min(v, 1e12)) / den : 1; return iy + ih - clamp(q, 0, 1) * ih; }
    ctx.fillStyle = st.muted; ctx.textAlign = 'right';
    ctx.fillText(fmt(maxv, 3), ix - 4, iy + 2); ctx.fillText('0', ix - 4, iy + ih);
    ctx.beginPath(); ctx.moveTo(X(0), iy + ih);
    hist.forEach(function (v, i) { ctx.lineTo(X(i), Y(v)); });
    ctx.lineTo(X(n - 1), iy + ih); ctx.closePath();
    ctx.fillStyle = rgba(C.loss, 0.14); ctx.fill();
    ctx.strokeStyle = C.loss; ctx.lineWidth = 2.4; ctx.beginPath();
    hist.forEach(function (v, i) { if (i === 0) ctx.moveTo(X(i), Y(v)); else ctx.lineTo(X(i), Y(v)); });
    ctx.stroke();
    ctx.beginPath(); ctx.arc(X(n - 1), Y(last), 4.5, 0, Math.PI * 2); ctx.fillStyle = C.loss; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = st.fg; ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillStyle = st.fg; ctx.font = '11px system-ui,sans-serif';
    ctx.fillText('L=' + fmt(last), x + w - 10, y + 13);
    if (!isFinite(last) || last > 1e6) {
      ctx.textAlign = 'center'; ctx.fillStyle = st.fg; ctx.font = '600 12px system-ui,sans-serif';
      ctx.fillText('Phân kỳ (diverge): loss tăng vọt', ix + iw / 2, iy + 14);
    }
  }

  /* ======================================================================
     5b. Công thức tổng quát + thế số từng bước (mỗi bước một ô mới, ô cũ giữ nguyên)
     Dòng bắt đầu bằng "#" là công thức chữ; dòng bắt đầu bằng "!" là kết quả (in đậm).
     ==================================================================== */
  function pn(v) { return v < 0 ? '(' + fmt(v) + ')' : fmt(v); }
  function fprime(act, z, a) { return act === 'sigmoid' ? a * (1 - a) : act === 'relu' ? (z > 0 ? 1 : 0) : 1; }
  function fprimeTxt(act, z, a) {
    if (act === 'sigmoid') return pn(a) + '×(1−' + pn(a) + ')';
    if (act === 'relu') return 'ReLU′(' + fmt(z) + ')=' + (z > 0 ? 1 : 0);
    return '1';
  }
  function zName(l, j, n) { return 'z' + (n > 1 ? sub(j + 1) : '') + sup(l + 1); }
  function dName(l, j, n) { return 'δ' + (n > 1 ? sub(j + 1) : '') + sup(l + 1); }

  function isNeuron(sc) { return sc.sizes.length === 2 && sc.sizes[0] === 1 && sc.sizes[1] === 1; }
  function isSimple(net) {
    var Lw = net.W.length, a = net.acts[Lw - 1];
    return (a === 'softmax' && net.loss === 'ce') || (a === 'sigmoid' && net.loss === 'bce') || (a === 'linear' && net.loss === 'hmse');
  }

  /* 4 công thức tổng quát, thay đổi theo bài đang chọn */
  function generalFormulas(T) {
    if (T.def.kind === 'rnn') return rnnGeneral();
    var sc = T.sc, net = T.tr.net, loss = net.loss, act = net.acts[net.W.length - 1];
    var lossF = loss === 'mse' ? (sc.mode === 'batch' ? 'L = (1/N)·Σ (ŷᵢ − yᵢ)²' : 'L = (ŷ − y)²')
      : loss === 'hmse' ? 'L = ½·Σ (ŷₖ − yₖ)²'
      : loss === 'bce' ? 'L = −[y·ln ŷ + (1−y)·ln(1−ŷ)]' : 'L = −Σ yₖ·ln ŷₖ';
    if (isNeuron(sc)) {
      var sig = net.acts[0] === 'sigmoid';
      var batch = sc.mode === 'batch';
      return [
        'z = w·x + b' + (sig ? '\nŷ = σ(z) = 1/(1 + e⁻ᶻ)' : '\nŷ = z') + (batch ? '\n(làm cho từng mẫu i)' : ''),
        lossF,
        loss === 'bce' ? 'δ = ŷ − y\n∂L/∂w = δ·x\n∂L/∂b = δ'
          : 'δᵢ = 2(ŷᵢ − yᵢ)·f′(zᵢ)\n∂L/∂w = ' + (batch ? '(1/N)·Σ δᵢ·xᵢ\n∂L/∂b = (1/N)·Σ δᵢ' : 'δ·x\n∂L/∂b = δ'),
        'w ← w − η·∂L/∂w\nb ← b − η·∂L/∂b'
      ];
    }
    var updAll = T.def.updateAll ? T.app.param('updAll') >= 1 : true;
    return [
      'zˡ = Wˡ·aˡ⁻¹ + bˡ   (a⁰ = x)\naˡ = f(zˡ)' + (act === 'softmax' ? '\nlớp ra: ŷₖ = e^zₖ / Σ e^zⱼ' : ''),
      lossF,
      (isSimple(net) ? 'δᴸ = ŷ − y' : 'δᴸ = (ŷ − y)·f′(zᴸ)') +
        (net.W.length > 1 ? '\nδˡ = (Wˡ⁺¹)ᵀ·δˡ⁺¹ ⊙ f′(zˡ)' : '') + '\n∂L/∂Wˡ = δˡ·(aˡ⁻¹)ᵀ\n∂L/∂bˡ = δˡ',
      'Wˡ ← Wˡ − η·∂L/∂Wˡ\nbˡ ← bˡ − η·∂L/∂bˡ' + (updAll ? '' : '\n(chỉ cập nhật lớp ra)')
    ];
  }

  function lossLines(net, yh, y, L) {
    var k, parts = [], out = [];
    switch (net.loss) {
      case 'hmse':
        for (k = 0; k < yh.length; k++) parts.push('(' + fmt(yh[k]) + ' − ' + pn(y[k]) + ')²');
        out.push('#L = ½·Σ (ŷₖ − yₖ)²');
        out.push('L = ½×' + (parts.length > 1 ? '[' + parts.join(' + ') + ']' : parts[0]));
        break;
      case 'mse':
        for (k = 0; k < yh.length; k++) parts.push('(' + fmt(yh[k]) + ' − ' + pn(y[k]) + ')²');
        out.push('#L = (ŷ − y)²');
        out.push('L = ' + parts.join(' + '));
        break;
      case 'bce':
        out.push('#L = −[y·ln ŷ + (1−y)·ln(1−ŷ)]');
        out.push('L = −[' + fmt(y[0]) + '×ln(' + fmt(yh[0]) + ') + (1−' + fmt(y[0]) + ')×ln(1−' + fmt(yh[0]) + ')]');
        break;
      default:
        for (k = 0; k < yh.length; k++) parts.push(fmt(y[k]) + '×ln(' + fmt(yh[k]) + ')');
        out.push('#L = −Σ yₖ·ln ŷₖ');
        out.push('L = −[' + parts.join(' + ') + ']');
    }
    out.push('!L = ' + fmt(L));
    return out;
  }

  /* Dựng nội dung một ô công thức cho pha vừa chạy xong */
  function stepCell(T, res) {
    var tr = T.tr, sc = T.sc, net = tr.net, S = sc.samples, g = res.group, ph = res.phase;
    var Lw = net.W.length, neuron = isNeuron(sc), L = [], k, l, j, i;
    var Wd = ph === 3 ? res.prevNet : net;      // trọng số dùng cho pha này (pha ④ lấy bản trước khi cập nhật)

    if (ph === 0) {
      if (neuron) {
        var f0 = net.acts[0], w = net.W[0][0][0], b = net.b[0][0];
        L.push('#z = w·x + b' + (f0 === 'sigmoid' ? ' ;  ŷ = σ(z)' : ' ;  ŷ = z'));
        g.forEach(function (si, q) {
          var lab = g.length > 1 ? sub(q + 1) : '', x = S[si].x[0], fw = tr.fw[q];
          L.push('z' + lab + ' = ' + pn(w) + '×' + pn(x) + ' + ' + pn(b) + ' = ' + fmt(fw.Z[0][0]));
          L.push('!ŷ' + lab + ' = ' + (f0 === 'sigmoid' ? 'σ(' + fmt(fw.Z[0][0]) + ') = ' : '') + fmt(fw.yhat[0]) + '   (y' + lab + ' = ' + fmt(S[si].y[0]) + ')');
        });
      } else {
        var fw0 = tr.fw[0];
        for (l = 0; l < Lw; l++) {
          var nl = net.W[l].length, inName = l ? 'a' + sup(l) : 'x';
          L.push('#' + 'z' + sup(l + 1) + ' = W' + sup(l + 1) + '·' + inName + ' + b' + sup(l + 1));
          for (j = 0; j < nl; j++) {
            var terms = [];
            for (i = 0; i < net.W[l][j].length; i++) terms.push(pn(Wd.W[l][j][i]) + '×' + pn(fw0.A[l][i]));
            L.push(zName(l, j, nl) + ' = ' + terms.join(' + ') + ' + ' + pn(Wd.b[l][j]) + ' = ' + fmt(fw0.Z[l][j]));
          }
          var an = T.topo.byId['0:' + (l + 1) + ':'];
          if (net.acts[l] === 'softmax') {
            var ez = fw0.Z[l].map(function (v) { return 'e^' + fmt(v); }).join(' + ');
            for (j = 0; j < nl; j++) L.push('!ŷ' + sub(j + 1) + ' = e^' + fmt(fw0.Z[l][j]) + ' / (' + ez + ') = ' + fmt(fw0.A[l + 1][j]));
          } else {
            for (j = 0; j < nl; j++) {
              var nm = T.topo.byId['0:' + (l + 1) + ':' + j].name, fn = fnName(net.acts[l]);
              L.push('!' + nm + ' = ' + (fn ? fn + '(' + fmt(fw0.Z[l][j]) + ') = ' : '') + fmt(fw0.A[l + 1][j]));
            }
          }
        }
      }
    } else if (ph === 1) {
      if (net.loss === 'mse' && sc.mode === 'batch') {
        L.push('#L = (1/N)·Σ (ŷᵢ − yᵢ)²');
        L.push('L = [' + g.map(function (si, q) { return '(' + fmt(tr.fw[q].yhat[0]) + ' − ' + pn(S[si].y[0]) + ')²'; }).join(' + ') + '] / ' + g.length);
        L.push('L = [' + tr.losses.map(function (v) { return fmt(v); }).join(' + ') + '] / ' + g.length);
        L.push('!L = ' + fmt(tr.L));
      } else {
        L = lossLines(net, tr.fw[0].yhat, S[g[0]].y, tr.L);
      }
    } else if (ph === 2) {
      var gr = tr.grad, d = tr.deltas;
      if (neuron) {
        var a0 = net.acts[0], N = g.length, dx = [], dd = [];
        if (net.loss === 'bce') L.push('#δ = ŷ − y ;  ∂L/∂w = δ·x ;  ∂L/∂b = δ');
        else L.push('#δ = 2(ŷ − y)·f′(z) ;  ∂L/∂w = ' + (N > 1 ? '(1/N)·Σ δᵢ·xᵢ ;  ∂L/∂b = (1/N)·Σ δᵢ' : 'δ·x ;  ∂L/∂b = δ'));
        g.forEach(function (si, q) {
          var lab = N > 1 ? sub(q + 1) : '', fwq = tr.fw[q], yh = fwq.yhat[0], yy = S[si].y[0], x = S[si].x[0], dv = d[q][0][0];
          if (net.loss === 'bce') L.push('δ' + lab + ' = ' + fmt(yh) + ' − ' + pn(yy) + ' = ' + fmt(dv));
          else L.push('δ' + lab + ' = 2×(' + fmt(yh) + ' − ' + pn(yy) + ')×' + fprimeTxt(a0, fwq.Z[0][0], yh) + ' = ' + fmt(dv));
          dx.push(pn(dv) + '×' + pn(x)); dd.push(pn(dv));
        });
        var sumX = dx.join(' + '), sumD = dd.join(' + ');
        L.push('!∂L/∂w = ' + (N > 1 ? '(' + sumX + ')/' + N : sumX) + ' = ' + fmt(gr.dW[0][0][0]));
        L.push('!∂L/∂b = ' + (N > 1 ? '(' + sumD + ')/' + N + ' = ' : 'δ = ') + fmt(gr.db[0][0]));
      } else {
        var fwq2 = tr.fw[0], dl = d[0], yh2 = fwq2.yhat, y2 = S[g[0]].y;
        for (l = Lw - 1; l >= 0; l--) {
          var nl2 = net.W[l].length;
          L.push('#' + (l === Lw - 1 ? (isSimple(net) ? 'δ' + sup(l + 1) + ' = ŷ − y' : 'δ' + sup(l + 1) + ' = (ŷ − y)·f′(z' + sup(l + 1) + ')')
            : 'δ' + sup(l + 1) + ' = (W' + sup(l + 2) + ')ᵀ·δ' + sup(l + 2) + ' ⊙ f′(z' + sup(l + 1) + ')'));
          for (j = 0; j < nl2; j++) {
            var line;
            if (l === Lw - 1) {
              line = dName(l, j, nl2) + ' = ' + fmt(yh2[j]) + ' − ' + pn(y2[j]);
              if (!isSimple(net)) line += ')×' + fprimeTxt(net.acts[l], fwq2.Z[l][j], yh2[j]), line = line.replace(' = ', ' = (');
            } else {
              var tt = [];
              for (k = 0; k < net.W[l + 1].length; k++) tt.push(pn(net.W[l + 1][k][j]) + '×' + pn(dl[l + 1][k]));
              line = dName(l, j, nl2) + ' = (' + tt.join(' + ') + ') × ' + fprimeTxt(net.acts[l], fwq2.Z[l][j], fwq2.A[l + 1][j]);
            }
            L.push(line + ' = ' + fmt(dl[l][j]));
          }
        }
        L.push('#∂L/∂W = δ × (đầu vào của cạnh) ;  ∂L/∂b = δ');
        for (l = Lw - 1; l >= 0; l--) {
          for (j = 0; j < net.W[l].length; j++) {
            for (i = 0; i < net.W[l][j].length; i++)
              L.push('∂L/∂' + wSym(l, j, i, sc.sizes) + ' = ' + pn(dl[l][j]) + '×' + pn(fwq2.A[l][i]) + ' = ' + fmt(gr.dW[l][j][i]));
            L.push('∂L/∂' + bSym(l, j, sc.sizes) + ' = ' + fmt(gr.db[l][j]));
          }
        }
      }
    } else {
      var lr = res.lr, gr4 = tr.grad, pv = res.prevNet;
      var updAll = T.def.updateAll ? T.app.param('updAll') >= 1 : true;
      L.push('#tham số ← tham số − η·gradient   (η = ' + fmt(lr) + ')');
      for (l = updAll ? 0 : Lw - 1; l < Lw; l++) {
        for (j = 0; j < net.W[l].length; j++) {
          for (i = 0; i < net.W[l][j].length; i++)
            L.push((neuron ? 'w' : wSym(l, j, i, sc.sizes)) + ' ← ' + fmt(pv.W[l][j][i]) + ' − ' + fmt(lr) + '×' + pn(gr4.dW[l][j][i]) + ' = ' + fmt(net.W[l][j][i]));
          L.push((neuron ? 'b' : bSym(l, j, sc.sizes)) + ' ← ' + fmt(pv.b[l][j]) + ' − ' + fmt(lr) + '×' + pn(gr4.db[l][j]) + ' = ' + fmt(net.b[l][j]));
        }
      }
    }
    return L;
  }

  var PH_NAME = ['① Xuôi', '② Mất mát', '③ Ngược', '④ Cập nhật'];
  var PH_COL = [0, 1, 3, 2];                 // chỉ số màu của khung vẽ cho từng pha

  function addLabelLines(el, lines) {
    lines.forEach(function (t) {
      var d = document.createElement('div');
      d.className = 'lf-l' + (t.charAt(0) === '#' ? ' f' : t.charAt(0) === '!' ? ' r' : '');
      d.textContent = (t.charAt(0) === '#' || t.charAt(0) === '!') ? t.slice(1) : t;
      el.appendChild(d);
    });
  }

  function buildFormulaSection(T) {
    var sec = document.createElement('section');
    sec.className = 'lab-formula';
    sec.setAttribute('aria-label', 'Công thức và thế số');
    sec.innerHTML =
      '<div><h2>Công thức (formula)</h2></div>' +
      '<div class="lf-gen"></div>' +
      '<div class="lf-bar"><div><h2>Thế số từng bước</h2></div><span class="lf-count"></span></div>' +
      '<div class="lf-log" tabindex="0" role="log" aria-label="Nhật ký thế số"></div>';
    T.root.appendChild(sec);
    T.genEl = sec.querySelector('.lf-gen');
    T.logEl = sec.querySelector('.lf-log');
    T.cntEl = sec.querySelector('.lf-count');
    T.log = [];
    refreshFormulaUI(T);
  }

  function refreshGeneral(T) {
    if (!T.genEl || !T.sc || !T.tr) return;
    var f = generalFormulas(T);
    T.genEl.textContent = '';
    var rn = T.def.kind === 'rnn', names = rn ? RNN_PH : PH_NAME, cols = rn ? RNN_COL : PH_COL;
    for (var k = 0; k < f.length; k++) {
      var c = document.createElement('div');
      c.className = 'lf-chip';
      c.style.setProperty('--c', T.app.color(cols[k]));
      var h = document.createElement('b'); h.textContent = names[k];
      c.appendChild(h);
      f[k].split('\n').forEach(function (ln) { addLabelLines(c, [ln]); });
      T.genEl.appendChild(c);
    }
  }

  function refreshFormulaUI(T) {
    if (!T.logEl) return;
    if (!T.log.length) {
      T.logEl.textContent = '';
      var e = document.createElement('div'); e.className = 'lf-empty';
      e.textContent = 'Chưa có bước nào.';
      T.logEl.appendChild(e);
    }
    T.cntEl.textContent = T.log.length ? 'Đã có ' + T.log.length + ' ô' : '';
  }

  function clearLog(T) {
    T.hist = [];
    if (!T.logEl) return;
    T.log = [];
    refreshFormulaUI(T);
    refreshGeneral(T);
  }

  function pushCell(T, res, desc) {
    if (!T.logEl) return;
    if (!T.log.length) T.logEl.textContent = '';
    var n = T.log.length + 1;
    var cell = document.createElement('div');
    cell.className = 'lf-cell new';
    var rn = T.def.kind === 'rnn';
    cell.style.setProperty('--c', T.app.color(rn ? RNN_COL[res.phase] : PH_COL[res.phase]));
    var h = document.createElement('b'); h.className = 'lf-t';
    h.textContent = rn ? 'Bước ' + n + (res.s < 12 ? ' · t = ' + (res.t + 1) : '') + ' · ' + RNN_PH[res.phase]
      : 'Bước ' + n + ' · Epoch ' + res.epoch + ' · ' + PH_NAME[res.phase] + (desc ? ' · ' + desc : '');
    cell.appendChild(h);
    addLabelLines(cell, rn ? rnnCell(T, res) : stepCell(T, res));
    var first = T.logEl.firstChild;
    if (first && first.classList) first.classList.remove('new');
    T.logEl.insertBefore(cell, first);
    T.log.push(cell);
    if (T.logEl.scrollTop) T.logEl.scrollTop = 0;
    while (T.logEl.childNodes.length > 800) T.logEl.removeChild(T.logEl.lastChild);
    refreshFormulaUI(T);
  }

  function popCell(T) {
    var cell = T.log.pop();
    if (cell && cell.parentNode) cell.parentNode.removeChild(cell);
    var first = T.logEl && T.logEl.firstChild;
    if (first && first.classList && T.log.length) first.classList.add('new');
    refreshFormulaUI(T);
  }

  /* ---------- Lùi một bước ---------- */
  function undoTab(T) {
    if (!T.hist || !T.hist.length) return false;
    var app = T.app;
    if (app.pause) app.pause();
    var h = T.hist.pop();
    T.tr.restore(h.tr);
    T.ui = h.ui;
    T.ui.t0 = performance.now() - 1e7;           // đã "chạy xong" hoạt ảnh của trạng thái cũ
    app.stepCount = h.steps;
    app.highlight(h.hl); T.hl = h.hl;
    var st = T.root.querySelector('.vl-status');
    if (st) st.innerHTML = h.status;
    popCell(T);
    app.redraw();
    syncFabs();
    return true;
  }

  /* ======================================================================
     5c. Tab RNN: mạng hồi quy many-to-one trải theo thời gian (chỉ forward pass)
     14 bước: với mỗi t = 1..3 có 4 pha (Wₓxₜ, Wₕhₜ₋₁, aₜ, hₜ = tanh), rồi z và ŷ.
     ==================================================================== */
  function buildRnnTopo(R) {
    var dxT = 3.9, nodes = [], edges = [], byId = {}, yH = [1.1, -1.1], t, j, i;
    function add(n) { n.lane = 0; nodes.push(n); byId[n.id] = n; return n; }
    function xs(c) { return (c - 2) * dxT; }
    for (j = 0; j < 2; j++) add({ id: 'h:0:' + j, x: xs(0), y: yH[j], kind: 'h', t: 0, j: j, name: 'h' + sub(j + 1), r: 0.42 });
    for (t = 1; t <= 3; t++) {
      for (j = 0; j < 2; j++) add({ id: 'h:' + t + ':' + j, x: xs(t), y: yH[j], kind: 'h', t: t, j: j, name: 'h' + sub(j + 1), r: 0.42 });
      add({ id: 'x:' + t, x: xs(t) - 1.6, y: -3.7, kind: 'x', t: t, name: Rnn.V[R.tokens[t - 1]], r: 0.6 });
      for (j = 0; j < 2; j++) add({ id: 'b:' + t + ':' + j, x: xs(t), y: yH[j] + (j === 0 ? 1.3 : -1.3), kind: 'bias', t: t, j: j, name: 'b', r: 0.27 });
    }
    add({ id: 'o', x: xs(4), y: 0, kind: 'out', name: 'ŷ', r: 0.55 });
    for (t = 1; t <= 3; t++) {
      for (j = 0; j < 2; j++) {
        edges.push({ a: 'x:' + t, b: 'h:' + t + ':' + j, kind: 'Wx', t: t, j: j });
        edges.push({ a: 'b:' + t + ':' + j, b: 'h:' + t + ':' + j, kind: 'b', t: t, j: j });
        for (i = 0; i < 2; i++) edges.push({ a: 'h:' + (t - 1) + ':' + i, b: 'h:' + t + ':' + j, kind: 'Wh', t: t, i: i, j: j });
      }
    }
    for (i = 0; i < 2; i++) edges.push({ a: 'h:3:' + i, b: 'o', kind: 'Wo', i: i });
    var labels = [{ x: xs(0), text: 'h₀ (ban đầu)', short: 'h₀' }];
    for (t = 1; t <= 3; t++) labels.push({ x: xs(t) - 0.8, text: 't = ' + t + ' · ' + Rnn.V[R.tokens[t - 1]], short: 't=' + t });
    labels.push({ x: xs(4), text: 'Phân lớp', short: 'Ra' });
    return { nodes: nodes, edges: edges, byId: byId, Lw: 0, sizes: [5, 2, 1],
      seps: [xs(1) - 2.6, xs(2) - 2.6, xs(3) - 2.6, (xs(3) + xs(4)) / 2], guideLabels: labels };
  }

  /* Nét đứt phân tầng + tên tầng. seps/labels tính theo toạ độ thế giới nên đi theo khi kéo/thu phóng. */
  function drawGuides(T, ctx, H, seps, labels, st) {
    var view = T.app.view, yb = 0;
    T.topo.nodes.forEach(function (n) { yb = Math.max(yb, view.toScreen(n.x, n.y)[1] + n.r * view.scale); });
    var yTop = 74, yBot = Math.min(H - 166, yb + 46);
    ctx.save();
    ctx.strokeStyle = rgba(st.axis, 0.6); ctx.lineWidth = 1.5; ctx.setLineDash([7, 6]);
    seps.forEach(function (sx) {
      var px = view.toScreen(sx, 0)[0];
      ctx.beginPath(); ctx.moveTo(px, yTop); ctx.lineTo(px, yBot); ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.fillStyle = st.muted; ctx.font = '600 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    labels.forEach(function (lb, k) {
      var px = view.toScreen(lb.x, 0)[0];
      var left = k === 0 ? 0 : view.toScreen(seps[k - 1], 0)[0], right = k < seps.length ? view.toScreen(seps[k], 0)[0] : 1e9;
      var room = Math.min(right - left, 400) - 8;
      var txt = ctx.measureText(lb.text).width <= room ? lb.text : (lb.short || lb.text);
      ctx.fillText(txt, px, 66);
    });
    ctx.restore();
  }

  /* cột + đường phân tầng cho các tab MLP / neuron */
  function mlpGuides(T) {
    var topo = T.topo, Lw = topo.Lw, cols = [], l;
    for (l = 0; l <= Lw + 1; l++) {
      var ns = topo.nodes.filter(function (n) { return n.layer === l; }), sx = 0;
      ns.forEach(function (n) { sx += n.x; });
      cols.push(ns.length ? sx / ns.length : 0);
    }
    var labels = cols.map(function (cx, k) {
      var text = k === 0 ? 'Đầu vào (input)' : k === Lw ? 'Đầu ra (output)' : k === Lw + 1 ? 'Mất mát (loss)'
        : (Lw > 2 ? 'Lớp ẩn ' + k + ' (hidden)' : 'Lớp ẩn (hidden)');
      var short = k === 0 ? 'Vào' : k === Lw ? 'Ra' : k === Lw + 1 ? 'Loss' : 'Ẩn';
      return { x: cx, text: text, short: short };
    });
    var seps = [];
    for (l = 0; l < cols.length - 1; l++) seps.push((cols[l] + cols[l + 1]) / 2);
    return { seps: seps, labels: labels };
  }

  function resetRnn(T) {
    var app = T.app, sc = T.sc, R = sc.rnn;
    T.tr = { k: 0, done: function () { return this.k >= Rnn.STEPS; },
      snapshot: function () { return this.k; }, restore: function (s) { this.k = s; } };
    T.topo = buildRnnTopo(R);
    T.ui = { cur: -1, t0: 0, dur: 0, group: [], s: null };
    T.fitW = 0;
    app.highlight(-1); T.hl = -1;
    clearLog(T);
    syncFabs();
    app.status('<b>Sẵn sàng.</b> Câu đầu vào: (' + R.tokens.map(function (k) { return Rnn.V[k]; }).join(', ') + ').');
    app.redraw();
  }

  function rnnCell(T, res) {
    var R = T.sc.rnn, P = Rnn.P, t = res.t, ph = res.phase, L = [], j, i, terms;
    var tok = R.tokens[t], T1 = sub(t + 1);
    if (ph === 0) {
      L.push('#Wₓx' + T1 + ' = cột ' + (tok + 1) + ' của Wₓ (token "' + Rnn.V[tok] + '"),  x' + T1 + ' = ' + JSON.stringify(R.X[t]).replace(/,/g, ', '));
      for (j = 0; j < 2; j++) {
        terms = P.Wx[j].map(function (w, q) { return pn(w) + '×' + R.X[t][q]; }).join(' + ');
        L.push('(Wₓx' + T1 + ')' + sub(j + 1) + ' = ' + terms + ' = ' + fmt(R.Wxx[t][j]));
      }
      L.push('!Wₓx' + T1 + ' = ' + fv(R.Wxx[t]));
    } else if (ph === 1) {
      L.push('#Wₕh' + sub(t) + ' với h' + sub(t) + ' = ' + fv(R.H[t]));
      for (j = 0; j < 2; j++)
        L.push('(Wₕh' + sub(t) + ')' + sub(j + 1) + ' = ' + pn(P.Wh[j][0]) + '×' + pn(R.H[t][0]) + ' + ' + pn(P.Wh[j][1]) + '×' + pn(R.H[t][1]) + ' = ' + fmt(R.Whh[t][j]));
      L.push('!Wₕh' + sub(t) + ' = ' + fv(R.Whh[t]));
    } else if (ph === 2) {
      L.push('#a' + T1 + ' = Wₓx' + T1 + ' + Wₕh' + sub(t) + ' + b');
      for (j = 0; j < 2; j++)
        L.push('a' + T1 + sub(j + 1) + ' = ' + fmt(R.Wxx[t][j]) + ' + ' + pn(R.Whh[t][j]) + ' + ' + fmt(P.b[j]) + ' = ' + fmt(R.A[t][j]));
      L.push('!a' + T1 + ' = ' + fv(R.A[t]));
    } else if (ph === 3) {
      L.push('#h' + T1 + ' = tanh(a' + T1 + ')');
      for (j = 0; j < 2; j++) L.push('h' + T1 + sub(j + 1) + ' = tanh(' + fmt(R.A[t][j]) + ') = ' + fmt(R.H[t + 1][j]));
      L.push('!h' + T1 + ' = ' + fv(R.H[t + 1]));
    } else if (ph === 4) {
      var h3 = R.H[3];
      L.push('#z = Wout·h₃ + bout');
      L.push('z = ' + fmt(P.Wout[0]) + '×' + fmt(h3[0]) + ' + ' + pn(P.Wout[1]) + '×' + fmt(h3[1]) + ' + ' + fmt(P.bout));
      L.push('!z = ' + fmt(R.z));
    } else {
      L.push('#ŷ = sigmoid(z) = 1/(1 + e^(−z))');
      L.push('ŷ = 1/(1 + e^(' + (R.z < 0 ? '' : '−') + fmt(Math.abs(R.z)) + ')) = 1/(1 + ' + fmt(Math.exp(-R.z)) + ')');
      L.push('!ŷ = ' + fmt(R.yhat));
      L.push('ŷ ' + (R.yhat >= 0.5 ? '≥' : '<') + ' 0.5  →  dự đoán ' + RNN_CLASS[R.label]);
    }
    return L;
  }

  function rnnGeneral() {
    return [
      'Wₓxₜ = cột của Wₓ ứng với token wₜ\n(xₜ là one-hot, h₀ = [0, 0])',
      'Wₕhₜ₋₁',
      'aₜ = Wₓxₜ + Wₕhₜ₋₁ + b',
      'hₜ = tanh(aₜ)',
      'z = Wout·h₃ + bout',
      'ŷ = sigmoid(z) = 1/(1 + e⁻ᶻ)\nŷ ≥ 0.5 → lớp 1, ngược lại lớp 0'
    ];
  }

  function stepRnn(T) {
    var app = T.app, tr = T.tr, ui = T.ui;
    if (tr.done()) { app.status('<b>Đã chạy xong forward pass.</b>'); return false; }
    var stEl = T.root.querySelector('.vl-status');
    T.hist.push({ tr: tr.snapshot(), ui: Object.assign({}, ui, { group: [] }), status: stEl ? stEl.innerHTML : '', hl: T.hl, steps: app.stepCount });
    var s = tr.k; tr.k++;
    var t = s < 12 ? Math.floor(s / 4) : 2, ph = s < 12 ? s % 4 : 4 + (s - 12);
    ui.cur = ph; ui.s = s; ui.t0 = performance.now(); ui.dur = animDur(T);
    var hl = ph < 4 ? ph + 2 : (ph === 4 ? 6 : 7);
    app.highlight(hl); T.hl = hl;
    var res = { phase: ph, t: t, s: s };
    var body = rnnCell(T, res).map(function (ln) {
      var c = ln.charAt(0);
      return (c === '#' || c === '!' ? ln.slice(1) : ln).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }).join('; ');
    app.status('<b>' + (s < 12 ? 't = ' + (t + 1) + ' · ' : '') + RNN_PH[ph] + '.</b> ' + body);
    pushCell(T, res, '');
    syncFabs();
    return !tr.done();
  }

  function drawRnn(T, ctx, W, H) {
    var app = T.app, view = app.view, ui = T.ui, tr = T.tr, topo = T.topo, R = T.sc.rnn, done = tr.k;
    var full = app.param('detail') >= 1, items = [], P = Rnn.P;
    var now = performance.now();
    var p = (ui.cur < 0 || ui.dur <= 0) ? 1 : clamp((now - ui.t0) / (ui.dur * 1000), 0, 1);
    var C = { fwd: app.color(0), loss: app.color(1), upd: app.color(2), bwd: app.color(3), inp: app.color(4), hid: app.color(5) };
    var fg = app.css('--vl-fg'), muted = app.css('--vl-muted'), axis = app.css('--vl-axis'), bg = app.css('--vl-bg'), line = app.css('--vl-line');
    function phCol(ph) { return app.color(RNN_COL[ph]); }
    var cs = ui.cur >= 0 && ui.s != null ? ui.s : -1;
    var cT = cs >= 0 && cs < 12 ? Math.floor(cs / 4) : -1;
    var col = cs >= 0 ? phCol(ui.cur) : C.fwd;
    function known(t, q) { return done > 4 * t + q; }
    var zKnown = done > 12, yKnown = done > 13;
    function P2(n) { return view.toScreen(n.x, n.y); }

    drawGuides(T, ctx, H, topo.seps, topo.guideLabels, { axis: axis, muted: muted });

    ctx.font = '11px system-ui,sans-serif';
    /* ---------- cạnh ---------- */
    topo.edges.forEach(function (e) {
      var a = topo.byId[e.a], b = topo.byId[e.b], pa = P2(a), pb = P2(b);
      var dx = pb[0] - pa[0], dy = pb[1] - pa[1], len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      var s0 = [pa[0] + ux * a.r * view.scale, pa[1] + uy * a.r * view.scale], t0 = [pb[0] - ux * b.r * view.scale, pb[1] - uy * b.r * view.scale];
      var wv, active = false, name;
      if (e.kind === 'Wx') { wv = P.Wx[e.j][R.tokens[e.t - 1]]; active = cs === 4 * (e.t - 1); name = 'Wₓ' + sub(e.j + 1) + sub(R.tokens[e.t - 1] + 1); }
      else if (e.kind === 'Wh') { wv = P.Wh[e.j][e.i]; active = cs === 4 * (e.t - 1) + 1; name = 'Wₕ' + sub(e.j + 1) + sub(e.i + 1); }
      else if (e.kind === 'b') { wv = P.b[e.j]; active = cs === 4 * (e.t - 1) + 2; }
      else { wv = P.Wout[e.i]; active = cs === 12; name = 'Wout' + sub(e.i + 1); }
      var lw = 1.4 + Math.min(4.5, Math.abs(wv) * 2.2);
      ctx.save();
      ctx.lineCap = 'round'; ctx.strokeStyle = rgba(axis, 0.85); ctx.lineWidth = lw;
      if (wv < 0 && e.kind !== 'b') ctx.setLineDash([7, 5]);
      ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(t0[0], t0[1]); ctx.stroke();
      ctx.setLineDash([]);
      if (active && cs >= 0) {
        var tw = p, hx = s0[0] + (t0[0] - s0[0]) * tw, hy = s0[1] + (t0[1] - s0[1]) * tw;
        ctx.strokeStyle = rgba(col, tw >= 1 ? 0.8 * (1 - clamp((p - 0.8) / 0.2, 0, 1)) : 0.95); ctx.lineWidth = lw + 2.4;
        ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(hx, hy); ctx.stroke();
        if (tw > 0 && tw < 1) {
          ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(hx, hy, 2.4, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
      if (e.kind !== 'b' && (full || active)) {
        var f = e.kind === 'Wo' ? 0.5 : (e.kind === 'Wh' ? (e.i === e.j ? 0.36 : 0.64) : (e.j === 0 ? 0.25 : 0.4));
        var txt = name + '=' + fmt(wv);
        items.push({ type: 'lab', lines: [txt], w: ctx.measureText(txt).width + 10, h: 18, ax: s0[0] + (t0[0] - s0[0]) * f, ay: s0[1] + (t0[1] - s0[1]) * f - 7,
          on: true, edge: active ? col : line });
      }
    });

    /* ---------- nút ---------- */
    topo.nodes.forEach(function (n) {
      var pp = P2(n), r = n.r * view.scale, ncol, lines = [], level = 0.2, ring = -1;
      if (n.kind === 'x') {
        ncol = C.inp;
        ctx.font = '600 ' + clamp(r * 0.8, 10, 15) + 'px system-ui,sans-serif';
        var pw = Math.max(2 * r, ctx.measureText(n.name).width + 16), ph2 = 1.5 * r;
        ctx.beginPath(); ctx.roundRect(pp[0] - pw / 2, pp[1] - ph2 / 2, pw, ph2, 8);
        ctx.fillStyle = rgba(ncol, 0.22); ctx.fill(); ctx.lineWidth = 2.6; ctx.strokeStyle = ncol; ctx.stroke();
        ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n.name, pp[0], pp[1] + 0.5);
        lines.push('x' + sub(n.t) + '=' + JSON.stringify(R.X[n.t - 1]).replace(/,/g, ','));
      } else {
        if (n.kind === 'h') {
          ncol = C.hid;
          var t0i = n.t - 1;
          if (n.t === 0) { level = 0.2; lines.push('h₀=0'); }
          else {
            var q = known(t0i, 3) ? 3 : known(t0i, 2) ? 2 : known(t0i, 1) ? 1 : known(t0i, 0) ? 0 : -1;
            var vals = [R.Wxx[t0i][n.j], R.Whh[t0i][n.j], R.A[t0i][n.j], R.H[n.t][n.j]];
            var names = ['Wₓx', 'Wₕh', 'a', 'h'];
            if (q >= 0) {
              level = q === 3 ? clamp(Math.abs(vals[3]), 0, 1) : 0.35;
              if (full) { for (var m = 0; m <= q; m++) lines.push(names[m] + '=' + fmt(vals[m])); }
              else lines.push(names[q] + '=' + fmt(vals[q]));
            } else lines.push('…');
            if (cs >= 0 && cs === 4 * t0i + 3) ring = p;
          }
        } else if (n.kind === 'bias') {
          ncol = axis; lines.push('b' + sub(n.j + 1) + '=' + fmt(P.b[n.j]));
        } else {
          ncol = C.fwd;
          if (zKnown) { lines.push('z=' + fmt(R.z)); level = 0.4; }
          if (yKnown) { lines.push('ŷ=' + fmt(R.yhat)); lines.push(RNN_CLASS[R.label]); level = clamp(R.yhat, 0, 1); }
          if (!zKnown) lines.push('…');
          if (cs === 12 || cs === 13) ring = p;
        }
        ctx.save();
        if (ring >= 0) {
          ctx.strokeStyle = rgba(col, 0.6 * (1 - ring)); ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.arc(pp[0], pp[1], r + 3 + ring * 13, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(pp[0], pp[1], r, 0, Math.PI * 2);
        ctx.fillStyle = rgba(ncol, n.kind === 'bias' ? 0.14 : 0.16 + 0.5 * level); ctx.fill();
        ctx.lineWidth = n.kind === 'bias' ? 2 : 2.8; ctx.strokeStyle = ncol; ctx.stroke();
        ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '600 ' + clamp(r * 0.78, 10, 16) + 'px system-ui,sans-serif';
        ctx.fillText(n.name, pp[0], pp[1] + 0.5);
        ctx.restore();
      }
      ctx.font = '11px system-ui,sans-serif';
      if (lines.length) {
        var lw2 = 0;
        lines.forEach(function (tx) { lw2 = Math.max(lw2, ctx.measureText(tx).width); });
        var bw = lw2 + 8, bh = lines.length * 14;
        var below = n.kind === 'bias' && n.j === 0 ? -1 : 1;
        var yoff = n.kind === 'x' ? 1.5 * r / 2 + 4 : r + 4;
        items.push({ type: 'txt', lines: lines, w: bw, h: bh, ax: pp[0], ay: pp[1] + below * (yoff + bh / 2), on: true });
      }
    });

    var circles = topo.nodes.map(function (n) { var q = P2(n); return { x: q[0], y: q[1], r: (n.kind === 'x' ? n.r * 0.9 : n.r) * view.scale + 3 }; });
    placeItems(items, circles, W, H);
    drawItems(ctx, items, bg, fg);

    /* ---------- 6 ô pha ---------- */
    var pad = 12, gap = 6, cw = (W - 2 * pad - 5 * gap) / 6, ch = 28, k;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (k = 0; k < 6; k++) {
      var cx = pad + k * (cw + gap), cy = 10, cc = phCol(k);
      var state = (cs >= 0 && k === ui.cur) ? 'on' : (cs >= 0 && (cs >= 12 ? k < ui.cur : (k < ui.cur && cs < 12))) ? 'done' : 'idle';
      ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 8);
      if (state === 'on') { ctx.fillStyle = cc; ctx.fill(); }
      else if (state === 'done') { ctx.fillStyle = rgba(cc, 0.22); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = cc; ctx.stroke(); }
      else { ctx.lineWidth = 1.5; ctx.strokeStyle = line; ctx.stroke(); }
      ctx.font = '600 ' + (cw < 70 ? 10.5 : 12) + 'px system-ui,sans-serif';
      ctx.fillStyle = state === 'on' ? onColor(cc) : state === 'done' ? fg : muted;
      ctx.fillText(RNN_CHIP[k], cx + cw / 2, cy + ch / 2 + 0.5);
      if (state === 'on' && p < 1) { ctx.fillStyle = rgba(onColor(cc), 0.65); ctx.fillRect(cx + 8, cy + ch - 5, (cw - 16) * p, 3); }
    }
    ctx.textAlign = 'left'; ctx.font = '12px system-ui,sans-serif'; ctx.fillStyle = fg;
    ctx.fillText('Câu: (' + R.tokens.map(function (q2) { return Rnn.V[q2]; }).join(', ') + ')' + (cs >= 0 ? ' · ' + (cs < 12 ? 'thời điểm t = ' + (cT + 1) : 'phân lớp') + ' · bước ' + done + '/' + Rnn.STEPS : ''), pad, 52);

    drawRnnStrip(T, ctx, W, H, { C: C, fg: fg, muted: muted, axis: axis, bg: bg, line: line, known: known, zKnown: zKnown, yKnown: yKnown, R: R, full: full });
  }

  function drawRnnStrip(T, ctx, W, H, st) {
    var pad = 12, sh = 150, y0 = H - sh - 10, R = st.R, C = st.C;
    var lw = Math.round((W - 3 * pad) * 0.6), rw = W - 3 * pad - lw;
    box(ctx, pad, y0, lw, sh, 'Hidden state theo thời gian (h₁ ▮, h₂ ▮ trong khoảng −1 đến 1)', st);
    var ix = pad + 14, iw = lw - 28, iy = y0 + 26, ih = sh - 50, zero = iy + ih / 2, k, j;
    ctx.strokeStyle = st.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ix, zero); ctx.lineTo(ix + iw, zero); ctx.stroke();
    var gw = iw / 4;
    ctx.font = '10px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (k = 0; k < 4; k++) {
      var gx = ix + gw * k + gw / 2, ok = k === 0 || st.known(k - 1, 3);
      ctx.fillStyle = st.muted; ctx.fillText('h' + sub(k), gx, iy + ih + 12);
      for (j = 0; j < 2; j++) {
        if (!ok) continue;
        var v = R.H[k][j], bh = clamp(v, -1, 1) * (ih / 2 - 4), bx = gx + (j === 0 ? -17 : 3);
        ctx.fillStyle = j === 0 ? C.fwd : C.upd;
        ctx.fillRect(bx, bh >= 0 ? zero - bh : zero, 14, Math.max(1, Math.abs(bh)));
        if (st.full) { ctx.fillStyle = st.fg; ctx.fillText(fmt(v, 2), bx + 7, bh >= 0 ? zero - bh - 7 : zero - bh + 7); }
      }
    }
    var rx = pad * 2 + lw;
    box(ctx, rx, y0, rw, sh, 'Đầu ra: ŷ so với ngưỡng 0.5', st);
    var gx0 = rx + 16, gw2 = rw - 32, gy = y0 + 58;
    ctx.fillStyle = rgba(st.axis, 0.25); ctx.fillRect(gx0, gy - 6, gw2, 12);
    ctx.strokeStyle = st.fg; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(gx0 + gw2 / 2, gy - 14); ctx.lineTo(gx0 + gw2 / 2, gy + 14); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = st.muted; ctx.textAlign = 'center'; ctx.fillText('0', gx0, gy + 22); ctx.fillText('0.5', gx0 + gw2 / 2, gy + 22); ctx.fillText('1', gx0 + gw2, gy + 22);
    ctx.font = '11px system-ui,sans-serif'; ctx.textAlign = 'left';
    if (st.yKnown) {
      var mx = gx0 + gw2 * clamp(R.yhat, 0, 1);
      ctx.fillStyle = R.label ? C.upd : C.loss; ctx.beginPath(); ctx.arc(mx, gy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = st.fg; ctx.stroke();
      ctx.fillStyle = st.fg; ctx.fillText('z=' + fmt(R.z) + '   ŷ=' + fmt(R.yhat), gx0, y0 + sh - 30);
      ctx.fillText('Dự đoán: ' + RNN_CLASS[R.label], gx0, y0 + sh - 14);
    } else {
      ctx.fillStyle = st.muted; ctx.fillText(st.zKnown ? 'z=' + fmt(R.z) + ' (chưa qua sigmoid)' : 'Chưa tính', gx0, y0 + sh - 22);
    }
  }

  /* ======================================================================
     6. Khởi tạo: thanh tab + 6 ứng dụng
     ==================================================================== */
  function init() {
  var nav = document.createElement('nav');
  nav.className = 'lab-tabs';
  nav.setAttribute('aria-label', 'Các bài mô phỏng');
  var navIn = document.createElement('div');
  navIn.className = 'lab-tabs-in';
  navIn.setAttribute('role', 'tablist');
  nav.appendChild(navIn);
  document.body.appendChild(nav);

  TABS.forEach(function (def, idx) {
    var T = { def: def, idx: idx, ui: null, tr: null, topo: null, app: null, root: null, fitW: 0, fitH: 0, busy: false };
    tabs.push(T);
    var btn = document.createElement('button');
    btn.className = 'lab-tab'; btn.type = 'button'; btn.id = 'lab-tab-' + idx;
    btn.setAttribute('role', 'tab'); btn.setAttribute('aria-controls', 'lab-panel-' + idx);
    btn.style.setProperty('--c', def.color);
    btn.innerHTML = '<span class="n">' + (idx + 1) + '</span><span class="t"></span>';
    btn.querySelector('.t').textContent = def.label;
    btn.addEventListener('click', function () { selectTab(idx, true); });
    navIn.appendChild(btn);
    T.btn = btn;

    T.app = VLab.create({
      title: def.h1, stage: '2d', height: 640,
      view: { cx: 0, cy: 0, scale: 50 },
      params: def.params, player: true, code: def.code,
      onReset: function (app) { T.app = app; resetTab(T); },
      onParam: function (id, v) { paramChanged(T, id, v); },
      onStep: function () { return stepTab(T); },
      onDraw: function (ctx) { drawTab(T, ctx); }
    });
    T.root = T.app.stageEl.closest('.vl-app');
    T.root.id = 'lab-panel-' + idx;
    T.root.setAttribute('role', 'tabpanel');
    T.root.setAttribute('aria-labelledby', 'lab-tab-' + idx);
    /* thời gian mỗi bước tính bằng giây (0.1 – 1.5); khung gốc nhận "bước/giây" nên đổi ngược 1/giây */
    var sp = T.root.querySelector('.vl-speed');
    T.sec = 0.5;
    if (sp) {
      var spRow = sp.closest('.vl-row');
      spRow.style.display = 'none';
      sp.min = '0.1'; sp.step = 'any'; sp.value = String(1 / T.sec);
      var row2 = document.createElement('div');
      row2.className = 'vl-row'; row2.style.marginTop = '12px';
      row2.innerHTML = '<div class="vl-lab"><span>Thời gian mỗi bước (giây)</span><span class="lab-sec-val">0.5 giây</span></div>' +
        '<input type="range" class="lab-sec" min="0.1" max="3" step="0.1" value="0.5" aria-label="Thời gian mỗi bước, tính bằng giây">';
      spRow.parentNode.insertBefore(row2, spRow.nextSibling);
      var secIn = row2.querySelector('.lab-sec'), secVal = row2.querySelector('.lab-sec-val');
      secIn.addEventListener('input', function () {
        var v = Math.max(0.1, parseFloat(secIn.value) || 0.5);
        T.sec = v; sp.value = String(1 / v); secVal.textContent = v.toFixed(1) + ' giây';
      });
    }
    /* thanh trượt trả phím ←/→ về cho nút Lùi/Tiếp sau khi thả chuột */
    Array.prototype.forEach.call(T.root.querySelectorAll('input[type=range]'), function (r) {
      r.addEventListener('change', function () { if (r.blur) r.blur(); });
    });
    T.hist = [];
    buildFormulaSection(T);
    refreshGeneral(T);

    /* kéo từng nút bằng chuột */
    var drag = null;
    T.app.view.onPointerDown = function (px, py) {
      var w = T.app.view.toWorld(px, py), ns = T.topo.nodes;
      for (var i = ns.length - 1; i >= 0; i--) {
        if (Math.hypot(ns[i].x - w[0], ns[i].y - w[1]) < Math.max(ns[i].r, 0.3) + 0.08) { drag = ns[i]; return true; }
      }
      return false;
    };
    T.app.view.onPointerMove = function (px, py) {
      if (!drag) return;
      var w = T.app.view.toWorld(px, py);
      drag.x = w[0]; drag.y = w[1];
      T.app.redraw();
    };
    T.app.view.onPointerUp = function () { drag = null; };
  });

  function selectTab(i, focus) {
    var prev = activeTab;
    if (prev && prev.app.pause && prev !== tabs[i]) prev.app.pause();
    activeTab = tabs[i];
    tabs.forEach(function (T, k) {
      var on = k === i;
      T.root.hidden = !on;
      T.btn.setAttribute('aria-selected', on ? 'true' : 'false');
      T.btn.tabIndex = on ? 0 : -1;
    });
    activeTab.fitW = 0;
    activeTab.app.redraw();
    syncFabs();
    if (focus) activeTab.btn.focus();
    try { localStorage.setItem('lab-nn-tab', String(i)); } catch (e) { /* bỏ qua */ }
    var bar = activeTab.btn;
    if (bar.scrollIntoView) bar.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  /* hai nút nổi hai bên màn hình + phím ← → */
  function mkFab(cls, arrow, text, label, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'lab-fab ' + cls; b.setAttribute('aria-label', label); b.title = label;
    b.innerHTML = '<span class="a"></span><span class="t"></span>';
    b.querySelector('.a').textContent = arrow; b.querySelector('.t').textContent = text;
    b.addEventListener('click', fn);
    document.body.appendChild(b);
    return b;
  }
  function goBack() { if (activeTab) undoTab(activeTab); }
  function goNext() {
    if (!activeTab) return;
    var btn = activeTab.root.querySelector('.vl-step');
    if (btn) btn.click();
  }
  fabL = mkFab('lab-fab-l', '◀', 'Lùi', 'Lùi một bước (phím ←)', goBack);
  fabR = mkFab('lab-fab-r', '▶', 'Tiếp', 'Bước tiếp (phím →)', goNext);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.defaultPrevented) return;
    var t = e.target;
    if (t && t.closest && t.closest('input[type=range], input[type=text], input[type=number], textarea, select, [contenteditable="true"]')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft') goBack(); else goNext();
  });

  var start = 0;
  try { var s = parseInt(localStorage.getItem('lab-nn-tab'), 10); if (s >= 0 && s < tabs.length) start = s; } catch (e) { /* bỏ qua */ }
  selectTab(start, false);

  /* vòng cập nhật khung hình: chỉ vẽ lại khi pha đang chuyển động */
  function loop() {
    requestAnimationFrame(loop);
    var T = activeTab;
    if (!T || !T.ui || T.ui.cur < 0) return;
    if (performance.now() - T.ui.t0 < T.ui.dur * 1000 + 60) T.app.redraw();
  }
  requestAnimationFrame(loop);

  /* nền sáng là mặc định; nút "Sáng/Tối" của khung vẽ vẫn đổi được */
  if (!document.documentElement.getAttribute('data-vl-theme')) document.documentElement.setAttribute('data-vl-theme', 'light');
  if (activeTab) activeTab.app.redraw();
  }

  if (document.body) init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
