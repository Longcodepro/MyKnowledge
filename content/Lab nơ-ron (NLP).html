<style>

  max-width: 1180px; margin: 0 auto; padding-block: 14px 32px;

}

.lab-tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;

}

  max-width: 1180px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 7px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--vl-line, #d9dde3); background: var(--vl-panel, #f6f7f9); color: var(--vl-fg, #14181d);

}
.lab-tab .n {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums;
}
.lab-tab:hover { border-color: var(--c); }
.lab-tab[aria-selected="true"] { background: var(--c); border-color: var(--c); color: #fff; }

/* Nút Lùi / Tiếp nổi hai bên màn hình, luôn nằm trong tầm nhìn */

  position: fixed; top: 50%; transform: translateY(-50%); z-index: 30;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  width: 46px; padding: 12px 0; border-radius: 14px; cursor: pointer;
  border: 2px solid var(--c, #2563eb); background: var(--vl-panel, #f6f7f9); color: var(--c, #2563eb);

}

@media (prefers-reduced-motion: reduce) { .lab-fab { transition: none; } }

<script>
/* === core/base.js (khung visual-lab, giữ nguyên) === */
/* ============================================================================
   VLab — khung dùng chung cho mọi trang mô phỏng bài học IT/AI
   ----------------------------------------------------------------------------
   Dán TOÀN BỘ file này vào thẻ <script> của trang HTML xuất ra.
   Không phụ thuộc thư viện ngoài. Chạy được offline.

   Cung cấp sẵn:
     - Chủ đề sáng/tối tự theo hệ thống + nút đổi
     - 4 bảng màu (có 1 bảng thân thiện với người mù màu)
     - Zoom bằng con lăn, kéo để di chuyển, nút đặt lại khung nhìn
     - Thanh trượt tham số
     - Bộ chạy: Chạy / Tạm dừng / Bước tiếp / Làm lại + thanh tốc độ
     - Ô nhập công thức (parser an toàn, KHÔNG dùng eval)
     - Khung mã giả tiếng Việt có tô sáng dòng đang chạy
     - Ô "Đang xảy ra gì?" và ô "Vì sao?"

   API chính:  const app = VLab.create({...});   xem phần cuối file.
   ========================================================================== */
(function (global) {
  'use strict';

  const VLab = {};

  /* ==========================================================================
     1. BẢNG MÀU
     ========================================================================== */
  const PALETTES = {
    'Mặc định':      ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed', '#0891b2'],
    'Dịu mắt':       ['#4f6d7a', '#c07a5c', '#6a8d73', '#a4789a', '#8c7851', '#5a7d9a'],
    'Tương phản cao':['#0040ff', '#ff0040', '#00a000', '#ff8000', '#8000ff', '#00a0a0'],
    'Thân thiện mù màu': ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#56B4E9', '#D55E00']
  };
  let paletteName = 'Mặc định';

  /* ==========================================================================
     2. CSS — nhúng một lần
     ========================================================================== */
  const CSS = `
  :root{
    --vl-bg:#ffffff; --vl-panel:#f6f7f9; --vl-fg:#14181d; --vl-muted:#5d6670;
    --vl-line:#d9dde3; --vl-accent:#2563eb; --vl-grid:#e8ebef; --vl-axis:#9aa3ad;
    --vl-hl:#fff3bf; --vl-hl-fg:#5c4600;
  }
  :root[data-vl-theme="dark"]{
    --vl-bg:#13161a; --vl-panel:#1b1f25; --vl-fg:#e8ecf1; --vl-muted:#9aa5b1;
    --vl-line:#2b323b; --vl-accent:#5b9dff; --vl-grid:#22272e; --vl-axis:#5d6670;
    --vl-hl:#3a3414; --vl-hl-fg:#ffe79a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-vl-theme="light"]){
      --vl-bg:#13161a; --vl-panel:#1b1f25; --vl-fg:#e8ecf1; --vl-muted:#9aa5b1;
      --vl-line:#2b323b; --vl-accent:#5b9dff; --vl-grid:#22272e; --vl-axis:#5d6670;
      --vl-hl:#3a3414; --vl-hl-fg:#ffe79a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--vl-bg);color:var(--vl-fg);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .vl-app{max-width:1180px;margin:0 auto;padding:16px;}
  .vl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .vl-title{font-size:18px;font-weight:650;margin:0;flex:1 1 220px;}
  .vl-head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .vl-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
  @media (max-width:860px){ .vl-main{grid-template-columns:1fr;} }
  .vl-stage-wrap{position:relative;border:1px solid var(--vl-line);border-radius:10px;
    overflow:hidden;background:var(--vl-panel);}
  .vl-stage{display:block;width:100%;height:auto;touch-action:none;cursor:grab;}
  .vl-stage.dragging{cursor:grabbing;}
  .vl-status{padding:10px 12px;border-top:1px solid var(--vl-line);background:var(--vl-bg);
    font-size:14px;min-height:42px;color:var(--vl-fg);}
  .vl-status b{color:var(--vl-accent);}
  .vl-side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .vl-card{border:1px solid var(--vl-line);border-radius:10px;background:var(--vl-panel);padding:12px;}
  .vl-card h3{margin:0 0 8px;font-size:13px;font-weight:650;text-transform:uppercase;
    letter-spacing:.04em;color:var(--vl-muted);}
  .vl-row{margin-bottom:12px;}
  .vl-row:last-child{margin-bottom:0;}
  .vl-lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px;}
  .vl-lab span:last-child{font-variant-numeric:tabular-nums;color:var(--vl-accent);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--vl-accent);margin:0;}
  .vl-btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;
    border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);}
  .vl-btn:hover{border-color:var(--vl-accent);}
  .vl-btn.primary{background:var(--vl-accent);border-color:var(--vl-accent);color:#fff;}
  .vl-btns{display:flex;gap:6px;flex-wrap:wrap;}
  select,input[type=text]{font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;
    border:1px solid var(--vl-line);background:var(--vl-bg);color:var(--vl-fg);width:100%;}
  .vl-head-tools select{width:auto;}
  .vl-err{color:#dc2626;font-size:12px;margin-top:4px;min-height:16px;}
  :root[data-vl-theme="dark"] .vl-err{color:#ff8080;}
  .vl-code{margin:0;font:12.5px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;
    counter-reset:vlline;max-height:260px;overflow:auto;}
  .vl-code div{padding:1px 6px;border-radius:4px;white-space:pre-wrap;color:var(--vl-muted);}
  .vl-code div.on{background:var(--vl-hl);color:var(--vl-hl-fg);font-weight:600;}
  .vl-why{font-size:13.5px;color:var(--vl-fg);}
  .vl-why p{margin:0 0 8px;} .vl-why p:last-child{margin:0;}
  .vl-hint{font-size:12px;color:var(--vl-muted);margin-top:6px;}
  `;

  function injectCSS() {
    if (document.getElementById('vl-css')) return;
    const s = document.createElement('style');
    s.id = 'vl-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ==========================================================================
     3. PARSER CÔNG THỨC — an toàn, không dùng eval()
     Hỗ trợ: + - * / ^ ( ) , số, biến, hàm dựng sẵn, hằng pi/e
     Dùng:  const f = VLab.compile('x^2 + 3*x', ['x']);  f({x:2}) -> 10
     ========================================================================== */
  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    exp: Math.exp, sqrt: Math.sqrt, abs: Math.abs,
    log: Math.log, ln: Math.log, log10: Math.log10, log2: Math.log2,
    floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign,
    min: Math.min, max: Math.max, pow: Math.pow, atan2: Math.atan2,
    relu: function (v) { return v > 0 ? v : 0; },
    sigmoid: function (v) { return 1 / (1 + Math.exp(-v)); }
  };
  const CONSTS = { pi: Math.PI, e: Math.E };

  function tokenize(src) {
    const out = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < src.length && /[0-9.]/.test(src[j])) j++;
        const num = parseFloat(src.slice(i, j));
        if (isNaN(num)) throw new Error('Số không hợp lệ: ' + src.slice(i, j));
        out.push({ t: 'num', v: num });
        i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i;
        while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
        out.push({ t: 'name', v: src.slice(i, j) });
        i = j; continue;
      }
      if ('+-*/^(),'.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      throw new Error('Ký tự lạ: "' + c + '"');
    }
    return out;
  }

  // Chuyển sang hậu tố bằng thuật toán sân ga (shunting-yard)
  function toRPN(tokens) {
    // Dấu trừ đứng trước (u-) nằm giữa */ và ^, nên -x^2 = -(x^2)
    const prec = { '+': 1, '-': 1, '*': 2, '/': 2, 'u-': 2.5, '^': 3 };
    const right = { '^': true, 'u-': true };
    const out = [], ops = [];
    let prev = null;
    for (let k = 0; k < tokens.length; k++) {
      const tk = tokens[k];
      if (tk.t === 'num') { out.push(tk); }
      else if (tk.t === 'name') {
        if (tokens[k + 1] && tokens[k + 1].t === '(') ops.push({ t: 'fn', v: tk.v, argc: 1 });
        else out.push(tk);
      }
      else if (tk.t === ',') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Dấu phẩy đặt sai chỗ');
        for (let m = ops.length - 2; m >= 0; m--) {
          if (ops[m].t === 'fn') { ops[m].argc++; break; }
          if (ops[m].t === '(') break;
        }
      }
      else if (tk.t === '(') { ops.push(tk); }
      else if (tk.t === ')') {
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('Thiếu dấu mở ngoặc');
        ops.pop();
        if (ops.length && ops[ops.length - 1].t === 'fn') out.push(ops.pop());
      }
      else {
        let op = tk.t;
        const unary = (op === '-' || op === '+') &&
          (prev === null || prev.t === '(' || prev.t === ',' ||
            '+-*/^'.indexOf(prev.t) >= 0);
        if (unary) {
          // dấu đứng trước toán hạng: không đẩy toán tử nào ra, chỉ xếp vào chồng
          if (op === '+') { prev = tk; continue; }
          ops.push({ t: 'u-' }); prev = tk; continue;
        }
        while (ops.length) {
          const top = ops[ops.length - 1];
          const topOp = top.t === 'fn' ? null : top.t;
          if (topOp && topOp !== '(' &&
            (prec[topOp] > prec[op] || (prec[topOp] === prec[op] && !right[op]))) {
            out.push(ops.pop());
          } else break;
        }
        ops.push({ t: op });
      }
      prev = tk;
    }
    while (ops.length) {
      const top = ops.pop();
      if (top.t === '(') throw new Error('Thiếu dấu đóng ngoặc');
      out.push(top);
    }
    return out;
  }

  /**
   * Biên dịch một biểu thức thành hàm.
   * @param {string} src  ví dụ 'x^2 + 3*x'
   * @param {string[]} vars  tên các biến được phép, ví dụ ['x'] hoặc ['x','y']
   * @returns {function(Object): number}
   */
  VLab.compile = function (src, vars) {
    vars = vars || ['x'];
    const rpn = toRPN(tokenize(String(src)));
    // Kiểm tra ngay lúc biên dịch: tên lạ, và biểu thức thiếu/thừa toán hạng
    let depth = 0;
    for (const tk of rpn) {
      if (tk.t === 'name' && vars.indexOf(tk.v) < 0 && !(tk.v in CONSTS))
        throw new Error('Không hiểu "' + tk.v + '"');
      if (tk.t === 'fn' && !(tk.v in FUNCS))
        throw new Error('Không có hàm "' + tk.v + '"');
      if (tk.t === 'num' || tk.t === 'name') depth += 1;
      else if (tk.t === 'u-') depth += 0;
      else if (tk.t === 'fn') depth += 1 - tk.argc;
      else depth -= 1;
      if (depth < 1) throw new Error('Biểu thức thiếu toán hạng');
    }
    if (depth !== 1) throw new Error('Biểu thức chưa hoàn chỉnh');
    return function (scope) {
      const st = [];
      for (const tk of rpn) {
        if (tk.t === 'num') st.push(tk.v);
        else if (tk.t === 'name') st.push(tk.v in CONSTS ? CONSTS[tk.v] : (scope[tk.v] || 0));
        else if (tk.t === 'u-') st.push(-st.pop());
        else if (tk.t === 'fn') {
          const args = st.splice(st.length - tk.argc, tk.argc);
          st.push(FUNCS[tk.v].apply(null, args));
        } else {
          const b = st.pop(), a = st.pop();
          st.push(tk.t === '+' ? a + b : tk.t === '-' ? a - b :
            tk.t === '*' ? a * b : tk.t === '/' ? a / b : Math.pow(a, b));
        }
      }
      return st.pop();
    };
  };

  /** Đạo hàm số (dùng khi không có công thức đạo hàm) */
  VLab.deriv = function (f, scope, varName, h) {
    h = h || 1e-5;
    const s1 = Object.assign({}, scope), s2 = Object.assign({}, scope);
    s1[varName] = scope[varName] + h;
    s2[varName] = scope[varName] - h;
    return (f(s1) - f(s2)) / (2 * h);
  };

  /* ==========================================================================
     4. KHUNG NHÌN 2D — zoom bằng con lăn, kéo để di chuyển
     ========================================================================== */
  function makeView2D(canvas, opts, onChange) {
    opts = opts || {};
    const home = {
      cx: opts.cx || 0,                  // toạ độ thế giới ở giữa khung
      cy: opts.cy || 0,
      scale: opts.scale || 40            // số pixel cho 1 đơn vị thế giới
    };
    const v = { cx: home.cx, cy: home.cy, scale: home.scale };

    function toScreen(x, y) {
      return [canvas.clientWidth / 2 + (x - v.cx) * v.scale,
              canvas.clientHeight / 2 - (y - v.cy) * v.scale];
    }
    function toWorld(px, py) {
      return [(px - canvas.clientWidth / 2) / v.scale + v.cx,
              -(py - canvas.clientHeight / 2) / v.scale + v.cy];
    }

    // Bài có thể gán v.onPointerDown / onPointerMove / onPointerUp để tự xử lý
    // (ví dụ kéo một nút của đồ thị). onPointerDown trả về true thì khung nhìn
    // không kéo theo. Toạ độ truyền vào là pixel trong canvas.
    let drag = null, grabbed = false;
    function local(e) {
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }
    canvas.addEventListener('pointerdown', function (e) {
      canvas.setPointerCapture(e.pointerId);
      if (v.onPointerDown) {
        const p = local(e);
        if (v.onPointerDown(p[0], p[1], e)) { grabbed = true; return; }
      }
      drag = { x: e.clientX, y: e.clientY, cx: v.cx, cy: v.cy };
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (grabbed) {
        if (v.onPointerMove) { const p = local(e); v.onPointerMove(p[0], p[1], e); }
        return;
      }
      if (!drag) return;

  /**
   * @param {Object} cfg
   *   title    {string}  tiêu đề trang

   *   stage    {'2d'|'none'}  '2d' tạo sẵn canvas + zoom/pan; 'none' để bài tự dựng (3D)
   *   view     {Object}  {cx, cy, scale} khung nhìn ban đầu (chỉ với stage '2d')
   *   height   {number}  chiều cao sân khấu, mặc định 460
   *   func     {Object}  {label, value, vars} hiện ô nhập công thức
   *   params   {Array}   [{id, label, min, max, step, value, fixed}]
   *   player   {boolean} hiện bộ Chạy/Bước/Làm lại
   *   code     {string[]} các dòng mã giả tiếng Việt

    /* --- đầu trang --- */
    const head = document.createElement('div');
    head.className = 'vl-head';
    head.innerHTML =
      '<h1 class="vl-title"></h1><div class="vl-head-tools">' +
      '<select class="vl-pal" title="Bảng màu"></select>' +
      '<button class="vl-btn vl-theme">Sáng/Tối</button>' +
      '<button class="vl-btn vl-home">Đặt lại khung nhìn</button></div>';
    head.querySelector('.vl-title').textContent = cfg.title || 'Mô phỏng';
    root.appendChild(head);

    const palSel = head.querySelector('.vl-pal');
    Object.keys(PALETTES).forEach(function (n) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n; palSel.appendChild(o);
    });

    palSel.addEventListener('change', function () {
      paletteName = palSel.value; app.redraw();

        const fmt = function (v) {

        val.textContent = fmt(p.value);
        r.addEventListener('input', function () {

    app.stepCount = 0;

      const card = document.createElement('div');

        '<div class="vl-row" style="margin-top:12px">' +
        '<div class="vl-lab"><span>Tốc độ (bước/giây)</span><span class="vl-spd">8</span></div>' +
        '<input type="range" class="vl-speed" min="1" max="60" step="1" value="8"></div>';
      side.appendChild(card);

      const spdEl = card.querySelector('.vl-spd');
      const spdIn = card.querySelector('.vl-speed');

        if (app.running) return;

    }

    app.redraw();

  };

  /** Vẽ đường cong y = f(x) trong toạ độ thế giới */

      const [sx, sy] = view.toScreen(x, y);
      if (sy < -1e4 || sy > 1e4) { started = false; continue; }
      if (started) ctx.lineTo(sx, sy); else { ctx.moveTo(sx, sy); started = true; }

    ctx.moveTo(c, d);
    ctx.lineTo(c - len * Math.cos(ang - 0.4), d - len * Math.sin(ang - 0.4));

  /* ======================================================================
     3. Trạng thái từng tab
     ==================================================================== */
  var tabs = [], activeTab = null, fabL = null, fabR = null;

  function syncFabs() {
    if (!fabL || !activeTab) return;
    var T = activeTab;
    fabL.setAttribute('aria-disabled', (T.hist && T.hist.length) ? 'false' : 'true');
    fabL.style.setProperty('--c', T.def.color); fabR.style.setProperty('--c', T.def.color);
  }

  function sampleDesc(T, res) {
    var sc = T.sc, S = sc.samples, n = S.length;
    if (sc.mode === 'batch') return 'cả ' + n + ' mẫu cùng lúc';
    if (n > 1) {
      var i = res.group[0];
      return 'mẫu ' + (i + 1) + '/' + n + ' (x = ' + fmt(S[i].x[0]) + ', y = ' + fmt(S[i].y[0]) + ')';
    }
    return 'x = ' + fv(S[0].x) + ', y = ' + fv(S[0].y);
  }

  function resetTab(T) {
    var app = T.app;
    T.sc = T.def.scen(app);
    var sc = T.sc;
    if (sc.rnn) { resetRnn(T); return; }
    T.tr = new Eng.Trainer({
      makeNet: sc.makeNet, samples: sc.samples, mode: sc.mode,
      lr: function () { return app.param('lr'); },
      shuffle: function () { return !!app.param('shuffle'); },
      updateAll: function () { return T.def.updateAll ? app.param('updAll') >= 1 : true; },
      maxEpoch: function () { return app.param('maxEpoch'); }
    });
    T.topo = buildTopo({ sizes: sc.sizes, lanes: sc.lanes, name: sc.name, dx: sc.dx });
    T.ui = { cur: -1, t0: 0, dur: 0, group: T.tr.group.slice(), fw: null, losses: null, L: null,
      grad: null, deltas: null, prevNet: null, epoch: 0, desc: sampleDesc(T, { group: T.tr.group }) };
    T.fitW = 0;
    app.highlight(-1); T.hl = -1;
    clearLog(T);
    syncFabs();
    app.status('<b>Sẵn sàng.</b>');
    app.redraw();
  }

  function animDur(T) {
    if (REDUCED) return 0;
    return clamp((T.sec || 0.5) * 0.9, 0.06, 1.3);   // hoạt ảnh một pha gói trong khoảng thời gian một bước
  }

  function stepTab(T) {
    if (T.def.kind === 'rnn') return stepRnn(T);
    var app = T.app, tr = T.tr, ui = T.ui, sc = T.sc;
    if (tr.phase === 0 && tr.done()) {
      app.status('<b>Đã chạy đủ ' + tr.epoch + ' epoch.</b>');
      return false;
    }
    var stEl = T.root.querySelector('.vl-status');
    T.hist.push({ tr: tr.snapshot(), ui: Object.assign({}, ui, { group: ui.group.slice() }), status: stEl ? stEl.innerHTML : '', hl: T.hl, steps: app.stepCount });
    if (T.hist.length > 3000) T.hist.shift();
    var res = tr.step();
    ui.cur = res.phase; ui.t0 = performance.now(); ui.dur = animDur(T);
    ui.epoch = res.epoch;
    if (res.phase === 0) {
      ui.group = res.group.slice(); ui.fw = tr.fw;
      ui.losses = null; ui.L = null; ui.grad = null; ui.deltas = null;
      ui.desc = sampleDesc(T, res);
    } else if (res.phase === 1) { ui.losses = tr.losses; ui.L = tr.L; }
    else if (res.phase === 2) { ui.grad = tr.grad; ui.deltas = tr.deltas; }
    else { ui.prevNet = res.prevNet; ui.lr = res.lr; }
    app.highlight(res.phase + 2); T.hl = res.phase + 2;
    app.status(statusHTML(T, res));
    pushCell(T, res, sc.mode !== 'batch' && sc.samples.length > 1 ? 'mẫu ' + (res.group[0] + 1) + '/' + sc.samples.length : '');
    syncFabs();
    return !(res.phase === 3 && tr.done());
  }

  function setSlider(T, id, v) {
    var idx = -1;
    T.def.params.forEach(function (p, k) { if (p.id === id) idx = k; });
    var inputs = T.root.querySelectorAll('.vl-side .vl-card input[type=range]');
    var el = inputs[idx];
    if (!el) return;
    el.value = v;
    el.dispatchEvent(new Event('input'));

  function hardReset(T) {

  function paramChanged(T, id, v) {
    if (T.busy) return;
    if (id === 'lr' || id === 'maxEpoch' || id === 'updAll' || id === 'detail') { if (id === 'updAll') refreshGeneral(T); T.app.redraw(); return; }
    if (id === 'vd' || id === 'cau') {
      if (id === 'vd' && T.def.lrByVd) {
        T.busy = true; setSlider(T, 'lr', T.def.lrByVd[Math.round(v) - 1]); T.busy = false;
      } else if (id === 'cau') {

  /* ======================================================================
     4. Văn bản "Đang xảy ra gì?" — luôn nêu con số cụ thể
     ==================================================================== */
  function fnName(a) { return a === 'sigmoid' ? 'σ' : a === 'relu' ? 'ReLU' : a === 'softmax' ? 'Softmax' : ''; }

  function statusHTML(T, res) {
    var tr = T.tr, sc = T.sc, net = tr.net, S = sc.samples, ui = T.ui, g = res.group;
    var neuron = sc.sizes.length === 2 && sc.sizes[0] === 1 && sc.sizes[1] === 1;
    var head = '<b>Epoch ' + res.epoch + '</b>' + (sc.mode === 'batch' ? '' : ' · ' + ui.desc);
    var Lw = net.W.length, outAct = net.acts[Lw - 1];
    var k, l, s;

    if (res.phase === 0) {
      if (neuron) {
        var w0 = net.W[0][0][0], b0 = net.b[0][0], f = fnName(net.acts[0]);
        if (sc.mode === 'batch') {
          var yh = tr.fw.map(function (q) { return q.yhat[0]; });
          var ys = g.map(function (i) { return S[i].y[0]; });
          return head + ' · <b>① Xuôi.</b> Cả ' + g.length + ' mẫu dùng chung w = ' + fmt(w0) + ', b = ' + fmt(b0) +
            '. ŷᵢ = ' + (f ? f + '(w·xᵢ + b)' : 'w·xᵢ + b') + ' → ŷ = ' + fv(yh) + '. Nhãn y = ' + fv(ys) +
            ', sai số e = ŷ − y = ' + fv(yh.map(function (v, i) { return v - ys[i]; })) + '.';
        }
        var x = S[g[0]].x[0], y = S[g[0]].y[0], z = tr.fw[0].Z[0][0], yhat = tr.fw[0].yhat[0];
        return head + ' · <b>① Xuôi.</b> z = w·x + b = ' + fmt(w0) + '×' + fmt(x) + ' + ' + fmt(b0) + ' = ' + fmt(z) +
          (f ? '; ŷ = ' + f + '(z) = ' + fmt(yhat) : '; ŷ = z') + '. Nhãn y = ' + fmt(y) +
          (sc.lossLabel === 'BCE' ? '; mô hình đang cho xác suất lớp 1 là ' + fmt(yhat * 100, 1) + '%.' : ', sai số e = ŷ − y = ' + fmt(yhat - y) + '.');
      }
      s = head + ' · <b>① Xuôi.</b> x = ' + fv(S[g[0]].x) + '.';
      for (l = 0; l < Lw; l++) {
        var a = tr.fw[0].A[l + 1], zz = tr.fw[0].Z[l];
        var fn = fnName(net.acts[l]);
        s += ' Lớp ' + (l + 1) + ': z' + sup(l + 1) + ' = W' + sup(l + 1) + '·a' + (l ? sup(l) : '(x)') + ' + b' + sup(l + 1) + ' = ' + fv(zz) +
          (fn ? ' → ' + (l === Lw - 1 ? 'ŷ' : 'a' + sup(l + 1)) + ' = ' + fn + '(z) = ' + fv(a) : ' → ŷ = z' + (l === Lw - 1 ? '' : '') + ' = ' + fv(a)) + '.';
      }
      if (outAct === 'softmax') s += ' Tổng ba xác suất = ' + fmt(tr.fw[0].yhat.reduce(function (p, c) { return p + c; }, 0)) + '.';
      return s;
    }

    if (res.phase === 1) {
      var Ls = tr.losses, yhat1 = tr.fw.map(function (q) { return q.yhat; });
      if (net.loss === 'mse' && sc.mode === 'batch')
        return head + ' · <b>② Mất mát.</b> MSE = trung bình của eᵢ² = (' +
          yhat1.map(function (q, i) { return fmt(Ls[i]); }).join(' + ') + ')/' + Ls.length + ' = <b>' + fmt(tr.L) + '</b>.';
      if (net.loss === 'mse')
        return head + ' · <b>② Mất mát.</b> L = (ŷ − y)² = (' + fmt(yhat1[0][0]) + ' − ' + fmt(S[g[0]].y[0]) + ')² = <b>' + fmt(Ls[0]) + '</b>.';
      if (net.loss === 'bce') {
        var yy = S[g[0]].y[0];
        return head + ' · <b>② Mất mát.</b> L = −[y·ln ŷ + (1−y)·ln(1−ŷ)] = −ln(' + fmt(yy === 1 ? yhat1[0][0] : 1 - yhat1[0][0]) + ') = <b>' + fmt(Ls[0]) + '</b>. ' +
          'Mô hình gán xác suất ' + fmt((yy === 1 ? yhat1[0][0] : 1 - yhat1[0][0]) * 100, 1) + '% cho nhãn đúng.';
      }
      if (net.loss === 'hmse')
        return head + ' · <b>② Mất mát.</b> L = ½(ŷ − y)² = ½(' + fmt(yhat1[0][0]) + ' − ' + fmt(S[g[0]].y[0]) + ')² = <b>' + fmt(Ls[0]) + '</b>.';
      var cls = S[g[0]].y.indexOf(1);
      return head + ' · <b>② Mất mát.</b> L = −Σ yₖ·ln ŷₖ = −ln(ŷ' + sub(cls + 1) + ') = −ln(' + fmt(yhat1[0][cls]) + ') = <b>' + fmt(Ls[0]) + '</b>.';
    }

    if (res.phase === 2) {
      var gr = tr.grad, dl = tr.deltas[0];
      if (neuron) {
        var gw = gr.dW[0][0][0], gb = gr.db[0][0];
        if (sc.lossLabel === 'BCE')
          return head + ' · <b>③ Ngược.</b> δ = ŷ − y = ' + fmt(dl[0][0]) + '; ∂L/∂w = δ·x = ' + fmt(gw) + '; ∂L/∂b = δ = ' + fmt(gb) + '.';
        return head + ' · <b>③ Ngược.</b> ' + (sc.mode === 'batch' ? 'Gradient trung bình trên cả ' + g.length + ' mẫu: ' : 'Gradient của mẫu này: ') +
          '∂L/∂w = ' + fmt(gw) + ', ∂L/∂b = ' + fmt(gb) + '.';
      }
      s = head + ' · <b>③ Ngược.</b>';
      var simple = (outAct === 'softmax' && net.loss === 'ce') || (outAct === 'sigmoid' && net.loss === 'bce') || (outAct === 'linear' && net.loss === 'hmse');
      s += ' δ' + sup(Lw) + (simple ? ' = ŷ − y' : ' = ∂L/∂z' + sup(Lw)) + ' = ' + fv(dl[Lw - 1]) + '.';
      for (l = Lw - 2; l >= 0; l--)
        s += ' δ' + sup(l + 1) + ' = (W' + sup(l + 2) + ')ᵀδ' + sup(l + 2) + ' ⊙ f′(z' + sup(l + 1) + ') = ' + fv(dl[l]) + '.';
      var dead = [];
      for (l = 0; l < Lw - 1; l++)
        if (net.acts[l] === 'relu') tr.fw[0].Z[l].forEach(function (zv, i) { if (zv <= 0) dead.push('h' + sub(i + 1)); });
      if (dead.length) s += ' ' + dead.join(', ') + ' có z ≤ 0 nên ReLU′ = 0.';
      return s;
    }

    /* pha 4 — cập nhật */
    var pv = res.prevNet, lr = res.lr, gr4 = tr.grad;
    var updAll = T.def.updateAll ? T.app.param('updAll') >= 1 : true;
    var first = updAll ? 0 : Lw - 1;
    if (neuron) {
      var gw4 = gr4.dW[0][0][0], gb4 = gr4.db[0][0];
      return head + ' · <b>④ Cập nhật.</b> w ← ' + fmt(pv.W[0][0][0]) + ' − ' + fmt(lr) + ' × (' + fmt(gw4) + ') = <b>' + fmt(net.W[0][0][0]) +
        '</b>; b ← ' + fmt(pv.b[0][0]) + ' − ' + fmt(lr) + ' × (' + fmt(gb4) + ') = <b>' + fmt(net.b[0][0]) + '</b>.' +
        (tr.done() ? ' Đã chạy đủ ' + tr.epoch + ' epoch.' : '');
    }
    var best = null;
    for (l = first; l < Lw; l++)
      for (var j = 0; j < net.W[l].length; j++)
        for (var i = 0; i < net.W[l][j].length; i++) {
          var gv = Math.abs(gr4.dW[l][j][i]);
          if (!best || gv > best.g) best = { l: l, j: j, i: i, g: gv };
        }
    s = head + ' · <b>④ Cập nhật</b> (η = ' + fmt(lr) + '): W ← W − η·∂L/∂W' + (updAll ? '' : ', chỉ ở lớp ra') + '. Ví dụ ' +
      wSym(best.l, best.j, best.i, sc.sizes) + ' ← ' + fmt(pv.W[best.l][best.j][best.i]) + ' − ' + fmt(lr) + ' × (' + fmt(gr4.dW[best.l][best.j][best.i]) + ') = <b>' +
      fmt(net.W[best.l][best.j][best.i]) + '</b>.';
    var x0 = S[0].x, y0 = S[0].y;
    var nf = Eng.forward(net, x0);
    var nL = Eng.lossValue(net, nf.yhat, y0);
    s += ' Nếu xuôi lại ngay: ' + (nf.yhat.length > 1 ? 'ŷ = ' + fv(nf.yhat) : 'ŷ ≈ ' + fmt(nf.yhat[0])) + ', loss mới = <b>' + fmt(nL) + '</b> (trước đó ' + fmt(tr.L) + ': ' + (nL < tr.L ? 'giảm' : 'không giảm') + ').';
    return s;
  }

  /* ======================================================================
     5. Vẽ
     ==================================================================== */
  function fit(T, W, H) {
    var nodes = T.topo.nodes, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    nodes.forEach(function (n) {
      x0 = Math.min(x0, n.x - n.r); x1 = Math.max(x1, n.x + n.r);
      y0 = Math.min(y0, n.y - n.r); y1 = Math.max(y1, n.y + n.r);
    });
    var padX = 1.2, padTop = 0.5, padBot = 1.9;
    var bw = (x1 - x0) + 2 * padX, bh = (y1 - y0) + padTop + padBot;
    var topPx = 70, botPx = 172;
    var aw = W - 12, ah = H - topPx - botPx;
    var scale = clamp(Math.min(aw / bw, ah / bh), 14, 110);
    var yc = ((y1 + padTop) + (y0 - padBot)) / 2;
    var yr = topPx + ah / 2;
    T.app.view.setHome({ cx: (x0 + x1) / 2, cy: yc - (H / 2 - yr) / scale, scale: scale });

  }

  /* Đẩy các ô chữ ra khỏi hình tròn của nút và khỏi nhau; lò xo kéo nhẹ về vị trí gốc nên kết quả ổn định giữa các khung hình */
  function drawItems(ctx, items, bg, fg) {
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    items.forEach(function (it) {
      var x0 = it.x - it.w / 2, y0 = it.y - it.h / 2;
      ctx.save();
      ctx.globalAlpha = it.on ? 1 : 0.3;
      if (Math.hypot(it.x - it.ax, it.y - it.ay) > 12) {           // đường nối từ vị trí gốc tới ô chữ đã bị đẩy
        ctx.strokeStyle = rgba(fg, 0.4); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(it.ax, it.ay); ctx.lineTo(it.x, it.y); ctx.stroke(); ctx.setLineDash([]);
      }
      if (it.type === 'lab') {
        ctx.fillStyle = rgba(bg, 0.95); ctx.strokeStyle = it.edge; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(x0, y0, it.w, it.h, 5); ctx.fill(); ctx.stroke();
      } else {

      var lhh = it.h / it.lines.length;
      it.lines.forEach(function (tx, k) { ctx.fillText(tx, it.x, y0 + lhh * (k + 0.5) + 0.5); });
      ctx.restore();

  }

  function placeItems(items, circles, W, H) {
    var loY = 78, hiY = H - 150 - 16, it, jt, c, k, a, b, n = items.length;
    items.forEach(function (q) { q.x = q.ax; q.y = q.ay; });
    for (k = 0; k < 60; k++) {
      for (a = 0; a < n; a++) {
        it = items[a];
        for (b = 0; b < circles.length; b++) {
          c = circles[b];
          var nx = Math.max(it.x - it.w / 2, Math.min(c.x, it.x + it.w / 2));
          var ny = Math.max(it.y - it.h / 2, Math.min(c.y, it.y + it.h / 2));
          var dx = nx - c.x, dy = ny - c.y, d = Math.hypot(dx, dy);
          if (d < c.r) {
            if (d < 0.01) { dx = it.x - c.x; dy = (it.y - c.y) || 1; d = Math.hypot(dx, dy) || 1; }
            var push = (c.r - d) + 1;
            it.x += dx / d * push; it.y += dy / d * push;
          }
        }
        for (b = a + 1; b < n; b++) {
          jt = items[b];
          var ox = (it.w + jt.w) / 2 + 2 - Math.abs(it.x - jt.x), oy = (it.h + jt.h) / 2 + 2 - Math.abs(it.y - jt.y);
          if (ox > 0 && oy > 0) {
            if (oy <= ox) { var sy = (it.y === jt.y ? (a < b ? -1 : 1) : (it.y < jt.y ? -1 : 1)); it.y += sy * oy / 2; jt.y -= sy * oy / 2; }
            else { var sx = (it.x === jt.x ? (a < b ? -1 : 1) : (it.x < jt.x ? -1 : 1)); it.x += sx * ox / 2; jt.x -= sx * ox / 2; }
          }
        }
      }
      for (a = 0; a < n; a++) {
        it = items[a];
        it.x += (it.ax - it.x) * 0.03; it.y += (it.ay - it.y) * 0.03;
        it.x = Math.max(4 + it.w / 2, Math.min(W - 4 - it.w / 2, it.x));
        it.y = Math.max(loY + it.h / 2, Math.min(hiY - it.h / 2, it.y));
      }
    }
  }

  function drawTab(T, ctx) {
    var app = T.app, view = app.view;
    var W = ctx.canvas.clientWidth, H = ctx.canvas.clientHeight;
    if (!T.topo || !T.ui || W < 40 || H < 40 || T.root.hidden) return;
    if (T.fitW !== W || T.fitH !== H) fit(T, W, H);
    if (T.sc.rnn) { drawRnn(T, ctx, W, H); return; }

    var ui = T.ui, tr = T.tr, topo = T.topo, Lw = topo.Lw, sc = T.sc, sizes = sc.sizes;
    var now = performance.now();
    var p = (ui.cur < 0 || ui.dur <= 0) ? 1 : clamp((now - ui.t0) / (ui.dur * 1000), 0, 1);
    var net = (ui.cur === 3 && ui.prevNet) ? Eng.lerpNet(ui.prevNet, tr.net, ease(p)) : tr.net;
    var updAll = T.def.updateAll ? app.param('updAll') >= 1 : true;
    var full = app.param('detail') >= 1, items = [];

    var C = { fwd: app.color(0), loss: app.color(1), upd: app.color(2), bwd: app.color(3), inp: app.color(4), hid: app.color(5) };
    var fg = app.css('--vl-fg'), muted = app.css('--vl-muted'), axis = app.css('--vl-axis');
    var bg = app.css('--vl-bg'), line = app.css('--vl-line');
    var phaseCol = ui.cur === 0 ? C.fwd : ui.cur === 1 ? C.loss : ui.cur === 2 ? C.bwd : C.upd;

    function P(n) { return view.toScreen(n.x, n.y); }
    function sampleOf(lane) { return sc.lanes > 1 ? lane : 0; }
    function laneOn(lane) { return lane < 0 || ui.group.indexOf(sampleOf(lane)) >= 0; }
    function gIdx(lane) { return ui.group.indexOf(sampleOf(lane)); }
    function gradVisible(wl) {
      if (!ui.grad || ui.cur < 2) return false;
      return ui.cur > 2 || p * (Lw + 1) >= (Lw - wl) + 1;
    }

    var gd = mlpGuides(T);
    drawGuides(T, ctx, H, gd.seps, gd.labels, { axis: axis, muted: muted });

    /* ---------- cạnh ---------- */
    var labels = [];
    topo.edges.forEach(function (e) {
      var a = topo.byId[e.a], b = topo.byId[e.b];
      var on = laneOn(e.lane);
      var pa = P(a), pb = P(b);
      var dx = pb[0] - pa[0], dy = pb[1] - pa[1], len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      var ra = a.r * view.scale, rb = b.r * view.scale;
      var s0 = [pa[0] + ux * ra, pa[1] + uy * ra], t0 = [pb[0] - ux * rb, pb[1] - uy * rb];
      var wv = e.kind === 'W' ? net.W[e.wl][e.j][e.i] : e.kind === 'b' ? net.b[e.wl][e.j] : 0;
      var lw = e.kind === 'loss' ? 1.8 : 1.4 + Math.min(4.5, Math.abs(wv) * 2.2);

      ctx.lineCap = 'round';
      ctx.strokeStyle = rgba(axis, 0.85); ctx.lineWidth = lw;
      if (e.kind === 'W' && wv < 0) ctx.setLineDash([7, 5]);
      ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(t0[0], t0[1]); ctx.stroke();
      ctx.setLineDash([]);

      /* dòng chảy: mực loang dọc cạnh + chấm sáng */
      var tw = -1, rev = false, col = phaseCol;
      if (on) {
        if (ui.cur === 0 && e.kind !== 'loss') tw = clamp(p * Lw - e.wl, 0, 1);
        else if (ui.cur === 1 && e.kind === 'loss') tw = p;
        else if (ui.cur === 2) {
          rev = true;
          tw = e.kind === 'loss' ? clamp(p * (Lw + 1), 0, 1) : clamp(p * (Lw + 1) - (Lw - e.wl), 0, 1);
        } else if (ui.cur === 3 && e.kind !== 'loss' && (updAll || e.wl === Lw - 1)) {

        }
      }
      if (tw >= 0) {
        var upd = ui.cur === 3;
        var alpha = upd ? 0.9 * (1 - p) : (tw >= 1 ? 0.8 * (1 - clamp((p - 0.8) / 0.2, 0, 1)) : 0.95);
        var from = rev ? t0 : s0, to = rev ? s0 : t0;
        var hx = from[0] + (to[0] - from[0]) * tw, hy = from[1] + (to[1] - from[1]) * tw;
        if (alpha > 0.01 && (tw > 0 || upd)) {
          ctx.strokeStyle = rgba(col, alpha); ctx.lineWidth = lw + 2.4;
          ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(hx, hy); ctx.stroke();
        }
        if (!upd && tw > 0 && tw < 1) {

          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(hx, hy, 2.4, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();

      if (e.kind === 'W') {
        var t = (sizes[e.wl] === 1 && e.m === 1) ? 0.5 : 0.3 + 0.36 * (e.j / Math.max(1, e.m - 1));
        var gv = gradVisible(e.wl) ? ui.grad.dW[e.wl][e.j][e.i] : null;
        var prevW = ui.prevNet ? ui.prevNet.W[e.wl][e.j][e.i] : wv;
        var dlt = (ui.cur === 3 && p > 0.05) ? tr.net.W[e.wl][e.j][e.i] - prevW : 0;
        var txt = wSym(e.wl, e.j, e.i, sizes) + '=' + fmt(wv);
        labels.push({ x: s0[0] + (t0[0] - s0[0]) * t, y: s0[1] + (t0[1] - s0[1]) * t, l1: txt + (Math.abs(dlt) > 1e-12 ? (dlt > 0 ? ' ▲' : ' ▼') : ''),
          l2: (gv == null || !(full || ui.cur === 2)) ? null : '∂=' + fmt(gv), on: on, edge: gv != null ? C.bwd : (ui.cur === 3 && Math.abs(dlt) > 1e-12 ? C.upd : line) });

        ax: lb.x, ay: lb.y - 7, on: lb.on, edge: lb.edge });
    });

    /* ---------- nút ---------- */
    topo.nodes.forEach(function (n) {
      var pp = P(n), r = n.r * view.scale, on = laneOn(n.lane), g = gIdx(n.lane);
      var col = n.kind === 'in' ? C.inp : n.kind === 'loss' ? C.loss : n.kind === 'bias' ? axis : (n.layer === Lw ? C.fwd : C.hid);
      var revealed = false, a = null, z = null;
      if (n.kind === 'neu' && ui.fw && g >= 0) {

      }
      var level = 0.2;
      if (a != null) level = (net.acts[n.layer - 1] === 'sigmoid' || net.acts[n.layer - 1] === 'softmax') ? clamp(a, 0, 1) : 1 - Math.exp(-Math.abs(a) / 2);

      /* vòng sáng khi tín hiệu tới nơi */

      if (on) {

        else if (ui.cur === 1 && n.kind === 'loss' && p > 0.8) ring = (p - 0.8) / 0.2;
        else if (ui.cur === 2) {

      }

      ctx.beginPath(); ctx.arc(pp[0], pp[1], r, 0, Math.PI * 2);
      ctx.fillStyle = rgba(col, n.kind === 'bias' ? 0.14 : 0.16 + 0.5 * level); ctx.fill();
      ctx.lineWidth = n.kind === 'bias' ? 2 : 2.8; ctx.strokeStyle = col; ctx.stroke();

      ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '600 ' + clamp(r * 0.78, 10, 16) + 'px system-ui,sans-serif';
      ctx.fillText(n.name, pp[0], pp[1] + 0.5);

      /* chữ số liệu */
      var lines = [];
      if (n.kind === 'in') lines.push(fmt(sc.samples[sampleOf(n.lane)].x[n.idx]));
      else if (n.kind === 'loss') {

        if (ui.L != null && (ui.cur > 1 || p >= 0.6)) lines.push(fmt(ui.L));
      } else if (n.kind === 'neu') {
        var isOut = n.layer === Lw, nm = isOut ? 'ŷ' + (sizes[Lw] > 1 ? sub(n.idx + 1) : '') : 'a';
        if (revealed) {
          if (full && net.acts[n.layer - 1] !== 'linear') lines.push('z=' + fmt(z));
          var tgt = isOut ? sc.samples[Math.max(0, sampleOf(n.lane))].y[n.idx] : 0;
          lines.push(nm + '=' + fmt(a) + (isOut && !full ? ' (y=' + fmt(tgt) + ')' : ''));
          if (isOut && full) lines.push('y=' + fmt(tgt));
        } else lines.push('…');
        if (ui.deltas && g >= 0 && (full ? ui.cur >= 2 : ui.cur === 2) && (ui.cur > 2 || p * (Lw + 1) >= (Lw - n.layer + 1)))
          lines.push('δ=' + fmt(ui.deltas[g][n.layer - 1][n.idx]));
      } else if (n.kind === 'bias') {
        lines.push(bSym(n.wl, n.idx, sizes) + '=' + fmt(net.b[n.wl][n.idx]));
        if (gradVisible(n.wl) && (full || ui.cur === 2)) lines.push('∂=' + fmt(ui.grad.db[n.wl][n.idx]));
      }
      ctx.font = '11px system-ui,sans-serif';
      ctx.restore();
      if (lines.length) {
        var lw2 = 0;
        lines.forEach(function (tx) { lw2 = Math.max(lw2, ctx.measureText(tx).width); });
        var bw2 = lw2 + 8, bh2 = lines.length * 14;
        items.push(n.kind === 'bias'
          ? { type: 'txt', lines: lines, w: bw2, h: bh2, ax: pp[0] + r + 4 + bw2 / 2, ay: pp[1], on: on }
          : { type: 'txt', lines: lines, w: bw2, h: bh2, ax: pp[0], ay: pp[1] + r + 4 + bh2 / 2, on: on });

    /* ---------- xếp chữ: đẩy các ô chữ ra khỏi nút và khỏi nhau, rồi mới vẽ ---------- */

    placeItems(items, circles, W, H);

    /* ---------- thanh 4 pha ---------- */

    var pad = 12, gap = 6, cw = (W - 2 * pad - 3 * gap) / 4, ch = 28;

      else if (state === 'done') { ctx.fillStyle = rgba(cols[k], 0.22); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = cols[k]; ctx.stroke(); }
      else { ctx.lineWidth = 1.5; ctx.strokeStyle = line; ctx.stroke(); }
      ctx.font = '600 12px system-ui,sans-serif';
      ctx.fillStyle = state === 'on' ? onColor(cols[k]) : state === 'done' ? fg : muted;
      ctx.fillText(names[k], cx + cw / 2, cy + ch / 2 + 0.5);
      if (state === 'on' && p < 1) {
        ctx.fillStyle = rgba(onColor(cols[k]), 0.65);
        ctx.fillRect(cx + 8, cy + ch - 5, (cw - 16) * p, 3);

    ctx.textAlign = 'left'; ctx.font = '12px system-ui,sans-serif'; ctx.fillStyle = fg;
    ctx.fillText('Epoch ' + ui.epoch + ' · ' + ui.desc + (tr.updates ? ' · đã cập nhật ' + tr.updates + ' lần' : ''), pad, 52);

    drawStrip(T, ctx, W, H, { C: C, fg: fg, muted: muted, axis: axis, bg: bg, line: line, net: net, p: p, phaseCol: phaseCol });
  }

  /* ---------- hai đồ thị nhỏ ở đáy sân khấu ---------- */
  function box(ctx, x, y, w, h, title, st) {
    ctx.fillStyle = st.bg; ctx.strokeStyle = st.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = st.muted; ctx.font = '600 11px system-ui,sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(title, x + 10, y + 13);
  }

  function drawStrip(T, ctx, W, H, st) {
    var sc = T.sc, tr = T.tr, ui = T.ui, pad = 12, sh = 150, y0 = H - sh - 10;
    var has = !!sc.plot;
    var gw = has ? (W - 3 * pad) / 2 : W - 2 * pad;
    if (has) drawModel(T, ctx, pad, y0, gw, sh, st);
    drawLoss(T, ctx, has ? 2 * pad + gw : pad, y0, gw, sh, st);
  }

  function drawModel(T, ctx, x, y, w, h, st) {
    var sc = T.sc, ui = T.ui, C = st.C, net = st.net, S = sc.samples;
    var logit = sc.plot === 'logit';
    box(ctx, x, y, w, h, logit ? 'Đường sigmoid và biên quyết định' : 'Mô hình khớp dữ liệu', st);
    var ix = x + 32, iy = y + 26, iw = w - 44, ih = h - 42;
    var xs = S.map(function (s) { return s.x[0]; }), ys = S.map(function (s) { return s.y[0]; });
    var xmin = Math.min.apply(null, xs) - 1, xmax = Math.max.apply(null, xs) + 1;
    var ymin = logit ? -0.15 : Math.min.apply(null, ys) - 1, ymax = logit ? 1.15 : Math.max.apply(null, ys) + 1;
    function X(v) { return ix + (v - xmin) / (xmax - xmin) * iw; }
    function Y(v) { return iy + ih - (v - ymin) / (ymax - ymin) * ih; }
    ctx.strokeStyle = st.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix, iy + ih); ctx.lineTo(ix + iw, iy + ih); ctx.stroke();
    ctx.fillStyle = st.muted; ctx.font = '10px system-ui,sans-serif'; ctx.textAlign = 'right';
    var yt = logit ? [0, 0.5, 1] : [Math.ceil(ymin), Math.round((ymin + ymax) / 2), Math.floor(ymax)];
    yt.forEach(function (v) {
      ctx.fillText(String(v), ix - 4, Y(v));
      ctx.strokeStyle = st.line; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(ix, Y(v)); ctx.lineTo(ix + iw, Y(v)); ctx.stroke(); ctx.globalAlpha = 1;
    });
    ctx.textAlign = 'center';
    xs.forEach(function (v) { ctx.fillText(String(v), X(v), iy + ih + 9); });

    ctx.save();
    ctx.beginPath(); ctx.rect(ix, iy - 2, iw, ih + 4); ctx.clip();
    /* phần dư (sai số) từ điểm tới đường */
    S.forEach(function (s, i) {
      var yh = Eng.forward(net, s.x).yhat[0];
      ctx.strokeStyle = rgba(C.loss, 0.75); ctx.lineWidth = 1.6; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(X(s.x[0]), Y(s.y[0])); ctx.lineTo(X(s.x[0]), Y(yh)); ctx.stroke(); ctx.setLineDash([]);
    });
    if (logit) {
      ctx.strokeStyle = rgba(st.axis, 0.9); ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(ix, Y(0.5)); ctx.lineTo(ix + iw, Y(0.5)); ctx.stroke(); ctx.setLineDash([]);

      var act = ui.group.indexOf(i) >= 0;
      ctx.beginPath(); ctx.arc(X(s.x[0]), Y(s.y[0]), act ? 6 : 5, 0, Math.PI * 2);
